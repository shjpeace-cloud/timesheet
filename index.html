          saveGoalData();ov.remove();render();
        }},"이동");
        box.appendChild(moveBtn);
        ov.appendChild(box);
        document.body.appendChild(ov);
      }},"📅"));
      // Hours display
      const dailyHrs=calcGoalTotalHours(g.id);
      if(dailyHrs>0)r.appendChild(h("span",{style:"font-size:10px;color:#f59e0b;font-family:'JetBrains Mono',monospace;font-weight:700;flex-shrink:0"},fmtHours(dailyHrs)));
      r.appendChild(h("button",{className:"goal-del",onClick:()=>removeDailyGoal(g.id)},"✕"));
      item.appendChild(r);
      // Ancestry breadcrumb
      const anc=renderAncestry(g);
      if(anc)item.appendChild(anc);
      // Expanded: parent edit
      if(isExpanded){
        const subWrap=h("div",{style:"margin-top:6px;padding:8px;background:#111827;border-radius:8px;border:1px dashed #1e293b"});
        const parentEditEl=renderParentEditSelectors("daily",g);
        if(parentEditEl)subWrap.appendChild(parentEditEl);
        if(subWrap.children.length>0)item.appendChild(subWrap);
      }
      ul.appendChild(item);
    });
    wrap.appendChild(ul);
  }
  return wrap;
}

function renderPeriodGoals(scope){
  const wrap=h("div",{});

  // Period selector (above form)
  if(scope==="monthly"){
    const mbar=h("div",{className:"book-month-selector"});
    for(let m=1;m<=12;m++){
      const cnt=(state.goalData.monthly||[]).filter(g=>{
        if(g.year!==state.year)return false;
        const sm=g.startMonth||g.month;
        const em=g.endMonth||g.month;
        return sm<=m&&m<=em;
      }).length;
      const lbl=m+"월"+(cnt>0?" ("+cnt+")":"");
      mbar.appendChild(h("button",{className:"book-month-btn"+(m===state.goalMonth?" active":""),onClick:()=>{state.goalMonth=m;render()}},lbl));
    }
    wrap.appendChild(mbar);
  }else if(scope==="weekly"){
    // Month selector
    const mbar=h("div",{className:"book-month-selector"});
    for(let m=1;m<=12;m++){
      mbar.appendChild(h("button",{className:"book-month-btn"+(m===state.goalWeekMonth?" active":""),onClick:()=>{
        state.goalWeekMonth=m;
        const wm=weeksInMonth(state.year,m);
        if(state.goalWeekIdx>wm)state.goalWeekIdx=wm;
        render();
      }},m+"월"));
    }
    wrap.appendChild(mbar);
    // Week selector
    const wbar=h("div",{className:"book-month-selector",style:"padding-top:0;flex-wrap:wrap"});
    const wm=weeksInMonth(state.year,state.goalWeekMonth);
    for(let w=1;w<=wm;w++){
      const cnt=(state.goalData.weekly||[]).filter(g=>g.year===state.year&&g.month===state.goalWeekMonth&&g.weekIdx===w).length;
      const range=weekDateRange(state.year,state.goalWeekMonth,w);
      const lbl=w+"주("+range+")"+(cnt>0?" ["+cnt+"]":"");
      wbar.appendChild(h("button",{className:"book-month-btn"+(w===state.goalWeekIdx?" active":""),onClick:()=>{state.goalWeekIdx=w;render()}},lbl));
    }
    wrap.appendChild(wbar);
  }else if(scope==="longterm"){
    // Year range selector
    const yrBar=h("div",{style:"display:flex;gap:8px;align-items:center;justify-content:center;padding:12px 0"});
    yrBar.appendChild(h("span",{style:"font-size:11px;color:#94a3b8"},"기간"));
    const startSel=h("select",{className:"goal-cat-select",style:"padding:6px 8px"});
    for(let y=2026;y<=2040;y++){
      const opt=h("option",{value:String(y)},y+"");
      if(y===state.goalLtStartYear)opt.selected=true;
      startSel.appendChild(opt);
    }
    startSel.addEventListener("change",e=>{
      state.goalLtStartYear=parseInt(e.target.value);
      if(state.goalLtEndYear<state.goalLtStartYear)state.goalLtEndYear=state.goalLtStartYear;
      render();
    });
    yrBar.appendChild(startSel);
    yrBar.appendChild(h("span",{style:"font-size:12px;color:#64748b"},"~"));
    const endSel=h("select",{className:"goal-cat-select",style:"padding:6px 8px"});
    for(let y=2026;y<=2040;y++){
      const opt=h("option",{value:String(y)},y+"");
      if(y===state.goalLtEndYear)opt.selected=true;
      endSel.appendChild(opt);
    }
    endSel.addEventListener("change",e=>{
      state.goalLtEndYear=parseInt(e.target.value);
      if(state.goalLtEndYear<state.goalLtStartYear)state.goalLtStartYear=state.goalLtEndYear;
      render();
    });
    yrBar.appendChild(endSel);
    wrap.appendChild(yrBar);
  }

  // Add form
  const placeholder=scope==="weekly"?"이번 주 목표":scope==="monthly"?"이번 달 목표":"장기 목표";
  const form=h("div",{className:"goal-form"});
  const row1=h("div",{className:"goal-form-row"});
  const sel=h("select",{className:"goal-cat-select"});
  CATEGORIES.forEach(c=>{
    const opt=h("option",{value:c.code},c.code+" "+c.label);
    if(c.code===state.goalNewCat)opt.selected=true;
    sel.appendChild(opt);
  });
  sel.addEventListener("change",e=>{state.goalNewCat=e.target.value;state.goalNewParentIds={};render()});
  row1.appendChild(sel);
  const inp=h("input",{className:"goal-input",placeholder:placeholder,value:state.goalNewName});
  inp.addEventListener("input",e=>{state.goalNewName=e.target.value});
  row1.appendChild(inp);
  form.appendChild(row1);

  // Parent goal selectors (one per upper scope, not for longterm)
  if(scope!=="longterm"){
    const parentSels=renderParentSelectors(scope,state.goalNewCat);
    if(parentSels){
      const prow=h("div",{className:"goal-form-row",style:"padding-top:0;flex-direction:column"});
      prow.appendChild(h("span",{style:"font-size:10px;color:#64748b;margin-bottom:2px"},"📎 상위 목표:"));
      prow.appendChild(parentSels);
      form.appendChild(prow);
    }
  }

  const row2=h("div",{className:"goal-form-row"});
  if(scope==="monthly"){
    // Start/end month dropdowns
    const smSel=h("select",{className:"goal-cat-select",style:"padding:6px 8px"});
    for(let m=1;m<=12;m++){
      const opt=h("option",{value:String(m)},m+"월");
      if(m===state.goalNewStartMonth)opt.selected=true;
      smSel.appendChild(opt);
    }
    smSel.addEventListener("change",e=>{
      state.goalNewStartMonth=parseInt(e.target.value);
      if(state.goalNewEndMonth<state.goalNewStartMonth)state.goalNewEndMonth=state.goalNewStartMonth;
      render();
    });
    row2.appendChild(smSel);
    row2.appendChild(h("span",{style:"font-size:11px;color:#64748b;align-self:center"},"~"));
    const emSel=h("select",{className:"goal-cat-select",style:"padding:6px 8px"});
    for(let m=1;m<=12;m++){
      const opt=h("option",{value:String(m)},m+"월");
      if(m===state.goalNewEndMonth)opt.selected=true;
      emSel.appendChild(opt);
    }
    emSel.addEventListener("change",e=>{
      state.goalNewEndMonth=parseInt(e.target.value);
      if(state.goalNewEndMonth<state.goalNewStartMonth)state.goalNewStartMonth=state.goalNewEndMonth;
      render();
    });
    row2.appendChild(emSel);
  }
  const memoInp=h("input",{className:"goal-input",placeholder:"메모(선택)",value:state.goalNewMemo});
  memoInp.addEventListener("input",e=>{state.goalNewMemo=e.target.value});
  row2.appendChild(memoInp);
  row2.appendChild(h("button",{className:"goal-add-btn",onClick:()=>addPeriodGoal(scope)},"+"));
  form.appendChild(row2);
  wrap.appendChild(form);

  // Filter list: separate active and completed
  const list=state.goalData[scope]||[];
  let filtered=list;
  if(scope==="weekly")filtered=filtered.filter(g=>g.year===state.year&&g.month===state.goalWeekMonth&&g.weekIdx===state.goalWeekIdx);
  else if(scope==="monthly")filtered=filtered.filter(g=>{
    if(g.year!==state.year)return false;
    const sm=g.startMonth||g.month;
    const em=g.endMonth||g.month;
    return sm<=state.goalMonth&&state.goalMonth<=em;
  });
  else if(scope==="longterm")filtered=filtered.filter(g=>{
    const sy=g.startYear||g.targetYear||state.year;
    const ey=g.endYear||g.targetYear||state.year;
    return !(ey<state.goalLtStartYear||sy>state.goalLtEndYear);
  });
  const activeGoals=filtered.filter(g=>(g.progress||0)<100);
  const completedGoals=filtered.filter(g=>(g.progress||0)>=100);

  // Weekly carryover: show incomplete goals from weeks that have ALREADY PASSED (based on today's date)
  let weeklyCarryover=[];
  if(scope==="weekly"){
    const allWeekly=state.goalData.weekly||[];
    const today=new Date();
    const todayY=today.getFullYear();
    const todayM=today.getMonth()+1;
    const todayD=today.getDate();
    const todayWeekIdx=weekIdxOfDay(todayY,todayM,todayD);
    // Only show carryover for weeks whose period has ended (strictly before today's week)
    weeklyCarryover=allWeekly.filter(g=>{
      if(g.year!==state.year||(g.progress||0)>=100)return false;
      // Compare against today's actual position, not UI selection
      // Past year's goals
      if(g.year<todayY)return true;
      if(g.year>todayY)return false;
      // Same year: compare month+week
      if(g.month<todayM)return true;
      if(g.month>todayM)return false;
      // Same month: only if week has already passed
      if(g.weekIdx<todayWeekIdx)return true;
      return false;
    });
  }

  const hasCarryover=weeklyCarryover.length>0;
  if(activeGoals.length===0&&completedGoals.length===0&&!hasCarryover){
    wrap.appendChild(h("div",{className:"goal-empty"},"목표가 없습니다"));
  }else{
    const ul=h("div",{className:"goal-list"});

    // Render weekly carryover items in red
    if(hasCarryover){
      ul.appendChild(h("div",{style:"font-size:10px;color:#ef4444;font-weight:700;padding:4px 0;margin-bottom:4px;border-bottom:1px solid #7f1d1d"},"🔴 이연된 주간 목표 ("+weeklyCarryover.length+")"));
      weeklyCarryover.forEach(g=>{
        const cat=catByCode(g.cat);
        const item=h("div",{className:"goal-item",style:"border:1px solid #7f1d1d;background:#1a0505"});
        const expKey=scope+"-"+g.id;
        const isExpanded=!!state.goalExpanded[expKey];
        const hasSub=g.subtasks&&g.subtasks.length>0;
        const r=h("div",{className:"goal-item-row"});
        const toggleBtn=h("button",{className:"goal-del",style:"font-size:11px;padding:2px 4px;color:#fca5a5",onClick:()=>toggleGoalExpand(scope,g.id)},isExpanded?"▼":"▶");
        r.appendChild(toggleBtn);
        r.appendChild(renderEditableCat(g.cat,newCat=>{
          updatePeriodGoalField(scope,g.id,"cat",newCat);render();
        }));
        r.appendChild(renderEditableName(g.name,newName=>{
          updatePeriodGoalField(scope,g.id,"name",newName);
        },"color:#fca5a5;"));
        r.appendChild(h("span",{style:"font-size:9px;color:#ef4444;font-family:monospace;flex-shrink:0"},g.month+"월"+g.weekIdx+"주"));
        if(hasSub){
          const doneCount=g.subtasks.filter(s=>s.done).length;
          r.appendChild(h("span",{style:"font-size:10px;color:#fca5a5;font-family:monospace"},doneCount+"/"+g.subtasks.length));
        }
        // Hours
        const coWkHrs=calcGoalTotalHours(g.id);
        if(coWkHrs>0)r.appendChild(h("span",{style:"font-size:10px;color:#f59e0b;font-family:'JetBrains Mono',monospace;font-weight:700;flex-shrink:0"},fmtHours(coWkHrs)));
        r.appendChild(h("button",{className:"goal-del",onClick:()=>{
          if(hasSub&&!confirm("서브태스크도 함께 삭제됩니다. 계속할까요?"))return;
          removePeriodGoal(scope,g.id);
        }},"✕"));
        item.appendChild(r);
        // Ancestry
        const coWkAnc=renderAncestry(g);
        if(coWkAnc)item.appendChild(coWkAnc);
        // Progress bar
        const pr=h("div",{className:"goal-progress-row"});
        const pct=g.progress||0;
        if(hasSub){
          const track=h("div",{style:"flex:1;height:6px;background:#1e293b;border-radius:3px;overflow:hidden"});
          track.appendChild(h("div",{style:"height:100%;width:"+pct+"%;background:#ef4444;transition:width .3s"}));
          pr.appendChild(track);
          pr.appendChild(h("span",{className:"goal-progress-val",style:"color:#ef4444"},pct+"%"));
        }else{
          const slider=h("input",{type:"range",min:"0",max:"100",step:"5",value:String(pct),className:"goal-progress-slider"});
          const valSpan=h("span",{className:"goal-progress-val",style:"color:#ef4444"},pct+"%");
          slider.addEventListener("input",e=>{
            const v=parseInt(e.target.value);
            valSpan.textContent=v+"%";
            updateGoalProgress(scope,g.id,v);
          });
          pr.appendChild(slider);
          pr.appendChild(valSpan);
        }
        item.appendChild(pr);
        // Expanded: subtasks + parent edit + period edit
        if(isExpanded){
          const subWrap=h("div",{style:"margin-top:6px;padding:8px;background:#111827;border-radius:8px;border:1px dashed #7f1d1d"});
          // Period edit
          const periodRow=h("div",{style:"display:flex;gap:6px;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e293b;font-size:11px"});
          periodRow.appendChild(h("span",{style:"color:#64748b;font-size:10px;flex-shrink:0"},"📆 기간:"));
          const mSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          for(let m=1;m<=12;m++){const o=h("option",{value:String(m)},m+"월");if(m===g.month)o.selected=true;mSel.appendChild(o)}
          mSel.addEventListener("change",e=>{const nm=parseInt(e.target.value);updatePeriodGoalField(scope,g.id,"month",nm);const wm2=weeksInMonth(state.year,nm);if(g.weekIdx>wm2)updatePeriodGoalField(scope,g.id,"weekIdx",wm2);render()});
          periodRow.appendChild(mSel);
          const wSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          const wm2=weeksInMonth(state.year,g.month);
          for(let w=1;w<=wm2;w++){const o=h("option",{value:String(w)},w+"주");if(w===g.weekIdx)o.selected=true;wSel.appendChild(o)}
          wSel.addEventListener("change",e=>{updatePeriodGoalField(scope,g.id,"weekIdx",parseInt(e.target.value));render()});
          periodRow.appendChild(wSel);
          subWrap.appendChild(periodRow);
          // Parent edit
          const parentEditEl=renderParentEditSelectors(scope,g);
          if(parentEditEl)subWrap.appendChild(parentEditEl);
          // Subtasks
          if(hasSub){
            g.subtasks.forEach(s=>{
              const sr=h("div",{style:"display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px"});
              const chk=h("button",{className:"goal-check"+(s.done?" checked":""),style:"width:16px;height:16px;font-size:10px;border-width:1.5px",onClick:()=>toggleSubtask(scope,g.id,s.id)},s.done?"✓":"");
              sr.appendChild(chk);
              sr.appendChild(h("span",{style:"flex:1;color:"+(s.done?"#64748b":"#fca5a5")+";text-decoration:"+(s.done?"line-through":"none")},s.name));
              sr.appendChild(h("span",{style:"font-size:10px;color:#ef4444;font-family:monospace;font-weight:700"},(s.weight||0)+"%"));
              sr.appendChild(h("button",{className:"goal-del",style:"font-size:12px",onClick:()=>removeSubtask(scope,g.id,s.id)},"✕"));
              subWrap.appendChild(sr);
            });
          }
          // Add subtask form
          const subFormKey=scope+"-"+g.id;
          const addRow=h("div",{style:"display:flex;gap:4px;margin-top:6px;padding-top:6px;border-top:1px solid #1e293b"});
          const subInp=h("input",{className:"goal-input",placeholder:"세부 단계",value:state.goalSubInputs[subFormKey]||"",style:"flex:1;font-size:11px;padding:6px 8px"});
          subInp.addEventListener("input",e=>{state.goalSubInputs[subFormKey]=e.target.value});
          subInp.addEventListener("keydown",e=>{if(e.key==="Enter")addSubtask(scope,g.id)});
          addRow.appendChild(subInp);
          const wInp=h("input",{className:"goal-input",type:"number",placeholder:"%",value:state.goalSubWeights[subFormKey]||"",style:"width:50px;font-size:11px;padding:6px 4px;text-align:center",min:"1",max:"100"});
          wInp.addEventListener("input",e=>{state.goalSubWeights[subFormKey]=e.target.value});
          addRow.appendChild(wInp);
          addRow.appendChild(h("button",{className:"goal-add-btn",style:"padding:6px 10px;font-size:11px",onClick:()=>addSubtask(scope,g.id)},"+"));
          subWrap.appendChild(addRow);
          item.appendChild(subWrap);
        }
        ul.appendChild(item);
      });
      if(activeGoals.length>0){
        ul.appendChild(h("div",{style:"border-top:1px solid #1e293b;margin:8px 0"}));
      }
    }

    activeGoals.forEach(g=>{
      const cat=catByCode(g.cat);
      const item=h("div",{className:"goal-item"});
      const expKey=scope+"-"+g.id;
      const isExpanded=!!state.goalExpanded[expKey];
      const hasSub=g.subtasks&&g.subtasks.length>0;
      // Header row
      const r=h("div",{className:"goal-item-row"});
      // Expand toggle
      const toggleBtn=h("button",{className:"goal-del",style:"font-size:11px;padding:2px 4px;color:#94a3b8",onClick:()=>toggleGoalExpand(scope,g.id)},isExpanded?"▼":"▶");
      r.appendChild(toggleBtn);
      r.appendChild(renderEditableCat(g.cat,newCat=>{
        updatePeriodGoalField(scope,g.id,"cat",newCat);render();
      }));
      r.appendChild(renderEditableName(g.name,newName=>{
        updatePeriodGoalField(scope,g.id,"name",newName);
      }));
      if(hasSub){
        const doneCount=g.subtasks.filter(s=>s.done).length;
        r.appendChild(h("span",{style:"font-size:10px;color:#64748b;font-family:monospace"},doneCount+"/"+g.subtasks.length));
      }
      // Hours display
      const totalHrs=calcGoalTotalHours(g.id);
      const directHrs=calcGoalDirectHours(g.id);
      if(totalHrs>0){
        const hrsText=totalHrs===directHrs?fmtHours(totalHrs):fmtHours(directHrs)+"(+"+fmtHours(totalHrs-directHrs)+")";
        r.appendChild(h("span",{style:"font-size:10px;color:#f59e0b;font-family:'JetBrains Mono',monospace;font-weight:700;flex-shrink:0"},hrsText));
      }
      r.appendChild(h("button",{className:"goal-del",onClick:()=>{
        if(hasSub&&!confirm("서브태스크 "+g.subtasks.length+"개도 함께 삭제됩니다. 계속할까요?"))return;
        removePeriodGoal(scope,g.id);
      }},"✕"));
      item.appendChild(r);
      // Ancestry breadcrumb
      const anc=renderAncestry(g);
      if(anc)item.appendChild(anc);
      // Child goals count
      const children=getChildGoals(g.id);
      if(children.length>0){
        item.appendChild(h("div",{style:"font-size:9px;color:#0d9488;padding:2px 0"},"└ 하위 목표 "+children.length+"개"));
      }
      // Progress: auto bar (with subtasks) or manual slider (without)
      const pr=h("div",{className:"goal-progress-row"});
      if(hasSub){
        // Read-only progress bar
        const pct=g.progress||0;
        const track=h("div",{style:"flex:1;height:6px;background:#1e293b;border-radius:3px;overflow:hidden"});
        track.appendChild(h("div",{style:"height:100%;width:"+pct+"%;background:#0d9488;transition:width .3s"}));
        pr.appendChild(track);
        pr.appendChild(h("span",{className:"goal-progress-val"},pct+"%"));
      }else{
        // Manual slider
        const slider=h("input",{type:"range",min:"0",max:"100",step:"5",value:String(g.progress||0),className:"goal-progress-slider"});
        const valSpan=h("span",{className:"goal-progress-val"},(g.progress||0)+"%");
        slider.addEventListener("input",e=>{
          const v=parseInt(e.target.value);
          valSpan.textContent=v+"%";
          updateGoalProgress(scope,g.id,v);
        });
        pr.appendChild(slider);
        pr.appendChild(valSpan);
      }
      item.appendChild(pr);
      // Meta: editable period display
      if(scope==="weekly"){
        const meta=h("div",{className:"goal-meta",style:"cursor:pointer",onClick:()=>toggleGoalExpand(scope,g.id)});
        meta.appendChild(h("span",{className:"goal-meta-item"},"📆 "+g.month+"월 "+g.weekIdx+"주 ("+weekDateRange(state.year,g.month,g.weekIdx)+")"));
        item.appendChild(meta);
      }
      if(scope==="monthly"&&(g.startMonth||g.endMonth)){
        const sm=g.startMonth||g.month;
        const em=g.endMonth||g.month;
        const rangeTxt=sm===em?(sm+"월"):(sm+"~"+em+"월");
        const meta=h("div",{className:"goal-meta"});
        meta.appendChild(h("span",{className:"goal-meta-item"},"🗓 "+rangeTxt));
        item.appendChild(meta);
      }
      if(scope==="longterm"&&(g.startYear||g.endYear||g.targetYear)){
        const meta=h("div",{className:"goal-meta"});
        const sy=g.startYear||g.targetYear;
        const ey=g.endYear||g.targetYear;
        const rangeTxt=sy===ey?(sy+"년"):(sy+"~"+ey);
        meta.appendChild(h("span",{className:"goal-meta-item"},"🎯 "+rangeTxt));
        item.appendChild(meta);
      }
      // Editable memo (inline)
      if(g.memo){
        const memoDiv=h("div",{className:"goal-memo",style:"cursor:pointer",onClick:e=>{
          e.stopPropagation();
          const inp=document.createElement("input");
          inp.className="goal-input";
          inp.style="width:100%;font-size:11px;padding:6px 8px;margin-top:4px;";
          inp.value=g.memo;
          inp.addEventListener("blur",()=>{
            updatePeriodGoalField(scope,g.id,"memo",inp.value.trim());
            render();
          });
          inp.addEventListener("keydown",ev=>{if(ev.key==="Enter")inp.blur();if(ev.key==="Escape")render()});
          memoDiv.replaceWith(inp);
          inp.focus();
        }},g.memo);
        item.appendChild(memoDiv);
      }
      // Subtasks (when expanded)
      if(isExpanded){
        const subWrap=h("div",{style:"margin-top:6px;padding:8px;background:#111827;border-radius:8px;border:1px dashed #1e293b"});

        // Period edit controls
        if(scope==="weekly"){
          const periodRow=h("div",{style:"display:flex;gap:6px;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e293b;font-size:11px"});
          periodRow.appendChild(h("span",{style:"color:#64748b;font-size:10px;flex-shrink:0"},"📆 기간:"));
          const mSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          for(let m=1;m<=12;m++){const o=h("option",{value:String(m)},m+"월");if(m===g.month)o.selected=true;mSel.appendChild(o)}
          mSel.addEventListener("change",e=>{
            const nm=parseInt(e.target.value);
            updatePeriodGoalField(scope,g.id,"month",nm);
            const wm=weeksInMonth(state.year,nm);
            if(g.weekIdx>wm)updatePeriodGoalField(scope,g.id,"weekIdx",wm);
            render();
          });
          periodRow.appendChild(mSel);
          const wSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          const wm=weeksInMonth(state.year,g.month);
          for(let w=1;w<=wm;w++){const o=h("option",{value:String(w)},w+"주");if(w===g.weekIdx)o.selected=true;wSel.appendChild(o)}
          wSel.addEventListener("change",e=>{updatePeriodGoalField(scope,g.id,"weekIdx",parseInt(e.target.value));render()});
          periodRow.appendChild(wSel);
          subWrap.appendChild(periodRow);
        }
        if(scope==="monthly"){
          const periodRow=h("div",{style:"display:flex;gap:6px;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e293b;font-size:11px"});
          periodRow.appendChild(h("span",{style:"color:#64748b;font-size:10px;flex-shrink:0"},"🗓 기간:"));
          const smSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          for(let m=1;m<=12;m++){const o=h("option",{value:String(m)},m+"월");if(m===(g.startMonth||g.month))o.selected=true;smSel.appendChild(o)}
          smSel.addEventListener("change",e=>{
            const v=parseInt(e.target.value);
            updatePeriodGoalField(scope,g.id,"startMonth",v);
            updatePeriodGoalField(scope,g.id,"month",v);
            if((g.endMonth||g.month)<v)updatePeriodGoalField(scope,g.id,"endMonth",v);
            render();
          });
          periodRow.appendChild(smSel);
          periodRow.appendChild(h("span",{style:"color:#64748b"},"~"));
          const emSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          for(let m=1;m<=12;m++){const o=h("option",{value:String(m)},m+"월");if(m===(g.endMonth||g.month))o.selected=true;emSel.appendChild(o)}
          emSel.addEventListener("change",e=>{
            const v=parseInt(e.target.value);
            updatePeriodGoalField(scope,g.id,"endMonth",v);
            if((g.startMonth||g.month)>v){updatePeriodGoalField(scope,g.id,"startMonth",v);updatePeriodGoalField(scope,g.id,"month",v)}
            render();
          });
          periodRow.appendChild(emSel);
          subWrap.appendChild(periodRow);
        }
        if(scope==="longterm"){
          const periodRow=h("div",{style:"display:flex;gap:6px;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e293b;font-size:11px"});
          periodRow.appendChild(h("span",{style:"color:#64748b;font-size:10px;flex-shrink:0"},"🎯 기간:"));
          const sySel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          for(let y=2026;y<=2040;y++){const o=h("option",{value:String(y)},y+"");if(y===(g.startYear||g.targetYear))o.selected=true;sySel.appendChild(o)}
          sySel.addEventListener("change",e=>{
            const v=parseInt(e.target.value);
            updatePeriodGoalField(scope,g.id,"startYear",v);
            if((g.endYear||g.targetYear)<v)updatePeriodGoalField(scope,g.id,"endYear",v);
            render();
          });
          periodRow.appendChild(sySel);
          periodRow.appendChild(h("span",{style:"color:#64748b"},"~"));
          const eySel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          for(let y=2026;y<=2040;y++){const o=h("option",{value:String(y)},y+"");if(y===(g.endYear||g.targetYear))o.selected=true;eySel.appendChild(o)}
          eySel.addEventListener("change",e=>{
            const v=parseInt(e.target.value);
            updatePeriodGoalField(scope,g.id,"endYear",v);
            if((g.startYear||g.targetYear)>v)updatePeriodGoalField(scope,g.id,"startYear",v);
            render();
          });
          periodRow.appendChild(eySel);
          subWrap.appendChild(periodRow);
        }
        // Editable memo field (always shown in expanded)

        // Parent goal edit (multi-scope, not for longterm)
        if(scope!=="longterm"){
          const parentEditEl=renderParentEditSelectors(scope,g);
          if(parentEditEl)subWrap.appendChild(parentEditEl);
        }

        if(!g.memo){
          const memoRow=h("div",{style:"margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e293b"});
          const memoInp=h("input",{className:"goal-input",placeholder:"메모 추가...",value:"",style:"width:100%;font-size:11px;padding:6px 8px"});
          memoInp.addEventListener("blur",()=>{
            if(memoInp.value.trim()){updatePeriodGoalField(scope,g.id,"memo",memoInp.value.trim());render()}
          });
          memoInp.addEventListener("keydown",ev=>{if(ev.key==="Enter")memoInp.blur()});
          memoRow.appendChild(memoInp);
          subWrap.appendChild(memoRow);
        }

        if(hasSub){
          g.subtasks.forEach(s=>{
            const sr=h("div",{style:"display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px"});
            const chk=h("button",{className:"goal-check"+(s.done?" checked":""),style:"width:16px;height:16px;font-size:10px;border-width:1.5px",onClick:()=>toggleSubtask(scope,g.id,s.id)},s.done?"✓":"");
            sr.appendChild(chk);
            sr.appendChild(h("span",{style:"flex:1;color:"+(s.done?"#64748b":"#cbd5e1")+";text-decoration:"+(s.done?"line-through":"none")},s.name));
            sr.appendChild(h("span",{style:"font-size:10px;color:#0d9488;font-family:monospace;font-weight:700"},(s.weight||0)+"%"));
            sr.appendChild(h("button",{className:"goal-del",style:"font-size:12px",onClick:()=>removeSubtask(scope,g.id,s.id)},"✕"));
            subWrap.appendChild(sr);
          });
          // Show weight total warning
          const totalWeight=g.subtasks.reduce((s,x)=>s+(x.weight||0),0);
          if(totalWeight!==100){
            subWrap.appendChild(h("div",{style:"font-size:9px;color:"+(totalWeight>100?"#ef4444":"#f59e0b")+";text-align:right;margin-top:2px"},"가중치 합: "+totalWeight+"% "+(totalWeight===100?"":(totalWeight<100?"(아직 "+(100-totalWeight)+"% 남음)":"(100% 초과!)"))));
          }
        }
        // Add subtask form
        const subFormKey=scope+"-"+g.id;
        const addRow=h("div",{style:"display:flex;gap:4px;margin-top:6px;padding-top:6px;border-top:1px solid #1e293b"});
        const subInp=h("input",{className:"goal-input",placeholder:"세부 단계",value:state.goalSubInputs[subFormKey]||"",style:"flex:1;font-size:11px;padding:6px 8px"});
        subInp.addEventListener("input",e=>{state.goalSubInputs[subFormKey]=e.target.value});
        subInp.addEventListener("keydown",e=>{if(e.key==="Enter")addSubtask(scope,g.id)});
        addRow.appendChild(subInp);
        const wInp=h("input",{className:"goal-input",type:"number",placeholder:"%",value:state.goalSubWeights[subFormKey]||"",style:"width:50px;font-size:11px;padding:6px 4px;text-align:center",min:"1",max:"100"});
        wInp.addEventListener("input",e=>{state.goalSubWeights[subFormKey]=e.target.value});
        addRow.appendChild(wInp);
        addRow.appendChild(h("button",{className:"goal-add-btn",style:"padding:6px 10px;font-size:11px",onClick:()=>addSubtask(scope,g.id)},"+"));
        subWrap.appendChild(addRow);
        item.appendChild(subWrap);
      }
      ul.appendChild(item);
    });
    wrap.appendChild(ul);

    // Completed goals section
    if(completedGoals.length>0){
      const doneSection=h("div",{style:"margin-top:12px"});
      doneSection.appendChild(h("div",{style:"font-size:10px;color:#064e3b;font-weight:700;padding:4px 0;margin-bottom:4px;border-bottom:1px solid #064e3b"},"✅ 완료된 목표 ("+completedGoals.length+")"));
      const doneList=h("div",{className:"goal-list"});
      completedGoals.forEach(g=>{
        const cat=catByCode(g.cat);
        const item=h("div",{className:"goal-item done",style:"opacity:.5"});
        const r=h("div",{className:"goal-item-row"});
        r.appendChild(h("span",{style:"font-size:14px;color:#10b981;flex-shrink:0"},"✓"));
        r.appendChild(h("span",{className:"goal-cat-tag",style:"background:"+(cat?cat.color:"#475569")},g.cat));
        r.appendChild(h("span",{className:"goal-name done"},g.name));
        const doneHrs=calcGoalTotalHours(g.id);
        if(doneHrs>0)r.appendChild(h("span",{style:"font-size:10px;color:#f59e0b;font-family:'JetBrains Mono',monospace;font-weight:700;flex-shrink:0"},fmtHours(doneHrs)));
        r.appendChild(h("button",{className:"goal-del",onClick:()=>{
          if(confirm("완료된 목표를 삭제할까요?"))removePeriodGoal(scope,g.id);
        }},"✕"));
        item.appendChild(r);
        const pr=h("div",{className:"goal-progress-row"});
        const track=h("div",{style:"flex:1;height:6px;background:#1e293b;border-radius:3px;overflow:hidden"});
        track.appendChild(h("div",{style:"height:100%;width:100%;background:#10b981"}));
        pr.appendChild(track);
        pr.appendChild(h("span",{className:"goal-progress-val",style:"color:#10b981"},"100%"));
        item.appendChild(pr);
        doneList.appendChild(item);
      });
      doneSection.appendChild(doneList);
      wrap.appendChild(doneSection);
    }
  }
  return wrap;
}

function renderGoals(){
  const wrap=h("div",{});
  // Scope selector
  const bar=h("div",{className:"goal-scope-bar"});
  [{id:"daily",icon:"📌",label:"일간"},{id:"weekly",icon:"📆",label:"주간"},{id:"monthly",icon:"🗓",label:"월간"},{id:"longterm",icon:"🎯",label:"장기"}].forEach(s=>{
    const b=h("button",{className:"goal-scope-btn"+(state.goalScope===s.id?" active":""),onClick:()=>{state.goalScope=s.id;state.goalNewName="";state.goalNewMemo="";state.goalNewDeadline="";render()}});
    b.appendChild(h("span",{className:"goal-scope-icon"},s.icon));
    b.appendChild(h("span",{},s.label));
    bar.appendChild(b);
  });
  wrap.appendChild(bar);

  const sec=h("div",{className:"goal-section"});
  const titles={daily:"📌 일간 목표",weekly:"📆 주간 목표",monthly:"🗓 월간 목표",longterm:"🎯 장기 목표"};

    sec.appendChild(renderDailyGoals());

  }
  wrap.appendChild(sec);

}

function renderBooks(){
  const wrap=h("div",{});
  const stats=getBookStats();

  // Year summary cards
  let yearEn=0,yearKr=0,yearTotal=0;
  for(let m=1;m<=12;m++){yearEn+=stats[m].en;yearKr+=stats[m].kr;yearTotal+=stats[m].total}
  const cards=h("div",{className:"book-summary-grid"});
  const c1=h("div",{className:"book-summary-card"});
  c1.appendChild(h("div",{className:"book-summary-value",style:"color:#f59e0b"},String(yearTotal)));
  c1.appendChild(h("div",{className:"book-summary-label"},"전체"));
  cards.appendChild(c1);
  const c2=h("div",{className:"book-summary-card"});
  c2.appendChild(h("div",{className:"book-summary-value",style:"color:#3b82f6"},String(yearEn)));
  c2.appendChild(h("div",{className:"book-summary-label"},"영어책"));
  cards.appendChild(c2);
  const c3=h("div",{className:"book-summary-card"});
  c3.appendChild(h("div",{className:"book-summary-value",style:"color:#10b981"},String(yearKr)));
  c3.appendChild(h("div",{className:"book-summary-label"},"한글책"));
  cards.appendChild(c3);
  wrap.appendChild(cards);

  // Month selector
  const mbar=h("div",{className:"book-month-selector"});
  for(let m=1;m<=12;m++){
    const cnt=(state.bookData[String(m)]||[]).length;
    const label=m+"월"+(cnt>0?" ("+cnt+")":"");
    mbar.appendChild(h("button",{className:"book-month-btn"+(m===state.bookMonth?" active":""),onClick:()=>{state.bookMonth=m;render()}},label));
  }
  wrap.appendChild(mbar);

  // Input section
  const inputSec=h("div",{className:"book-section"});
  inputSec.appendChild(h("h3",{className:"book-section-title"},"📖 "+state.bookMonth+"월 독서 기록"));

  const typeRow=h("div",{style:"display:flex;gap:8px;margin-bottom:10px"});
  const enBtn=h("button",{className:"book-type-btn"+(state.bookNewType==="en"?" active-en":""),onClick:()=>{state.bookNewType="en";render()}},"🇺🇸 영어책");
  const krBtn=h("button",{className:"book-type-btn"+(state.bookNewType==="kr"?" active-kr":""),onClick:()=>{state.bookNewType="kr";render()}},"🇰🇷 한글책");
  typeRow.appendChild(enBtn);
  typeRow.appendChild(krBtn);
  inputSec.appendChild(typeRow);

  const inputRow=h("div",{className:"book-input-row"});
  const titleInput=h("input",{className:"book-input",placeholder:"책 제목을 입력하세요",value:state.bookNewTitle});
  titleInput.addEventListener("input",e=>{state.bookNewTitle=e.target.value});
  titleInput.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&state.bookNewTitle.trim()){
      addBook(state.bookMonth,state.bookNewType,state.bookNewTitle.trim());
      state.bookNewTitle="";
    }
  });
  inputRow.appendChild(titleInput);
  const addBtn=h("button",{className:"book-add-btn",onClick:()=>{
    if(!state.bookNewTitle.trim())return;
    addBook(state.bookMonth,state.bookNewType,state.bookNewTitle.trim());
    state.bookNewTitle="";
  }},"추가");
  inputRow.appendChild(addBtn);
  inputSec.appendChild(inputRow);

  // Book list for selected month
  const monthBooks=state.bookData[String(state.bookMonth)]||[];
  if(monthBooks.length>0){
    const list=h("div",{className:"book-list"});
    monthBooks.forEach(book=>{
      const item=h("div",{className:"book-item",style:"flex-wrap:wrap"});
      // Type toggle button
      const typeBtn=h("button",{className:"book-type-tag "+(book.type==="en"?"en":"kr"),style:"cursor:pointer",onClick:()=>{
        updateBookField(state.bookMonth,book.id,"type",book.type==="en"?"kr":"en");
        render();
      }},book.type==="en"?"EN":"KR");
      item.appendChild(typeBtn);
      // Editable title
      const titleSpan=h("span",{className:"book-item-title",style:"cursor:pointer",onClick:e=>{
        e.stopPropagation();
        const inp=document.createElement("input");
        inp.className="book-input";
        inp.style="flex:1;font-size:13px;padding:4px 8px;";
        inp.value=book.title;
        inp.addEventListener("blur",()=>{
          if(inp.value.trim()&&inp.value.trim()!==book.title){
            updateBookField(state.bookMonth,book.id,"title",inp.value.trim());
          }
          render();
        });
        inp.addEventListener("keydown",ev=>{if(ev.key==="Enter")inp.blur();if(ev.key==="Escape")render()});
        titleSpan.replaceWith(inp);
        inp.focus();inp.select();
      }},book.title);
      item.appendChild(titleSpan);
      item.appendChild(h("button",{className:"book-del-btn",onClick:()=>removeBook(state.bookMonth,book.id)},"✕"));
      // Memo/감상
      const memoInput=h("input",{style:"width:100%;margin-top:6px;padding:6px 10px;border-radius:8px;border:1px solid #1e293b;background:#111827;color:#94a3b8;font-size:11px;font-family:'Noto Sans KR',sans-serif;outline:none",placeholder:"한줄 감상 입력...",value:book.memo||""});
      let memoTimer=null;
      memoInput.addEventListener("input",e=>{
        clearTimeout(memoTimer);
        memoTimer=setTimeout(()=>{updateBookMemo(state.bookMonth,book.id,e.target.value)},800);
      });
      memoInput.addEventListener("focus",e=>{e.target.style.borderColor="#f59e0b"});
      memoInput.addEventListener("blur",e=>{e.target.style.borderColor="#1e293b"});
      item.appendChild(memoInput);
      list.appendChild(item);
    });
    inputSec.appendChild(list);
  }else{
    inputSec.appendChild(h("div",{className:"book-empty"},"이번 달 읽은 책이 없습니다"));
  }
  wrap.appendChild(inputSec);

  // Chart
  const chartSec=h("div",{className:"chart-container"});
  chartSec.appendChild(h("h3",{className:"chart-title"},"📈 월별 독서 추이 (권)"));
  const chartWrap=h("div",{className:"chart-wrap"});
  const canvas=h("canvas",{id:"bookChart"});
  chartWrap.appendChild(canvas);
  chartSec.appendChild(chartWrap);
  wrap.appendChild(chartSec);

  // Yearly table
  const tableSec=h("div",{className:"book-section"});
  tableSec.appendChild(h("h3",{className:"book-section-title"},"📊 연간 독서 현황"));
  const table=h("div",{className:"book-yearly-table"});
  const hdr=h("div",{className:"book-yr-row header"});
  hdr.appendChild(h("span",{className:"book-yr-cell"},""));
  for(let m=1;m<=12;m++)hdr.appendChild(h("span",{className:"book-yr-cell"},m+"월"));
  hdr.appendChild(h("span",{className:"book-yr-cell",style:"font-weight:700"},"합계"));
  table.appendChild(hdr);

  // EN row
  const enRow=h("div",{className:"book-yr-row"});
  enRow.appendChild(h("span",{className:"book-yr-cell",style:"color:#3b82f6;font-weight:700"},"EN"));
  let enSum=0;
  for(let m=1;m<=12;m++){
    const v=stats[m].en;
    enSum+=v;
    enRow.appendChild(h("span",{className:"book-yr-cell",style:v>0?"color:#60a5fa;background:#3b82f620":""},v>0?String(v):"–"));
  }
  enRow.appendChild(h("span",{className:"book-yr-cell",style:"font-weight:700;color:#3b82f6"},String(enSum)));
  table.appendChild(enRow);

  // KR row
  const krRow=h("div",{className:"book-yr-row"});
  krRow.appendChild(h("span",{className:"book-yr-cell",style:"color:#10b981;font-weight:700"},"KR"));
  let krSum=0;
  for(let m=1;m<=12;m++){
    const v=stats[m].kr;
    krSum+=v;
    krRow.appendChild(h("span",{className:"book-yr-cell",style:v>0?"color:#34d399;background:#10b98120":""},v>0?String(v):"–"));
  }
  krRow.appendChild(h("span",{className:"book-yr-cell",style:"font-weight:700;color:#10b981"},String(krSum)));
  table.appendChild(krRow);

  // Total row
  const totRow=h("div",{className:"book-yr-row"});
  totRow.appendChild(h("span",{className:"book-yr-cell",style:"color:#f59e0b;font-weight:700"},"합계"));
  let totSum=0;
  for(let m=1;m<=12;m++){
    const v=stats[m].total;
    totSum+=v;
    totRow.appendChild(h("span",{className:"book-yr-cell",style:v>0?"color:#fbbf24;font-weight:600;background:#f59e0b20":""},v>0?String(v):"–"));
  }
  totRow.appendChild(h("span",{className:"book-yr-cell",style:"font-weight:900;color:#f59e0b;font-size:13px"},String(totSum)));
  table.appendChild(totRow);

  tableSec.appendChild(table);
  wrap.appendChild(tableSec);

  setTimeout(()=>renderBookChart(stats),0);
  return wrap;
}

  const grid=h("div",{className:"cat-grid"});

  ov.appendChild(sheet);

// Track if user is actively typing in an input/textarea
var _isEditing=false;
document.addEventListener("focusin",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")_isEditing=true;
});
document.addEventListener("focusout",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"){
    // Small delay: blur fires before click, so let click handlers run first
    setTimeout(()=>{
      var ae=document.activeElement;
      if(!ae||ae.tagName==="BODY"||ae.tagName==="BUTTON"||ae.tagName==="DIV")_isEditing=false;
    },100);
  }
});
function render(force){
  if(_isEditing&&!force)return;
  const app=document.getElementById("app");
  app.innerHTML="";
  app.appendChild(renderHeader());
  app.appendChild(renderTabs());
  const main=h("div",{className:"main"});
  if(state.tab==="input"||state.tab==="daily"){
    main.appendChild(renderDateBar());
    if(state.showDatePicker)main.appendChild(renderDatePicker());
  }
  if(state.tab==="input")main.appendChild(renderInput());
  if(state.tab==="daily")main.appendChild(renderDaily());
  if(state.tab==="dashboard")main.appendChild(renderDashboard());
  if(state.tab==="goals")main.appendChild(renderGoals());
  if(state.tab==="books")main.appendChild(renderBooks());
  app.appendChild(main);
  if(state.showCatPicker)app.appendChild(renderCatPicker());
}

state.data=load();
state.bookData=loadBooks();
state.goalData=loadGoals();
render();
