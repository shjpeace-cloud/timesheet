<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="시간통계">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0f1a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>⏱ 시간통계</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#0c0f1a;font-family:'Noto Sans KR',sans-serif;color:#e2e8f0;overflow-x:hidden}
@keyframes spin{to{transform:rotate(360deg)}}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:80px}
.header{padding:16px 20px 8px;background:linear-gradient(135deg,#0c0f1a,#1a1f35);position:sticky;top:0;z-index:50;border-bottom:1px solid #1e293b}
.header-top{display:flex;justify-content:space-between;align-items:center}
.title-row{display:flex;align-items:center;gap:10px}
.title{font-size:22px;font-weight:900;letter-spacing:-0.5px}
.year-btn{background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:4px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'JetBrains Mono',monospace}
.year-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;padding:10px 0 4px}
.year-opt{padding:7px 14px;border-radius:8px;border:1px solid #334155;background:#111827;color:#94a3b8;font-size:13px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:600}
.year-opt.active{background:#6366f1;color:#fff;border-color:#6366f1}
.header-actions{display:flex;align-items:center;gap:8px}
.saved-badge{font-size:11px;background:#064e3b;color:#6ee7b7;padding:3px 10px;border-radius:20px;font-weight:500}
.saved-badge.error{background:#7f1d1d;color:#fca5a5}
.menu-btn{background:none;border:none;color:#94a3b8;font-size:22px;cursor:pointer;padding:4px 8px}
.dropdown{position:absolute;right:16px;top:52px;background:#1e293b;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:100;border:1px solid #334155}
.dropdown button{display:block;width:100%;padding:14px 20px;border:none;background:none;color:#e2e8f0;font-size:14px;cursor:pointer;text-align:left;font-family:'Noto Sans KR',sans-serif}
.dropdown button.danger{color:#f87171}
.tab-bar{display:flex;justify-content:center;gap:4px;padding:8px 16px;background:#0c0f1a;position:sticky;top:56px;z-index:40}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;border:none;border-radius:12px;background:#111827;color:#64748b;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;transition:all .2s}
.tab.active{background:#1e293b;color:#e2e8f0;box-shadow:0 0 20px rgba(99,102,241,.15)}
.tab-icon{font-size:18px}
.tab-label{font-size:11px}
.main{padding:0 12px 20px}
.date-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 0 10px}
.date-arrow{background:#1e293b;border:1px solid #334155;color:#94a3b8;width:36px;height:36px;border-radius:10px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.date-display{background:none;border:none;cursor:pointer;display:flex;align-items:baseline;gap:6px;color:#e2e8f0}
.date-month{font-size:16px;font-weight:500;color:#94a3b8}
.date-day{font-size:28px;font-weight:900;font-family:'JetBrains Mono',monospace}
.today-btn{background:#6366f1;border:none;color:#fff;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.dp-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center}
.dp-box{background:#1e293b;border-radius:20px;padding:20px;width:90%;max-width:360px;border:1px solid #334155}
.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.month-btn{padding:8px 0;border-radius:8px;border:1px solid #334155;background:#111827;color:#94a3b8;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.month-btn.active{background:#6366f1;color:#fff;border-color:#6366f1;font-weight:700}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day-btn{padding:10px 0;border-radius:8px;border:none;background:#111827;color:#94a3b8;font-size:13px;cursor:pointer;font-family:'JetBrains Mono',monospace}
.day-btn.active{background:#6366f1;color:#fff;font-weight:700}
.day-btn.has-data{box-shadow:inset 0 -2px 0 #6366f1}
.mode-toggle{display:flex;gap:4px;padding:4px;background:#111827;border-radius:12px;margin-bottom:12px}
.mode-btn{flex:1;padding:10px 0;border:none;border-radius:10px;background:transparent;color:#64748b;font-size:14px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s}
.mode-btn.active-plan{background:#6366f1;color:#fff}
.mode-btn.active-actual{background:#059669;color:#fff}
.slot{display:flex;align-items:center;padding:8px 10px;background:#111827;border-radius:10px;transition:all .15s;flex-wrap:wrap;margin-bottom:2px;border-left:4px solid transparent}
.slot.hour-start{border-top:1px solid #1e293b;margin-top:4px}
.slot-time{width:52px;flex-shrink:0}
.time-text{font-size:13px;color:#94a3b8;font-family:'JetBrains Mono',monospace}
.time-text.bold{font-weight:700}
.slot-content{flex:1;cursor:pointer;min-height:32px;display:flex;align-items:center}
.slot-filled{display:flex;align-items:center;gap:8px}
.cat-badge{padding:2px 8px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace}
.cat-label{font-size:13px;color:#cbd5e1}
.slot-empty{font-size:12px;color:#475569}
.slot-actions{width:30px;display:flex;justify-content:center}
.clear-btn{background:none;border:none;color:#64748b;font-size:16px;cursor:pointer;padding:4px}
.memo-tag{width:100%;padding-left:52px;font-size:11px;color:#94a3b8;margin-top:2px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.summary-col{background:#111827;border-radius:14px;padding:14px;border:1px solid #1e293b}
.summary-title{font-size:14px;font-weight:700;margin-bottom:12px;color:#6366f1}
.summary-title.actual{color:#059669}
.group-block{margin-bottom:10px}
.group-header{display:flex;justify-content:space-between;padding:6px 8px;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:2px;border-radius:4px}
.group-name{font-size:10px}
.group-total{font-family:'JetBrains Mono',monospace;font-size:12px}
.cat-row{display:flex;align-items:center;gap:4px;padding:3px 8px;font-size:11px}
.cat-code{font-weight:700;width:22px;font-family:'JetBrains Mono',monospace;font-size:10px}
.cat-name{flex:1;color:#94a3b8;font-size:10px}
.cat-hours{font-family:'JetBrains Mono',monospace;color:#cbd5e1;font-size:11px}
.total-row{text-align:center;padding:10px 0;font-weight:700;font-size:14px;border-top:1px solid #1e293b;margin-top:8px;color:#6366f1;font-family:'JetBrains Mono',monospace}
.total-row.actual{color:#059669}
.bar-section{margin-top:16px;background:#111827;border-radius:14px;padding:16px;border:1px solid #1e293b}
.bar-title{font-size:14px;font-weight:700;margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{width:16px;font-weight:900;font-size:14px;font-family:'JetBrains Mono',monospace}
.bar-track{flex:1;height:24px;background:#1e293b;border-radius:6px;position:relative;overflow:hidden}
.bar{position:absolute;left:0;height:45%;border-radius:4px;transition:width .4s ease}
.bar.plan{top:0;opacity:.35}
.bar.actual{top:55%}
.bar-val{width:44px;font-size:11px;color:#94a3b8;font-family:'JetBrains Mono',monospace;text-align:right}
.bar-legend{display:flex;justify-content:center;gap:16px;font-size:11px;color:#94a3b8;margin-top:8px}
.dash-month-bar{display:flex;gap:4px;padding:12px 0;overflow-x:auto;scrollbar-width:none}
.dash-month-bar::-webkit-scrollbar{display:none}
.dash-month-btn{flex-shrink:0;padding:8px 12px;border-radius:8px;border:1px solid #1e293b;background:#111827;color:#64748b;font-size:12px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:600}
.dash-month-btn.active{background:#6366f1;color:#fff;border-color:#6366f1}
.dash-section{background:#111827;border-radius:14px;padding:16px;border:1px solid #1e293b;margin-bottom:16px}
.dash-title{font-size:15px;font-weight:700;margin-bottom:14px}
.dash-group{margin-bottom:12px}
.dash-group-header{display:flex;justify-content:space-between;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:500;margin-bottom:4px}
.dash-cat-row{display:flex;align-items:center;gap:6px;padding:5px 12px;font-size:12px}
.dash-cat-code{font-weight:700;width:24px;font-family:'JetBrains Mono',monospace;font-size:11px}
.dash-bar-track{flex:1;height:6px;background:#1e293b;border-radius:3px;overflow:hidden}
.dash-bar{height:100%;border-radius:3px;transition:width .4s ease}
.dash-cat-val{width:30px;text-align:right;font-size:11px;font-family:'JetBrains Mono',monospace;color:#94a3b8}
.dash-total{text-align:center;padding:12px 0;font-weight:700;font-size:16px;border-top:1px solid #1e293b;margin-top:8px;color:#e2e8f0;font-family:'JetBrains Mono',monospace}
.year-table{overflow-x:auto;font-size:10px}
.year-hdr-row,.year-row{display:flex;min-width:700px;padding:4px 0}
.year-hdr-row{border-bottom:1px solid #1e293b;padding-bottom:6px}
.year-row{border-bottom:1px solid #0f172a}
.year-cell{flex:1;min-width:42px;text-align:center;padding:4px 2px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#94a3b8}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.picker-sheet{background:#1e293b;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;padding:12px 20px 30px;box-shadow:0 -10px 50px rgba(0,0,0,.5)}
.picker-handle{width:40px;height:4px;background:#475569;border-radius:2px;margin:0 auto 14px}
.picker-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.picker-title{font-size:16px;font-weight:700}
.picker-time{font-size:13px;color:#94a3b8;font-family:'JetBrains Mono',monospace}
.memo-row{display:flex;gap:8px;margin-bottom:16px}
.memo-field{flex:1;padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#111827;color:#e2e8f0;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none}
.memo-save-btn{padding:0 16px;border-radius:10px;border:none;background:#6366f1;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.cat-grid{display:flex;flex-direction:column;gap:14px}
.picker-group-label{font-size:12px;font-weight:700;margin-bottom:6px;letter-spacing:.5px}
.picker-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.picker-btn{padding:12px 8px;border-radius:10px;border:1px solid;cursor:pointer;text-align:center;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px;background:none}
.picker-btn:active{transform:scale(.95)}
.picker-code{font-weight:800;font-size:14px;font-family:'JetBrains Mono',monospace}
.picker-label{font-size:10px;color:#e2e8f0;font-weight:600}
.chart-container{background:#111827;border-radius:14px;padding:16px;border:1px solid #1e293b;margin-bottom:16px}
.chart-title{font-size:15px;font-weight:700;margin-bottom:14px}
.chart-wrap{position:relative;width:100%;height:220px}
.hidden{display:none}

/* 독서통계 styles */
.book-month-selector{display:flex;gap:4px;padding:12px 0;overflow-x:auto;scrollbar-width:none}
.book-month-selector::-webkit-scrollbar{display:none}
.book-month-btn{flex-shrink:0;padding:8px 12px;border-radius:8px;border:1px solid #1e293b;background:#111827;color:#64748b;font-size:12px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:600}
.book-month-btn.active{background:#f59e0b;color:#fff;border-color:#f59e0b}
.book-section{background:#111827;border-radius:14px;padding:16px;border:1px solid #1e293b;margin-bottom:16px}
.book-section-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.book-input-row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.book-input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#0c0f1a;color:#e2e8f0;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none}
.book-input:focus{border-color:#f59e0b}
.book-type-btn{padding:8px 14px;border-radius:10px;border:1px solid #334155;background:#111827;color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.book-type-btn.active-en{background:#3b82f620;color:#60a5fa;border-color:#3b82f6}
.book-type-btn.active-kr{background:#10b98120;color:#34d399;border-color:#10b981}
.book-add-btn{padding:8px 16px;border-radius:10px;border:none;background:#f59e0b;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.book-add-btn:active{transform:scale(.95)}
.book-list{display:flex;flex-direction:column;gap:6px}
.book-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0c0f1a;border-radius:10px;border:1px solid #1e293b}
.book-type-tag{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.book-type-tag.en{background:#3b82f630;color:#60a5fa}
.book-type-tag.kr{background:#10b98130;color:#34d399}
.book-item-title{flex:1;font-size:13px;color:#e2e8f0;font-weight:500}
.book-del-btn{background:none;border:none;color:#64748b;font-size:16px;cursor:pointer;padding:2px 6px}
.book-del-btn:hover{color:#f87171}
.book-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.book-summary-card{background:#111827;border-radius:14px;padding:16px;border:1px solid #1e293b;text-align:center}
.book-summary-value{font-size:28px;font-weight:900;font-family:'JetBrains Mono',monospace;margin-bottom:4px}
.book-summary-label{font-size:11px;color:#94a3b8;font-weight:500}
.book-empty{text-align:center;padding:30px 0;color:#475569;font-size:13px}
.book-yearly-table{overflow-x:auto}
.book-yr-row{display:flex;min-width:600px;padding:6px 0;border-bottom:1px solid #0f172a;align-items:center}
.book-yr-row.header{border-bottom:1px solid #1e293b;font-weight:600;color:#64748b;font-size:10px}
.book-yr-cell{flex:1;min-width:40px;text-align:center;padding:4px 2px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#94a3b8}

/* 목표 styles */
.goal-scope-bar{display:flex;gap:4px;padding:12px 0;overflow-x:auto;scrollbar-width:none}
.goal-scope-bar::-webkit-scrollbar{display:none}
.goal-scope-btn{flex:1;min-width:60px;padding:10px 8px;border-radius:10px;border:1px solid #1e293b;background:#111827;color:#64748b;font-size:12px;cursor:pointer;font-weight:600;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px}
.goal-scope-btn.active{background:#0d9488;color:#fff;border-color:#0d9488}
.goal-search-inp:focus{border-color:#0d9488!important;outline:none}
.goal-scope-icon{font-size:16px}
.goal-section{background:#111827;border-radius:14px;padding:14px;border:1px solid #1e293b;margin-bottom:12px}
.goal-section-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.goal-form{background:#0c0f1a;border-radius:10px;padding:10px;margin-bottom:10px;border:1px solid #1e293b}
.goal-form-row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.goal-input{flex:1;min-width:100px;padding:8px 10px;border-radius:8px;border:1px solid #334155;background:#111827;color:#e2e8f0;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none}
.goal-input:focus{border-color:#0d9488}
.goal-cat-select{padding:8px 10px;border-radius:8px;border:1px solid #334155;background:#111827;color:#e2e8f0;font-size:12px;font-family:'JetBrains Mono',monospace;outline:none}
.goal-add-btn{padding:8px 14px;border-radius:8px;border:none;background:#0d9488;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.goal-add-btn:active{transform:scale(.95)}
.goal-list{display:flex;flex-direction:column;gap:8px}
.goal-item{background:#0c0f1a;border-radius:10px;padding:10px 12px;border:1px solid #1e293b;display:flex;flex-direction:column;gap:6px}
.goal-item.done{opacity:.55}
.goal-item-row{display:flex;align-items:center;gap:8px}
.goal-cat-tag{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0;color:#fff}
.goal-name{flex:1;font-size:13px;color:#cbd5e1}
.goal-name.done{text-decoration:line-through;color:#64748b}
.goal-check{width:22px;height:22px;border-radius:6px;border:2px solid #475569;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#0d9488;flex-shrink:0;padding:0}
.goal-check.checked{background:#0d9488;border-color:#0d9488;color:#fff}
.goal-del{background:none;border:none;color:#475569;font-size:16px;cursor:pointer;padding:2px 6px}
.goal-del:hover{color:#ef4444}
.goal-progress-row{display:flex;align-items:center;gap:8px;margin-top:2px}
.goal-progress-slider{flex:1;height:6px;-webkit-appearance:none;appearance:none;background:#1e293b;border-radius:3px;outline:none}
.goal-progress-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#0d9488;cursor:pointer;border:none}
.goal-progress-slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#0d9488;cursor:pointer;border:none}
.goal-progress-val{width:38px;text-align:right;font-size:11px;font-family:'JetBrains Mono',monospace;color:#0d9488;font-weight:700}
.goal-meta{font-size:10px;color:#64748b;display:flex;gap:10px;flex-wrap:wrap}
.goal-meta-item{display:flex;align-items:center;gap:3px}
.goal-memo{font-size:11px;color:#94a3b8;padding:6px 8px;background:#111827;border-radius:6px;border-left:2px solid #0d9488}
.goal-empty{text-align:center;padding:20px 0;color:#475569;font-size:12px}
.goal-date-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.goal-date-arrow{background:#1e293b;border:1px solid #334155;color:#94a3b8;width:32px;height:32px;border-radius:8px;font-size:12px;cursor:pointer}
.goal-date-label{font-size:14px;font-weight:700;color:#e2e8f0;font-family:'JetBrains Mono',monospace}

/* ==== PC / Tablet responsive (태블릿 768px+, PC 1200px+) ==== */
@media (min-width:768px){
  #app{max-width:760px;padding-bottom:40px}
  .main{padding:0 20px 30px}
  .title{font-size:28px}
  .date-day{font-size:36px}
  .date-month{font-size:20px}
  .date-arrow{width:42px;height:42px;font-size:16px}
  .today-btn{font-size:14px;padding:8px 18px}
  .year-btn{font-size:15px;padding:5px 14px}
  .tab{padding:13px 0}
  .tab-icon{font-size:22px}
  .tab-label{font-size:13px}
  /* 입력 슬롯 (가장 많이 보는 화면) */
  .slot{padding:11px 14px;min-height:42px}
  .slot-time{width:60px}
  .time-text{font-size:15px!important}
  .time-text.bold{font-size:16px!important}
  .cat-badge{font-size:12px!important;padding:3px 9px!important}
  .cat-label{font-size:15px}
  .slot-empty{font-size:14px}
  .memo-tag{font-size:13px;padding-left:60px}
  /* 슬롯 내 인라인 font-size 덮어쓰기 (planInp, goalSpan, "탭" placeholder) */
  .slot input{font-size:13px!important;padding:3px 6px!important}

function isHoliday(y,m,d){return HOLIDAYS[y]&&HOLIDAYS[y][m+"-"+d]||null}
// 평일 판정: 월~금이고 한국 공휴일이 아닌 날
function isWeekday(y,m,d){
  var dow=new Date(y,m-1,d).getDay();
  if(dow===0||dow===6)return false;
  if(isHoliday(y,m,d))return false;
  return true;
}
// 습관 완료 키: "M-D" 형식 (예: "4-13")
function habitKey(y,m,d){return y+"-"+m+"-"+d}
// 일간 입력에서 자동 체크 판정: 해당 날짜에 habit.id와 연결된 슬롯이 있으면 true
function isHabitAutoChecked(habit,y,m,d){
  var dk=(m)+"-"+(d);
  // 그 연도 entries 사용 — 과거 연도 평가 시 현재 연도 데이터로 거짓 매칭 방지
  var slots=getEntriesForYear(y)[dk]||{};
  var id=habit.id;
  // 직접 연결된 슬롯 확인
  for(var t in slots){
    if(t==="_diary")continue;
    if(slots[t].actualGoalId===id)return true;
  }
  // 하위 목표 ID 수집 (재귀)
  var descIds=new Set();
  function collectDesc(gid){
    var children=getChildGoals(gid);
    children.forEach(function(ch){
      if(!descIds.has(ch.goal.id)){
        descIds.add(ch.goal.id);
        collectDesc(ch.goal.id);
      }
    });
  }
  collectDesc(id);
  if(descIds.size>0){
    for(var t2 in slots){
      if(t2==="_diary")continue;
      if(slots[t2].actualGoalId&&descIds.has(slots[t2].actualGoalId))return true;
    }
  }
  // ── 자동 추론 룰 (habit 이름 키워드 → 카테고리/메모/시간대 매칭) ──
  // 이름 매칭은 공백 무시 ("새벽 기도" / "새벽기도" 모두 인정)
  var hname=(habit.name||"").replace(/\s/g,"");
  // 새벽 기도: D1 + 5:00~6:30 슬롯
  if(hname.indexOf("새벽기도")>=0){
    for(var t3 in slots){
      if(t3==="_diary")continue;
      var hr=parseInt((t3||"").split(":")[0],10);
      if(hr>=5&&hr<7&&slots[t3]&&slots[t3].actual==="D1")return true;
    }
  }
  // 묵상: D1 + 메모에 "묵상"
  if(hname.indexOf("묵상")>=0){
    for(var t4 in slots){
      if(t4==="_diary")continue;
      var s4=slots[t4];
      if(!s4||s4.actual!=="D1")continue;
      if((s4.actualMemo||"").indexOf("묵상")>=0)return true;
    }
  }
  // 성경 읽기: D1 + 메모에 "성경"
  if(hname.indexOf("성경")>=0){
    for(var t5 in slots){
      if(t5==="_diary")continue;
      var s5=slots[t5];
      if(!s5||s5.actual!=="D1")continue;
      if((s5.actualMemo||"").indexOf("성경")>=0)return true;
    }
  }
  // 영어뉴스: R3 + 메모에 "영어" 또는 "뉴스"
  if(hname.indexOf("영어뉴스")>=0){
    for(var t6 in slots){
      if(t6==="_diary")continue;
      var s6=slots[t6];
      if(!s6||s6.actual!=="R3")continue;
      var memo6=(s6.actualMemo||"");
      if(memo6.indexOf("영어")>=0||memo6.indexOf("뉴스")>=0)return true;
    }
  }
  return false;
}
// 수동+자동 통합 완료 여부
function isHabitDone(habit,y,m,d){
  return !!(habit.completions&&habit.completions[habitKey(y,m,d)])||isHabitAutoChecked(habit,y,m,d);
}
// 특정 날의 습관 수동 토글 (자동체크된 날은 수동체크 추가/제거만)
function toggleHabit(habitId,y,m,d){
  var habit=(state.goalData.habits||[]).find(function(h){return h.id===habitId});

// 주간 습관 진도: monDate 기준 주의 평일 (자동+수동) 체크 수 / 평일 수 * 100
function calcHabitWeeklyPct(habit,monDate){
  var count=0,total=0;
  for(var i=0;i<5;i++){
    var dd=new Date(monDate);dd.setDate(monDate.getDate()+i);
    var yy=dd.getFullYear(),mm=dd.getMonth()+1,day=dd.getDate();
    if(isWeekday(yy,mm,day)){
      total++;
      if(isHabitDone(habit,yy,mm,day))count++;
    }
  }
  if(total===0)return 0;
  return Math.round(count/total*100);
}
// 장기 전체 진도: (수동 completions + 자동체크) 합집합 날짜 수 / HABIT_TOTAL_DAYS * 100
function calcHabitLongtermPct(habit){
  var manualKeys=new Set(Object.keys(habit.completions||{}));
  var entries=state.data.entries||{};
  var autoKeys=new Set();
  // 하위 목표 ID 수집
  var descIds=new Set();
  function collectDesc(gid){
    getChildGoals(gid).forEach(function(ch){
      if(!descIds.has(ch.goal.id)){descIds.add(ch.goal.id);collectDesc(ch.goal.id);}
    });
  }
  collectDesc(habit.id);
  for(var dk in entries){
    var slots=entries[dk];
    for(var t in slots){
      if(t==="_diary")continue;
      var gid=slots[t].actualGoalId;
      if(gid===habit.id||descIds.has(gid)){autoKeys.add(dk);break;}
    }
  }
  var total=manualKeys.size+autoKeys.size;
  return Math.min(100,Math.round(total/HABIT_TOTAL_DAYS*100));
}
// Christian liturgical calendar (부활절 기반 계산)
function computeEaster(y){
  // Anonymous Gregorian algorithm
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4;
  var f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  var i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  var m2=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m2+114)/31),day=((h+l-7*m2+114)%31)+1;
  return{m:month,d:day};
}
function getChurchDays(y){
  var e=computeEaster(y);
  var ed=new Date(y,e.m-1,e.d);
  function addDays(dt,n){var r=new Date(dt);r.setDate(r.getDate()+n);return r}
  function fmt(dt){return(dt.getMonth()+1)+"-"+dt.getDate()}
  var days={};
  // 주현절 (1/6 고정)
  days["1-6"]="주현절";
  // 성회수요일 (부활절-46일)
  var ash=addDays(ed,-46);days[fmt(ash)]="성회수요일";
  // 사순절시작 = 성회수요일 다음 주일
  // 종려주일 (부활절-7일)
  var palm=addDays(ed,-7);days[fmt(palm)]="종려주일";
  // 성금요일 (부활절-2일)
  var gf=addDays(ed,-2);days[fmt(gf)]="성금요일";
  // 부활절
  days[fmt(ed)]="부활절";
  // 승천일 (부활절+39일)
  var asc=addDays(ed,39);days[fmt(asc)]="승천일";
  // 성령강림절 (부활절+49일)
  var pent=addDays(ed,49);days[fmt(pent)]="성령강림절";
  // 삼위일체주일 (부활절+56일)
  var trin=addDays(ed,56);days[fmt(trin)]="삼위일체주일";
  // 종교개혁일 (10/31 고정)
  days["10-31"]="종교개혁일";
  // 대림절 첫째주일 (11/30에 가장 가까운 주일)
  var nov30=new Date(y,10,30);
  var advDow=nov30.getDay();
  var advOff=advDow===0?0:(advDow<=3?-advDow:(7-advDow));
  var adv1=addDays(nov30,advOff);days[fmt(adv1)]="대림절";
  // 성탄절 (12/25 - 이미 공휴일에 포함)
  return days;
}

// ── Cloud sync (Sheets-as-truth, 2026-04-23 v69) ──
// Google Sheets = 진실의 원천. localStorage = 캐시 (앱 재시작 시 빠른 표시 + 오프라인 폴백)
// 모든 쓰기는 단일 FIFO 큐(_writeQueue)를 통해 직렬화 — race condition 제거 (이전 syncTimer 공유 버그 해결)
// 충돌 발생 시(클라우드 데이터 ≠ 로컬 미푸시 변경) 사용자에게 모달로 선택 제시
var CLOUD_URL=localStorage.getItem('timesheet-cloud-url')||'';
var SYNC_DEBOUNCE_MS=1500;            // 같은 (kind,year) 연속 변경 합치기
var SYNC_REPULL_INTERVAL=30000;       // 탭 재포커스 재-pull 스로틀
var _writeQueue=[];                    // [{kind, year, getter, scheduledAt, attempts}]
var _writeInFlight=false;
var _writeDrainTimer=null;
var _bootDone=false;                   // cloudBootstrap 완료 여부
var _lastCloudPullAt=0;
function _refreshSyncBadge(){
  if(!CLOUD_URL){if(state.syncStatus!=='offline'){state.syncStatus='offline';if(_bootDone){_isAutoRender=true;render();}}return;}
  var s=(_writeInFlight||_writeQueue.length>0)?'syncing':'idle';
  if(state.syncStatus!==s){state.syncStatus=s;if(_bootDone){_isAutoRender=true;render();}}
}
// 모든 쓰기는 enqueueWrite를 통과 — 같은 (kind,year)는 마지막 변경만 푸시
function enqueueWrite(kind,year,getter){
  if(!CLOUD_URL)return;
  if(isArchiveMode()&&kind!=='reviews')return; // 과거 연도는 reviews만 sync
  var keyStr=kind+'|'+String(year);
  _writeQueue=_writeQueue.filter(function(x){return (x.kind+'|'+x.year)!==keyStr;});
  _writeQueue.push({kind:kind,year:String(year),getter:getter,scheduledAt:Date.now()+SYNC_DEBOUNCE_MS,attempts:0});
  _refreshSyncBadge();
  _scheduleDrain();
}
function _scheduleDrain(){
  if(_writeInFlight||_writeQueue.length===0)return;
  clearTimeout(_writeDrainTimer);
  var nextDelay=Math.max(0,_writeQueue[0].scheduledAt-Date.now());
  _writeDrainTimer=setTimeout(_drainQueue,nextDelay);
}
function _drainQueue(){
  if(_writeInFlight||_writeQueue.length===0)return;
  var head=_writeQueue[0];
  if(Date.now()<head.scheduledAt){_scheduleDrain();return;}
  _writeQueue.shift();
  var payload;
  try{payload=head.getter();}catch(e){console.error('queue getter failed:',head.kind,e);_drainQueue();return;}
  if(payload==null){_scheduleDrain();return;}
  var actionMap={time:'save',books:'saveBooks',goals:'saveGoals',reviews:'saveReviews'};
  var action=actionMap[head.kind];
  if(!action){console.error('unknown queue kind:',head.kind);_scheduleDrain();return;}
  _writeInFlight=true;_refreshSyncBadge();
  var body='action='+action+'&year='+encodeURIComponent(head.year)+'&data='+encodeURIComponent(JSON.stringify(payload));
  fetch(CLOUD_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body,redirect:'follow'})
  .then(function(r){return r.json();}).then(function(d){
    _writeInFlight=false;
    if(!d||d.status!=='ok'){
      console.error('queue push not-ok:',head.kind,head.year,d);
      head.attempts++;
      if(head.attempts<=3){head.scheduledAt=Date.now()+3000*head.attempts;_writeQueue.unshift(head);}
      else{state.syncStatus='error';if(_bootDone){_isAutoRender=true;render();}}
    }
    _refreshSyncBadge();_scheduleDrain();
  }).catch(function(e){
    console.error('queue push error:',head.kind,head.year,e);
    _writeInFlight=false;
    head.attempts++;
    if(head.attempts<=3){head.scheduledAt=Date.now()+3000*head.attempts;_writeQueue.unshift(head);}
    else{state.syncStatus='error';if(_bootDone){_isAutoRender=true;render();}}
    _refreshSyncBadge();_scheduleDrain();
  });
}
function _hasPendingFor(kind,year){
  year=String(year);
  if(_writeInFlight)return true; // in-flight도 충돌 가능성 있음
  return _writeQueue.some(function(x){return x.kind===kind&&x.year===year;});
}
// 페이지 닫기 시 큐 잔량 sendBeacon으로 즉시 푸시 (debounce 무시)
function flushQueueNow(){
  if(!CLOUD_URL||_writeQueue.length===0)return;
  var actionMap={time:'save',books:'saveBooks',goals:'saveGoals',reviews:'saveReviews'};
  while(_writeQueue.length>0){
    var item=_writeQueue.shift();
    var action=actionMap[item.kind];if(!action)continue;
    var payload;try{payload=item.getter();}catch(e){continue;}
    if(payload==null)continue;
    var body='action='+action+'&year='+encodeURIComponent(item.year)+'&data='+encodeURIComponent(JSON.stringify(payload));
    try{navigator.sendBeacon(CLOUD_URL,new Blob([body],{type:'application/x-www-form-urlencoded'}));}catch(e){}
  }
}

function applyWeeklyPlan(monDate,plan,overwrite){
  const DOW_KEYS=["mon","tue","wed","thu","fri","sat","sun"];
  var applied=0;
  for(var i=0;i<7;i++){
    var dd=new Date(monDate);dd.setDate(monDate.getDate()+i);
    var dk=(dd.getMonth()+1)+"-"+dd.getDate();
    var dayPlan=plan[DOW_KEYS[i]]||[];
    if(dayPlan.length===0)continue;
    if(!state.data.entries[dk])state.data.entries[dk]={};
    dayPlan.forEach(function(p){
      var existing=state.data.entries[dk][p.time];
      if(!overwrite&&existing&&existing.plan)return; // 덮어쓰기 안 할 때 기존 plan 보존
      if(!state.data.entries[dk][p.time])state.data.entries[dk][p.time]={};
      state.data.entries[dk][p.time].plan=p.cat;
      if(p.memo)state.data.entries[dk][p.time].planMemo=p.memo;
      else delete state.data.entries[dk][p.time].planMemo;
      applied++;
    });
  }
  save();
  return applied;
}

    const p=JSON.parse(r);

    if(habits.length===0){

      if(longterm.length<before)migrated=true;
    }
    // ID 중복 제거 (이전 버전 버그로 중복 생성된 경우 정리)
    var seenIds={};
    var deduped=habits.filter(function(h){
      if(seenIds[h.id])return false;
      seenIds[h.id]=true;return true;
    });
    if(deduped.length<habits.length){habits=deduped;migrated=true;}
    var result={daily:p.daily||{},weekly:sortByDream(p.weekly||[]),monthly:sortByDream(p.monthly||[]),longterm:sortByDream(longterm),habits:habits,readingGoals:p.readingGoals||[],_lastEdited:p._lastEdited||0};

function calcReadingGoalProgress(rg){
  if(rg.type==="specific")return rg.progress||0;
  // cumulative: 전체 연도 bookData에서 해당 type 권수 집계 (2025년 포함)
  var count=0;
  for(var y=2025;y<=2040;y++){
    var bkey="books-data-"+y;
    var raw=null;
    try{raw=localStorage.getItem(bkey)}catch(e){}
    if(!raw)continue;
    try{
      var bd=JSON.parse(raw);
      for(var m=1;m<=12;m++){
        var list=bd[String(m)]||[];
        list.forEach(function(b){
          if(rg.bookType==="all"||b.type===rg.bookType)count++;
        });
      }
    }catch(e){}
  }
  if(rg.targetCount>0)return Math.min(100,Math.round(count/rg.targetCount*100));
  return 0;
}
function calcReadingGoalCount(rg){
  if(rg.type==="specific")return null;

  for(var y=2025;y<=2040;y++){

        list.forEach(function(b){

function migrateHabits(longtermList){
  var result=[];
  longtermList.forEach(function(g){
    if(HABIT_LONGTERM_IDS.indexOf(g.id)===-1)return;
    result.push({
      id:g.id,
      cat:g.cat,
      name:g.name,
      startDate:HABIT_START_DATE,
      endDate:HABIT_END_DATE,
      completions:{},
      longtermId:g.id

  return result;
}

  ["longterm","monthly","weekly"].forEach(function(sc){
    var arr=state.goalData[sc]||[];
    var before=arr.length;
    state.goalData[sc]=arr.filter(function(g){
      if(g.bookTarget&&(g.bookTarget.targetCount||0)>=1){
        removedIds.push(g.id);
        return false;
      }
      // bookTarget만 있고 count 없으면 → language 필드로 변환 후 유지
      if(g.bookTarget&&g.bookTarget.bookType){
        g.language=g.bookTarget.bookType;
        delete g.bookTarget;
      }
      return true;
    });
    removed+=before-state.goalData[sc].length;
  });
  // 고아 parentIds 정리: 삭제된 목표를 가리키는 참조를 모든 자식에서 제거
  if(removedIds.length>0){
    function cleanStaleP(g){
      if(!g.parentIds)return;
      Object.keys(g.parentIds).forEach(function(k){
        if(removedIds.indexOf(g.parentIds[k])>=0)delete g.parentIds[k];
      });
    }
    (state.goalData.longterm||[]).forEach(cleanStaleP);
    (state.goalData.monthly||[]).forEach(cleanStaleP);
    (state.goalData.weekly||[]).forEach(cleanStaleP);
    Object.keys(state.goalData.daily||{}).forEach(function(k){
      (state.goalData.daily[k]||[]).forEach(cleanStaleP);
    });
  }
  if(removed>0){
    try{localStorage.setItem(goalStorageKey(),JSON.stringify(state.goalData))}catch(e){}
    console.log("[cleanupLegacyBookTargets] removed "+removed+" count-based reading goals + cleaned "+removedIds.length+" stale parent refs");
  }
  return removed;
}
window.cleanupLegacyBookTargets=cleanupLegacyBookTargets;

// 모든 scope에서 특정 id의 목표를 제거 (parentIds 참조까지 청소)
function forceDeleteGoalById(gid){
  if(!gid)return 0;
  var removed=0;
  ["longterm","monthly","weekly","habits","readingGoals"].forEach(function(sc){
    var arr=state.goalData[sc]||[];
    var before=arr.length;
    state.goalData[sc]=arr.filter(function(x){return x.id!==gid;});
    removed+=before-state.goalData[sc].length;
  });
  Object.keys(state.goalData.daily||{}).forEach(function(k){
    var before=(state.goalData.daily[k]||[]).length;
    state.goalData.daily[k]=(state.goalData.daily[k]||[]).filter(function(x){return x.id!==gid;});
    removed+=before-state.goalData.daily[k].length;
    if(state.goalData.daily[k].length===0)delete state.goalData.daily[k];
  });
  function cleanP(gg){
    if(!gg.parentIds)return;
    Object.keys(gg.parentIds).forEach(function(k){if(gg.parentIds[k]===gid)delete gg.parentIds[k];});
  }
  (state.goalData.longterm||[]).forEach(cleanP);
  (state.goalData.monthly||[]).forEach(cleanP);
  (state.goalData.weekly||[]).forEach(cleanP);
  Object.keys(state.goalData.daily||{}).forEach(function(k){(state.goalData.daily[k]||[]).forEach(cleanP);});
  return removed;
}

// 이름으로 모든 매치를 강제 삭제 (부분 일치, 대소문자 무시)
function forceDeleteGoalsByName(needle){

  scan(state.goalData.monthly);

}

// 기존 독서목표 → longterm/weekly로 이관 (1회성, 이후 no-op)
function migrateReadingGoals(){
  if(!state.goalData||!state.goalData.readingGoals||state.goalData.readingGoals.length===0)return false;
  var rgList=state.goalData.readingGoals.slice();
  var today=new Date();
  var rgIdToScope={};
  rgList.forEach(function(rg){
    if(!rg.type||rg.type==="cumulative"){
      // 누적권수 목표(영어책 100권 등)는 새 모델에서 제외 — 삭제
      return;
    }else{
      var refDate=rg.endDate?new Date(rg.endDate):today;
      var ry=refDate.getFullYear(),rm=refDate.getMonth()+1;
      var startD=1,endD=Math.min(7,daysInMonth(ry,rm));
      if(rg.startDate){
        var sd=new Date(rg.startDate);
        if(sd.getFullYear()===ry&&sd.getMonth()+1===rm)startD=sd.getDate();
      }
      if(rg.endDate){
        var ed=new Date(rg.endDate);
        if(ed.getFullYear()===ry&&ed.getMonth()+1===rm)endD=ed.getDate();
      }
      var wi=weekIdxOfDay(ry,rm,startD);
      var wg={
        id:rg.id,cat:rg.cat,name:rg.name,memo:rg.memo||"",
        progress:rg.progress||0,subtasks:[],
        year:ry,month:rm,weekIdx:wi,startDay:startD,endDay:endD,
        period:ry+"-"+String(rm).padStart(2,"0")+"-W"+wi
      };
      if(!state.goalData.weekly)state.goalData.weekly=[];
      state.goalData.weekly.push(wg);
      rgIdToScope[rg.id]="weekly";
    }
  });
  // parentIds.readingGoals → parentIds.longterm/weekly로 재연결
  function fixParents(g){
    if(!g.parentIds||!g.parentIds.readingGoals)return;
    var rgId=g.parentIds.readingGoals;
    var newScope=rgIdToScope[rgId];
    if(newScope)g.parentIds[newScope]=rgId;
    delete g.parentIds.readingGoals;
  }
  (state.goalData.longterm||[]).forEach(fixParents);
  (state.goalData.monthly||[]).forEach(fixParents);
  (state.goalData.weekly||[]).forEach(fixParents);
  Object.keys(state.goalData.daily||{}).forEach(function(dk){
    (state.goalData.daily[dk]||[]).forEach(fixParents);
  });
  state.goalData.readingGoals=[];
  try{localStorage.setItem(goalStorageKey(),JSON.stringify(state.goalData))}catch(e){}
  console.log("[migrateReadingGoals] migrated "+rgList.length+" reading goals → longterm/weekly");
  return true;
}

// ── 데이터 병합 헬퍼 (타임스탬프 동일하나 내용 다를 때 사용) ──
// 두 entries 데이터를 병합. 날짜 키 합집합 + 충돌 시 슬롯 많은 쪽 선택.
// 구버전 클라이언트가 _lastEdited 갱신 없이 푸시한 경우 유실 방지용.
function mergeEntriesData(localData, cloudData){
  var localEnt=(localData&&localData.entries)||{};
  var cloudEnt=(cloudData&&cloudData.entries)||{};
  var merged={entries:{}};
  var allKeys={};
  Object.keys(localEnt).forEach(function(k){allKeys[k]=1;});
  Object.keys(cloudEnt).forEach(function(k){allKeys[k]=1;});
  Object.keys(allKeys).forEach(function(k){
    var l=localEnt[k], c=cloudEnt[k];
    if(!l&&c)merged.entries[k]=c;
    else if(l&&!c)merged.entries[k]=l;
    else if(l&&c){
      // 둘 다 있으면 슬롯 많은 쪽 선택 (이전 저장 보존 우선)
      var lSlots=Object.keys(l).filter(function(x){return x!=="_diary";}).length;
      var cSlots=Object.keys(c).filter(function(x){return x!=="_diary";}).length;
      merged.entries[k]=cSlots>lSlots?c:l;
    }
  });
  return merged;
}

// ── 충돌 모달 ────────────────────────────────────────────────
// 클라우드 데이터가 로컬과 다른데 큐에 미푸시 변경이 있을 때 사용자에게 선택권 제공.
// state._conflictQueue: 미해결 충돌 목록 [{kind, year, cloudData, localData}]
// 한 번에 하나씩 처리. 모달이 떠 있는 동안 _maybeRepull은 일시 정지.
function _enqueueConflict(kind,year,cloudData,localData){
  state._conflictQueue=state._conflictQueue||[];
  // 같은 (kind,year) 중복 제거
  state._conflictQueue=state._conflictQueue.filter(function(c){return !(c.kind===kind&&c.year===year);});
  state._conflictQueue.push({kind:kind,year:String(year),cloudData:cloudData,localData:localData});
  if(_bootDone){_isAutoRender=true;render();}
}
function _resolveConflict(useCloud){
  var c=(state._conflictQueue||[]).shift();if(!c)return;
  var keyMap={time:storageKey,books:bookStorageKey,goals:goalStorageKey};
  if(useCloud){
    // 클라우드로 교체 + 큐의 해당 (kind,year) 제거
    _writeQueue=_writeQueue.filter(function(x){return !(x.kind===c.kind&&x.year===c.year);});
    if(c.kind==='time'){state.data=c.cloudData;localStorage.setItem(keyMap.time(),JSON.stringify(c.cloudData));}
    else if(c.kind==='books'){state.bookData=c.cloudData;localStorage.setItem(keyMap.books(),JSON.stringify(c.cloudData));}
    else if(c.kind==='goals'){state.goalData=c.cloudData;localStorage.setItem(keyMap.goals(),JSON.stringify(c.cloudData));}
  }else{
    // 로컬 유지 → 강제 푸시
    if(c.kind==='time')enqueueWrite('time',c.year,function(){return state.data;});
    else if(c.kind==='books')enqueueWrite('books',c.year,function(){return state.bookData;});
    else if(c.kind==='goals')enqueueWrite('goals',c.year,function(){return state.goalData;});
  }
  _isAutoRender=true;render();
}

// 키 정규화 — JSON 문자열 비교 시 키 순서/내부 메타가 달라도 같다고 판정하기 위해
function _normalizeForCompare(obj){
  if(obj==null||typeof obj!=='object')return obj;
  if(Array.isArray(obj))return obj.map(_normalizeForCompare);
  var out={};
  Object.keys(obj).sort().forEach(function(k){
    if(k==='_lastEdited')return; // 타임스탬프는 비교에서 제외
    out[k]=_normalizeForCompare(obj[k]);
  });
  return out;
}
function _deepEqual(a,b){return JSON.stringify(_normalizeForCompare(a))===JSON.stringify(_normalizeForCompare(b));}

// ── 클라우드 읽기 (server = truth) ────────────────────────────
// _lastEdited 비교 제거. 서버 데이터를 항상 캐시에 적용.
// 단, 큐에 미푸시 write가 있는 (kind,year)는 충돌 모달로 사용자 선택.
function cloudLoadCurrent(){
  if(!CLOUD_URL)return Promise.resolve(false);
  var y=state.year;
  return Promise.all([
    fetch(CLOUD_URL+'?action=load&year='+y,{redirect:'follow'}).then(r=>r.json()).catch(e=>({status:'error',e:String(e)})),
    fetch(CLOUD_URL+'?action=loadBooks&year='+y,{redirect:'follow'}).then(r=>r.json()).catch(e=>({status:'error',e:String(e)})),
    fetch(CLOUD_URL+'?action=loadGoals&year='+y,{redirect:'follow'}).then(r=>r.json()).catch(e=>({status:'error',e:String(e)})),
    fetch(CLOUD_URL+'?action=loadReviews&year='+y,{redirect:'follow'}).then(r=>r.json()).catch(e=>({status:'error',e:String(e)}))
  ]).then(function(results){
    var t=results[0],b=results[1],g=results[2],rv=results[3];
    var changed=false,pushTime=false,pushBooks=false,pushGoals=false;
    // ─── Time: union merge (데이터 손실 방지) ───
    // 절대 원칙: 로컬에 있고 클라우드에 없는 슬롯은 지우지 않음.
    // 같은 (날짜,시각) 슬롯이 양쪽에 있고 내용이 다르면 → 더 많은 필드를 가진 쪽 (안전한 근사),
    // 또는 `_hasPendingFor`가 true면 사용자 선택 모달.
    if(t&&t.status==='ok'&&t.data){
      var mergeT=_mergeTimeEntries(state.data.entries||{},t.data.entries||{});
      if(mergeT.hasTrueConflict&&_hasPendingFor('time',y)){
        _enqueueConflict('time',y,t.data,state.data);
      }else if(mergeT.changed){
        state.data.entries=mergeT.entries;
        localStorage.setItem(storageKey(),JSON.stringify(state.data));
        changed=true;
        // 로컬에만 있던 데이터가 있으면 클라우드에 다시 push (merged 결과)
        if(mergeT.localOnlyCount>0||mergeT.localRicher>0)pushTime=true;
      }
    }
    // ─── Books: union merge by month/id ───
    if(b&&b.status==='ok'&&b.data){
      var mergeB=_mergeBooks(state.bookData||{},b.data||{});
      if(mergeB.hasTrueConflict&&_hasPendingFor('books',y)){
        _enqueueConflict('books',y,b.data,state.bookData);
      }else if(mergeB.changed){
        state.bookData=mergeB.data;
        localStorage.setItem(bookStorageKey(),JSON.stringify(state.bookData));
        changed=true;
        if(mergeB.localOnlyCount>0)pushBooks=true;
      }
    }
    // ─── Goals: union merge by id per scope ───
    if(g&&g.status==='ok'&&g.data){
      var inc=g.data;
      var cloudLongterm=inc.longterm||[];
      var cloudHabits=inc.habits||[];
      if(cloudHabits.length===0){
        cloudHabits=migrateHabits(cloudLongterm);
        if(cloudHabits.length>0)cloudLongterm=cloudLongterm.filter(function(g0){return HABIT_LONGTERM_IDS.indexOf(g0.id)===-1});
      }else{
        var hIds=cloudHabits.map(function(h){return h.longtermId}).filter(Boolean);
        cloudLongterm=cloudLongterm.filter(function(g0){return hIds.indexOf(g0.id)===-1});
      }
      var cloudGoals={daily:inc.daily||{},weekly:inc.weekly||[],monthly:inc.monthly||[],longterm:cloudLongterm,habits:cloudHabits,readingGoals:inc.readingGoals||[]};
      var mergeG=_mergeGoals(state.goalData||{},cloudGoals);
      if(mergeG.hasTrueConflict&&_hasPendingFor('goals',y)){
        _enqueueConflict('goals',y,cloudGoals,state.goalData);
      }else if(mergeG.changed){
        state.goalData={daily:mergeG.data.daily,weekly:sortByDream(mergeG.data.weekly),monthly:sortByDream(mergeG.data.monthly),longterm:sortByDream(mergeG.data.longterm),habits:mergeG.data.habits,readingGoals:mergeG.data.readingGoals};
        localStorage.setItem(goalStorageKey(),JSON.stringify(state.goalData));
        changed=true;
        if(mergeG.localOnlyCount>0)pushGoals=true;
      }
    }
    // ─── Reviews: 개별 키로 union (keys만 추가, 삭제 안 함) ───
    if(rv&&rv.status==='ok'&&rv.data){
      Object.keys(rv.data).forEach(function(k){
        if(k==='_lastEdited')return;
        // 로컬에 이미 있으면 비교. 더 긴/풍부한 쪽 선택.
        var existing=localStorage.getItem(k);
        var incoming=JSON.stringify(rv.data[k]);
        if(!existing||String(existing).length<incoming.length){
          try{localStorage.setItem(k,incoming);}catch(e){}
        }
      });
    }
    // 로컬에만 있던 데이터는 push (현재 연도)
    if(pushTime)enqueueWrite('time',y,function(){return state.data;});
    if(pushBooks)enqueueWrite('books',y,function(){return state.bookData;});
    if(pushGoals)enqueueWrite('goals',y,function(){return state.goalData;});
    if(changed&&_bootDone){_isAutoRender=true;render();}
    _refreshSyncBadge();
    return true;
  }).catch(function(e){
    console.error('cloudLoadCurrent failed:',e);
    state.syncStatus='error';if(_bootDone){_isAutoRender=true;render();}
    return false;
  });
}

// ── Union merge helpers ──────────────────────────────────────
// 원칙: 데이터 손실 방지 — 한쪽에만 있는 항목은 무조건 유지, 양쪽에 있으면 더 풍부한 쪽 선택.
// 진짜 충돌(같은 슬롯/id가 양쪽에 있고 실질적으로 다름)만 모달.

function _mergeTimeEntries(localE,cloudE){
  var merged={};
  var allDates={};
  Object.keys(localE).forEach(function(d){allDates[d]=1;});
  Object.keys(cloudE).forEach(function(d){allDates[d]=1;});
  var localOnlyCount=0,localRicher=0,hasTrueConflict=false,changed=false;
  Object.keys(allDates).forEach(function(d){
    var l=localE[d],c=cloudE[d];
    if(l&&!c){merged[d]=l;localOnlyCount++;changed=true;return;}
    if(!l&&c){merged[d]=c;changed=true;return;}
    // both — slot-level
    var mday={};
    var slots={};
    Object.keys(l).forEach(function(s){slots[s]=1;});
    Object.keys(c).forEach(function(s){slots[s]=1;});
    Object.keys(slots).forEach(function(s){
      var ls=l[s],cs=c[s];
      if(ls!=null&&cs==null){mday[s]=ls;localRicher++;changed=true;return;}
      if(ls==null&&cs!=null){mday[s]=cs;changed=true;return;}
      // both exist
      if(s==='_diary'){
        var la=String(ls||'');var ca=String(cs||'');
        if(la===ca){mday[s]=ls;return;}
        // 다른 내용 — 긴 쪽 선택 (일기는 누가 더 많이 썼나 기준)
        mday[s]=la.length>=ca.length?ls:cs;
        changed=true;return;
      }
      // 슬롯 오브젝트: 필드 풍부한 쪽 선택
      if(JSON.stringify(ls)===JSON.stringify(cs)){mday[s]=ls;return;}
      var lf=Object.keys(ls||{}).filter(function(k){return ls[k]!=null&&ls[k]!=='';}).length;
      var cf=Object.keys(cs||{}).filter(function(k){return cs[k]!=null&&cs[k]!=='';}).length;
      if(lf===cf){hasTrueConflict=true;} // 필드 수 동일인데 내용 다름 → 진짜 충돌
      mday[s]=lf>=cf?ls:cs;
      if(lf>cf)localRicher++;
      changed=true;
    });
    merged[d]=mday;
  });
  return {entries:merged,localOnlyCount:localOnlyCount,localRicher:localRicher,hasTrueConflict:hasTrueConflict,changed:changed};
}

function _mergeBooks(local,cloud){
  var merged={};
  var months={};
  Object.keys(local).forEach(function(k){if(k!=='_lastEdited')months[k]=1;});
  Object.keys(cloud).forEach(function(k){if(k!=='_lastEdited')months[k]=1;});
  var localOnlyCount=0,hasTrueConflict=false,changed=false;
  Object.keys(months).forEach(function(m){
    var lb=local[m]||[];
    var cb=cloud[m]||[];
    var byId={};
    lb.forEach(function(bk){var id=bk&&bk.id;if(id!=null)byId[id]={local:bk};else{byId['_noid_l_'+Math.random()]={local:bk};}});
    cb.forEach(function(bk){var id=bk&&bk.id;if(id!=null){if(byId[id])byId[id].cloud=bk;else byId[id]={cloud:bk};}else{byId['_noid_c_'+Math.random()]={cloud:bk};}});
    var arr=[];
    Object.keys(byId).forEach(function(id){
      var e=byId[id];
      if(e.local&&!e.cloud){arr.push(e.local);localOnlyCount++;changed=true;return;}
      if(!e.local&&e.cloud){arr.push(e.cloud);changed=true;return;}
      if(JSON.stringify(e.local)===JSON.stringify(e.cloud)){arr.push(e.local);return;}
      // 둘 다 있고 다름 — 메모 긴 쪽
      var lm=String(e.local.memo||'').length,cm=String(e.cloud.memo||'').length;
      arr.push(lm>=cm?e.local:e.cloud);
      if(lm!==cm)changed=true;
      else hasTrueConflict=true;
    });
    merged[m]=arr;
  });
  return {data:merged,localOnlyCount:localOnlyCount,hasTrueConflict:hasTrueConflict,changed:changed};
}

function _mergeGoalArr(localArr,cloudArr){
  // id 기준 union. 양쪽에 같은 id가 있으면 progress 높은 쪽 (또는 더 많은 필드).
  var byId={};
  var result=[];
  var localOnly=0,trueConflict=false,changed=false;
  (localArr||[]).forEach(function(it){var id=it&&it.id;if(id!=null)byId[id]={local:it};});
  (cloudArr||[]).forEach(function(it){var id=it&&it.id;if(id!=null){if(byId[id])byId[id].cloud=it;else byId[id]={cloud:it};}});
  Object.keys(byId).forEach(function(id){
    var e=byId[id];
    if(e.local&&!e.cloud){result.push(e.local);localOnly++;changed=true;return;}
    if(!e.local&&e.cloud){result.push(e.cloud);changed=true;return;}
    if(JSON.stringify(e.local)===JSON.stringify(e.cloud)){result.push(e.local);return;}
    // 둘 다 있음 — progress/done 선호 후 필드 수
    var lp=Number(e.local.progress||0),cp=Number(e.cloud.progress||0);
    var ld=e.local.done===true?1:0,cd=e.cloud.done===true?1:0;
    if(ld!==cd){result.push(ld>cd?e.local:e.cloud);changed=true;return;}
    if(lp!==cp){result.push(lp>cp?e.local:e.cloud);changed=true;return;}
    // 필드 수로 tie-break
    var lf=Object.keys(e.local).length,cf=Object.keys(e.cloud).length;
    if(lf===cf)trueConflict=true;
    result.push(lf>=cf?e.local:e.cloud);
    changed=true;
  });
  return {arr:result,localOnly:localOnly,trueConflict:trueConflict,changed:changed};
}

function _mergeGoals(local,cloud){
  var out={};
  var localOnlyCount=0,hasTrueConflict=false,changed=false;
  // daily: {M-D: [goals]}
  var dailyMerged={};
  var dKeys={};
  Object.keys(local.daily||{}).forEach(function(k){dKeys[k]=1;});
  Object.keys(cloud.daily||{}).forEach(function(k){dKeys[k]=1;});
  Object.keys(dKeys).forEach(function(dk){
    var m=_mergeGoalArr((local.daily||{})[dk]||[],(cloud.daily||{})[dk]||[]);
    dailyMerged[dk]=m.arr;
    localOnlyCount+=m.localOnly;
    if(m.trueConflict)hasTrueConflict=true;
    if(m.changed)changed=true;
  });
  out.daily=dailyMerged;
  // 배열 scope들
  ['weekly','monthly','longterm','habits','readingGoals'].forEach(function(sc){
    var m=_mergeGoalArr(local[sc]||[],cloud[sc]||[]);
    out[sc]=m.arr;
    localOnlyCount+=m.localOnly;
    if(m.trueConflict)hasTrueConflict=true;
    if(m.changed)changed=true;
  });
  return {data:out,localOnlyCount:localOnlyCount,hasTrueConflict:hasTrueConflict,changed:changed};
}

// 과거 연도 전체 sync: 각 kind별로 cloud에 존재하는 연도 집합을 반환
// 반환값 {time:Set, books:Set, goals:Set, reviews:Set} — bootstrap auto-push 기준
function cloudLoadPastYears(){
  if(!CLOUD_URL)return Promise.resolve({time:{},books:{},goals:{},reviews:{}});
  var present={time:{},books:{},goals:{},reviews:{}};
  return fetch(CLOUD_URL+'?action=loadAll',{redirect:'follow'}).then(r=>r.json()).then(function(d){
    if(d.status!=='ok'||!d.data)return present;
    var years=Object.keys(d.data);
    var pastYears=[];
    years.forEach(function(y){
      if(String(y)===String(state.year))return;
      pastYears.push(String(y));
      try{
        var inc=d.data[y];
        if(!inc||typeof inc!=='object')return;
        if(!inc.entries||Object.keys(inc.entries).length===0)return;
        present.time[y]=1;
        localStorage.setItem('timesheet-data-'+y,JSON.stringify(inc));
      }catch(e){console.error('past time '+y+':',e);}
    });
    var fetches=[];
    pastYears.forEach(function(y){
      fetches.push(fetch(CLOUD_URL+'?action=loadBooks&year='+y,{redirect:'follow'}).then(r=>r.json()).then(function(bd){
        if(bd.status==='ok'&&bd.data&&Object.keys(bd.data).some(function(k){return k!=='_lastEdited';})){
          present.books[y]=1;
          try{localStorage.setItem('books-data-'+y,JSON.stringify(bd.data));}catch(e){}
        }
      }).catch(function(e){console.error('past books '+y+':',e);}));
      fetches.push(fetch(CLOUD_URL+'?action=loadGoals&year='+y,{redirect:'follow'}).then(r=>r.json()).then(function(gd){
        if(gd.status!=='ok'||!gd.data)return;
        var inc=gd.data;
        var hasG=(inc.daily&&Object.keys(inc.daily).length>0)||(inc.weekly&&inc.weekly.length>0)||(inc.monthly&&inc.monthly.length>0)||(inc.longterm&&inc.longterm.length>0)||(inc.habits&&inc.habits.length>0)||(inc.readingGoals&&inc.readingGoals.length>0);
        if(hasG){
          present.goals[y]=1;
          try{localStorage.setItem('goals-data-'+y,JSON.stringify(inc));}catch(e){}
        }
      }).catch(function(e){console.error('past goals '+y+':',e);}));
    });
    // 리뷰는 연도 리스트를 미리 모름 — loadAllReviews로 한 번에
    fetches.push(fetch(CLOUD_URL+'?action=loadAllReviews',{redirect:'follow'}).then(r=>r.json()).then(function(rd){
      if(rd.status!=='ok'||!rd.data)return;
      Object.keys(rd.data).forEach(function(y){
        var blob=rd.data[y];if(!blob)return;
        var hasBlob=Object.keys(blob).some(function(k){return k!=='_lastEdited';});
        if(hasBlob)present.reviews[y]=1;
        Object.keys(blob).forEach(function(k){
          if(k==='_lastEdited')return;
          try{localStorage.setItem(k,JSON.stringify(blob[k]));}catch(e){}
        });
      });
    }).catch(function(e){console.error('past reviews:',e);}));
    return Promise.all(fetches).then(function(){return present;});
  }).catch(function(e){console.error('cloudLoadPastYears failed:',e);return present;});
}

// 부팅 시 1회: cloud → state 주입 → cloud에 없는 로컬 연도 자동 push (time/books/goals/reviews 모두)
// → cloudPushAllYears 수동 버튼 불필요 (기기 전환 시 자동 합류)
function cloudBootstrap(){
  if(!CLOUD_URL)return Promise.resolve();
  state.syncStatus='syncing';
  return cloudLoadCurrent().then(function(){
    return cloudLoadPastYears();
  }).then(function(present){
    present=present||{time:{},books:{},goals:{},reviews:{}};
    var curY=String(state.year);
    // 1) time data: localStorage에는 있지만 cloud에 없는 연도 push
    for(var i=0;i<localStorage.length;i++){
      var key=localStorage.key(i);if(!key)continue;
      var m=key.match(/^timesheet-data-(\d+)$/);
      if(m&&!present.time[m[1]]&&m[1]!==curY){
        var raw=localStorage.getItem(key);if(!raw)continue;
        try{
          var p=JSON.parse(raw);
          if(p&&p.entries&&Object.keys(p.entries).length>0){
            (function(yy,data){enqueueWrite('time',yy,function(){return data;});})(m[1],p);
          }
        }catch(e){}
      }
    }
    // 2) books data
    for(var i2=0;i2<localStorage.length;i2++){
      var k2=localStorage.key(i2);if(!k2)continue;
      var m2=k2.match(/^books-data-(\d+)$/);
      if(m2&&!present.books[m2[1]]&&m2[1]!==curY){
        var raw2=localStorage.getItem(k2);if(!raw2)continue;
        try{
          var p2=JSON.parse(raw2);
          var hasB=p2&&Object.keys(p2).some(function(k){return k!=='_lastEdited';});
          if(hasB){
            (function(yy,data){enqueueWrite('books',yy,function(){return data;});})(m2[1],p2);
          }
        }catch(e){}
      }
    }
    // 3) goals data
    for(var i3=0;i3<localStorage.length;i3++){
      var k3=localStorage.key(i3);if(!k3)continue;
      var m3=k3.match(/^goals-data-(\d+)$/);
      if(m3&&!present.goals[m3[1]]&&m3[1]!==curY){
        var raw3=localStorage.getItem(k3);if(!raw3)continue;
        try{
          var p3=JSON.parse(raw3);
          var hasG=p3&&((p3.daily&&Object.keys(p3.daily).length>0)||(p3.weekly&&p3.weekly.length>0)||(p3.monthly&&p3.monthly.length>0)||(p3.longterm&&p3.longterm.length>0)||(p3.habits&&p3.habits.length>0)||(p3.readingGoals&&p3.readingGoals.length>0));
          if(hasG){
            (function(yy,data){enqueueWrite('goals',yy,function(){return data;});})(m3[1],p3);
          }
        }catch(e){}
      }
    }
    // 4) reviews: localStorage의 *-review-YYYY-* 키에서 연도 수집 → cloud에 없는 연도만 push
    var localReviewYears={};
    for(var i4=0;i4<localStorage.length;i4++){
      var k4=localStorage.key(i4);if(!k4)continue;
      var rm=k4.match(/^(?:daily|weekly|monthly|yearly)-review-(\d+)/);
      if(rm&&rm[1]!==curY)localReviewYears[rm[1]]=true;
    }
    Object.keys(localReviewYears).forEach(function(y){
      if(present.reviews[y])return;
      var blob=collectReviewsForYear(y);
      if(Object.keys(blob).length===0)return;
      (function(yy,data){enqueueWrite('reviews',yy,function(){data._lastEdited=Date.now();return data;});})(y,blob);
    });
    _refreshSyncBadge();
  }).catch(function(e){
    console.error('cloudBootstrap failed:',e);
    state.syncStatus='error';
  });
}

// localStorage의 모든 연도 데이터(time/books/goals)를 클라우드에 일괄 푸시
// 기기 전환 초기 세팅용 — 데스크탑에서 한 번 클릭하면 과거 연도가 Sheets에 올라감
function cloudPushAllYears(){
  if(!CLOUD_URL){alert('클라우드 URL이 설정되지 않았습니다.');return;}
  var tasks=[];
  for(var i=0;i<localStorage.length;i++){
    var key=localStorage.key(i);
    if(!key)continue;
    var m=key.match(/^timesheet-data-(\d+)$/);
    if(m){
      if(String(m[1])===String(state.year))continue;
      var raw=localStorage.getItem(key);
      if(raw)tasks.push({action:'save',year:m[1],data:raw});
      continue;
    }
    m=key.match(/^books-data-(\d+)$/);
    if(m){
      if(String(m[1])===String(state.year))continue;
      var raw=localStorage.getItem(key);
      if(raw)tasks.push({action:'saveBooks',year:m[1],data:raw});
      continue;
    }
    m=key.match(/^goals-data-(\d+)$/);
    if(m){
      if(String(m[1])===String(state.year))continue;
      var raw=localStorage.getItem(key);
      if(raw)tasks.push({action:'saveGoals',year:m[1],data:raw});
    }
  }
  // 리뷰 메모: 키별 저장이므로 연도 그룹핑 후 blob으로 push
  var reviewYears={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(!k)continue;
    var rm=k.match(/^(?:daily|weekly|monthly|yearly)-review-(\d+)/);
    if(rm)reviewYears[rm[1]]=true;
  }
  Object.keys(reviewYears).forEach(function(y){
    var blob=collectReviewsForYear(y);
    if(Object.keys(blob).length===0)return;
    blob._lastEdited=Date.now();
    tasks.push({action:'saveReviews',year:y,data:JSON.stringify(blob)});
  });
  if(tasks.length===0){alert('업로드할 과거 연도 데이터가 없습니다.');return;}
  if(!confirm(tasks.length+'개 항목(과거 연도 시간/독서/목표)을 클라우드에 업로드합니다.\n계속하시겠습니까?'))return;
  var ok=0,fail=0,done=0,okItems=[],failItems=[];
  function showResult(){
    var msg='완료: 성공 '+ok+' / 실패 '+fail;
    if(okItems.length>0)msg+='\n\n[성공]\n'+okItems.join(', ');
    if(failItems.length>0)msg+='\n\n[실패]\n'+failItems.join('\n');
    if(ok>0)msg+='\n\n다른 기기에서 새로고침하면 성공한 연도가 로드됩니다.';
    alert(msg);
  }
  tasks.forEach(function(t){
    var label=t.action+' '+t.year;
    var body='action='+t.action+'&year='+t.year+'&data='+encodeURIComponent(t.data);
    fetch(CLOUD_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body,redirect:'follow'})
    .then(r=>{
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    }).then(d=>{
      if(d&&d.status==='ok'){ok++;okItems.push(label);}
      else{fail++;failItems.push(label+' — '+(d&&d.message?d.message:'status '+(d&&d.status)));}
      done++;
      if(done===tasks.length)showResult();
    }).catch(e=>{
      console.error('push '+label+' failed:',e);
      fail++;failItems.push(label+' — '+(e.message||'network error'));
      done++;
      if(done===tasks.length)showResult();
    });
  });
}

// Show goal picker overlay for linking a time slot to a goal
// Applies to consecutive same-category slots starting from 'time'
function showGoalPicker(time,goalField,catCode){
  const goals=getActiveGoalsForCat(catCode);
  // Find consecutive same-category slots from this time
  const field=state.mode==="plan"?"plan":"actual";
  const de=state.data.entries[dateKey()]||{};
  const startIdx=SLOTS.indexOf(time);
  let batchSlots=[time];
  for(let i=startIdx+1;i<SLOTS.length;i++){
    const sd=de[SLOTS[i]]||{};
    if(sd[field]===catCode)batchSlots.push(SLOTS[i]);
    else break;
  }
  const isBatch=batchSlots.length>1;

  const ov=document.createElement("div");
  ov.style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center";
  ov.addEventListener("click",()=>ov.remove());
  const box=document.createElement("div");
  box.style="background:#1e293b;border-radius:16px;padding:16px;max-width:340px;width:90%;max-height:70vh;overflow-y:auto;border:1px solid #334155";
  box.addEventListener("click",ev=>ev.stopPropagation());
  const titleText="🎯 목표 연결 · "+time+(isBatch?"~"+batchSlots[batchSlots.length-1]+" ("+batchSlots.length+"슬롯)":"")+" · "+catCode;
  box.appendChild(h("div",{style:"font-size:13px;font-weight:700;margin-bottom:10px;color:#e2e8f0"},titleText));

  // "없음" option to clear
  const noneBtn=h("button",{style:"width:100%;padding:10px;margin-bottom:6px;border-radius:8px;border:1px solid #334155;background:#111827;color:#94a3b8;font-size:12px;cursor:pointer;text-align:left;font-family:'Noto Sans KR',sans-serif",onClick:()=>{
    const k=dateKey();
    batchSlots.forEach(function(t){
      if(state.data.entries[k]&&state.data.entries[k][t]){
        delete state.data.entries[k][t][goalField];
      }
    });
    save();ov.remove();render(true);
  }},"없음 (연결 해제)"+(isBatch?" — "+batchSlots.length+"슬롯":""));
  box.appendChild(noneBtn);

  // Direct text input for custom goal
  const customRow=h("div",{style:"display:flex;gap:6px;margin-bottom:8px"});
  const customInp=h("input",{style:"flex:1;padding:8px 10px;border-radius:8px;border:1px solid #334155;background:#111827;color:#e2e8f0;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none",placeholder:"직접 입력..."});
  customInp.addEventListener("focus",function(){customInp.style.borderColor="#0d9488"});
  customInp.addEventListener("blur",function(){customInp.style.borderColor="#334155"});
  customInp.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&customInp.value.trim()){
      _isEditing=false;
      batchSlots.forEach(function(t){setSlotSilent(t,goalField,customInp.value.trim())});
      save();ov.remove();render(true);
    }
  });
  customRow.appendChild(customInp);
  const customBtn=h("button",{style:"padding:8px 12px;border-radius:8px;border:none;background:#0d9488;color:#fff;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0",onClick:function(){
    if(customInp.value.trim()){
      _isEditing=false;
      batchSlots.forEach(function(t){setSlotSilent(t,goalField,customInp.value.trim())});
      save();ov.remove();render(true);
    }
  }},"확인");
  customRow.appendChild(customBtn);
  box.appendChild(customRow);

  if(goals.length===0){
    box.appendChild(h("div",{style:"text-align:center;padding:20px 0;color:#475569;font-size:12px"},"이 카테고리의 활성 목표가 없습니다"));
  }else{
    // Group by scope (habits 포함)
    var pickerScopes=["longterm","habits","readingGoals","monthly","weekly","daily"];
    pickerScopes.forEach(function(s){
      var scopeGoals=goals.filter(function(g){return g.scope===s});
      if(scopeGoals.length===0)return;
      var sLabel={longterm:"장기",habits:"습관",readingGoals:"독서목표",monthly:"월간",weekly:"주간",daily:"일간"}[s]||s;
      box.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin:8px 0 4px;letter-spacing:.5px"},sLabel));
      scopeGoals.forEach(function(item){
        var g=item.goal;
        var btn=h("button",{style:"width:100%;padding:8px 10px;margin-bottom:4px;border-radius:8px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:12px;cursor:pointer;text-align:left;font-family:'Noto Sans KR',sans-serif;display:flex;align-items:center;gap:6px",onClick:function(){
          batchSlots.forEach(function(t){setSlotSilent(t,goalField,g.id)});
          save();ov.remove();render(true);

        var cat=catByCode(g.cat);
        btn.appendChild(h("span",{style:"font-size:10px;font-weight:700;color:"+(cat?cat.color:"#94a3b8")+";font-family:'JetBrains Mono',monospace;flex-shrink:0"},g.cat));

        box.appendChild(btn);
      });
    });
  }

  ov.appendChild(box);
  document.body.appendChild(ov);
}
function clearSlot(time,field){
  const k=dateKey();
  if(!state.data.entries[k]||!state.data.entries[k][time])return;
  delete state.data.entries[k][time][field];
  if(field==="plan"){delete state.data.entries[k][time]["planMemo"];delete state.data.entries[k][time]["planGoalId"]}
  if(field==="actual"){delete state.data.entries[k][time]["actualMemo"];delete state.data.entries[k][time]["actualGoalId"]}
  if(Object.keys(state.data.entries[k][time]).length===0)delete state.data.entries[k][time];
  _isEditing=false;save();render(true);
}

function dailySummary(){
  const p={},a={};
  CATEGORIES.forEach(c=>{p[c.code]=0;a[c.code]=0});
  const de=state.data.entries[dateKey()]||{};
  Object.entries(de).forEach(([k,s])=>{
    if(k==="_diary")return;
    if(s.plan)p[s.plan]=(p[s.plan]||0)+0.5;
    if(s.actual)a[s.actual]=(a[s.actual]||0)+0.5;
  });
  return{plan:p,actual:a};
}
function monthlySummary(){
  const r={};CATEGORIES.forEach(c=>{r[c.code]=0});
  Object.entries(state.data.entries).forEach(([k,ds])=>{
    const m=parseInt(k.split("-")[0]);
    if(m===state.dashMonth)Object.entries(ds).forEach(([sk,s])=>{if(sk!=="_diary"&&s.actual)r[s.actual]=(r[s.actual]||0)+0.5});
  });
  return r;
}
function yearSummary(){
  const by={};for(let m=1;m<=12;m++){by[m]={};CATEGORIES.forEach(c=>{by[m][c.code]=0})}
  Object.entries(state.data.entries).forEach(([k,ds])=>{
    const m=parseInt(k.split("-")[0]);
    if(by[m])Object.entries(ds).forEach(([sk,s])=>{if(sk!=="_diary"&&s.actual&&by[m])by[m][s.actual]=(by[m][s.actual]||0)+0.5});
  });
  return by;
}

// ── 기록일수 유틸 (일평균 계산용) ──
// "기록일"의 정의: 해당 날짜에 actual 슬롯이 1개 이상 있는 날
function countRecordedDaysInMonth(entries, m){
  var c=0;
  for(var d=1;d<=31;d++){
    var de=entries[m+"-"+d];
    if(!de)continue;
    for(var t in de){
      if(t==="_diary")continue;
      if(de[t]&&de[t].actual){c++;break;}
    }
  }
  return c;
}
function countRecordedDaysInYear(y){
  var ent=getEntriesForYear(y);
  var c=0;
  for(var m=1;m<=12;m++)c+=countRecordedDaysInMonth(ent,m);
  return c;
}
function countRecordedDaysInYearUpToMonth(entries, uptoM){
  var c=0;
  for(var m=1;m<=uptoM;m++)c+=countRecordedDaysInMonth(entries,m);
  return c;
}
function countRecordedDaysInWeek(monDate){
  var c=0;
  for(var di=0;di<7;di++){
    var dd=new Date(monDate);dd.setDate(monDate.getDate()+di);
    var ent=getEntriesForYear(dd.getFullYear());
    var de=ent[(dd.getMonth()+1)+"-"+dd.getDate()];
    if(!de)continue;
    for(var t in de){
      if(t==="_diary")continue;
      if(de[t]&&de[t].actual){c++;break;}
    }
  }
  return c;
}
// 커버리지 분모: 과거 해는 365(윤년 366), 금년은 경과일수, 미래는 0
function elapsedDaysInYear(y){
  var today=new Date();
  var ty=today.getFullYear();
  if(y<ty)return((y%4===0&&y%100!==0)||y%400===0)?366:365;
  if(y>ty)return 0;
  var start=new Date(y,0,1);
  return Math.floor((today-start)/86400000)+1;
}
// 안전 나눗셈 (소수점 2자리, 0 분모면 0)
function avgPerDay(total, days){
  return days>0?+(total/days).toFixed(2):0;
}

// ── 목표 날짜 판정 유틸 (필터 중복 통합, 단일 진실의 원천) ──
// 특정 목표의 활동 기간이 주어진 날짜(y,m,d)를 포함하는지 판정
// scope: "longterm" | "monthly" | "weekly" | "daily" | "readingGoals" | "habits"
// daily는 dk 키로 직접 조회하므로 별도 처리 불필요
function goalIncludesDate(g, scope, y, m, d){
  if(!g)return false;
  var key=y*10000+m*100+d;
  if(scope==="longterm"){
    var sy=g.startYear||g.targetYear||y;
    var ey=g.endYear||g.targetYear||y;
    return sy<=y&&y<=ey;
  }
  if(scope==="monthly"){
    var gy=g.year||y;
    if(gy!==y)return false;
    var sm=g.startMonth||g.month||1, sd=g.startDay||1;
    var em=g.endMonth||g.month||12, ed=g.endDay||daysInMonth(gy,em);
    return gy*10000+sm*100+sd<=key && key<=gy*10000+em*100+ed;
  }
  if(scope==="weekly"){
    var gy2=g.year||y;
    if(gy2!==y)return false;
    var sm2=g.startMonth||g.month||1, sd2=g.startDay||1;
    var em2=g.endMonth||g.month||sm2, ed2=g.endDay||Math.min(sd2+6,daysInMonth(gy2,em2));
    return gy2*10000+sm2*100+sd2<=key && key<=gy2*10000+em2*100+ed2;
  }
  if(scope==="readingGoals"){
    if(g.type==="specific"&&(g.startDate||g.endDate)){
      var dstr=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      if(g.startDate&&dstr<g.startDate)return false;
      if(g.endDate&&dstr>g.endDate)return false;
      return true;
    }
    var rsy=g.startYear||y, rey=g.endYear||2040;
    return rsy<=y&&y<=rey;
  }
  if(scope==="habits"){
    if(!g.startDate&&!g.endDate)return true;
    var dstr2=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    if(g.startDate&&dstr2<g.startDate)return false;
    if(g.endDate&&dstr2>g.endDate)return false;
    return true;
  }
  return false;
}
// 목표의 종료일이 주어진 날짜 이전인지 (이연/만료 판정)
function goalExpiredBefore(g, scope, y, m, d){
  if(!g)return false;
  var key=y*10000+m*100+d;
  if(scope==="weekly"||scope==="monthly"){
    var gy=g.year||y;
    if(gy>y)return false;
    if(gy<y)return true;
    var em=g.endMonth||g.month||1;
    var ed=g.endDay||daysInMonth(gy,em);
    return gy*10000+em*100+ed<key;
  }
  if(scope==="longterm"){
    var ey=g.endYear||g.targetYear||y;
    return ey<y;
  }
  if(scope==="readingGoals"){
    if(g.type==="specific"&&g.endDate){
      var dstr=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      return g.endDate<dstr;
    }
    var ey2=g.endYear||2040;
    return ey2<y;
  }
  return false;
}

function restoreData(){
  const input=document.createElement("input");
  input.type="file";input.accept=".json";
  input.onchange=function(e){
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){
      try{
        const raw=JSON.parse(ev.target.result);
        // 포맷 감지: (A) 백업 포맷 {data:{"YYYY":...},books,goals} (B) 단일 연도 {entries:...}
        var isBackup=raw&&raw.data&&typeof raw.data==='object'&&Object.keys(raw.data).length>0;
        var isSingleYear=raw&&raw.entries&&typeof raw.entries==='object';
        if(!isBackup&&!isSingleYear){alert("올바른 복원 파일이 아닙니다.\n\n지원 포맷:\n• 백업 파일: {data:{...}, books, goals}\n• 단일 연도: {entries:{...}}");return}
        // (B) 단일 연도 파일 → 연도를 물어봄 (기본값 = 현재 state.year)
        if(!isBackup&&isSingleYear){
          var inputYear=prompt("어느 연도의 데이터입니까?\n(파일에 entries만 있어 연도를 자동 감지할 수 없습니다)",String(state.year));
          if(!inputYear)return;
          var y=parseInt(inputYear,10);
          if(!y||y<2019||y>2040){alert("유효한 연도가 아닙니다.");return}
          var slotCount=0;
          Object.values(raw.entries||{}).forEach(function(d){Object.keys(d).forEach(function(s){if(s!=='_diary')slotCount++;});});
          var dateCount=Object.keys(raw.entries||{}).length;
          if(!confirm(y+"년 시간 데이터 복원:\n• "+dateCount+"개 날짜, "+slotCount+"개 슬롯\n\n"+y+"년의 기존 데이터를 덮어씁니다. 계속할까요?"))return;
          localStorage.setItem("timesheet-data-"+y,JSON.stringify(raw));
          // 현재 state 갱신
          if(y===state.year){
            state.data=load();
            // 큐에 즉시 enqueue → 클라우드에 푸시 → 다른 기기에서 union merge로 받음
            if(CLOUD_URL)enqueueWrite('time',y,function(){return state.data;});
          }
          state.showMenu=false;render();
          alert("복원 완료! "+y+"년 시간 데이터가 localStorage에 저장되었습니다."+(CLOUD_URL?"\n클라우드에도 자동 푸시됩니다.":""));
          return;
        }
        // (A) 표준 백업 포맷
        const backup=raw;
        const years=Object.keys(backup.data);
        const msg="백업 파일 정보:\n• 내보낸 날짜: "+(backup.exportDate?backup.exportDate.slice(0,10):"알 수 없음")+"\n• 포함된 연도: "+years.join(", ")+"년\n\n기존 데이터를 덮어씁니다. 복원하시겠습니까?";
        if(!confirm(msg))return;
        years.forEach(y=>{
          localStorage.setItem("timesheet-data-"+y,JSON.stringify(backup.data[y]));
        });
        if(backup.books){
          Object.keys(backup.books).forEach(y=>{
            localStorage.setItem("books-data-"+y,JSON.stringify(backup.books[y]));
          });
        }
        if(backup.goals){
          Object.keys(backup.goals).forEach(y=>{
            localStorage.setItem("goals-data-"+y,JSON.stringify(backup.goals[y]));
          });
        }
        // 주간리뷰 복원
        if(backup.weeklyReviews){
          Object.values(backup.weeklyReviews).forEach(function(yObj){
            Object.keys(yObj).forEach(function(k){
              localStorage.setItem(k,JSON.stringify(yObj[k]));
            });
          });
        }
        // 주간계획 복원
        if(backup.weeklyPlans){
          Object.values(backup.weeklyPlans).forEach(function(yObj){
            Object.keys(yObj).forEach(function(k){
              localStorage.setItem(k,JSON.stringify(yObj[k]));
            });
          });
        }
        // reviews (새 통합 백업 포맷 — Code.gs v5)
        if(backup.reviews){
          Object.values(backup.reviews).forEach(function(yObj){
            Object.keys(yObj).forEach(function(k){
              if(k==='_lastEdited')return;
              localStorage.setItem(k,JSON.stringify(yObj[k]));
            });
          });
        }
        state.data=load();
        state.bookData=loadBooks();
        state.goalData=loadGoals();
        // 클라우드에도 자동 푸시 (복원된 연도 전부)
        if(CLOUD_URL){
          years.forEach(function(y){
            var yearData=backup.data[y];
            enqueueWrite('time',y,function(){return yearData;});
            if(backup.books&&backup.books[y]){var bd=backup.books[y];enqueueWrite('books',y,function(){return bd;});}
            if(backup.goals&&backup.goals[y]){var gd=backup.goals[y];enqueueWrite('goals',y,function(){return gd;});}
          });
        }
        state.showMenu=false;render();
        alert("복원 완료! "+years.length+"개 연도 데이터가 복원되었습니다."+(CLOUD_URL?"\n클라우드에도 자동 푸시됩니다.":""));
      }catch(err){console.error('restoreData:',err);alert("파일을 읽을 수 없습니다. 올바른 백업 파일인지 확인해주세요.\n\n"+err.message)}
    };
    reader.readAsText(file);
  };
  input.click();
}

function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="string")el.setAttribute("style",v);
    else if(k.startsWith("on")){if(typeof v==="function")el.addEventListener(k.slice(2).toLowerCase(),v);}
    else if(k==="className")el.className=v;
    else if(k==="innerHTML")el.innerHTML=v;
    else if(v===false||v==null)return; // boolean false/null 속성은 건너뛰기 (disabled 등 정상 동작)
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{
    if(c==null)return;
    if(typeof c==="string"||typeof c==="number")el.appendChild(document.createTextNode(c));
    else if(c instanceof Node)el.appendChild(c);
  });
  return el;
}

    renderEdit();
  });

  renderRead();
  sheet.appendChild(body);
  ov.addEventListener("click",function(e){if(e.target===ov){if(isEditMode)render(true);ov.remove()}});
  ov.appendChild(sheet);
  document.body.appendChild(ov);

  });
}

let dailyMonthChartInst=null;
function renderDailyMonthChart(){
  if(typeof Chart==='undefined')return;
  try{
    if(dailyMonthChartInst){dailyMonthChartInst.destroy();dailyMonthChartInst=null}
    const cv=document.getElementById("dailyMonthChart");
    if(!cv)return;
    const maxD=daysInMonth(state.year,state.month);
    const labels=[];
    const groupData={};
    GROUPS.forEach(g=>{groupData[g]=[]});
    for(let d=1;d<=maxD;d++){
      labels.push(String(d));
      const k=state.month+"-"+d;
      const ds=state.data.entries[k]||{};
      const dayCats={};CATEGORIES.forEach(c=>{dayCats[c.code]=0});
      Object.entries(ds).forEach(([sk,s])=>{if(sk!=="_diary"&&s.actual)dayCats[s.actual]=(dayCats[s.actual]||0)+0.5});
      GROUPS.forEach(g=>{
        const gh=groupCats(g).reduce((s,c)=>s+(dayCats[c.code]||0),0);
        groupData[g].push(gh);
      });
    }
    dailyMonthChartInst=new Chart(cv,{
      type:"bar",
      data:{
        labels,
        datasets:GROUPS.map(g=>({
          label:g,
          data:groupData[g],
          backgroundColor:GC[g],
          borderWidth:0,
          borderRadius:1,
          stack:"dream"
        }))
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{labels:{color:"#94a3b8",font:{size:11,family:"'JetBrains Mono',monospace"},boxWidth:12,padding:8}},
          tooltip:{
            backgroundColor:"#1e293b",titleColor:"#e2e8f0",bodyColor:"#cbd5e1",borderColor:"#334155",borderWidth:1,
            callbacks:{
              title:function(ctx){return state.month+"월 "+ctx[0].label+"일"},
              label:function(ctx){return ctx.dataset.label+": "+ctx.parsed.y+"h"},
              footer:function(ctx){
                let t=0;ctx.forEach(c=>{t+=c.parsed.y});
                return "합계: "+t+"h";
              }
            }
          }
        },
        scales:{
          x:{stacked:true,ticks:{color:"#64748b",font:{size:9}},grid:{display:false}},
          y:{stacked:true,beginAtZero:true,ticks:{color:"#64748b",font:{size:10},callback:v=>v+"h"},grid:{color:"#1e293b"}}
        }
      }
    });
  }catch(e){console.log('Daily month chart skipped:',e)}
}
