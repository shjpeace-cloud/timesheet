  // ─ 주간 실적 (그 달의 모든 주 + 이번달/지난달/연평균 표) ─
  (function(){
    const baseY=monDate.getFullYear();
    const baseM=monDate.getMonth()+1;
    const mondays=[];
    const dim=daysInMonth(baseY,baseM);
    for(var d=1;d<=dim;d++){
      const dt=new Date(baseY,baseM-1,d);
      if(dt.getDay()===1)mondays.push(dt);
    }
    if(mondays.length===0)return;

    const weekData=mondays.map(function(monD){
      const dayHrs={};GROUPS.forEach(function(g){dayHrs[g]=0;});
      var weekTot=0,recDays=0;
      for(var di=0;di<7;di++){
        const dd=new Date(monD);dd.setDate(monD.getDate()+di);
        const dy=dd.getFullYear(),dm=dd.getMonth()+1,dd2=dd.getDate();
        const ent=getEntriesForYear(dy);
        const slots=ent[dm+"-"+dd2]||{};
        var hasA=false;
        Object.keys(slots).forEach(function(t){
          if(t==="_diary")return;
          const s=slots[t];
          if(s.actual){const cat=catByCode(s.actual);if(cat){dayHrs[cat.group]+=0.5;weekTot+=0.5;hasA=true;}}
        });
        if(hasA)recDays++;
      }
      return{dayHrs:dayHrs,total:weekTot,recDays:recDays,monD:monD,wIdx:weekIdxByMonday(monD)};
    });

    const cmEnt=getEntriesForYear(baseY);
    const cmCats=getCatHoursByMonth(cmEnt,baseM);
    const cmRD=countRecordedDaysInMonth(cmEnt,baseM);
    const cmG={};GROUPS.forEach(function(g){cmG[g]=0;});
    CATEGORIES.forEach(function(c){cmG[c.group]+=(cmCats[c.code]||0);});

    const lmDt=new Date(baseY,baseM-2,1);
    const lmY=lmDt.getFullYear(),lmM=lmDt.getMonth()+1;
    const lmEnt=getEntriesForYear(lmY);
    const lmCats=getCatHoursByMonth(lmEnt,lmM);
    const lmRD=countRecordedDaysInMonth(lmEnt,lmM);
    const lmG={};GROUPS.forEach(function(g){lmG[g]=0;});
    CATEGORIES.forEach(function(c){lmG[c.group]+=(lmCats[c.code]||0);});

    const cyG={};GROUPS.forEach(function(g){cyG[g]=0;});
    for(var _mi=1;_mi<=12;_mi++){
      const _mc=getCatHoursByMonth(state.data.entries,_mi);
      CATEGORIES.forEach(function(c){cyG[c.group]+=(_mc[c.code]||0);});
    }
    const cyRD=countRecordedDaysInYear(state.year);

    const summaryBox=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:12px;margin-bottom:14px;border:1px solid #1e293b"});
    summaryBox.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:10px;letter-spacing:.5px"},"📊 주간 실적 ("+baseM+"월)"));

    function fmtAvg(v){return v>=0.05?v.toFixed(1):"–";}
    const nW=weekData.length;
    const tblWrap=h("div",{});
    const tbl=h("div",{style:"display:grid;grid-template-columns:24px repeat("+nW+",1fr) 36px 36px 36px;gap:2px;font-size:9px;font-family:'JetBrains Mono',monospace"});
    tbl.appendChild(h("span",{style:"text-align:center"},""));
    weekData.forEach(function(wk){
      const isCur=wk.monD.getTime()===monDate.getTime();
      tbl.appendChild(h("span",{style:"text-align:center;color:"+(isCur?"#3b82f6":"#64748b")+";font-weight:700;background:"+(isCur?"#1e3a5f":"transparent")+";border-radius:4px;padding:2px 0"},wk.wIdx+"주"));
    });
    tbl.appendChild(h("span",{style:"text-align:center;color:#0d9488;font-weight:700"},"이번달"));
    tbl.appendChild(h("span",{style:"text-align:center;color:#94a3b8;font-weight:700"},"지난달"));
    tbl.appendChild(h("span",{style:"text-align:center;color:#a855f7;font-weight:700"},"연평균"));

    GROUPS.forEach(function(g){
      tbl.appendChild(h("span",{style:"text-align:center;color:"+GC[g]+";font-weight:700"},g));
      weekData.forEach(function(wk){
        const isCur=wk.monD.getTime()===monDate.getTime();
        const v=wk.recDays>0?wk.dayHrs[g]/wk.recDays:0;
        tbl.appendChild(h("span",{style:"text-align:center;color:"+(v>=0.05?(isCur?"#e2e8f0":"#cbd5e1"):"#334155")+";background:"+(v>=0.05?(isCur?GC[g]+"40":GC[g]+"20"):"transparent")+";border-radius:2px;padding:2px 0"},fmtAvg(v)));
      });
      const cmAvg=cmRD>0?cmG[g]/cmRD:0;
      const lmAvg=lmRD>0?lmG[g]/lmRD:0;
      const cyAvgG=cyRD>0?cyG[g]/cyRD:0;
      tbl.appendChild(h("span",{style:"text-align:center;color:#0d9488;font-weight:700"},fmtAvg(cmAvg)));
      tbl.appendChild(h("span",{style:"text-align:center;color:#94a3b8;font-weight:700"},fmtAvg(lmAvg)));
      tbl.appendChild(h("span",{style:"text-align:center;color:#a855f7;font-weight:700"},fmtAvg(cyAvgG)));
    });

    tbl.appendChild(h("span",{style:"text-align:center;color:#64748b;font-weight:700;border-top:1px solid #334155;padding-top:3px;margin-top:1px"},"합"));
    weekData.forEach(function(wk){
      const isCur=wk.monD.getTime()===monDate.getTime();
      const totAvg=wk.recDays>0?wk.total/wk.recDays:0;
      tbl.appendChild(h("span",{style:"text-align:center;color:"+(totAvg>=0.05?(isCur?"#3b82f6":"#94a3b8"):"#334155")+";font-weight:700;border-top:1px solid #334155;padding-top:3px;margin-top:1px"},fmtAvg(totAvg)));
    });
    const cmTot=GROUPS.reduce(function(s,g){return s+cmG[g];},0);
    const lmTot=GROUPS.reduce(function(s,g){return s+lmG[g];},0);
    const cyTot=GROUPS.reduce(function(s,g){return s+cyG[g];},0);
    const cmAvgT=cmRD>0?cmTot/cmRD:0;
    const lmAvgT=lmRD>0?lmTot/lmRD:0;
    const cyAvgT=cyRD>0?cyTot/cyRD:0;
    tbl.appendChild(h("span",{style:"text-align:center;color:#0d9488;font-weight:900;border-top:1px solid #334155;padding-top:3px;margin-top:1px"},fmtAvg(cmAvgT)));
    tbl.appendChild(h("span",{style:"text-align:center;color:#94a3b8;font-weight:900;border-top:1px solid #334155;padding-top:3px;margin-top:1px"},fmtAvg(lmAvgT)));
    tbl.appendChild(h("span",{style:"text-align:center;color:#a855f7;font-weight:900;border-top:1px solid #334155;padding-top:3px;margin-top:1px"},fmtAvg(cyAvgT)));
    tblWrap.appendChild(tbl);
    summaryBox.appendChild(tblWrap);
    summaryBox.appendChild(h("div",{style:"font-size:8px;color:#475569;margin-top:10px;text-align:right"},"일평균 (h/일) · 분모=기록일수 · 이번달/지난달/연="+cmRD+"/"+lmRD+"/"+cyRD+"일"));
    wrap.appendChild(summaryBox);
  })();

  // ── 주간 습관 달성률 (그 달의 모든 주 + 이번달/지난달/연평균) ──
  (function(){
    const habits=state.goalData.habits||[];
    if(habits.length===0)return;
    const baseY=monDate.getFullYear();
    const baseM=monDate.getMonth()+1;
    const mondays=[];
    const dim=daysInMonth(baseY,baseM);
    for(var d=1;d<=dim;d++){
      const dt=new Date(baseY,baseM-1,d);
      if(dt.getDay()===1)mondays.push(dt);
    }
    if(mondays.length===0)return;

    const lmDt=new Date(baseY,baseM-2,1);
    const lmY=lmDt.getFullYear(),lmM=lmDt.getMonth()+1;

    function calcYrPct(hb){var done=0,wd=0;for(var m=1;m<=12;m++){var days=daysInMonth(state.year,m);for(var d=1;d<=days;d++){if(isWeekday(state.year,m,d)){wd++;if(isHabitDone(hb,state.year,m,d))done++;}}}return wd>0?Math.round(done/wd*100):0;}

    const habBox=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:12px;margin-bottom:14px;border:1px solid #1e293b"});
    habBox.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:8px;letter-spacing:.5px"},"🔁 주간 습관 달성률 ("+baseM+"월)"));

    const nW=mondays.length;
    const tplCols="1fr repeat("+nW+",42px) 36px 36px 36px";

    const hdrRow=h("div",{style:"display:grid;grid-template-columns:"+tplCols+";gap:4px;align-items:center;margin-bottom:4px"});
    hdrRow.appendChild(h("div",{},""));
    mondays.forEach(function(monD){
      const isCur=monD.getTime()===monDate.getTime();
      const wIdx=weekIdxByMonday(monD);
      hdrRow.appendChild(h("div",{style:"text-align:center;font-size:9px;color:"+(isCur?"#3b82f6":"#94a3b8")+";font-weight:"+(isCur?"700":"400")+";background:"+(isCur?"#1e3a5f":"transparent")+";border-radius:4px;padding:2px 0"},wIdx+"주"));
    });
    hdrRow.appendChild(h("div",{style:"text-align:center;font-size:9px;color:#0d9488;font-weight:700"},"이번달"));
    hdrRow.appendChild(h("div",{style:"text-align:center;font-size:9px;color:#94a3b8;font-weight:700"},"지난달"));
    hdrRow.appendChild(h("div",{style:"text-align:center;font-size:9px;color:#a855f7;font-weight:700"},"연평균"));
    habBox.appendChild(hdrRow);

    habits.forEach(function(hb){
      const cat=catByCode(hb.cat);
      const hrow=h("div",{style:"display:grid;grid-template-columns:"+tplCols+";gap:4px;align-items:center;padding:5px 0;border-top:1px solid #1e293b"});
      const nameCell=h("div",{style:"display:flex;align-items:center;gap:4px;overflow:hidden;min-width:0;cursor:pointer",
        onClick:function(){navigateToGoal("habits",hb);}
      });
      nameCell.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:"+(cat?cat.color:"#94a3b8")+";font-family:monospace;flex-shrink:0;background:"+(cat?cat.color+"22":"#1e293b")+";border-radius:3px;padding:1px 4px"},hb.cat));
      nameCell.appendChild(h("span",{style:"font-size:11px;color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},hb.name));
      hrow.appendChild(nameCell);

      mondays.forEach(function(monD){
        const isCur=monD.getTime()===monDate.getTime();
        const pct=calcHabitWeeklyPct(hb,monD);
        const color=pct===100?"#0d9488":pct>=60?"#f59e0b":pct>0?"#94a3b8":"#334155";
        hrow.appendChild(h("div",{style:"text-align:center;font-size:10px;color:"+color+";font-weight:"+(isCur?"900":"700")+";font-family:monospace;background:"+(isCur?"#1e3a5f":"transparent")+";border-radius:4px;padding:3px 0"},pct+"%"));
      });
      const cmPct=getHabitMonthPct(hb,baseY,baseM);
      const lmPct=getHabitMonthPct(hb,lmY,lmM);
      const cyPct=calcYrPct(hb);
      hrow.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#0d9488;font-weight:700;font-family:monospace"},cmPct+"%"));
      hrow.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#94a3b8;font-weight:700;font-family:monospace"},lmPct+"%"));
      hrow.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#a855f7;font-weight:700;font-family:monospace"},cyPct+"%"));
      habBox.appendChild(hrow);
    });

    const sumRow=h("div",{style:"display:grid;grid-template-columns:"+tplCols+";gap:4px;align-items:center;padding:4px 0;border-top:1px solid #334155;margin-top:2px"});
    sumRow.appendChild(h("span",{style:"font-size:9px;color:#475569;font-weight:700"},"평균"));
    mondays.forEach(function(monD){
      const isCur=monD.getTime()===monDate.getTime();
      var sum=0;
      habits.forEach(function(hb){sum+=calcHabitWeeklyPct(hb,monD);});
      const wkAvg=Math.round(sum/habits.length);
      const color=wkAvg===100?"#0d9488":wkAvg>=60?"#f59e0b":wkAvg>0?"#94a3b8":"#334155";
      sumRow.appendChild(h("div",{style:"text-align:center;font-size:10px;color:"+color+";font-weight:"+(isCur?"900":"700")+";font-family:monospace"},wkAvg+"%"));
    });
    var cmSumA=0,lmSumA=0,cySumA=0;
    habits.forEach(function(hb){
      cmSumA+=getHabitMonthPct(hb,baseY,baseM);
      lmSumA+=getHabitMonthPct(hb,lmY,lmM);
      cySumA+=calcYrPct(hb);
    });
    const cmAvgH=Math.round(cmSumA/habits.length);
    const lmAvgH=Math.round(lmSumA/habits.length);
    const cyAvgH=Math.round(cySumA/habits.length);
    sumRow.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#0d9488;font-weight:900;font-family:monospace"},cmAvgH+"%"));
    sumRow.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#94a3b8;font-weight:900;font-family:monospace"},lmAvgH+"%"));
    sumRow.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#a855f7;font-weight:900;font-family:monospace"},cyAvgH+"%"));
    habBox.appendChild(sumRow);

    wrap.appendChild(habBox);
  })();

  const wkGoalsBox=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:12px;margin-bottom:14px;border:1px solid #1e293b"});
  wkGoalsBox.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:10px;letter-spacing:.5px"},"📋 금주 목표"));
  // 금주 목표: 월요일~일요일 범위에 걸치는 주간 목표 (다주 주간 목표도 포함)
  const wkGoalsList=(state.goalData.weekly||[]).filter(function(g){
    for(var di=0;di<7;di++){
      var dd=new Date(monDate);dd.setDate(monDate.getDate()+di);
      if(goalIncludesDate(g,"weekly",dd.getFullYear(),dd.getMonth()+1,dd.getDate()))return true;
    }
    return false;
  });
  if(wkGoalsList.length===0){
    wkGoalsBox.appendChild(h("div",{style:"text-align:center;padding:10px 0;color:#334155;font-size:12px"},"이번 주 목표가 없습니다"));
  }else{
    var activeWk=wkGoalsList.filter(g=>!g.done);
    var doneWk=wkGoalsList.filter(g=>!!g.done);
    function renderWkGoalRow(g,isDone){
      const cat=catByCode(g.cat);
      const row=h("div",{style:"display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #0f172a"});

      const chk=h("input",{type:"checkbox",style:"width:15px;height:15px;accent-color:#3b82f6;cursor:pointer;flex-shrink:0"});
      chk.checked=isDone;
      chk.addEventListener("change",function(e){
        e.stopPropagation();
        markGoalDone(g,chk.checked);
        g.progress=chk.checked?100:0;
        saveGoalData();cloudSaveGoals();_isAutoRender=true;render();
      });
      row.appendChild(chk);
      row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:"+(cat?cat.color:"#94a3b8")+";font-family:monospace;flex-shrink:0;background:"+(cat?cat.color+"22":"#1e293b")+";border-radius:3px;padding:1px 5px"},g.cat));
      const nameSpan=h("span",{style:"flex:1;font-size:12px;color:"+(isDone?"#475569":"#cbd5e1")+(isDone?";text-decoration:line-through":"")+";overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer"},g.name);
      nameSpan.addEventListener("click",function(){navigateToGoal("weekly",g);});
      row.appendChild(nameSpan);
      row.appendChild(h("span",{style:"font-size:9px;color:#3b82f6;flex-shrink:0;cursor:pointer",onClick:function(){navigateToGoal("weekly",g);}},"↗"));
      return row;
    }
    activeWk.forEach(g=>wkGoalsBox.appendChild(renderWkGoalRow(g,false)));
    if(doneWk.length>0){
      wkGoalsBox.appendChild(h("div",{style:"font-size:9px;color:#064e3b;margin:8px 0 4px;font-weight:700"},"✅ 완료 ("+doneWk.length+")"));
      doneWk.forEach(g=>wkGoalsBox.appendChild(renderWkGoalRow(g,true)));
    }
  }
  wrap.appendChild(wkGoalsBox);

  // ── 다음주 목표 (주간 + 월간 미리보기) ──
  (function(){
    const nextMon=new Date(monDate);nextMon.setDate(monDate.getDate()+7);
    const nextWeekDays=[];
    for(var di=0;di<7;di++){
      const dd=new Date(nextMon);dd.setDate(nextMon.getDate()+di);
      nextWeekDays.push(dd);
    }
    const nextWk=(state.goalData.weekly||[]).filter(function(g){
      return nextWeekDays.some(function(dd){return goalIncludesDate(g,"weekly",dd.getFullYear(),dd.getMonth()+1,dd.getDate());});
    });
    const nextMth=(state.goalData.monthly||[]).filter(function(g){
      return nextWeekDays.some(function(dd){return goalIncludesDate(g,"monthly",dd.getFullYear(),dd.getMonth()+1,dd.getDate());});
    });
    if(nextWk.length===0&&nextMth.length===0)return;

    const nxBox=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:12px;margin-bottom:14px;border:1px solid #1e293b"});
    const fmtNx=function(d){return(d.getMonth()+1)+"/"+d.getDate();};
    nxBox.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:8px;letter-spacing:.5px"},"📅 다음주 목표 ("+fmtNx(nextMon)+"~"+fmtNx(nextWeekDays[6])+")"));

    function renderPreviewRow(g,scope){
      const cat=catByCode(g.cat);
      const isDone=scope==="weekly"?!!g.done:(g.progress||0)>=100;
      const row=h("div",{style:"display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #0f172a;cursor:pointer",onClick:function(){navigateToGoal(scope,g);}});
      row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:"+(cat?cat.color:"#94a3b8")+";font-family:monospace;flex-shrink:0;background:"+(cat?cat.color+"22":"#1e293b")+";border-radius:3px;padding:1px 5px"},g.cat));
      const scopeLbl=scope==="weekly"?"주":"월";
      const scopeColor=scope==="weekly"?"#3b82f6":"#a855f7";
      row.appendChild(h("span",{style:"font-size:8px;font-weight:700;color:#fff;background:"+scopeColor+";border-radius:3px;padding:1px 5px;flex-shrink:0"},scopeLbl));
      row.appendChild(h("span",{style:"flex:1;font-size:12px;color:"+(isDone?"#475569":"#cbd5e1")+(isDone?";text-decoration:line-through":"")+";overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},g.name));
      if(scope==="monthly")row.appendChild(h("span",{style:"font-size:9px;color:#a855f7;font-family:monospace;font-weight:700;flex-shrink:0"},(g.progress||0)+"%"));
      row.appendChild(h("span",{style:"font-size:9px;color:"+scopeColor+";flex-shrink:0"},"↗"));
      return row;
    }
    if(nextWk.length>0){
      nxBox.appendChild(h("div",{style:"font-size:9px;color:#3b82f6;font-weight:700;margin:4px 0 2px;letter-spacing:.5px"},"주간"));
      nextWk.forEach(function(g){nxBox.appendChild(renderPreviewRow(g,"weekly"));});
    }
    if(nextMth.length>0){
      nxBox.appendChild(h("div",{style:"font-size:9px;color:#a855f7;font-weight:700;margin:6px 0 2px;letter-spacing:.5px"},"월간"));
      nextMth.forEach(function(g){nxBox.appendChild(renderPreviewRow(g,"monthly"));});
    }
    wrap.appendChild(nxBox);
  })();

  // ── 성찰 (감사→잘한것→놓친것→다음주→메모 통합) ──
  wrap.appendChild(renderReflectionBox(
    "weekly-review-"+y+"-"+m+"-"+wIdx,
    {title:"✍️ 주간 성찰",next:"🎯 다음 주 한 가지",nextPh:"다음 주에 반드시 할 것은?"}
  ));
  return wrap;
}

function buildGoalSearchResults(q){
  const sec=h("div",{className:"goal-section"});
  sec.appendChild(h("h3",{className:"goal-section-title"},"🔍 검색 결과"));
  const SCOPE_META=[
    {sc:"longterm",icon:"🎯",label:"장기"},
    {sc:"monthly",icon:"🗓",label:"월간"},
    {sc:"weekly",icon:"📆",label:"주간"},
    {sc:"daily",icon:"📌",label:"일간"},
    {sc:"habits",icon:"🔁",label:"습관"},
    {sc:"readingGoals",icon:"📚",label:"독서목표"},
  ];
  let totalFound=0;
  SCOPE_META.forEach(function(sm){
    let list=[];
    if(sm.sc==="daily"){
      Object.entries(state.goalData.daily||{}).forEach(function([dk,arr]){
        (arr||[]).forEach(function(g){if(g.name&&g.name.toLowerCase().indexOf(q)>=0)list.push({g:g,extra:dk});});
      });
    }else if(sm.sc==="habits"){
      list=(state.goalData.habits||[]).filter(function(g){return g.name&&g.name.toLowerCase().indexOf(q)>=0;}).map(function(g){return{g:g};});
    }else if(sm.sc==="readingGoals"){
      list=(state.goalData.readingGoals||[]).filter(function(g){return g.name&&g.name.toLowerCase().indexOf(q)>=0;}).map(function(g){return{g:g};});
    }else{
      list=(state.goalData[sm.sc]||[]).filter(function(g){return g.name&&g.name.toLowerCase().indexOf(q)>=0;}).map(function(g){return{g:g};});
    }
    if(list.length===0)return;
    totalFound+=list.length;
    sec.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;letter-spacing:.5px;padding:8px 4px 4px"},sm.icon+" "+sm.label));
    list.forEach(function(item){
      const g=item.g;
      const catObj=catByCode(g.cat);
      const hrs=calcGoalTotalHours(g.id);
      const row=h("div",{style:"display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;margin-bottom:3px;background:#111827;border:1px solid #1e293b;cursor:pointer",
        onClick:function(){navigateToGoal(sm.sc,g);}
      });
      row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:"+(catObj?catObj.color:"#94a3b8")+";font-family:monospace;flex-shrink:0;min-width:28px"},g.cat||""));
      const nameParts=g.name.split(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"));
      const nameSpan=h("span",{style:"flex:1;font-size:12px;color:#e2e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"});
      nameParts.forEach(function(part){
        if(part.toLowerCase()===q){
          nameSpan.appendChild(h("mark",{style:"background:#f59e0b40;color:#fcd34d;border-radius:2px;padding:0 1px"},part));
        }else{
          nameSpan.appendChild(document.createTextNode(part));
        }
      });
      row.appendChild(nameSpan);
      if(typeof g.progress==="number"){
        const pct=g.progress||0;
        const pColor=pct>=100?"#10b981":pct>=50?"#f59e0b":"#64748b";
        row.appendChild(h("span",{style:"font-size:10px;color:"+pColor+";font-family:monospace;flex-shrink:0"},pct+"%"));
      }
      if(hrs>0)row.appendChild(h("span",{style:"font-size:10px;color:#f59e0b;font-family:monospace;flex-shrink:0"},fmtHours(hrs)));
      if(item.extra)row.appendChild(h("span",{style:"font-size:9px;color:#475569;flex-shrink:0"},item.extra));
      sec.appendChild(row);
    });
  });
  if(totalFound===0){
    sec.appendChild(h("div",{style:"text-align:center;padding:30px;color:#475569;font-size:12px"},'"'+q+'" 검색 결과가 없습니다'));
  }
  return sec;
}


function _refreshGlobalSearch(){
  const ct=document.getElementById("__globalSearchContent");
  if(!ct){render();return;}
  const q=(state.goalSearch||"").trim().toLowerCase();
  const clrBtn=document.getElementById("__gsClr");
  if(clrBtn)clrBtn.style.display=state.goalSearch?"":"none";
  // 검색어 있으면 결과 영역만 교체(포커스 유지), 비면 전체 재렌더로 원복
  if(q){
    ct.innerHTML="";
    ct.appendChild(buildGoalSearchResults(q));
  }else{
    render();
  }
}

// ── 목표 상세 패널 (클릭 시 확장) ────────────────────────────
function renderGoalDetailPanel(g,scope,catDef,dk){
  const panel=h("div",{style:"background:#0a0f1a;border-radius:0 0 10px 10px;padding:10px 12px 12px;border:1px solid "+catDef.color+"40;border-top:none;margin-bottom:4px"});

  // ── 카테고리 + 이름 + 삭제 ──
  const editRow=h("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:8px"});
  editRow.appendChild(renderEditableCat(g.cat,function(newCat){
    if(scope==="daily"&&dk)updateDailyGoalField(dk,g.id,"cat",newCat);
    else updatePeriodGoalField(scope,g.id,"cat",newCat);
    saveGoalData();render(true);
  }));
  const nameInp=h("input",{style:"flex:1;padding:6px 10px;border-radius:7px;border:1px solid #334155;background:#111827;color:#e2e8f0;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none",value:g.name||""});
  nameInp.addEventListener("focus",function(){nameInp.style.borderColor=catDef.color;_isEditing=true;});
  nameInp.addEventListener("blur",function(){nameInp.style.borderColor="#334155";_isEditing=false;});
  nameInp.addEventListener("input",function(e){g.name=e.target.value;});
  nameInp.addEventListener("change",function(){saveGoalData();cloudSaveGoals();});
  editRow.appendChild(nameInp);
  editRow.appendChild(h("button",{
    style:"padding:5px 8px;border-radius:6px;border:1px solid #ef444440;background:transparent;color:#ef4444;font-size:11px;cursor:pointer;flex-shrink:0",
    onClick:function(){
      if(!confirm("\""+g.name+"\" 목표를 삭제하시겠습니까?"))return;
      forceDeleteGoalById(g.id);
      state._expandedGoal=null;saveGoalData();cloudSaveGoals();render(true);
    }
  },"🗑"));
  panel.appendChild(editRow);

  // ── 메모 ──
  const memoInp=h("input",{style:"width:100%;padding:5px 10px;border-radius:7px;border:1px solid #1e293b;background:#111827;color:#94a3b8;font-size:11px;font-family:'Noto Sans KR',sans-serif;outline:none;margin-bottom:8px",placeholder:"메모 (선택)",value:g.memo||""});
  memoInp.addEventListener("focus",function(){memoInp.style.borderColor="#334155";_isEditing=true;});
  memoInp.addEventListener("blur",function(){memoInp.style.borderColor="#1e293b";_isEditing=false;});
  memoInp.addEventListener("input",function(e){g.memo=e.target.value;});
  memoInp.addEventListener("change",function(){saveGoalData();});
  panel.appendChild(memoInp);

  // ── Scope 변경 (일간/주간/월간/장기 상호 변환) ──
  if(scope==="daily"||scope==="weekly"||scope==="monthly"||scope==="longterm"){
    const scRow=h("div",{style:"display:flex;gap:4px;align-items:center;margin-bottom:8px;padding:4px 8px;background:#0c0f1a;border-radius:6px;border:1px dashed #33415580"});
    scRow.appendChild(h("span",{style:"font-size:10px;color:#64748b;flex-shrink:0"},"🔄 변경:"));
    [["daily","📌 일간","#6366f1"],["weekly","🗓 주간","#3b82f6"],["monthly","📅 월간","#0d9488"],["longterm","🎯 장기","#f59e0b"]].forEach(function(sv){
      const isCur=sv[0]===scope;
      scRow.appendChild(h("button",{
        style:"padding:3px 7px;border-radius:4px;border:1px solid "+(isCur?sv[2]:"#334155")+";background:"+(isCur?sv[2]+"22":"transparent")+";color:"+(isCur?sv[2]:"#64748b")+";font-size:10px;cursor:"+(isCur?"default":"pointer"),
        disabled:isCur,
        onClick:isCur?null:function(e){
          if(e)e.stopPropagation();
          if(!confirm("\""+g.name+"\" 목표를 "+sv[1]+"(으)로 변경하시겠습니까?"))return;
          const today=new Date();
          const ty=today.getFullYear(),tm=today.getMonth()+1,td=today.getDate();
          // 1) 원본에서 제거
          if(scope==="daily"&&dk){
            state.goalData.daily[dk]=(state.goalData.daily[dk]||[]).filter(x=>x.id!==g.id);
            if(state.goalData.daily[dk].length===0)delete state.goalData.daily[dk];
          }else if(state.goalData[scope]){
            state.goalData[scope]=state.goalData[scope].filter(x=>x.id!==g.id);
          }
          // 2) 대상 scope로 복사 — 메타데이터 최대 보존
          const base={id:g.id,cat:g.cat,name:g.name,memo:g.memo||""};
          if(g.parentIds)base.parentIds=g.parentIds;
          if(g.language)base.language=g.language;
          if(g.completedAt)base.completedAt=g.completedAt;
          if(g.done)base.done=g.done;
          if(g.bookTarget&&sv[0]==="longterm")base.bookTarget=g.bookTarget;
          if(sv[0]==="daily"){
            const nk=tm+"-"+td;
            if(!state.goalData.daily[nk])state.goalData.daily[nk]=[];
            state.goalData.daily[nk].push(base);
            state._expandedGoal={id:g.id,scope:"daily",dk:nk};
          }else if(sv[0]==="weekly"){
            base.progress=g.progress||0;base.subtasks=g.subtasks||[];
            base.year=ty;base.month=tm;
            base.weekIdx=weekIdxOfDay(ty,tm,td);
            base.startDay=td;base.endDay=Math.min(td+6,daysInMonth(ty,tm));
            base.period=ty+"-"+String(tm).padStart(2,"0")+"-W"+base.weekIdx;
            if(!state.goalData.weekly)state.goalData.weekly=[];
            state.goalData.weekly.push(base);
            state._expandedGoal={id:g.id,scope:"weekly",dk:null};
          }else if(sv[0]==="monthly"){
            base.progress=g.progress||0;base.subtasks=g.subtasks||[];
            base.year=ty;base.month=tm;base.startMonth=tm;base.endMonth=tm;
            if(!state.goalData.monthly)state.goalData.monthly=[];
            state.goalData.monthly.push(base);
            state._expandedGoal={id:g.id,scope:"monthly",dk:null};
          }else if(sv[0]==="longterm"){
            base.progress=g.progress||0;base.subtasks=g.subtasks||[];
            base.startYear=g.startYear||ty;base.endYear=g.endYear||(ty+1);
            if(!state.goalData.longterm)state.goalData.longterm=[];
            state.goalData.longterm.push(base);
            state._expandedGoal={id:g.id,scope:"longterm",dk:null};
          }
          saveGoalData();cloudSaveGoals();_isAutoRender=true;render();
        }
      },sv[1]));
    });
    panel.appendChild(scRow);
  }

  // ── 기간 편집 ──
  if(scope==="weekly"){
    const pRow=h("div",{style:"display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap"});
    pRow.appendChild(h("span",{style:"font-size:10px;color:#64748b;flex-shrink:0"},"📆 기간:"));
    const smSelW=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    const sdSelW=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    const emSelW=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    const edSelW=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    for(let m=1;m<=12;m++){const osm=h("option",{value:String(m)},m+"월");if(m===(g.startMonth||g.month||1))osm.selected=true;smSelW.appendChild(osm);const oem=h("option",{value:String(m)},m+"월");if(m===(g.endMonth||g.month||1))oem.selected=true;emSelW.appendChild(oem);}
    function refreshWkSd(){sdSelW.innerHTML="";var maxSd=daysInMonth(state.year,g.startMonth||g.month||1);for(let d=1;d<=maxSd;d++){var o=document.createElement("option");o.value=String(d);o.textContent=d+"일";if(d===(g.startDay||1))o.selected=true;sdSelW.appendChild(o);}}
    function refreshWkEd(){edSelW.innerHTML="";var maxEd=daysInMonth(state.year,g.endMonth||g.month||1);for(let d=1;d<=maxEd;d++){var o=document.createElement("option");o.value=String(d);o.textContent=d+"일";if(d===(g.endDay||maxEd))o.selected=true;edSelW.appendChild(o);}}
    smSelW.addEventListener("change",function(e){g.startMonth=parseInt(e.target.value);g.month=g.startMonth;if((g.endMonth||g.startMonth)<g.startMonth)g.endMonth=g.startMonth;var maxSd=daysInMonth(state.year,g.startMonth);if(g.startDay&&g.startDay>maxSd)g.startDay=maxSd;g.weekIdx=weekIdxOfDay(state.year,g.startMonth,g.startDay||1);refreshWkSd();refreshWkEd();saveGoalData();});
    emSelW.addEventListener("change",function(e){g.endMonth=parseInt(e.target.value);if((g.startMonth||g.endMonth)>g.endMonth){g.startMonth=g.endMonth;g.month=g.startMonth;}var maxEd=daysInMonth(state.year,g.endMonth);if(g.endDay&&g.endDay>maxEd)g.endDay=maxEd;refreshWkEd();refreshWkSd();saveGoalData();});
    sdSelW.addEventListener("change",function(e){g.startDay=parseInt(e.target.value);g.weekIdx=weekIdxOfDay(state.year,g.startMonth||g.month||1,g.startDay);if((g.startMonth||g.month)===(g.endMonth||g.month)&&(g.endDay||1)<g.startDay){g.endDay=g.startDay;refreshWkEd();}saveGoalData();});
    edSelW.addEventListener("change",function(e){g.endDay=parseInt(e.target.value);if((g.startMonth||g.month)===(g.endMonth||g.month)&&(g.startDay||1)>g.endDay){g.startDay=g.endDay;refreshWkSd();}saveGoalData();});
    refreshWkSd();refreshWkEd();
    pRow.appendChild(smSelW);pRow.appendChild(sdSelW);pRow.appendChild(h("span",{style:"font-size:10px;color:#475569;flex-shrink:0"},"~"));pRow.appendChild(emSelW);pRow.appendChild(edSelW);
    panel.appendChild(pRow);
  }else if(scope==="monthly"){
    const pRow=h("div",{style:"display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap"});
    pRow.appendChild(h("span",{style:"font-size:10px;color:#64748b;flex-shrink:0"},"🗓 기간:"));
    const smSel=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    const sdSelM=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    const emSel=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    const edSelM=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    for(let m=1;m<=12;m++){const os=h("option",{value:String(m)},m+"월");if(m===(g.startMonth||g.month||1))os.selected=true;smSel.appendChild(os);const oe=h("option",{value:String(m)},m+"월");if(m===(g.endMonth||g.month||1))oe.selected=true;emSel.appendChild(oe);}
    function refreshMSd(){sdSelM.innerHTML="";var maxSd=daysInMonth(state.year,g.startMonth||g.month||1);for(let d=1;d<=maxSd;d++){var o=document.createElement("option");o.value=String(d);o.textContent=d+"일";if(d===(g.startDay||1))o.selected=true;sdSelM.appendChild(o);}}
    function refreshMEd(){edSelM.innerHTML="";var maxEd=daysInMonth(state.year,g.endMonth||g.month||1);for(let d=1;d<=maxEd;d++){var o=document.createElement("option");o.value=String(d);o.textContent=d+"일";if(d===(g.endDay||maxEd))o.selected=true;edSelM.appendChild(o);}}
    smSel.addEventListener("change",function(e){g.startMonth=parseInt(e.target.value);g.month=g.startMonth;if((g.endMonth||1)<g.startMonth)g.endMonth=g.startMonth;var maxSd=daysInMonth(state.year,g.startMonth);if(g.startDay&&g.startDay>maxSd)g.startDay=maxSd;refreshMSd();refreshMEd();saveGoalData();});
    emSel.addEventListener("change",function(e){g.endMonth=parseInt(e.target.value);if((g.startMonth||1)>g.endMonth)g.startMonth=g.endMonth;g.endDay=daysInMonth(state.year,g.endMonth);refreshMEd();refreshMSd();saveGoalData();});
    sdSelM.addEventListener("change",function(e){g.startDay=parseInt(e.target.value);if((g.startMonth||g.month)===(g.endMonth||g.month)&&(g.endDay||1)<g.startDay){g.endDay=g.startDay;refreshMEd();}saveGoalData();});
    edSelM.addEventListener("change",function(e){g.endDay=parseInt(e.target.value);if((g.startMonth||g.month)===(g.endMonth||g.month)&&(g.startDay||1)>g.endDay){g.startDay=g.endDay;refreshMSd();}saveGoalData();});
    refreshMSd();refreshMEd();
    pRow.appendChild(smSel);pRow.appendChild(sdSelM);pRow.appendChild(h("span",{style:"font-size:10px;color:#475569;flex-shrink:0"},"~"));pRow.appendChild(emSel);pRow.appendChild(edSelM);
    panel.appendChild(pRow);
  }else if(scope==="longterm"){
    const pRow=h("div",{style:"display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap"});
    pRow.appendChild(h("span",{style:"font-size:10px;color:#64748b;flex-shrink:0"},"🎯 기간:"));
    const sySel=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    const smSelLt=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    const eySel=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    const emSelLt=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    for(let y=2025;y<=2040;y++){const os=h("option",{value:String(y)},y+"년");if(y===(g.startYear||state.year))os.selected=true;sySel.appendChild(os);const oe=h("option",{value:String(y)},y+"년");if(y===(g.endYear||state.year))oe.selected=true;eySel.appendChild(oe);}
    for(let m=1;m<=12;m++){const osm=h("option",{value:String(m)},m+"월");if(m===(g.startMonth||1))osm.selected=true;smSelLt.appendChild(osm);const oem=h("option",{value:String(m)},m+"월");if(m===(g.endMonth||12))oem.selected=true;emSelLt.appendChild(oem);}
    sySel.addEventListener("change",function(e){g.startYear=parseInt(e.target.value);if((g.endYear||state.year)<g.startYear)g.endYear=g.startYear;saveGoalData();});
    eySel.addEventListener("change",function(e){g.endYear=parseInt(e.target.value);if((g.startYear||state.year)>g.endYear)g.startYear=g.endYear;saveGoalData();});
    smSelLt.addEventListener("change",function(e){g.startMonth=parseInt(e.target.value);saveGoalData();});
    emSelLt.addEventListener("change",function(e){g.endMonth=parseInt(e.target.value);saveGoalData();});
    pRow.appendChild(sySel);pRow.appendChild(smSelLt);pRow.appendChild(h("span",{style:"font-size:10px;color:#475569;flex-shrink:0"},"~"));pRow.appendChild(eySel);pRow.appendChild(emSelLt);
    panel.appendChild(pRow);
  }else if(scope==="daily"&&dk){
    const pRow=h("div",{style:"display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap"});
    pRow.appendChild(h("span",{style:"font-size:10px;color:#64748b;flex-shrink:0"},"📌 날짜:"));
    const parts=dk.split("-");
    const mSel2=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    for(let m=1;m<=12;m++){const o=h("option",{value:String(m)},m+"월");if(m===parseInt(parts[0]))o.selected=true;mSel2.appendChild(o);}
    const dSel2=h("select",{style:"padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px"});
    function refreshDSel2(){dSel2.innerHTML="";var maxD2=daysInMonth(state.year,parseInt(mSel2.value));for(let d=1;d<=maxD2;d++){const o=document.createElement("option");o.value=String(d);o.textContent=d+"일";if(d===parseInt(parts[1]))o.selected=true;dSel2.appendChild(o);}}
    mSel2.addEventListener("change",function(){refreshDSel2();});
    dSel2.addEventListener("change",function(){var newDk=mSel2.value+"-"+dSel2.value;if(newDk!==dk){var arr=state.goalData.daily[dk]||[];state.goalData.daily[dk]=arr.filter(x=>x.id!==g.id);if(!state.goalData.daily[newDk])state.goalData.daily[newDk]=[];state.goalData.daily[newDk].push(g);state._expandedGoal={id:g.id,scope:"daily",dk:newDk};saveGoalData();render(true);}});
    pRow.appendChild(mSel2);refreshDSel2();pRow.appendChild(dSel2);
    panel.appendChild(pRow);
  }

  // ── E2 독서 언어 태그 (모든 scope) ──
  if(g.cat==="E2"){
    const btRow=h("div",{style:"display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;padding:6px 8px;background:#0c0f1a;border-radius:6px;border:1px dashed #3b82f640"});
    btRow.appendChild(h("span",{style:"font-size:10px;color:#64748b;flex-shrink:0"},"📚 언어:"));
    [["en","🇺🇸 영어","#3b82f6"],["kr","🇰🇷 한글","#10b981"]].forEach(function(bt){
      const active=g.language===bt[0];
      btRow.appendChild(h("button",{style:"padding:3px 10px;border-radius:4px;border:1px solid "+(active?bt[2]:"#334155")+";background:"+(active?bt[2]+"22":"transparent")+";color:"+(active?bt[2]:"#64748b")+";font-size:11px;cursor:pointer",onClick:function(){g.language=bt[0];saveGoalData();cloudSaveGoals();_isAutoRender=true;render();}},bt[1]));
    });
    if(g.language){
      btRow.appendChild(h("button",{style:"padding:2px 6px;border-radius:4px;border:1px solid #475569;background:transparent;color:#64748b;font-size:10px;cursor:pointer;margin-left:auto",title:"언어 태그 해제",onClick:function(){delete g.language;saveGoalData();cloudSaveGoals();_isAutoRender=true;render();}},"✕ 해제"));
    }
    panel.appendChild(btRow);
  }

  // ── 상위 목표 연결 ──
  var parentEditEl=renderParentEditSelectors(scope,g);
  if(parentEditEl)panel.appendChild(parentEditEl);

  // ── 진도율 / 완료 ──
  if(scope==="daily"||scope==="weekly"){

  // ── 하위 목표 ──

// ── 인라인 폼용 상위목표 선택 ────────────────────────────────
// af.parentIds를 직접 수정 (state.goalNewParentIds 미사용)
function renderInlineParentSelectors(af){
  var scope=af.scope;
  var cat=af.cat;
  var uppers=upperScopes(scope);
  if(uppers.length===0)return null;
  if(!af.parentIds)af.parentIds={};
  var hasAny=false;
  var wrap=h("div",{style:"display:flex;flex-direction:column;gap:4px;margin-top:6px;padding:6px 8px;background:#0c0f1a;border-radius:6px;border:1px solid #1e293b"});
  wrap.appendChild(h("span",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:2px"},"📎 상위 목표 연결"));
  uppers.forEach(function(us){
    var candidates=getCandidatesForScope(us,cat);
    if(candidates.length===0)return;
    hasAny=true;
    var label=us==="habits"?"습관":us==="readingGoals"?"독서목표":(SCOPE_LABELS[us]||us);
    var row=h("div",{style:"display:flex;gap:6px;align-items:center"});
    row.appendChild(h("span",{style:"font-size:10px;color:#64748b;width:40px;flex-shrink:0;text-align:right"},label+":"));
    var sel=h("select",{style:"flex:1;padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px;font-family:'Noto Sans KR',sans-serif"});
    var noneOpt=h("option",{value:""},"없음");
    if(!af.parentIds[us])noneOpt.selected=true;
    sel.appendChild(noneOpt);
    candidates.forEach(function(g){
      var opt=h("option",{value:String(g.id)},g.cat+" "+g.name);
      if(af.parentIds[us]===g.id)opt.selected=true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change",(function(upperScope){return function(e){
      if(e.target.value)af.parentIds[upperScope]=parseInt(e.target.value);
      else delete af.parentIds[upperScope];
    }})(us));
    row.appendChild(sel);
    wrap.appendChild(row);
  });
  return hasAny?wrap:null;
}


function doAddInlineGoal(af){
  var name=(af.name||"").trim();
  if(!name)return;
  var memo=(af.memo||"").trim();
  var id=Date.now();
  var cat=af.cat;
  var pids=(af.parentIds&&Object.keys(af.parentIds).length>0)?af.parentIds:undefined;

  // E2 목표는 언어 태그 부착
  var lang=(cat==="E2"&&af.language)?af.language:null;

  if(af.scope==="daily"){
    var m=af.month||new Date().getMonth()+1;
    var d=af.day||new Date().getDate();
    var dk=m+"-"+d;
    if(!state.goalData.daily[dk])state.goalData.daily[dk]=[];
    var dg={id:id,cat:cat,name:name,done:false,memo:memo};
    if(pids)dg.parentIds=pids;
    if(lang)dg.language=lang;
    state.goalData.daily[dk].push(dg);
    state.goalCalMonth=m;state.goalCalDay=d;

  }else if(af.scope==="weekly"){
    var wsm=af.startMonth||af.month||new Date().getMonth()+1;
    var wem=af.endMonth||wsm;
    var sd=af.startDay||1;
    var ed=af.endDay||Math.min(sd+6,daysInMonth(state.year,wem));
    var wi=weekIdxOfDay(state.year,wsm,sd);
    var wg={id:id,cat:cat,name:name,memo:memo,progress:0,subtasks:[],
      year:state.year,month:wsm,startMonth:wsm,endMonth:wem,weekIdx:wi,startDay:sd,endDay:ed,
      period:state.year+"-"+String(wsm).padStart(2,"0")+"-W"+wi};
    if(pids)wg.parentIds=pids;
    if(lang)wg.language=lang;
    state.goalData.weekly.push(wg);
    state.goalData.weekly=sortByDream(state.goalData.weekly);

  }else if(af.scope==="monthly"){
    var sm=af.startMonth||new Date().getMonth()+1;
    var em=af.endMonth||sm;
    var smSd=af.startDay||1;
    var emEd=af.endDay||daysInMonth(state.year,em);
    var mg={id:id,cat:cat,name:name,memo:memo,progress:0,subtasks:[],
      year:state.year,month:sm,startMonth:sm,endMonth:em,startDay:smSd,endDay:emEd};
    if(pids)mg.parentIds=pids;
    if(lang)mg.language=lang;
    state.goalData.monthly.push(mg);
    state.goalData.monthly=sortByDream(state.goalData.monthly);

  }else if(af.scope==="longterm"){
    var ltCurM=new Date().getMonth()+1;
    var lg={id:id,cat:cat,name:name,memo:memo,progress:0,subtasks:[],
      startYear:af.startYear||state.year,endYear:af.endYear||state.year+1,
      startMonth:af.startMonth||ltCurM,endMonth:af.endMonth||ltCurM};
    if(pids)lg.parentIds=pids;
    if(lang)lg.language=lang;
    state.goalData.longterm.push(lg);
    state.goalData.longterm=sortByDream(state.goalData.longterm);

  }else if(af.scope==="habits"){
    if(!state.goalData.habits)state.goalData.habits=[];
    state.goalData.habits.push({
      id:id,cat:cat,name:name,
      startDate:HABIT_START_DATE,endDate:HABIT_END_DATE,
      completions:{},longtermId:pids&&pids.longterm?pids.longterm:null
    });

  }

  state._addForm=null;
  saveGoalData();cloudSaveGoals();
  render(true);
}

function renderGoals(){

  // ── 월간 캘린더 ──────────────────────────────────────────

  calNav.appendChild(calTitle);
  calNav.appendChild(h("button",{className:"goal-date-arrow",onClick:function(){
    state.goalCalMonth++;if(state.goalCalMonth>12){state.goalCalMonth=1;state.goalCalYear++;}render();
  }},"▶"));
  calBox.appendChild(calNav);

  // 요일 헤더 (일요일 시작)
  const dowHdr=h("div",{style:"display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px"});
  ["일","월","화","수","목","금","토"].forEach(function(d,i){
    var hc=i===0?"#ef4444":(i===6?"#3b82f6":"#475569");
    dowHdr.appendChild(h("div",{style:"text-align:center;font-size:9px;font-weight:700;color:"+hc+";padding:2px 0"},d));
  });
  calBox.appendChild(dowHdr);

  // 날짜 그리드 (일요일 시작)
  const firstDay=new Date(calY,calM-1,1);
  const firstDow=firstDay.getDay(); // 0=Sun
  const startOffset=firstDow; // Sun=0
  const totalDays=daysInMonth(calY,calM);
  // 일간목표 있는 날짜 수집
  const daysWithGoals=new Set();
  Object.keys(state.goalData.daily||{}).forEach(function(dk){
    const parts=dk.split("-");
    if(parseInt(parts[0])===calM&&(state.goalData.daily[dk]||[]).length>0){
      daysWithGoals.add(parseInt(parts[1]));
    }
  });

  const grid=h("div",{style:"display:grid;grid-template-columns:repeat(7,1fr);gap:2px"});
  // 앞 빈칸
  for(let i=0;i<startOffset;i++){
    grid.appendChild(h("div",{},""));
  }
  for(let d=1;d<=totalDays;d++){
    const isToday3=calY===today2.getFullYear()&&calM===today2.getMonth()+1&&d===today2.getDate();
    const isSelected=state.goalCalDay===d&&calY===state.goalCalYear&&calM===state.goalCalMonth;
    const hasDGoals=daysWithGoals.has(d);
    const dow2=(startOffset+d-1)%7; // 0=Sun, 6=Sat
    const isSun=dow2===0;
    const isSat=dow2===6;
    const isHol2=!!isHoliday(calY,calM,d);
    const dayColor=isToday3?"#fff":isSat?"#3b82f6":(isHol2||isSun)?"#ef4444":"#cbd5e1";
    const dayBg=isToday3?"#6366f1":(isSelected?"#1e3a8a":"transparent");

        state.goalCalDay=(state.goalCalDay===d&&calY===state.goalCalYear&&calM===state.goalCalMonth)?null:d;
        render();
      }

    // 일간목표 있으면 점 표시
    if(hasDGoals){
      const dot=h("div",{style:"position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:"+(isToday3?"#fff":"#6366f1")});
      dayBtn.style.position="relative";
      dayBtn.appendChild(dot);
    }
    grid.appendChild(dayBtn);
  }
  calBox.appendChild(grid);

  // 선택된 날의 일간목표 표시
  if(state.goalCalDay){
    const selDk=calM+"-"+state.goalCalDay;
    const selGoals=state.goalData.daily[selDk]||[];
    const selDow=["일","월","화","수","목","금","토"][new Date(calY,calM-1,state.goalCalDay).getDay()];
    const selBox=h("div",{style:"margin-top:10px;padding-top:10px;border-top:1px solid #1e293b"});
    selBox.appendChild(h("div",{style:"font-size:10px;color:#6366f1;font-weight:700;margin-bottom:6px"},calM+"/"+state.goalCalDay+" ("+selDow+") 일간목표"));
    if(selGoals.length===0){
      selBox.appendChild(h("div",{style:"font-size:11px;color:#334155;text-align:center;padding:6px 0"},"일간 목표 없음"));
    }else{
      selGoals.forEach(function(g){
        const cat=catByCode(g.cat);
        const row=h("div",{style:"display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;cursor:pointer",
          onClick:function(){navigateToGoal("daily",g);}
        });
        row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:"+(cat?cat.color:"#94a3b8")+";font-family:monospace;flex-shrink:0"},g.cat));
        row.appendChild(h("span",{style:"flex:1;color:"+(g.done?"#475569":"#cbd5e1")+(g.done?";text-decoration:line-through":"")},g.name));
        if(g.done)row.appendChild(h("span",{style:"color:#10b981"},"✓"));
        row.appendChild(h("span",{style:"font-size:9px;color:#0d9488"},"↗"));
        selBox.appendChild(row);
      });
    }
    // + 일간목표 추가 버튼
    const addDayBtn=h("button",{
      style:"margin-top:6px;width:100%;padding:6px;border-radius:8px;border:1px dashed #334155;background:transparent;color:#0d9488;font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif",
      onClick:function(){

        state.month=calM;state.day=state.goalCalDay;
        state.goalScope="daily";state.tab="goals";
        render(true);
      }
    },"+ 일간목표 추가");
    selBox.appendChild(addDayBtn);
    calBox.appendChild(selBox);
  }
  wrap.appendChild(calBox);

  // ── 금일 목표 ─────────────────────────────────────────────
  (function(){
    // 캘린더에서 날짜 선택 시 그 날 기준, 아니면 오늘
    const tgtY=state.goalCalDay?state.goalCalYear:state.year;
    const tgtM=state.goalCalDay?state.goalCalMonth:state.month;
    const tgtD=state.goalCalDay?state.goalCalDay:state.day;
    const isToday=tgtY===state.year&&tgtM===state.month&&tgtD===state.day;
    const tdk=tgtM+"-"+tgtD;
    const tWIdx=weekIdxOfDay(tgtY,tgtM,tgtD);
    // 완료 목표는 "최근 완료" 섹션에서만 표시 (picker/이연과 동일 기준)
    const tDaily=(state.goalData.daily[tdk]||[]).filter(function(g){return !g.done;});
    // 주간: 기준일을 startDate~endDate 범위에 포함하는 것 + 미완료
    const _tRefKey=tgtY*10000+tgtM*100+tgtD;
    const tWeekly=(state.goalData.weekly||[]).filter(function(g){
      if(g.done||(g.progress||0)>=100)return false;
      return goalIncludesDate(g,"weekly",tgtY,tgtM,tgtD);
    });

    // 이연: 선택일 이전 30일 내 미완료 일간목표
    const dailyCarryover=[];
    (function(){
      const viewDate=new Date(tgtY,tgtM-1,tgtD);
      for(let i=1;i<=30;i++){
        const cd=new Date(viewDate);cd.setDate(cd.getDate()-i);
        if(cd.getFullYear()!==tgtY)break;
        const pk=(cd.getMonth()+1)+"-"+cd.getDate();
        (state.goalData.daily[pk]||[]).forEach(function(g){
          if(!g.done)dailyCarryover.push({goal:g,origKey:pk});
        });
      }
    })();
    // 이연: endDate가 선택일 이전 & 미완료 주간 목표 (통합 유틸 사용)
    const weeklyCarryover=(state.goalData.weekly||[]).filter(function(g){
      if((g.progress||0)>=100||g.done)return false;
      return goalExpiredBefore(g,"weekly",tgtY,tgtM,tgtD);
    });
    // 이연: endDate 지난 specific 독서목표
    const tgtDateStr=new Date(tgtY,tgtM-1,tgtD).toISOString().slice(0,10);
    const readingCarryover=(state.goalData.readingGoals||[]).filter(function(g){
      if(g.type!=="specific"||!g.endDate)return false;
      if(g.endDate>=tgtDateStr)return false;
      return calcReadingGoalProgress(g)<100;
    });

    if(tWeekly.length===0&&tDaily.length===0&&dailyCarryover.length===0&&weeklyCarryover.length===0&&readingCarryover.length===0)return;

    const box=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:10px;margin-bottom:12px;border:1px solid #1e293b"});
    const hdr=h("div",{style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"});
    hdr.appendChild(h("span",{style:"font-size:10px;color:#64748b;font-weight:700;letter-spacing:.5px"},
      "📅 "+tgtM+"/"+tgtD+(isToday?" 금일":"")+" 목표"));
    const summary=[];
    const coTotal=dailyCarryover.length+weeklyCarryover.length+readingCarryover.length;

    if(tDaily.length)summary.push(tDaily.length+" 일간");
    hdr.appendChild(h("span",{style:"font-size:9px;color:#475569;font-family:'JetBrains Mono',monospace"},summary.join(" · ")));
    box.appendChild(hdr);

    function makeRow(icon,iconColor,accentColor,label,catCode,done,onToggle,navScope,navGoal){
      const cat=catByCode(catCode);

      },label);
      if(navScope&&navGoal){
        nameSpan.addEventListener("click",function(e){e.stopPropagation();navigateToGoal(navScope,navGoal);});

      if(navScope){
        row.appendChild(h("span",{style:"font-size:9px;color:#0d9488;flex-shrink:0;cursor:pointer",onClick:function(e){e.stopPropagation();navigateToGoal(navScope,navGoal);}},"↗"));
      }

      box.appendChild(h("div",{style:"font-size:9px;color:#ef4444;font-weight:700;padding:4px 0;margin-bottom:2px;border-bottom:1px solid #7f1d1d;letter-spacing:.5px"},"🔴 이연 ("+coTotal+")"));

        row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:#fff;background:"+(cat?cat.color:"#475569")+";border-radius:3px;padding:1px 5px;flex-shrink:0;font-family:'JetBrains Mono',monospace"},g.cat));
        row.appendChild(h("span",{style:"flex:1;font-size:12px;color:#fca5a5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},g.name));
        row.appendChild(h("span",{style:"font-size:9px;color:#ef4444;font-family:monospace;flex-shrink:0"},(g.endDate||"").slice(5)+" "+pct+"%"));
        box.appendChild(row);
      });
      weeklyCarryover.forEach(function(g){
        const cat=catByCode(g.cat);
        const row=h("div",{style:"display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #0f172a;border-left:2px solid #ef4444;background:#1a0505;margin-bottom:2px;border-radius:3px"});
        // 완료 체크박스 (일간 이연과 동일 방식)
        const chk=h("input",{type:"checkbox",style:"width:14px;height:14px;accent-color:#ef4444;flex-shrink:0;cursor:pointer"});
        chk.checked=!!g.done;
        chk.addEventListener("change",function(){
          markGoalDone(g,!g.done);saveGoalData();_isAutoRender=true;render();
        });
        row.appendChild(chk);

  const _refD=(state.goalCalDay&&state.goalCalYear===calY&&state.goalCalMonth===calM)?state.goalCalDay:(new Date().getMonth()+1===calM&&new Date().getFullYear()===calY?new Date().getDate():1);

    };

    function renderGoalPill(g,scope,depth,pillDk,indentPx){
      const vis=SCOPE_VIS[scope]||{color:"#94a3b8",bg:"transparent",border:"#1e293b",label:scope,fs:"12px",fw:"400",lh:"2px"};
      const hrs=calcGoalTotalHours(g.id);
      const pct=scope==="readingGoals"?calcReadingGoalProgress(g):(g.progress||0);
      const done=(scope==="readingGoals"?(pct>=100):(scope==="daily"||scope==="weekly")?g.done:(pct>=100));
      const isExpanded=state._expandedGoal&&state._expandedGoal.id===g.id&&state._expandedGoal.scope===scope;

      // 들여쓰기: 명시적 indentPx 우선, 없으면 depth 기반
      const INDENT=indentPx!==undefined?indentPx:depth*14;

      const wrap=h("div",{style:"margin-left:"+INDENT+"px;margin-bottom:"+(scope==="longterm"||scope==="readingGoals"||scope==="habits"?"6px":"3px")});

      // ── 좌측 스코프 라인 (장기/독서/습관은 굵게) ──
      const isRoot=scope==="longterm"||scope==="readingGoals"||scope==="habits";
      const pillWrap=h("div",{
        style:"position:relative;border-radius:"+(isExpanded?"8px 8px 0 0":"8px")+";"+
          "background:"+(isExpanded?vis.color+"20":isRoot?vis.bg:"transparent")+";"+
          "border:1px solid "+(isExpanded?vis.color:done?"#064e3b":(isRoot?vis.border:"#1a2234"))+";"+
          "border-left:"+(isRoot?"3px solid "+vis.color:"1px solid "+(done?"#064e3b":"#1a2234"))+";"+
          "transition:all .15s;cursor:pointer",
        onClick:function(){
          if(isExpanded)state._expandedGoal=null;
          else state._expandedGoal={id:g.id,scope:scope,dk:pillDk||null};
          _isAutoRender=true;render();
        }
      });

      const pill=h("div",{style:"display:flex;align-items:center;gap:6px;padding:"+(isRoot?"7px 10px":"5px 10px")});

      // 연결선 (들여쓰기 있는 하위목표)
      if(INDENT>0){
        pill.appendChild(h("span",{style:"font-size:9px;color:#334155;flex-shrink:0;font-family:monospace"},"└"));
      }

      // 스코프 레이블 뱃지
      const badgeStyle="font-size:9px;font-weight:700;color:#fff;background:"+vis.color+";"+
        "border-radius:4px;padding:1px 5px;flex-shrink:0;white-space:nowrap;font-family:'JetBrains Mono',monospace";
      pill.appendChild(h("span",{style:badgeStyle},vis.label));

      // E2 독서 언어 태그
      if(g.language==="en"||g.language==="kr"){
        const langColor=g.language==="en"?"#3b82f6":"#10b981";
        pill.appendChild(h("span",{style:"font-size:9px;color:"+langColor+";flex-shrink:0"},g.language==="en"?"🇺🇸":"🇰🇷"));
      }

      // 목표명
      pill.appendChild(h("span",{
        style:"flex:1;font-size:"+vis.fs+";font-weight:"+vis.fw+";"+
          "color:"+(done?"#475569":"#e2e8f0")+
          (done?";text-decoration:line-through":"")+
          ";overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
      },g.name));

      // 기간 표시 (스코프 우측에 작게)
      var periodTxt="";
      if(scope==="weekly"){
        periodTxt=g.startDay&&g.endDay?(g.month+"/"+g.startDay+"~"+g.endDay):(g.month+"월"+g.weekIdx+"주");
      }else if(scope==="monthly"){
        const sm=g.startMonth||g.month||"";const em=g.endMonth||g.month||"";
        periodTxt=sm===em?sm+"월":sm+"~"+em+"월";
      }else if(scope==="longterm"){
        periodTxt=(g.startYear||"")+"~"+(g.endYear||"");
      }else if(scope==="daily"&&pillDk){
        const dp=pillDk.split("-");periodTxt=dp[0]+"/"+dp[1];
      }
      if(periodTxt){
        pill.appendChild(h("span",{style:"font-size:9px;color:#475569;font-family:'JetBrains Mono',monospace;flex-shrink:0"},periodTxt));
      }

      // 투입시간
      if(hrs>0){
        pill.appendChild(h("span",{style:"font-size:9px;color:#f59e0b;font-family:monospace;flex-shrink:0"},fmtHours(hrs)));
      }

      // 진도/완료
      if(scope==="daily"||scope==="weekly"){
        const chk=h("div",{style:"width:18px;height:18px;border-radius:3px;border:1.5px solid "+(done?"#10b981":vis.color)+";background:"+(done?"#10b981":"transparent")+";display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer",
          title:done?"완료 취소":"완료 체크",
          onClick:function(e){
            e.stopPropagation();
            markGoalDone(g,!g.done);
            saveGoalData();_isAutoRender=true;render();
          }});
        if(done)chk.appendChild(h("span",{style:"font-size:11px;color:#fff;line-height:1"},"✓"));
        pill.appendChild(chk);
      }else if(scope==="readingGoals"&&g.type==="cumulative"){
        const cnt=calcReadingGoalCount(g);
        pill.appendChild(h("span",{style:"font-size:9px;color:#3b82f6;font-family:monospace;flex-shrink:0"},cnt+"/"+g.targetCount+"권"));
      }else if(scope!=="habits"){
        const track=h("div",{style:"width:36px;height:"+vis.lh+";background:#1e293b;border-radius:2px;overflow:hidden;flex-shrink:0"});
        track.appendChild(h("div",{style:"height:100%;width:"+pct+"%;background:"+(done?"#10b981":vis.color)+";transition:width .3s"}));
        pill.appendChild(track);
        pill.appendChild(h("span",{style:"font-size:9px;color:"+(done?"#10b981":vis.color)+";font-family:monospace;width:24px;text-align:right;flex-shrink:0"},pct+"%"));
      }

      // 직접 삭제 버튼 (모든 scope 스캔해서 제거)
      pill.appendChild(h("button",{
        style:"font-size:11px;color:#475569;background:transparent;border:none;padding:0 4px;cursor:pointer;flex-shrink:0",
        title:"삭제",
        onClick:function(e){
          e.stopPropagation();
          if(!confirm("\""+g.name+"\" 목표를 삭제할까요?"))return;
          forceDeleteGoalById(g.id);
          state._expandedGoal=null;
          saveGoalData();cloudSaveGoals();_isAutoRender=true;render();
        }
      },"✕"));
      // 확장 토글
      pill.appendChild(h("span",{style:"font-size:9px;color:"+(isExpanded?vis.color:"#334155")+";flex-shrink:0"},isExpanded?"▲":"▼"));
      pillWrap.appendChild(pill);

      // ── 하위 목표 추가 버튼 (pill 아래 우측 정렬) ──
      var childScopes=[];
      if(scope==="longterm"||scope==="readingGoals"){
        childScopes=[{s:"monthly",l:"월간"},{s:"weekly",l:"주간"},{s:"daily",l:"일간"}];
      }else if(scope==="monthly"){
        childScopes=[{s:"weekly",l:"주간"},{s:"daily",l:"일간"}];
      }else if(scope==="weekly"){
        childScopes=[{s:"daily",l:"일간"}];
      }
      if(childScopes.length>0){
        const childBtnRow=h("div",{style:"display:flex;justify-content:flex-end;gap:3px;padding:2px 6px 4px"});
        childScopes.forEach(function(cs){
          const isAct=state._addForm&&state._addForm._parentGoalId===g.id&&state._addForm.scope===cs.s;
          childBtnRow.appendChild(h("button",{
            style:"font-size:8px;color:"+(isAct?"#fff":vis.color)+";background:"+(isAct?vis.color:vis.color+"18")+";border:1px solid "+vis.color+(isAct?"":"40")+";border-radius:3px;padding:1px 5px;cursor:pointer",
            onClick:function(e){
              e.stopPropagation();
              if(isAct){state._addForm=null;}
              else{
                var pids={};
                if(scope==="longterm")pids.longterm=g.id;
                else if(scope==="readingGoals")pids.readingGoals=g.id;
                else if(scope==="monthly")pids.monthly=g.id;
                else if(scope==="weekly")pids.weekly=g.id;
                state._addForm={cat:catDef.code,scope:cs.s,name:"",memo:"",
                  month:calM,startDay:today2.getDate(),endDay:Math.min(today2.getDate()+6,daysInMonth(calY,calM)),
                  day:today2.getDate(),startMonth:calM,endMonth:calM,
                  startYear:calY,endYear:calY+1,
                  parentIds:pids,_parentGoalId:g.id};
              }
              render();
            }
          },"+"+(isAct?"취소":cs.l)));
        });
        pillWrap.appendChild(childBtnRow);
      }

      wrap.appendChild(pillWrap);

      // 확장 패널 (수정)
      if(isExpanded){
        wrap.appendChild(renderGoalDetailPanel(g,scope,catDef,pillDk||null));
      }

      // 하위 목표 추가 폼 (이 pill 아래)
      if(state._addForm&&state._addForm._parentGoalId===g.id){
        const af=state._addForm;
        wrap.appendChild(renderInlineAddForm(af,catDef,INDENT+16));
      }

      return wrap;
    }

    // ── 트리 구성: 장기 → 월간 → 주간 → 일간, 독서 ──
    // 완료된 목표는 숨김 (단, 미완료 자식이 있으면 조상은 유지)
    // 주간: wGoals2 필터가 이미 "날짜 범위 내"만 통과시키므로 done이어도 표시 — 활동 기간 중 참조/복원 가능
    function isGoalActive(g,scope){
      if(scope==="readingGoals")return calcReadingGoalProgress(g)<100;
      if(scope==="daily")return !g.done;
      if(scope==="weekly")return true;
      return (g.progress||0)<100 && !g.done;
    }
    const activeDescCache={};
    function hasActiveDescendant(goalId){
      if(activeDescCache[goalId]!==undefined)return activeDescCache[goalId];
      activeDescCache[goalId]=false;
      for(var i=0;i<mGoals2.length;i++){var mg=mGoals2[i];
        if(Object.values(getParentIds(mg)).indexOf(goalId)<0)continue;
        if(isGoalActive(mg,"monthly")||hasActiveDescendant(mg.id)){activeDescCache[goalId]=true;return true;}
      }
      for(var i=0;i<wGoals2.length;i++){var wg=wGoals2[i];
        if(Object.values(getParentIds(wg)).indexOf(goalId)<0)continue;
        if(isGoalActive(wg,"weekly")||hasActiveDescendant(wg.id)){activeDescCache[goalId]=true;return true;}
      }
      for(var i=0;i<dGoals2.length;i++){var dItem=dGoals2[i];
        if(Object.values(getParentIds(dItem.g)).indexOf(goalId)<0)continue;
        if(isGoalActive(dItem.g,"daily")){activeDescCache[goalId]=true;return true;}
      }
      return false;
    }
    function shouldShow(g,scope){return isGoalActive(g,scope)||hasActiveDescendant(g.id);}

    var renderedM=new Set();
    var renderedW=new Set();
    var renderedD=new Set();
    var pillCount=0;
    function pillAdd(g,scope,depth,pillDk,indentPx){
      if(!shouldShow(g,scope))return false;
      catSec.appendChild(renderGoalPill(g,scope,depth,pillDk,indentPx));
      pillCount++;
      return true;
    }
    // 특정 goalId를 parent로 갖는 일간목표(이번 달) 수집 (날짜 오름차순)
    function dailyChildrenOf(goalId){
      return dGoals2.filter(function(item){
        var pids=getParentIds(item.g);
        return Object.values(pids).indexOf(goalId)>=0;
      }).sort(function(a,b){return a.d-b.d;});
    }

    ltGoals.concat(rgGoals2).forEach(function(lt,idx){
      const ltScope=idx<ltGoals.length?"longterm":"readingGoals";
      pillAdd(lt,ltScope,0,undefined,0);

      // 하위 월간
      const childM=mGoals2.filter(g=>{
        const pids=getParentIds(g);
        return Object.values(pids).indexOf(lt.id)>=0;
      });
      childM.forEach(function(mg){
        if((mg.year||calY)!==calY)return;
        renderedM.add(mg.id);
        pillAdd(mg,"monthly",1,undefined,14);
        // 하위 주간
        const childW=wGoals2.filter(g=>{
          const pids=getParentIds(g);
          return Object.values(pids).indexOf(mg.id)>=0;
        });
        childW.forEach(function(wg){
          renderedW.add(wg.id);
          pillAdd(wg,"weekly",2,undefined,28);
          // 주간의 하위 일간
          dailyChildrenOf(wg.id).forEach(function(item){
            if(renderedD.has(item.g.id))return;
            renderedD.add(item.g.id);
            pillAdd(item.g,"daily",3,item.dk,42);
          });
        });
        // 월간의 직속 하위 일간 (주간 거치지 않음)
        dailyChildrenOf(mg.id).forEach(function(item){
          if(renderedD.has(item.g.id))return;
          renderedD.add(item.g.id);
          pillAdd(item.g,"daily",2,item.dk,28);
        });
      });
      // 장기/독서의 직속 하위 일간
      dailyChildrenOf(lt.id).forEach(function(item){
        if(renderedD.has(item.g.id))return;
        renderedD.add(item.g.id);
        pillAdd(item.g,"daily",1,item.dk,14);
      });
    });

    // 부모 없는 월간 (orphan) — 장기와 같은 위치
    mGoals2.forEach(function(mg){
      if(mg.year!==calY||renderedM.has(mg.id))return;
      const pids=getParentIds(mg);
      if(Object.keys(pids).length>0)return;
      pillAdd(mg,"monthly",0,undefined,0);
      // 하위 주간
      const childW=wGoals2.filter(g=>{
        const pids2=getParentIds(g);
        return Object.values(pids2).indexOf(mg.id)>=0;
      });
      childW.forEach(function(wg){
        renderedW.add(wg.id);
        pillAdd(wg,"weekly",1,undefined,14);
        dailyChildrenOf(wg.id).forEach(function(item){
          if(renderedD.has(item.g.id))return;
          renderedD.add(item.g.id);
          pillAdd(item.g,"daily",2,item.dk,28);
        });
      });
      dailyChildrenOf(mg.id).forEach(function(item){
        if(renderedD.has(item.g.id))return;
        renderedD.add(item.g.id);
        pillAdd(item.g,"daily",1,item.dk,14);
      });
    });

    // 부모 없는 주간 (orphan) — 장기와 같은 위치
    wGoals2.forEach(function(wg){
      if(renderedW.has(wg.id))return;
      const pids=getParentIds(wg);
      if(Object.keys(pids).length>0)return;
      pillAdd(wg,"weekly",0,undefined,0);
      dailyChildrenOf(wg.id).forEach(function(item){
        if(renderedD.has(item.g.id))return;
        renderedD.add(item.g.id);
        pillAdd(item.g,"daily",1,item.dk,14);
      });
    });

    // 부모 없는 일간 (orphan) — 날짜 오름차순
    const orphanDaily=dGoals2.filter(function(item){return!renderedD.has(item.g.id);}).sort(function(a,b){return a.d-b.d;});
    orphanDaily.forEach(function(item){
      pillAdd(item.g,"daily",0,item.dk,0);
    });

    // 필터링 결과 모두 완료되면 카테고리 섹션 자체 생략 (폼 열린 경우 제외)
    const formOpenHere=!!(state._addForm&&state._addForm.cat===catCode);
    if(pillCount>0||formOpenHere)wrap.appendChild(catSec);
  });

  // 목표가 하나도 없는 경우
  const hasAnyGoal=(state.goalData.longterm||[]).length+(state.goalData.monthly||[]).length+(state.goalData.weekly||[]).length>0||Object.keys(state.goalData.daily||{}).length>0;
  if(!hasAnyGoal){
    wrap.appendChild(h("div",{style:"text-align:center;padding:40px 20px;color:#334155"},
      h("div",{style:"font-size:32px;margin-bottom:10px"},"🎯"),
      h("div",{style:"font-size:14px;color:#475569"},"목표를 추가해 시작하세요"),
      h("div",{style:"font-size:11px;color:#334155;margin-top:6px"},"카테고리별 +장기 / +월간 / +주간 / +일간 버튼 클릭")
    ));
  }

  return wrap;
}



function renderBooks(){
  const wrap=h("div",{});
  const stats=getBookStats();

  // ── 독서 목표 섹션 ──
  const readingGoals=state.goalData.readingGoals||[];
  const rgBox=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:12px;margin-bottom:14px;border:1px solid #1e293b"});
  const rgTitle=h("div",{style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"});
  rgTitle.appendChild(h("span",{style:"font-size:10px;color:#64748b;font-weight:700;letter-spacing:.5px"},"📚 독서 목표"));
  // 추가 버튼
  rgTitle.appendChild(h("button",{style:"font-size:11px;color:#3b82f6;background:transparent;border:1px solid #3b82f6;border-radius:6px;padding:2px 8px;cursor:pointer",onClick:function(){state.showReadingGoalForm=!state.showReadingGoalForm;render()}},"+ 목표추가"));
  rgBox.appendChild(rgTitle);

  // 추가 폼
  if(state.showReadingGoalForm){
    if(!state.rgNewName)state.rgNewName="";
    // goalNewCat으로 진입했으면 항상 반영
    if(state.goalNewCat)state.rgNewCat=state.goalNewCat;
    if(!state.rgNewCat)state.rgNewCat="E2";
    if(!state.rgNewType)state.rgNewType="cumulative";
    if(!state.rgNewBookType)state.rgNewBookType="en";
    if(!state.rgNewTarget)state.rgNewTarget=100;
    if(!state.rgNewStartYear)state.rgNewStartYear=2025;
    if(!state.rgNewEndYear)state.rgNewEndYear=2040;
    const form=h("div",{style:"background:#111827;border-radius:8px;padding:10px;margin-bottom:10px;border:1px solid #334155"});
    // 타입 선택
    const typeRow=h("div",{style:"display:flex;gap:6px;margin-bottom:8px"});
    ["cumulative","specific"].forEach(function(t){
      const label=t==="cumulative"?"📊 누적권수":"📖 특정책";
      typeRow.appendChild(h("button",{style:"flex:1;padding:4px;border-radius:6px;border:1px solid "+(state.rgNewType===t?"#3b82f6":"#334155")+";background:"+(state.rgNewType===t?"#3b82f620":"transparent")+";color:"+(state.rgNewType===t?"#60a5fa":"#64748b")+";font-size:11px;cursor:pointer",onClick:function(){state.rgNewType=t;render()}},label));
    });
    form.appendChild(typeRow);
    // 카테고리 + 이름
    const row1=h("div",{style:"display:flex;gap:6px;margin-bottom:6px"});
    const catSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px;width:100px"});
    CATEGORIES.forEach(function(c){
      const opt=h("option",{value:c.code},c.code);
      if(c.code===state.rgNewCat)opt.selected=true;
      catSel.appendChild(opt);
    });
    catSel.addEventListener("change",function(e){state.rgNewCat=e.target.value});
    row1.appendChild(catSel);
    const nameInp=h("input",{className:"goal-input",placeholder:"목표명 (예: 영어책 100권)",value:state.rgNewName||""});
    nameInp.addEventListener("input",function(e){state.rgNewName=e.target.value});
    nameInp.addEventListener("keydown",function(e){if(e.key==="Enter")addReadingGoal()});
    row1.appendChild(nameInp);
    form.appendChild(row1);
    // cumulative 전용: bookType + targetCount
    if(state.rgNewType==="cumulative"){
      const row2=h("div",{style:"display:flex;gap:6px;margin-bottom:6px;align-items:center"});
      const btSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px;width:90px"});
      [{v:"en",l:"영어책"},{v:"kr",l:"한글책"},{v:"all",l:"전체"}].forEach(function(o){
        const opt=h("option",{value:o.v},o.l);
        if(o.v===state.rgNewBookType)opt.selected=true;
        btSel.appendChild(opt);
      });
      btSel.addEventListener("change",function(e){state.rgNewBookType=e.target.value});
      row2.appendChild(btSel);
      row2.appendChild(h("span",{style:"font-size:11px;color:#64748b"},"목표:"));
      const tgtInp=h("input",{style:"width:60px;padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#0c0f1a;color:#e2e8f0;font-size:11px;text-align:right",type:"number",min:"1",value:String(state.rgNewTarget||100)});
      tgtInp.addEventListener("input",function(e){state.rgNewTarget=parseInt(e.target.value)||100});
      row2.appendChild(tgtInp);
      row2.appendChild(h("span",{style:"font-size:11px;color:#64748b"},"권"));
      form.appendChild(row2);
    }
    // 기간 설정: specific=날짜, cumulative=연도
    const periodRow=h("div",{style:"display:flex;gap:6px;margin-bottom:6px;align-items:center"});
    periodRow.appendChild(h("span",{style:"font-size:11px;color:#64748b;flex-shrink:0"},"기간:"));
    if(state.rgNewType==="specific"){
      if(!state.rgNewStartDate)state.rgNewStartDate=new Date().toISOString().slice(0,10);
      if(!state.rgNewEndDate)state.rgNewEndDate="";
      const sdInp=h("input",{type:"date",style:"flex:1;padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#0c0f1a;color:#e2e8f0;font-size:11px",value:state.rgNewStartDate});
      sdInp.addEventListener("change",function(e){state.rgNewStartDate=e.target.value});
      periodRow.appendChild(sdInp);
      periodRow.appendChild(h("span",{style:"font-size:11px;color:#64748b"},"~"));
      const edInp=h("input",{type:"date",style:"flex:1;padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#0c0f1a;color:#e2e8f0;font-size:11px",value:state.rgNewEndDate||""});
      edInp.addEventListener("change",function(e){state.rgNewEndDate=e.target.value});

function renderCatPicker(){
  const ov=h("div",{className:"overlay",onClick:()=>{state.showCatPicker=false;render()}});
  const sheet=h("div",{className:"picker-sheet",onClick:e=>e.stopPropagation()});
  sheet.appendChild(h("div",{className:"picker-handle"}));
  const phdr=h("div",{className:"picker-header"});
  phdr.appendChild(h("span",{className:"picker-title"},"📋 카테고리 선택"));
  phdr.appendChild(h("span",{className:"picker-time"},state.activeSlot+" · "+(state.mode==="plan"?"Plan":"Actual")));
  sheet.appendChild(phdr);

  // Time range selector for batch input
  const rangeRow=h("div",{style:"display:flex;gap:8px;align-items:center;margin-bottom:12px;padding:8px 10px;background:#111827;border-radius:10px"});
  rangeRow.appendChild(h("span",{style:"font-size:11px;color:#94a3b8;flex-shrink:0"},state.activeSlot+" ~"));
  const endSel=h("select",{className:"goal-cat-select",style:"padding:6px 8px;font-size:12px;flex:1"});
  // Build end time options: from activeSlot+30min to 24:00
  const startIdx=SLOTS.indexOf(state.activeSlot);
  const singleOpt=h("option",{value:""},"이 슬롯만");
  endSel.appendChild(singleOpt);
  for(let si=startIdx+1;si<SLOTS.length;si++){
    const hrs=((si-startIdx+1)*0.5);
    const opt=h("option",{value:SLOTS[si]},SLOTS[si]+" ("+hrs+"h)");
    endSel.appendChild(opt);
  }
  endSel.addEventListener("change",function(){state._batchEndSlot=endSel.value});
  rangeRow.appendChild(endSel);
  sheet.appendChild(rangeRow);

  const grid=h("div",{className:"cat-grid"});
  GROUPS.forEach(g=>{
    const pg=h("div",{});
    pg.appendChild(h("div",{className:"picker-group-label",style:"color:"+GC[g]},g+" · "+GN[g]));
    const btns=h("div",{className:"picker-btns"});
    groupCats(g).forEach(c=>{
      const btn=h("button",{className:"picker-btn",style:"background:"+c.color+"18;border-color:"+c.color+"40",onClick:()=>{
        const field=state.mode==="plan"?"plan":"actual";
        const endSlot=state._batchEndSlot||"";
        if(endSlot){
          // Batch apply: from activeSlot to endSlot (inclusive)
          const si=SLOTS.indexOf(state.activeSlot);
          const ei=SLOTS.indexOf(endSlot);
          for(let idx=si;idx<=ei;idx++){
            setSlotSilent(SLOTS[idx],field,c.code);
          }
          save();
        }else{
          setSlotSilent(state.activeSlot,field,c.code);
          save();
        }
        state._batchEndSlot="";
        state.showCatPicker=false;render();
      }});
      btn.appendChild(h("span",{className:"picker-code",style:"color:"+c.color},c.code));
      btn.appendChild(h("span",{className:"picker-label"},c.label));
      btns.appendChild(btn);
    });
    pg.appendChild(btns);
    grid.appendChild(pg);
  });
  sheet.appendChild(grid);
  ov.appendChild(sheet);
  return ov;
}

// Track if user is actively typing in an input/textarea
// Only blocks automatic background renders (cloud sync), not user-initiated renders
var _isEditing=false;
var _isAutoRender=false;
document.addEventListener("focusin",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")_isEditing=true;
});
document.addEventListener("focusout",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"){
    setTimeout(()=>{
      var ae=document.activeElement;
      if(!ae||ae.tagName==="BODY"||ae.tagName==="BUTTON"||ae.tagName==="DIV")_isEditing=false;
      // SELECT로 이동한 경우도 편집 중으로 유지
    },100);
  }
});
function render(force){
  // Only block render if it's an automatic background render AND user is editing
  if(_isEditing&&_isAutoRender&&!force)return;
  _isAutoRender=false;
  // 차트 인스턴스 사전 파괴 — DOM 교체 전에 해야 메모리 누수 없음
  try{if(lineChartInst){lineChartInst.destroy();lineChartInst=null}}catch(e){}
  try{if(barChartInst){barChartInst.destroy();barChartInst=null}}catch(e){}
  try{if(dashDailyChartInst){dashDailyChartInst.destroy();dashDailyChartInst=null}}catch(e){}
  try{if(dailyMonthChartInst){dailyMonthChartInst.destroy();dailyMonthChartInst=null}}catch(e){}
  try{if(bookChartInst){bookChartInst.destroy();bookChartInst=null}}catch(e){}
  try{if(window._dSubChartInst){window._dSubChartInst.destroy();window._dSubChartInst=null}}catch(e){}
  try{if(window._rSubChartInst){window._rSubChartInst.destroy();window._rSubChartInst=null}}catch(e){}
  try{if(window._eSubChartInst){window._eSubChartInst.destroy();window._eSubChartInst=null}}catch(e){}
  try{if(window._aSubChartInst){window._aSubChartInst.destroy();window._aSubChartInst=null}}catch(e){}

  const app=document.getElementById("app");

  app.appendChild(renderTabs());
  // ── 전역 검색창 ──────────────────────────────────────────────
  const searchBar=h("div",{style:"display:flex;align-items:center;gap:8px;padding:7px 12px;background:#0c0f1a;border-bottom:1px solid #1e293b;position:sticky;top:98px;z-index:39"});
  const searchInp=h("input",{
    placeholder:"🔍  목표 / 습관 / 독서목표 검색...",
    value:state.goalSearch||"",
    style:"flex:1;background:#111827;border:1px solid #1e293b;border-radius:8px;padding:6px 10px;font-size:12px;color:#e2e8f0;outline:none"
  });
  searchInp.className="goal-search-inp";
  function _srUpdate(val){
    state.goalSearch=val;
    _refreshGlobalSearch();
  }
  // 한글·영어 혼용 호환: composition 가드 제거 (Windows 한글 IME에서 영어 입력 시
  // compositionstart만 발동하고 compositionend가 누락되는 버그 때문에 영어 입력이
  // 차단되던 문제 해결). 모든 input 이벤트에서 value 반영 — 한글 composition 중간
  // 상태(ㄱ → 가)도 검색에 반영되지만 일반 검색창 UX와 일치.
  searchInp.addEventListener("input",function(e){_srUpdate(e.target.value);});
  searchInp.addEventListener("compositionend",function(e){_srUpdate(e.target.value);});
  searchInp.addEventListener("keydown",function(e){if(e.key==="Escape"){state.goalSearch="";searchInp.value="";_refreshGlobalSearch();}});
  const clrBtn=h("button",{
    id:"__gsClr",
    style:"background:transparent;border:none;color:#64748b;font-size:16px;cursor:pointer;padding:0 4px;display:"+(state.goalSearch?"":"none"),
    onClick:function(){state.goalSearch="";searchInp.value="";_refreshGlobalSearch();searchInp.focus();}
  },"✕");
  searchBar.appendChild(searchInp);
  searchBar.appendChild(clrBtn);
  app.appendChild(searchBar);
  // ── 메인 콘텐츠 ─────────────────────────────────────────────
  const main=h("div",{className:"main",id:"__globalSearchContent"});
  const _gsq=(state.goalSearch||"").trim().toLowerCase();
  if(_gsq){
    main.appendChild(buildGoalSearchResults(_gsq));
  }else{
    if(state.tab==="input"){
      main.appendChild(renderDateBar());
      if(state.showDatePicker)main.appendChild(renderDatePicker());
    }
    if(state.tab==="input")main.appendChild(renderInput());
    if(state.tab==="goals")main.appendChild(renderGoals());
    if(state.tab==="review")main.appendChild(renderReview());
  }
  app.appendChild(main);
  if(state.showDatePicker&&state.tab==="goals")app.appendChild(renderDatePicker());
  if(state.showCatPicker)app.appendChild(renderCatPicker());
  if(state._conflictQueue&&state._conflictQueue.length>0)app.appendChild(renderConflictModal());
}

// 충돌 모달: 클라우드 데이터가 다른데 로컬 큐에 미푸시 변경이 있을 때
function renderConflictModal(){
  var c=state._conflictQueue[0];
  var labels={time:'시간 데이터',books:'독서 데이터',goals:'목표 데이터'};
  var ov=h("div",{style:"position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px"});
  var box=h("div",{style:"background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;max-width:500px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.5)"});
  box.appendChild(h("div",{style:"font-size:16px;font-weight:700;color:#fbbf24;margin-bottom:12px"},"⚠ 동기화 충돌"));
  box.appendChild(h("div",{style:"font-size:13px;color:#cbd5e1;line-height:1.6;margin-bottom:16px"},c.year+'년 '+(labels[c.kind]||c.kind)+'가 클라우드에서 변경되었습니다. 이 기기에는 아직 클라우드에 푸시되지 않은 변경사항이 있습니다.'));
  if(state._conflictQueue.length>1)box.appendChild(h("div",{style:"font-size:11px;color:#94a3b8;margin-bottom:12px"},"(미해결 충돌 "+state._conflictQueue.length+"개)"));
  var btnRow=h("div",{style:"display:flex;gap:8px;flex-direction:column"});
  btnRow.appendChild(h("button",{
    style:"padding:10px 14px;border-radius:8px;border:1px solid #6366f1;background:#312e8133;color:#c7d2fe;font-size:13px;cursor:pointer;text-align:left",
    onClick:function(){_resolveConflict(false);}
  },"📤 내 변경사항 유지 (클라우드에 덮어쓰기)"));
  btnRow.appendChild(h("button",{
    style:"padding:10px 14px;border-radius:8px;border:1px solid #b91c1c;background:#7f1d1d22;color:#fca5a5;font-size:13px;cursor:pointer;text-align:left",
    onClick:function(){_resolveConflict(true);}
  },"📥 클라우드 데이터로 교체 (이 기기 변경 사라짐)"));
  box.appendChild(btnRow);
  ov.appendChild(box);
  return ov;
}

// ── 탭 재포커스 시 재-pull (다기기 동시 사용 대응) ──
// 30초 스로틀 — 충돌 모달이 열려있으면 일시 정지 (사용자 결정 대기)
function _maybeRepull(){
  if(!CLOUD_URL||isArchiveMode())return;
  if(document.visibilityState!=='visible')return;
  if(state._conflictQueue&&state._conflictQueue.length>0)return; // 충돌 미해결 시 pull 정지
  var now=Date.now();
  if(now-_lastCloudPullAt<SYNC_REPULL_INTERVAL)return;
  _lastCloudPullAt=now;
  cloudLoadCurrent();
}
document.addEventListener('visibilitychange',_maybeRepull);
window.addEventListener('focus',_maybeRepull);
