// ── 일간 리뷰 ────────────────────────────────────────────────
// ── 통합 성찰 박스 (감사→잘한것→놓친것→다음→메모) ──────────
// reviewKey: 기존 성찰 저장소 (weekly-review-*, monthly-review-*, yearly-review-*, daily-review-*)
// gratitudeKey: 감사한 일 저장소 (별도 or null이면 reviewKey에 통합)
// labels: {title, next} 커스터마이즈
// 리뷰 키에서 연도 추출 — daily-review-Y-M-D / weekly-review-Y-M-W / monthly-review-Y-M / yearly-review-Y
function yearFromReviewKey(key){
  var m=key&&key.match(/^(?:daily|weekly|monthly|yearly)-review-(\d+)/);
  return m?m[1]:null;
}
// 특정 연도의 모든 리뷰 메모를 localStorage에서 수집 (cloud push용)
function collectReviewsForYear(y){
  var out={};
  var p1="daily-review-"+y+"-";
  var p2="weekly-review-"+y+"-";
  var p3="monthly-review-"+y+"-";
  var exact="yearly-review-"+y;
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(!k)continue;
    if(k.indexOf(p1)===0||k.indexOf(p2)===0||k.indexOf(p3)===0||k===exact){
      try{out[k]=JSON.parse(localStorage.getItem(k)||"{}");}catch(e){out[k]={};}
    }
  }
  return out;
}

function renderReflectionBox(reviewKey,labels){
  var rv;
  try{rv=JSON.parse(localStorage.getItem(reviewKey)||"{}")}catch(e){rv={};}
  const lbl=labels||{};
  const title=lbl.title||"✍️ 성찰";
  const nextLabel=lbl.next||"🎯 다음 한 가지";
  const nextPlaceholder=lbl.nextPh||"다음에 반드시 할 것은?";
  // 일간은 단일 입력 (덮어쓰기), 주간/월간/연간은 누적 모드 (이전 보존 + 신규 append)
  const isAccum=!/^daily-review-/.test(reviewKey);

  function tsNow(){
    const d=new Date();
    const pad=function(n){return String(n).padStart(2,"0");};
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  }

  const box=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:12px;border:1px solid #1e293b;margin-bottom:4px"});
  box.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:10px;letter-spacing:.5px"},title+(isAccum?" · 누적 (기존 보존)":"")));

  const pendingNew={};

  function buildField(key,labelText,labelColor,borderActive,borderIdle,placeholder){
    box.appendChild(h("div",{style:"font-size:11px;color:"+labelColor+";font-weight:700;margin-bottom:4px;margin-top:"+(key==="gratitude"?"4":"8")+"px"},labelText));
    if(isAccum){
      const prev=(rv[key]||"").trim();
      if(prev){
        box.appendChild(h("div",{style:"width:100%;padding:8px;border-radius:8px;border:1px solid #1e293b;background:#0a0e17;color:#94a3b8;font-size:11px;font-family:'Noto Sans KR',sans-serif;line-height:1.5;white-space:pre-wrap;max-height:200px;overflow-y:auto;margin-bottom:6px"},prev));
      }
      const ta=h("textarea",{style:"width:100%;padding:8px;border-radius:8px;border:1px solid "+borderIdle+";background:#111827;color:#e2e8f0;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;resize:none;line-height:1.5;min-height:52px",placeholder:"추가 입력... ("+placeholder+")"});
      ta.addEventListener("focus",function(){ta.style.borderColor=borderActive});
      ta.addEventListener("blur",function(){ta.style.borderColor=borderIdle});
      ta.addEventListener("input",function(e){pendingNew[key]=e.target.value;});
      box.appendChild(ta);
    }else{
      const ta=h("textarea",{style:"width:100%;padding:8px;border-radius:8px;border:1px solid "+borderIdle+";background:#111827;color:#e2e8f0;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;resize:none;line-height:1.5;min-height:52px",placeholder:placeholder});
      ta.value=rv[key]||"";
      ta.addEventListener("focus",function(){ta.style.borderColor=borderActive});
      ta.addEventListener("blur",function(){ta.style.borderColor=borderIdle});
      var timer=null;
      ta.addEventListener("input",function(e){
        rv[key]=e.target.value;
        clearTimeout(timer);
        timer=setTimeout(function(){try{localStorage.setItem(reviewKey,JSON.stringify(rv))}catch(ex){}cloudSaveReviews(yearFromReviewKey(reviewKey));},800);
      });
      box.appendChild(ta);
    }
  }

  buildField("gratitude","🙏 감사한 일","#22c55e","#22c55e","#14532d","오늘 감사한 일을 기록하세요...");
  buildField("best","🌟 잘 한 것","#94a3b8","#0d9488","#334155","가장 잘 된 일은?");
  buildField("missed","⚠️ 놓친 것","#94a3b8","#0d9488","#334155","아쉬웠거나 못 한 일은?");
  buildField("next",nextLabel,"#94a3b8","#0d9488","#334155",nextPlaceholder);
  buildField("note","📝 메모","#94a3b8","#0d9488","#334155","자유 기록...");

  const saveBtn=h("button",{style:"margin-top:10px;width:100%;padding:8px;border-radius:8px;background:#0d9488;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer",
    onClick:function(){
      if(isAccum){
        const ts=tsNow();
        var changed=false;
        Object.keys(pendingNew).forEach(function(k){
          const v=(pendingNew[k]||"").trim();
          if(v){
            rv[k]=(rv[k]?rv[k]+"\n\n":"")+"["+ts+"]\n"+v;
            changed=true;
          }
        });
        if(changed){
          try{localStorage.setItem(reviewKey,JSON.stringify(rv))}catch(e){}
          cloudSaveReviews(yearFromReviewKey(reviewKey));
        }
        saveBtn.textContent=changed?"✅ 추가됨":"–";
        setTimeout(function(){
          saveBtn.textContent="💾 저장";
          if(changed){_isAutoRender=true;render();}
        },1200);
      }else{
        try{localStorage.setItem(reviewKey,JSON.stringify(rv))}catch(e){}
        cloudSaveReviews(yearFromReviewKey(reviewKey));
        saveBtn.textContent="✅ 저장됨";
        setTimeout(function(){saveBtn.textContent="💾 저장"},1500);
      }
    }
  },"💾 저장");
  box.appendChild(saveBtn);
  return box;
}

var _entriesCache={};
function getEntriesForYear(y){
  if(y===state.year)return state.data.entries;

      row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:"+(cat?cat.color:"#94a3b8")+";font-family:monospace;flex-shrink:0;background:"+(cat?cat.color+"22":"#1e293b")+";border-radius:3px;padding:1px 5px"},g.cat));
      row.appendChild(h("span",{style:"flex:1;font-size:12px;color:"+(isDone?"#475569":"#cbd5e1")+(isDone?";text-decoration:line-through":"")},g.name));

  }
  wrap.appendChild(goalBox);

  // ── 메모 ──
  const diaryText=(state.data.entries[rdk]&&state.data.entries[rdk]._diary)||"";
  if(diaryText.trim()){

  // ── 일간 성찰 ──
  wrap.appendChild(renderReflectionBox("daily-review-"+ry+"-"+rm+"-"+rd,{title:"✍️ 오늘 성찰",next:"🎯 내일 한 가지",nextPh:"내일 반드시 할 것은?"}));

  return wrap;
}


function renderMonthlyReview(){
  const wrap=h("div",{});
  if(!state.dashMonth)state.dashMonth=new Date().getMonth()+1;

  // ── 월 네비게이션 ──
  var mbar=h("div",{style:"display:flex;gap:4px;padding:4px 0 12px;overflow-x:auto;scrollbar-width:none"});
  for(var m=1;m<=12;m++){
    (function(mm){mbar.appendChild(h("button",{
      style:"flex-shrink:0;padding:6px 10px;border-radius:8px;border:1px solid "+(mm===state.dashMonth?"#6366f1":"#1e293b")+";background:"+(mm===state.dashMonth?"#6366f1":"#111827")+";color:"+(mm===state.dashMonth?"#fff":"#64748b")+";font-size:12px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:600",
      onClick:function(){state.dashMonth=mm;_isAutoRender=true;render();}
    },mm+"월"));})(m);
  }
  wrap.appendChild(mbar);

  const cy=state.year,cm=state.dashMonth;

  // ── 1a. 월간 성장률 비교 (동월 YoY) + 변동성 비교 (trailing 3개월 CV YoY) ──
  const qtr=Math.ceil(cm/3);
  const qStartM=(qtr-1)*3+1;
  (function(){
    // 헬퍼
    function calcCV(values){
      var v=values.filter(function(x){return x>=0;});
      if(v.length<2)return null;
      var mean=v.reduce(function(s,x){return s+x;},0)/v.length;
      if(mean<0.05)return null;
      var variance=v.reduce(function(s,x){return s+(x-mean)*(x-mean);},0)/v.length;
      return Math.round(Math.sqrt(variance)/mean*100);
    }
    function fmtCV(c){return c==null?"–":c+"%";}
    function cvColor(c){if(c==null)return "#334155";if(c<=20)return "#10b981";if(c<=40)return "#f59e0b";return "#ef4444";}
    function fmtHday(v){return v>=0.05?v.toFixed(2)+"h":"–";}
    function fmtDiffPP(c, base){
      if(c==null||base==null)return{txt:"–",color:"#334155"};
      var d=c-base;
      var color=d<=-2?"#10b981":d>=2?"#ef4444":"#64748b";
      return{txt:(d>0?"+":"")+d+"%p",color:color};
    }
    function avgVals(arr){
      var v=arr.filter(function(x){return x!=null;});
      return v.length>0?v.reduce(function(s,x){return s+x;},0)/v.length:null;
    }
    function avgCVs(arr){
      var v=arr.filter(function(x){return x!=null;});
      return v.length>0?Math.round(v.reduce(function(s,x){return s+x;},0)/v.length):null;
    }

    // (year, month) → {rd, byG, tot} 캐시
    var monthCache={};
    function getMonth(year,month){
      var key=year+"-"+month;
      if(!monthCache[key]){
        var ent=getEntriesForYear(year);
        var rd=countRecordedDaysInMonth(ent,month);
        var entry={rd:rd, byG:{}, tot:null};
        if(rd>0){
          var mc=getCatHoursByMonth(ent,month);
          var totH=0;
          GROUPS.forEach(function(g){
            var s=groupCats(g).reduce(function(a,c){return a+(mc[c.code]||0);},0);
            entry.byG[g]=s/rd;
            totH+=s;
          });
          entry.tot=totH/rd;
        }
        monthCache[key]=entry;
      }
      return monthCache[key];
    }
    // 단일 월의 그룹 일평균 (없으면 null)
    function monAvgG(year,month,group){
      var m=getMonth(year,month);
      if(m.rd<=0)return null;
      return group==="_TOT_"?m.tot:m.byG[group];
    }
    // (year, month) 기준 trailing 3개월 CV — 해당 월부터 직전 2개월까지
    function trailing3CV(year, month, group){
      var arr=[];
      for(var i=2;i>=0;i--){
        var ty=year, tm=month-i;
        while(tm<=0){tm+=12;ty-=1;}
        var v=monAvgG(ty,tm,group);
        if(v!=null)arr.push(v);
      }
      return calcCV(arr);
    }

    // ── 데이터: 성장률 (동월 YoY) ──
    var cur={}, last={};
    GROUPS.forEach(function(g){
      cur[g]=monAvgG(cy,cm,g)||0;
      last[g]=monAvgG(cy-1,cm,g)||0;
    });
    var past5={}, past5N=0;
    GROUPS.forEach(function(g){past5[g]=0;});
    for(var py=cy-1;py>=cy-5;py--){
      if(getMonth(py,cm).rd>0){past5N++;GROUPS.forEach(function(g){past5[g]+=monAvgG(py,cm,g);});}
    }
    GROUPS.forEach(function(g){past5[g]=past5N>0?past5[g]/past5N:0;});

    // ── 표 1: 성장률 비교 ──
    var growSec=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:12px;margin-bottom:14px;border:1px solid #1e293b"});
    growSec.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:10px;letter-spacing:.5px"},"📈 성장률 비교 ("+cm+"월 일평균)"));
    var growGrid=h("div",{style:"display:grid;grid-template-columns:24px 1fr 1fr 1fr 1fr 1fr;gap:2px;font-family:'JetBrains Mono',monospace"});
    growGrid.appendChild(h("div",{},""));
    growGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#3b82f6;font-weight:700;padding-top:4px"},cm+"월"));
    growGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#94a3b8;font-weight:700;padding-top:4px"},"'"+String(cy-1).slice(2)+" "+cm+"월"));
    growGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#64748b;font-weight:700;padding-top:4px"},"vs작년"));
    growGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#0d9488;font-weight:700;padding-top:4px"},"5년평균"));
    growGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#0d9488;font-weight:700;padding-top:4px"},"vs5년"));
    var grandCur=0,grandLast=0,grandP5=0;
    GROUPS.forEach(function(g){
      var c=cur[g]||0,l=last[g]||0,p=past5[g]||0;
      grandCur+=c;grandLast+=l;grandP5+=p;
      var dL=fmtDiff(c,l), dP=fmtDiff(c,p);
      growGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:"+GC[g]+";font-weight:700;padding-top:6px"},g));
      growGrid.appendChild(h("div",{style:"text-align:center;font-size:11px;color:"+(c>=0.05?"#e2e8f0":"#334155")+";font-weight:700;padding:4px 0;background:"+(c>=0.05?GC[g]+"30":"transparent")+";border-radius:2px"},fmtHday(c)));
      growGrid.appendChild(h("div",{style:"text-align:center;font-size:11px;color:"+(l>=0.05?"#94a3b8":"#334155")+";font-weight:700;padding-top:6px"},fmtHday(l)));
      growGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:"+dL.color+";font-weight:700;padding-top:6px"},dL.txt));
      growGrid.appendChild(h("div",{style:"text-align:center;font-size:11px;color:"+(p>=0.05?"#0d9488":"#334155")+";font-weight:700;padding-top:6px"},fmtHday(p)));
      growGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:"+dP.color+";font-weight:700;padding-top:6px"},dP.txt));
    });
    var totDL=fmtDiff(grandCur,grandLast), totDP=fmtDiff(grandCur,grandP5);
    growGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#64748b;font-weight:700;border-top:1px solid #334155;padding-top:5px;margin-top:1px"},"합"));
    growGrid.appendChild(h("div",{style:"text-align:center;font-size:12px;color:#3b82f6;font-weight:900;border-top:1px solid #334155;padding-top:5px;margin-top:1px"},fmtHday(grandCur)));
    growGrid.appendChild(h("div",{style:"text-align:center;font-size:12px;color:#94a3b8;font-weight:900;border-top:1px solid #334155;padding-top:5px;margin-top:1px"},fmtHday(grandLast)));
    growGrid.appendChild(h("div",{style:"text-align:center;font-size:11px;color:"+totDL.color+";font-weight:900;border-top:1px solid #334155;padding-top:5px;margin-top:1px"},totDL.txt));
    growGrid.appendChild(h("div",{style:"text-align:center;font-size:12px;color:#0d9488;font-weight:900;border-top:1px solid #334155;padding-top:5px;margin-top:1px"},fmtHday(grandP5)));
    growGrid.appendChild(h("div",{style:"text-align:center;font-size:11px;color:"+totDP.color+";font-weight:900;border-top:1px solid #334155;padding-top:5px;margin-top:1px"},totDP.txt));
    growSec.appendChild(growGrid);
    growSec.appendChild(h("div",{style:"font-size:8px;color:#475569;margin-top:8px;text-align:right;line-height:1.4"},"일평균 (h/일) · 분모="+cm+"월 기록일수 · 5년평균=직전5년("+(cy-5)+"~"+(cy-1)+") "+cm+"월 "+past5N+"개년 평균"));
    wrap.appendChild(growSec);

    // ── 데이터: 변동성 (trailing 3개월 CV YoY) ──
    var cvCurG={}, cvHistG={}, cvPast5G={};
    GROUPS.forEach(function(g){
      cvCurG[g]=trailing3CV(cy,cm,g);
      cvHistG[g]={};
      var arr=[];
      for(var hy=cy-5;hy<=cy-1;hy++){
        var v=trailing3CV(hy,cm,g);
        cvHistG[g][hy]=v;
        if(v!=null)arr.push(v);
      }
      cvPast5G[g]=avgCVs(arr);
    });
    var cvCurTot=trailing3CV(cy,cm,"_TOT_");
    var cvHistTot={}, cvPast5TotArr=[];
    for(var hy2=cy-5;hy2<=cy-1;hy2++){
      cvHistTot[hy2]=trailing3CV(hy2,cm,"_TOT_");
      if(cvHistTot[hy2]!=null)cvPast5TotArr.push(cvHistTot[hy2]);
    }
    var cvPast5Tot=avgCVs(cvPast5TotArr);

    // ── 표 2: 변동성 비교 (trailing 3개월 CV YoY) ──
    var cvSec=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:12px;margin-bottom:14px;border:1px solid #1e293b"});
    cvSec.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:10px;letter-spacing:.5px"},"📊 변동성 비교 (trailing 3개월 CV %, ↓안정)"));
    var cvGrid=h("div",{style:"display:grid;grid-template-columns:22px repeat(5,1fr) 1.1fr 1.1fr 1fr;gap:2px;font-family:'JetBrains Mono',monospace"});
    cvGrid.appendChild(h("div",{},""));
    // 두 줄 헤더 빌더 — 위: 라벨, 아래: trailing 월 범위
    function trailingRangeStr(month){
      var startM=month-2;
      while(startM<=0)startM+=12;
      return startM+"~"+month+"월";
    }
    function twoLineHdr(top,topColor,bottom){
      var c=h("div",{style:"text-align:center;padding-top:2px"});
      c.appendChild(h("div",{style:"font-size:10px;color:"+topColor+";font-weight:700;line-height:1.1"},top));
      c.appendChild(h("div",{style:"font-size:8px;color:#475569;font-weight:600;line-height:1.1;margin-top:1px"},bottom));
      return c;
    }
    var histYears=[];
    for(var hy3=cy-5;hy3<=cy-1;hy3++)histYears.push(hy3);
    var rangeStr=trailingRangeStr(cm);
    histYears.forEach(function(y){
      cvGrid.appendChild(twoLineHdr("'"+String(y).slice(2),"#94a3b8",rangeStr));
    });
    cvGrid.appendChild(twoLineHdr("이번","#3b82f6",cy+"·"+rangeStr.replace("월","")));
    cvGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#0d9488;font-weight:700;padding-top:4px"},"5년평균"));
    cvGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#64748b;font-weight:700;padding-top:4px"},"차이"));
    GROUPS.forEach(function(g){
      var diff=fmtDiffPP(cvCurG[g],cvPast5G[g]);
      cvGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:"+GC[g]+";font-weight:700;padding-top:6px"},g));
      histYears.forEach(function(y){
        var v=cvHistG[g][y];
        cvGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:"+cvColor(v)+";font-weight:700;padding:4px 0"},fmtCV(v)));
      });
      cvGrid.appendChild(h("div",{style:"text-align:center;font-size:11px;color:"+cvColor(cvCurG[g])+";font-weight:700;padding:4px 0;background:"+(cvCurG[g]!=null?GC[g]+"30":"transparent")+";border-radius:2px"},fmtCV(cvCurG[g])));
      cvGrid.appendChild(h("div",{style:"text-align:center;font-size:11px;color:"+cvColor(cvPast5G[g])+";font-weight:700;padding:4px 0"},fmtCV(cvPast5G[g])));
      cvGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:"+diff.color+";font-weight:700;padding:4px 0"},diff.txt));
    });
    var totDiff=fmtDiffPP(cvCurTot,cvPast5Tot);
    cvGrid.appendChild(h("div",{style:"text-align:center;font-size:10px;color:#64748b;font-weight:700;border-top:1px solid #334155;padding-top:5px;margin-top:1px"},"합"));
    histYears.forEach(function(y){
      var v=cvHistTot[y];
      cvGrid.appendChild(h("div",{style:"text-align:center;font-size:11px;color:"+cvColor(v)+";font-weight:900;border-top:1px solid #334155;padding-top:5px;margin-top:1px"},fmtCV(v)));
    });
    cvGrid.appendChild(h("div",{style:"text-align:center;font-size:12px;color:"+cvColor(cvCurTot)+";font-weight:900;border-top:1px solid #334155;padding-top:5px;margin-top:1px"},fmtCV(cvCurTot)));
    cvGrid.appendChild(h("div",{style:"text-align:center;font-size:12px;color:"+cvColor(cvPast5Tot)+";font-weight:900;border-top:1px solid #334155;padding-top:5px;margin-top:1px"},fmtCV(cvPast5Tot)));
    cvGrid.appendChild(h("div",{style:"text-align:center;font-size:11px;color:"+totDiff.color+";font-weight:900;border-top:1px solid #334155;padding-top:5px;margin-top:1px"},totDiff.txt));
    cvSec.appendChild(cvGrid);
    cvSec.appendChild(h("div",{style:"font-size:8px;color:#475569;margin-top:8px;text-align:right;line-height:1.4"},"각 셀 = 해당 연도 "+cm+"월 포함 직전 3개월의 월간 일평균 σ/μ · 5년평균=직전5년("+(cy-5)+"~"+(cy-1)+") trailing CV들의 평균 · 차이=이번−5년평균 (음수=개선) · ≤20% 안정"));
    wrap.appendChild(cvSec);
  })();
  // ── 1b. 연간 추이 차트 (1~12월 라인) — DREAM 5그룹 + 각 그룹 세부 ──
  var lineSec=h("div",{className:"chart-container"});
  lineSec.appendChild(h("h3",{className:"chart-title"},"📈 DREAM 월간 일평균 추이 (h/일)"));
  var lineWrap=h("div",{className:"chart-wrap"});
  lineWrap.appendChild(h("canvas",{id:"lineChart"}));
  lineSec.appendChild(lineWrap);
  wrap.appendChild(lineSec);

  ["D","R","E","A","M"].forEach(function(gK){
    const sec=h("div",{className:"chart-container"});
    sec.appendChild(h("h3",{className:"chart-title"},"📈 "+gK+" 세부 추이 (h/일)"));
    const wr=h("div",{className:"chart-wrap"});
    wr.appendChild(h("canvas",{id:gK.toLowerCase()+"Chart"}));
    sec.appendChild(wr);
    wrap.appendChild(sec);
  });

  // ── 2. 월간 습관 달성률 (분기 3개월 + 전분기 + 올해 + 3년) ──
  (function(){
    const habits=state.goalData.habits||[];
    if(habits.length===0)return;
    const qMonths=[qStartM,qStartM+1,qStartM+2];
    const prevQ=qtr===1?4:qtr-1;
    const prevQY=qtr===1?cy-1:cy;
    const prevQStart=(prevQ-1)*3+1;

    const habBox=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:12px;margin-bottom:14px;border:1px solid #1e293b"});
    habBox.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:8px;letter-spacing:.5px"},"🔁 월간 습관 달성률 ("+qtr+"분기)"));

    const hdrRow=h("div",{style:"display:grid;grid-template-columns:1fr repeat(3,38px) 36px 36px 36px;gap:4px;align-items:center;margin-bottom:4px"});

    hdrRow.appendChild(h("div",{style:"text-align:center;font-size:9px;color:#0d9488;font-weight:700"},"올해"));
    hdrRow.appendChild(h("div",{style:"text-align:center;font-size:9px;color:#a855f7;font-weight:700"},"5년"));
    habBox.appendChild(hdrRow);

    // 올해 입력일 기준 분모 — 현재 연도 entries 캐시
    const cyEntCache=getEntriesForYear(cy);

    habits.forEach(function(hb){
      const cat=catByCode(hb.cat);
      const hrow=h("div",{style:"display:grid;grid-template-columns:1fr repeat(3,38px) 36px 36px 36px;gap:4px;align-items:center;padding:5px 0;border-top:1px solid #1e293b"});
      const nameCell=h("div",{style:"display:flex;align-items:center;gap:4px;overflow:hidden;min-width:0;cursor:pointer",

      // 5년 — 직전 5년 (cy-5 ~ cy-1) 월별 % 평균

  // ── 3. 독서 (12개월 × EN/KR/합 표 + 이번달 책 제목) ──

      });

  })();

  // ── 4a. 금월 목표 (진행/완료) ──
  var mGoalsBox=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:12px;margin-bottom:12px;border:1px solid #1e293b"});
  mGoalsBox.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:10px;letter-spacing:.5px"},"📋 금월 목표"));
  var mGoalsList=(state.goalData.monthly||[]).filter(function(g){
    if(g.year!==cy)return false;var sm=g.startMonth||g.month;var em=g.endMonth||g.month;return sm<=cm&&cm<=em;
  });
  if(mGoalsList.length===0){mGoalsBox.appendChild(h("div",{style:"text-align:center;padding:10px 0;color:#334155;font-size:12px"},"이번 달 목표가 없습니다"));}
  else{
    [mGoalsList.filter(function(g){return(g.progress||0)<100;}),mGoalsList.filter(function(g){return(g.progress||0)>=100;})].forEach(function(list,idx){
      if(idx===1&&list.length>0)mGoalsBox.appendChild(h("div",{style:"font-size:9px;color:#064e3b;margin:8px 0 4px;font-weight:700"},"✅ 완료 ("+list.length+")"));

        row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:"+(cat?cat.color:"#94a3b8")+";font-family:monospace;flex-shrink:0;background:"+(cat?cat.color+"22":"#1e293b")+";border-radius:3px;padding:1px 5px"},g.cat));

  // ── 4b. 다음달 목표 (월간만) ──

    nextMth.forEach(function(g){
      const cat=catByCode(g.cat);
      const isDone=(g.progress||0)>=100;
      const row=h("div",{style:"display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #0f172a;cursor:pointer",onClick:function(){navigateToGoal("monthly",g);}});
      row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:"+(cat?cat.color:"#94a3b8")+";font-family:monospace;flex-shrink:0;background:"+(cat?cat.color+"22":"#1e293b")+";border-radius:3px;padding:1px 5px"},g.cat));
      row.appendChild(h("span",{style:"flex:1;font-size:12px;color:"+(isDone?"#475569":"#cbd5e1")+(isDone?";text-decoration:line-through":"")},g.name));
      row.appendChild(h("span",{style:"font-size:9px;color:#a855f7;font-family:monospace;font-weight:700;flex-shrink:0"},(g.progress||0)+"%"));
      row.appendChild(h("span",{style:"font-size:9px;color:#a855f7;flex-shrink:0"},"↗"));
      nxBox.appendChild(row);

    wrap.appendChild(nxBox);
  })();

  // ── 5. 월간 성찰 ──
  wrap.appendChild(renderReflectionBox("monthly-review-"+cy+"-"+cm,{title:"✍️ 월간 성찰",next:"🎯 다음 달 한 가지",nextPh:"다음 달에 반드시 할 것은?"}));
  setTimeout(function(){renderCharts(yearSummary());},0);
  return wrap;
}


function renderYearlyReview(){
  const wrap=h("div",{});
  var ys=yearSummary();
  var cy=state.year;

  // ── 1a. 성장률 비교 + 변동성 비교 (두 표) ──
  (function(){
    // 6년치 그룹별 일평균 캐시 (cy ~ cy-5)
    function getYearGroupAvgs(y){
      var ent=getEntriesForYear(y);
      var rd=countRecordedDaysInYear(y);
      var byG={};GROUPS.forEach(function(g){byG[g]=0;});
      for(var mi=1;mi<=12;mi++){
        var mo=getCatHoursByMonth(ent,mi);
        CATEGORIES.forEach(function(c){byG[c.group]+=(mo[c.code]||0);});
      }
      var avg={};GROUPS.forEach(function(g){avg[g]=rd>0?byG[g]/rd:0;});
      return {avg:avg,rd:rd,ent:ent};
    }
    var ydata={};
    for(var iy=cy;iy>=cy-5;iy--)ydata[iy]=getYearGroupAvgs(iy);
    var cur=ydata[cy].avg, last=ydata[cy-1].avg;

    // 직전 5년 평균 (cy-1 ~ cy-5, 데이터 있는 연도만 동등 평균)
    var past5={}, past5N=0;
    GROUPS.forEach(function(g){past5[g]=0;});
    for(var iy2=cy-1;iy2>=cy-5;iy2--){
      if(ydata[iy2].rd>0){past5N++;GROUPS.forEach(function(g){past5[g]+=ydata[iy2].avg[g];});}
    }
    GROUPS.forEach(function(g){past5[g]=past5N>0?past5[g]/past5N:0;});

    function calcCV(values){
      var v=values.filter(function(x){return x>=0;});
      if(v.length<2)return null;
      var mean=v.reduce(function(s,x){return s+x;},0)/v.length;
      if(mean<0.05)return null;
      var variance=v.reduce(function(s,x){return s+(x-mean)*(x-mean);},0)/v.length;
      return Math.round(Math.sqrt(variance)/mean*100);
    }
    function fmtCV(c){return c==null?"–":c+"%";}
    function cvColor(c){if(c==null)return "#334155";if(c<=20)return "#10b981";if(c<=40)return "#f59e0b";return "#ef4444";}
    function fmtHday(v){return v>=0.05?v.toFixed(2)+"h":"–";}
    // CV 차이 (%p) — 음수=개선(낮을수록 안정), 양수=악화
    function fmtDiffPP(c, base){
      if(c==null||base==null)return{txt:"–",color:"#334155"};
      var d=c-base;
      var color=d<=-2?"#10b981":d>=2?"#ef4444":"#64748b";
      return{txt:(d>0?"+":"")+d+"%p",color:color};
    }

    // 각 해(cy ~ cy-5)의 연도내 CV — 그룹별 + 합계
    var yearInYrCV={};
    for(var py=cy;py>=cy-5;py--){
      if(!ydata[py])continue;
      var pent=ydata[py].ent;
      var pMonG={};GROUPS.forEach(function(g){pMonG[g]=[];});
      var pMonT=[];
      for(var pm=1;pm<=12;pm++){
        var pmrd=countRecordedDaysInMonth(pent,pm);
        if(pmrd<=0)continue;
        var pmc=getCatHoursByMonth(pent,pm);
        var pts=0;
        GROUPS.forEach(function(g){
          var s=groupCats(g).reduce(function(a,c){return a+(pmc[c.code]||0);},0);
          pMonG[g].push(s/pmrd);
          pts+=s;
        });
        pMonT.push(pts/pmrd);
      }
      var entry={tot:calcCV(pMonT)};
      GROUPS.forEach(function(g){entry[g]=calcCV(pMonG[g]);});
      yearInYrCV[py]=entry;
    }
    // 직전 5년 평균 (cy-1 ~ cy-5, null 제외)
    function avgCVs(arr){
      var v=arr.filter(function(x){return x!=null;});
      return v.length>0?Math.round(v.reduce(function(s,x){return s+x;},0)/v.length):null;
    }
    var past5AvgG={};
    GROUPS.forEach(function(g){
      var arr=[];
      for(var py2=cy-1;py2>=cy-5;py2--){if(yearInYrCV[py2])arr.push(yearInYrCV[py2][g]);}
      past5AvgG[g]=avgCVs(arr);
    });
    var past5AvgTotArr=[];
    for(var py3=cy-1;py3>=cy-5;py3--){if(yearInYrCV[py3])past5AvgTotArr.push(yearInYrCV[py3].tot);}
    var past5AvgTot=avgCVs(past5AvgTotArr);

    // ── 시뮬레이션 모집단: 2019~cy-1 중 연 기록률 ≥70%인 해 (cy 제외) ──
    var simPoolYears=[];
    for(var psy=2019;psy<=cy-1;psy++){
      var psyRD=countRecordedDaysInYear(psy);
      var psyTotal=((psy%4===0&&psy%100!==0)||psy%400===0)?366:365;
      if(psyRD/psyTotal>=0.7)simPoolYears.push(psy);
    }
    function buildSimPool(group){
      var pool=[];
      simPoolYears.forEach(function(sy){
        var sent=getEntriesForYear(sy);
        for(var sm=1;sm<=12;sm++){
          var srd=countRecordedDaysInMonth(sent,sm);
          if(srd<=0)continue;
          var smc=getCatHoursByMonth(sent,sm);
          var s=group==="_TOT_"
            ? CATEGORIES.reduce(function(a,c){return a+(smc[c.code]||0);},0)
            : groupCats(group).reduce(function(a,c){return a+(smc[c.code]||0);},0);
          pool.push(s/srd);
        }
      });
      return pool;
    }
    function makeRng(seed){
      return function(){
        seed|=0; seed=seed+0x6D2B79F5|0;
        var t=Math.imul(seed^seed>>>15, 1|seed);
        t=t+Math.imul(t^t>>>7, 61|t)^t;
        return((t^t>>>14)>>>0)/4294967296;
      };
    }
    function bootstrap(pool, runs){
      if(pool.length<6)return null;
      var rng=makeRng(42);
      var means=[], cvs=[];
      for(var bi=0;bi<runs;bi++){
        var sumX=0, sumX2=0;
        for(var bk=0;bk<12;bk++){
          var bv=pool[Math.floor(rng()*pool.length)];
          sumX+=bv; sumX2+=bv*bv;
        }
        var bmean=sumX/12;
        var bvar=sumX2/12-bmean*bmean;
        if(bvar<0)bvar=0;
        means.push(bmean);
        if(bmean>0.05)cvs.push(Math.round(Math.sqrt(bvar)/bmean*100));
      }
      function pct(arr,p){
        var a=arr.slice().sort(function(x,y){return x-y;});
        return a[Math.min(Math.floor(a.length*p),a.length-1)];
      }
      return {
        p25_mean:+pct(means,0.25).toFixed(2),
        p50_mean:+pct(means,0.50).toFixed(2),
        p75_mean:+pct(means,0.75).toFixed(2),
        p25_cv:cvs.length>0?pct(cvs,0.25):null,
        p50_cv:cvs.length>0?pct(cvs,0.50):null,
        p75_cv:cvs.length>0?pct(cvs,0.75):null
      };
    }
    var simResults={};
    GROUPS.forEach(function(g){simResults[g]=bootstrap(buildSimPool(g),1000);});
    simResults._TOT_=bootstrap(buildSimPool("_TOT_"),1000);
    // M은 방향 반전 (낮을수록 좋음)
    function meanTarget(g){var s=simResults[g];if(!s)return null;return g==="M"?s.p25_mean:s.p75_mean;}
    function meanAchieved(g,cur){var t=meanTarget(g);if(t==null||cur==null)return null;return g==="M"?cur<=t:cur>=t;}
    function meanTargetTot(){var s=simResults._TOT_;return s?s.p75_mean:null;}
    function meanAchievedTot(cur){var t=meanTargetTot();if(t==null||cur==null)return null;return cur>=t;}
    function cvTarget(g){var s=simResults[g];return s?s.p25_cv:null;}
    function cvAchieved(g,cur){var t=cvTarget(g);if(t==null||cur==null)return null;return cur<=t;}
    function cvTargetTot(){var s=simResults._TOT_;return s?s.p25_cv:null;}
    function cvAchievedTot(cur){var t=cvTargetTot();if(t==null||cur==null)return null;return cur<=t;}
    // 목표 셀 빌더 — target 값 + (보조 %/%p) inline, 달성 시 ✓ + 녹색
    function growthTargetCell(target, curVal, achieved, isTotal){
      var c=h("div",{style:"text-align:center;"+(isTotal?"border-top:1px solid #334155;padding:6px 0 2px;margin-top:1px;":"padding:5px 0;")});
      if(target==null){c.appendChild(h("div",{style:"font-size:13px;color:#475569"},"—"));return c;}
      var ach=achieved===true;
      c.style.background=ach?"#10b98122":"transparent";
      c.style.borderRadius="2px";
      var color=ach?"#10b981":"#a855f7";
      var pct=curVal>0.01?Math.round((target-curVal)/curVal*100):null;
      var pctStr=pct==null?"":" ("+(pct>0?"+":"")+pct+"%)";
      var checkStr=ach?" ✓":"";
      c.appendChild(h("div",{style:"font-size:"+(isTotal?"14":"13")+"px;color:"+color+";font-weight:"+(isTotal?"900":"700")+";line-height:1.2"},fmtHday(target)+pctStr+checkStr));
      return c;
    }
    function cvTargetCell(target, curVal, achieved, isTotal){
      var c=h("div",{style:"text-align:center;"+(isTotal?"border-top:1px solid #334155;padding:6px 0 2px;margin-top:1px;":"padding:5px 0;")});
      if(target==null){c.appendChild(h("div",{style:"font-size:13px;color:#475569"},"—"));return c;}
      var ach=achieved===true;
      c.style.background=ach?"#10b98122":"transparent";
      c.style.borderRadius="2px";
      var color=ach?"#10b981":"#a855f7";
      var diffP=curVal!=null?(curVal-target):null;
      var diffStr=diffP==null?"":" ("+(diffP>0?"+":"")+diffP+"%p)";
      var checkStr=ach?" ✓":"";
      c.appendChild(h("div",{style:"font-size:"+(isTotal?"14":"13")+"px;color:"+color+";font-weight:"+(isTotal?"900":"700")+";line-height:1.2"},fmtCV(target)+diffStr+checkStr));
      return c;
    }

      // 이름 (클릭 → navigate)
      var nameEl=h("span",{style:"flex:1;color:#94a3b8;text-decoration:line-through;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer",onClick:function(){navigateToGoal(scope,g);}},g.name);
      row.appendChild(nameEl);
      // 총시간 + 직접시간
      var tot=0,dir=0;try{tot=calcGoalTotalHours(g.id);dir=calcGoalDirectHours(g.id);}catch(e){}
      if(tot>0){
        if(tot===dir){
          row.appendChild(h("span",{style:"font-size:12px;color:#fbbf24;font-family:monospace;font-weight:700;flex-shrink:0"},fmtHours(tot)));
        }else{
          var tw=h("span",{style:"display:flex;align-items:baseline;gap:3px;flex-shrink:0"});
          tw.appendChild(h("span",{style:"font-size:12px;color:#fbbf24;font-family:monospace;font-weight:700"},fmtHours(tot)));
          tw.appendChild(h("span",{style:"font-size:10px;color:#f59e0b"},"직"+fmtHours(dir)));
          row.appendChild(tw);
        }
      }
      // 기간 + 소요일수
      var startStr=inferStart(g,scope);
      var endStr=g.completedAt||"";
      if(startStr&&endStr){
        var period=startStr.slice(5).replace(/-/g,".")+"~"+endStr.slice(5).replace(/-/g,".");
        row.appendChild(h("span",{style:"font-size:11px;color:#94a3b8;font-family:monospace;flex-shrink:0"},period));
        var dd=daysDiff(startStr,endStr);
        if(dd!==null)row.appendChild(h("span",{style:"font-size:11px;color:#34d399;font-family:monospace;font-weight:700;flex-shrink:0"},dd+"일"));
      }else if(endStr){
        row.appendChild(h("span",{style:"font-size:11px;color:#94a3b8;font-family:monospace;flex-shrink:0"},"완료 "+endStr.slice(5).replace(/-/g,".")));
      }else{
        row.appendChild(h("span",{style:"font-size:11px;color:#64748b;font-family:monospace;flex-shrink:0"},"완료일 미상"));
      }
      // 완료 취소 버튼
      row.appendChild(h("button",{
        style:"padding:3px 7px;border-radius:4px;border:1px solid #065f46;background:transparent;color:#34d399;font-size:10px;cursor:pointer;flex-shrink:0",
        title:"완료 취소",
        onClick:function(e){e.stopPropagation();undoComplete(g,scope);}
      },"↩ 취소"));
      return row;
    }

    // 장기 정렬: 완료일 내림차순 (미상은 뒤)
    doneLong.sort(function(a,b){
      var ca=a.completedAt||"",cb=b.completedAt||"";
      if(!ca&&!cb)return 0;if(!ca)return 1;if(!cb)return -1;
      return ca<cb?1:-1;
    });
    doneMonth.sort(function(a,b){
      var ca=a.completedAt||"",cb=b.completedAt||"";
      if(!ca&&!cb)return 0;if(!ca)return 1;if(!cb)return -1;
      return ca<cb?1:-1;
    });

    // 트리 구조: 장기 먼저 (자식 월간 중첩), 고아 월간 마지막
    var usedMonth=new Set();
    doneLong.forEach(function(lt){
      doneBox.appendChild(renderCompletedRow(lt,"longterm",0));
      doneMonth.forEach(function(mg){
        var pids=getParentIds(mg);
        if(Object.values(pids).indexOf(lt.id)>=0){
          usedMonth.add(mg.id);
          doneBox.appendChild(renderCompletedRow(mg,"monthly",16));
        }
      });
    });
    // 장기 부모 없는(orphan) 월간
    var orphanMonth=doneMonth.filter(function(mg){return!usedMonth.has(mg.id);});
    if(orphanMonth.length>0&&doneLong.length>0){
      doneBox.appendChild(h("div",{style:"font-size:11px;color:#0d9488;font-weight:700;margin:8px 0 4px;padding:4px 0;border-top:1px dashed #1e293b"},"📅 독립 월간"));
    }
    orphanMonth.forEach(function(mg){
      doneBox.appendChild(renderCompletedRow(mg,"monthly",0));
    });

    wrap.appendChild(doneBox);
  })();

  // ── 목표별 투입시간 트리 ──
  var goalSec=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:12px;margin-bottom:16px;border:1px solid #1e293b"});
  goalSec.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:10px;letter-spacing:.5px"},"🎯 목표별 투입시간"));
  function renderGoalTree(goalId,scope,name,cat,depth,visited){
    if(!visited)visited={};if(visited[goalId])return null;visited[goalId]=true;
    // 완료 상태 판정 (숨김 대신 표시 분기용)
    var _gr=findGoalById(goalId);
    var isCompleted=false;
    if(_gr&&_gr.goal){
      isCompleted=_gr.goal.done===true||(scope!=="readingGoals"&&(_gr.goal.progress||0)>=100);
    }
    var totalHrs=calcGoalTotalHours(goalId);var directHrs=calcGoalDirectHours(goalId);
    if(totalHrs===0)return null;
    var catObj=catByCode(cat);var indent=depth*14;
    var node=h("div",{style:"border-bottom:1px solid #0f172a"});
    var row=h("div",{style:"display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:12px;padding-left:"+(8+indent)+"px;cursor:pointer;transition:background .15s;"+(isCompleted?"opacity:.7":""),onClick:function(){var found=findGoalById(goalId);if(found)navigateToGoal(found.scope,found.goal);}});
    row.addEventListener("mouseenter",function(){row.style.background="#ffffff08";});row.addEventListener("mouseleave",function(){row.style.background="transparent";});
    if(depth>0)row.appendChild(h("span",{style:"font-size:9px;color:#334155;flex-shrink:0"},"└"));
    row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:"+(catObj?catObj.color:"#94a3b8")+";font-family:monospace;flex-shrink:0"},cat));
    if(isCompleted){
      row.appendChild(h("span",{style:"font-size:10px;color:#10b981;flex-shrink:0",title:"완료"+(_gr&&_gr.goal&&_gr.goal.completedAt?" "+_gr.goal.completedAt:"")},"✓"));
    }
    row.appendChild(h("span",{style:"flex:1;color:"+(isCompleted?"#64748b":(depth===0?"#e2e8f0":"#94a3b8"))+";overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:"+(depth===0?"600":"400")+(isCompleted?";text-decoration:line-through":"")},name));
    var barW=Math.max(2,Math.min(Math.round(totalHrs/200*60),60));
    var track2=h("div",{style:"width:60px;height:6px;background:#1e293b;border-radius:3px;overflow:hidden;flex-shrink:0"});
    track2.appendChild(h("div",{style:"height:100%;width:"+barW+"px;background:#f59e0b;border-radius:3px"}));
    row.appendChild(track2);
    if(totalHrs===directHrs){row.appendChild(h("span",{style:"font-size:11px;color:#f59e0b;font-family:monospace;font-weight:700;width:52px;text-align:right;flex-shrink:0"},fmtHours(totalHrs)));}
    else{var txt=h("div",{style:"display:flex;flex-direction:column;align-items:flex-end;width:52px;flex-shrink:0"});txt.appendChild(h("span",{style:"font-size:11px;color:#f59e0b;font-family:monospace;font-weight:700"},fmtHours(totalHrs)));txt.appendChild(h("span",{style:"font-size:9px;color:#78350f;font-family:monospace"},"직"+fmtHours(directHrs)));row.appendChild(txt);}
    node.appendChild(row);
    // 월간/장기만 트리에 포함 (일간/주간/습관/독서는 시간 합산은 되지만 개별 행 표시 안 함)
    getChildGoals(goalId).forEach(function(ch){
      if(ch.scope!=="longterm"&&ch.scope!=="monthly")return;
      var child=renderGoalTree(ch.goal.id,ch.scope,ch.goal.name,ch.goal.cat,depth+1,visited);
      if(child)node.appendChild(child);
    });
    return node;
  }
  var hasAny=false;var allRoots=[];
  ["longterm","monthly"].forEach(function(sc){
    var list=state.goalData[sc]||[];
    list.forEach(function(g){if(Object.keys(getParentIds(g)).length>0)return;allRoots.push({g:g,sc:sc});});
  });
  allRoots.sort(function(a,b){return dreamSortKey(a.g.cat)-dreamSortKey(b.g.cat);});
  allRoots.forEach(function(item){var node=renderGoalTree(item.g.id,item.sc,item.g.name,item.g.cat,0,null);if(node){hasAny=true;goalSec.appendChild(node);}});
  if(!hasAny)goalSec.appendChild(h("div",{style:"text-align:center;padding:20px;color:#475569;font-size:12px"},"목표에 시간을 연결하면 여기에 트리가 표시됩니다"));
  wrap.appendChild(goalSec);

  // ── 연간 성찰 ──
  wrap.appendChild(renderReflectionBox("yearly-review-"+cy,{title:"✍️ 연간 성찰",next:"🎯 내년 한 가지",nextPh:"내년에 반드시 할 것은?"}));
  setTimeout(renderYearlyCharts,0);
  return wrap;
}



function renderDashboard(){return renderReview();}  // 하위 호환용

let lineChartInst=null,barChartInst=null,dashDailyChartInst=null;
let yearlyDreamChartInst=null,yearlyDChartInst=null,yearlyRChartInst=null,yearlyEChartInst=null,yearlyAChartInst=null,yearlyMChartInst=null,yearlyBookChartInst=null,yearlyCoverageChartInst=null;
let monthlyBookChartInst=null;

// ── 연간 추이 차트 (연간 리뷰 탭) ─────────────────────────
// Window: cy-6..cy (7 years). Shows daily-avg hours per DREAM group.
function renderYearlyCharts(){
  if(typeof Chart==='undefined')return;
  try{
    [yearlyDreamChartInst,yearlyDChartInst,yearlyRChartInst,yearlyEChartInst,yearlyAChartInst,yearlyMChartInst,yearlyBookChartInst,yearlyCoverageChartInst].forEach(function(ci){try{if(ci)ci.destroy()}catch(e){}});
    yearlyDreamChartInst=yearlyDChartInst=yearlyRChartInst=yearlyEChartInst=yearlyAChartInst=yearlyMChartInst=yearlyBookChartInst=yearlyCoverageChartInst=null;
    var cy=state.year;
    // 2019(시간통계 시작)부터 선택 연도까지. 미래 연도라도 전 구간 표시.
    var startY=2019;
    var endY=Math.max(startY,cy);
    var years=[];for(var yy=startY;yy<=endY;yy++)years.push(yy);
    var labels=years.map(function(y){return y+"년"});
    function yearTotals(y){
      var ent=getEntriesForYear(y);
      var r={};CATEGORIES.forEach(function(c){r[c.code]=0});
      for(var m=1;m<=12;m++){var mo=getCatHoursByMonth(ent,m);CATEGORIES.forEach(function(c){r[c.code]+=(mo[c.code]||0)});}
      return r;
    }
    function daysIn(y){return((y%4===0&&y%100!==0)||y%400===0)?366:365}
    // 연도별 카테고리별 총시간 테이블
    var tots=years.map(yearTotals);
    // 연도별 기록일수 (일평균 분모) — 진행 중인 해는 기록된 날만 집계됨
    var recDays=years.map(function(y){return countRecordedDaysInYear(y);});

    // 공통 데이터 라벨 플러그인 (line chart)
    var dlPlugin={id:'yearlyDataLabels',afterDatasetsDraw:function(chart){
      var ctx=chart.ctx;
      chart.data.datasets.forEach(function(ds,i){
        var meta=chart.getDatasetMeta(i);
        if(meta.hidden)return;
        meta.data.forEach(function(el,idx){
          var val=ds.data[idx];
          if(val>0){
            ctx.fillStyle=ds.borderColor||'#94a3b8';
            ctx.font='bold 10px JetBrains Mono,monospace';
            ctx.textAlign='center';
            ctx.fillText(val,el.x,el.y-8);
          }
        });
      });
    }};

    // 1) DREAM 그룹 일평균 (D/R/E/A/M) — 분모는 기록일수
    (function(){
      var cv=document.getElementById("yearlyDreamChart");
      if(!cv)return;
      var datasets=GROUPS.map(function(g){
        var data=tots.map(function(t,i){
          var sum=groupCats(g).reduce(function(s,c){return s+(t[c.code]||0)},0);
          var rd=recDays[i];
          return(sum>0&&rd>0)?+(sum/rd).toFixed(2):0;
        });
        return{label:g,data:data,borderColor:GC[g],backgroundColor:GC[g]+"30",borderWidth:2.5,pointRadius:4,pointBackgroundColor:GC[g],tension:0.3,fill:false};
      });
      yearlyDreamChartInst=new Chart(cv,{type:"line",plugins:[dlPlugin],
        data:{labels:labels,datasets:datasets},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{labels:{color:"#94a3b8",font:{size:11,family:"'JetBrains Mono',monospace"},boxWidth:12,padding:10}},
            tooltip:{backgroundColor:"#1e293b",titleColor:"#e2e8f0",bodyColor:"#cbd5e1",borderColor:"#334155",borderWidth:1,
              callbacks:{label:function(ctx){return ctx.dataset.label+": "+ctx.parsed.y+"h/일"}}}},
          scales:{x:{ticks:{color:"#64748b",font:{size:10}},grid:{color:"#1e293b"}},
                  y:{beginAtZero:true,ticks:{color:"#64748b",font:{size:10},callback:function(v){return v+"h"}},grid:{color:"#1e293b"}}}}});
    })();

    // 2) 세부 카테고리 비교 (D1/D2/D3 등) — 점 모양으로 시각 구분
    var SUB_PT=['circle','rectRot','triangle'];
    function renderSubChart(canvasId,groupCode,instSetter){
      var cv=document.getElementById(canvasId);if(!cv)return null;
      var cats=groupCats(groupCode);
      var datasets=cats.map(function(c,i){
        var data=tots.map(function(t,j){var rd=recDays[j];return(t[c.code]>0&&rd>0)?+(t[c.code]/rd).toFixed(2):0;});
        return{label:c.code+" "+c.label,data:data,borderColor:c.color,backgroundColor:c.color+"30",borderWidth:2.5,pointRadius:8,pointHoverRadius:10,pointBorderWidth:2,pointBorderColor:"#0c0f1a",pointBackgroundColor:c.color,pointStyle:SUB_PT[i%SUB_PT.length],tension:0.3,fill:false};
      });
      return new Chart(cv,{type:"line",plugins:[dlPlugin],
        data:{labels:labels,datasets:datasets},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{labels:{color:"#94a3b8",font:{size:10,family:"'Noto Sans KR',sans-serif"},boxWidth:14,boxHeight:14,padding:10,usePointStyle:true,pointStyleWidth:14}},
            tooltip:{backgroundColor:"#1e293b",titleColor:"#e2e8f0",bodyColor:"#cbd5e1",borderColor:"#334155",borderWidth:1,usePointStyle:true,
              callbacks:{label:function(ctx){return ctx.dataset.label+": "+ctx.parsed.y+"h/일"}}}},
          scales:{x:{ticks:{color:"#64748b",font:{size:10}},grid:{color:"#1e293b"}},
                  y:{beginAtZero:true,ticks:{color:"#64748b",font:{size:10},callback:function(v){return v+"h"}},grid:{color:"#1e293b"}}}}});
    }
    yearlyDChartInst=renderSubChart("yearlyDChart","D");
    yearlyRChartInst=renderSubChart("yearlyRChart","R");
    yearlyEChartInst=renderSubChart("yearlyEChart","E");
    yearlyAChartInst=renderSubChart("yearlyAChart","A");
    yearlyMChartInst=renderSubChart("yearlyMChart","M");

    // 3) 연간 기록률 (커버리지)
    (function(){
      var cv=document.getElementById("yearlyCoverageChart");if(!cv)return;
      var covData=years.map(function(y,i){
        var ed=elapsedDaysInYear(y);
        return ed>0?Math.round(recDays[i]/ed*100):0;
      });
      var labelsCov=years.map(function(y,i){
        var ed=elapsedDaysInYear(y);
        return y+"년 ("+recDays[i]+"/"+ed+"일)";
      });
      yearlyCoverageChartInst=new Chart(cv,{type:"line",plugins:[dlPlugin],
        data:{labels:labels,datasets:[
          {label:"기록률",data:covData,borderColor:"#f59e0b",backgroundColor:"#f59e0b30",borderWidth:2.5,pointRadius:4,pointBackgroundColor:"#f59e0b",tension:0.3,fill:true}
        ]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{labels:{color:"#94a3b8",font:{size:11,family:"'Noto Sans KR',sans-serif"},boxWidth:12,padding:10}},
            tooltip:{backgroundColor:"#1e293b",titleColor:"#e2e8f0",bodyColor:"#cbd5e1",borderColor:"#334155",borderWidth:1,
              callbacks:{title:function(items){return labelsCov[items[0].dataIndex];},label:function(ctx){return "기록률: "+ctx.parsed.y+"%";}}}},
          scales:{x:{ticks:{color:"#64748b",font:{size:10}},grid:{color:"#1e293b"}},
                  y:{beginAtZero:true,max:100,ticks:{color:"#64748b",font:{size:10},callback:function(v){return v+"%";}},grid:{color:"#1e293b"}}}}});
    })();

    // 3) 독서 연간 추이 (EN/KR/합계 권수)
    (function(){
      var cv=document.getElementById("yearlyBookChart");if(!cv)return;
      function bookCounts(y,type){var all=[];for(var m=1;m<=12;m++)all=all.concat(getBooksForYearMonth(y,m));return all.filter(function(b){return b.type===type}).length}
      var enData=years.map(function(y){return bookCounts(y,"en")});
      var krData=years.map(function(y){return bookCounts(y,"kr")});
      var totData=enData.map(function(v,i){return v+krData[i]});
      yearlyBookChartInst=new Chart(cv,{type:"line",plugins:[dlPlugin],
        data:{labels:labels,datasets:[
          {label:"🇺🇸 영어",data:enData,borderColor:"#3b82f6",backgroundColor:"#3b82f630",borderWidth:2.5,pointRadius:4,pointBackgroundColor:"#3b82f6",tension:0.3,fill:false},
          {label:"🇰🇷 국문",data:krData,borderColor:"#10b981",backgroundColor:"#10b98130",borderWidth:2.5,pointRadius:4,pointBackgroundColor:"#10b981",tension:0.3,fill:false},
          {label:"📚 합계",data:totData,borderColor:"#a855f7",backgroundColor:"#a855f730",borderWidth:3,borderDash:[6,3],pointRadius:5,pointBackgroundColor:"#a855f7",tension:0.3,fill:false}
        ]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{labels:{color:"#94a3b8",font:{size:11,family:"'Noto Sans KR',sans-serif"},boxWidth:12,padding:10}},
            tooltip:{backgroundColor:"#1e293b",titleColor:"#e2e8f0",bodyColor:"#cbd5e1",borderColor:"#334155",borderWidth:1,
              callbacks:{label:function(ctx){return ctx.dataset.label+": "+ctx.parsed.y+"권"}}}},
          scales:{x:{ticks:{color:"#64748b",font:{size:10}},grid:{color:"#1e293b"}},
                  y:{beginAtZero:true,ticks:{color:"#64748b",font:{size:10},callback:function(v){return v+"권"}},grid:{color:"#1e293b"}}}}});
    })();
  }catch(e){console.error("renderYearlyCharts error:",e)}
}

function renderDailyBarChart(){
  if(typeof Chart==='undefined')return;
  try{
    if(dashDailyChartInst){dashDailyChartInst.destroy();dashDailyChartInst=null}
    const cv=document.getElementById("dashDailyChart");
    if(!cv)return;
    const m=state.dashMonth;
    const maxD=daysInMonth(state.year,m);
    const labels=[];
    const groupData={};
    GROUPS.forEach(g=>{groupData[g]=[]});
    // dashMonth가 현재 연도 데이터 사용 (state.data는 현재 연도)
    for(let d=1;d<=maxD;d++){
      labels.push(String(d));
      const k=m+"-"+d;
      const slots=state.data.entries[k]||{};

// ===== Goals (목표) =====
// Daily goals: keyed by date "M-D" → array of {id, cat, name, done}
// Weekly/Monthly: array of {id, cat, name, deadline, memo, progress, period}
// Long-term: array of {id, cat, name, targetYear, memo, progress}

function getISOWeek(dt){
  const d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day);
  const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  const wk=Math.ceil((((d-yearStart)/86400000)+1)/7);
  return d.getUTCFullYear()+"-W"+String(wk).padStart(2,"0");
}
// Get number of weeks in a month (based on calendar weeks containing days of that month)
function weeksInMonth(y,m){
  const first=new Date(y,m-1,1);
  const last=new Date(y,m,0);
  const firstDow=first.getDay();
  return Math.ceil((firstDow+last.getDate())/7);
}
// Returns "1~7" or "8~14" — the day numbers of that week within the month
function weekDateRange(y,m,wIdx){
  const first=new Date(y,m-1,1);
  const firstDow=first.getDay(); // 0=Sun
  // Week 1 starts on day 1, ends on the first Saturday
  const lastDay=daysInMonth(y,m);
  let start,end;
  if(wIdx===1){
    start=1;
    end=Math.min(7-firstDow,lastDay);
  }else{
    start=7-firstDow+1+(wIdx-2)*7;
    end=Math.min(start+6,lastDay);
  }
  return start+"~"+end+"일";
}
// Which week (1-based) of the month does day d fall in?
function weekIdxOfDay(y,m,d){
  const first=new Date(y,m-1,1);
  const firstDow=first.getDay();
  if(d<=7-firstDow)return 1;
  return Math.ceil((d-(7-firstDow))/7)+1;
}
// 월요일 기반 주차: 그 달의 N번째 월요일이 N주차 (표시용 — 데이터 모델은 weekIdxOfDay 유지)
function weekIdxByMonday(monD){
  const firstDow=new Date(monD.getFullYear(),monD.getMonth(),1).getDay();
  const firstMonDay=firstDow===1?1:(firstDow===0?2:9-firstDow);
  return Math.floor((monD.getDate()-firstMonDay)/7)+1;
}
// Build a key for the Nth week of a specific month: "2026-05-W2"
function monthWeekKey(y,m,wIdx){
  return y+"-"+String(m).padStart(2,"0")+"-W"+wIdx;
}
function monthKey(y,m){return y+"-"+String(m).padStart(2,"0")}
function currentMonthWeekKey(){return monthWeekKey(state.year,state.goalWeekMonth,state.goalWeekIdx)}
function currentMonthOnlyKey(){return monthKey(state.year,state.goalMonth)}

function addDailyGoal(){

function markGoalDone(g,done){
  g.done=!!done;
  if(done)g.completedAt=new Date().toISOString().slice(0,10);
  else delete g.completedAt;
}

function addPeriodGoal(scope){
  if(!state.goalNewName.trim())return;
  const item={id:Date.now(),cat:state.goalNewCat,name:state.goalNewName.trim(),memo:state.goalNewMemo.trim(),progress:0,subtasks:[]};
  // Multi-scope parent links
  const pids=buildNewParentIds(scope);
  if(Object.keys(pids).length>0)item.parentIds=pids;
  if(scope==="weekly"){
    item.period=currentMonthWeekKey();
    item.month=state.goalWeekMonth;
    item.weekIdx=state.goalWeekIdx;
    item.year=state.year;
  }else if(scope==="monthly"){
    item.year=state.year;
    item.startMonth=state.goalNewStartMonth;
    item.endMonth=state.goalNewEndMonth;
    if(item.endMonth<item.startMonth)item.endMonth=item.startMonth;
    item.month=item.startMonth; // back-compat for filter
  }else if(scope==="longterm"){
    item.startYear=state.goalLtStartYear;
    item.endYear=state.goalLtEndYear;
  }
  state.goalData[scope].push(item);
  state.goalData[scope]=sortByDream(state.goalData[scope]);
  state.goalNewName="";state.goalNewMemo="";state.goalNewDeadline="";state.goalNewParentIds={};
  saveGoalData();render(true);
}
function updateGoalProgress(scope,id,progress){
  const g=state.goalData[scope].find(x=>x.id===id);
  if(g){
    g.progress=progress;
    if(progress>=100&&!g.completedAt)g.completedAt=new Date().toISOString().slice(0,10);
    if(progress<100)delete g.completedAt;
    saveGoalData();
  }
}
function removePeriodGoal(scope,id){
  state.goalData[scope]=state.goalData[scope].filter(x=>x.id!==id);
  saveGoalData();render(true);
}
// Subtask functions
function addSubtask(scope,goalId){
  const key=scope+"-"+goalId;
  const name=(state.goalSubInputs[key]||"").trim();
  const weight=parseInt(state.goalSubWeights[key])||0;
  if(!name)return;
  const g=state.goalData[scope].find(x=>x.id===goalId);
  if(!g)return;
  if(!g.subtasks)g.subtasks=[];
  g.subtasks.push({id:Date.now(),name:name,weight:weight,done:false});
  state.goalSubInputs[key]="";
  state.goalSubWeights[key]="";
  recomputeProgress(scope,goalId);
  saveGoalData();render(true);
}
function toggleSubtask(scope,goalId,subId){
  const g=state.goalData[scope].find(x=>x.id===goalId);
  if(!g||!g.subtasks)return;
  const s=g.subtasks.find(x=>x.id===subId);
  if(s){s.done=!s.done;recomputeProgress(scope,goalId);saveGoalData();render(true)}
}
function removeSubtask(scope,goalId,subId){
  const g=state.goalData[scope].find(x=>x.id===goalId);
  if(!g||!g.subtasks)return;
  g.subtasks=g.subtasks.filter(x=>x.id!==subId);
  recomputeProgress(scope,goalId);
  saveGoalData();render(true);
}
function recomputeProgress(scope,goalId){
  const g=state.goalData[scope].find(x=>x.id===goalId);
  if(!g||!g.subtasks||g.subtasks.length===0)return;
  let done=0;
  g.subtasks.forEach(s=>{if(s.done)done+=(s.weight||0)});
  const prev=g.progress||0;
  g.progress=Math.min(100,done);
  if(g.progress>=100&&prev<100&&!g.completedAt)g.completedAt=new Date().toISOString().slice(0,10);
  if(g.progress<100)delete g.completedAt;
  // weekly도 g.done 동기화 (체크박스 반영)
  if(scope==="weekly"||scope==="monthly"||scope==="longterm"){
    g.done=g.progress>=100;
  }
}
function toggleGoalExpand(scope,goalId){
  const key=scope+"-"+goalId;
  state.goalExpanded[key]=!state.goalExpanded[key];
  render();
}

// ── Goal Hierarchy Helpers ──────────────────────────────────
// Scope order: longterm > monthly > weekly > daily
var SCOPE_ORDER=["longterm","monthly","weekly","daily"];
var SCOPE_LABELS={longterm:"장기",monthly:"월간",weekly:"주간",daily:"일간",habits:"습관"};

// Get upper scopes for a given scope
function upperScopes(scope){
  var idx=SCOPE_ORDER.indexOf(scope);
  return idx>0?SCOPE_ORDER.slice(0,idx):[];
}

// Find a goal by id across all scopes
function findGoalById(id){
  if(!id)return null;
  // habits 먼저 검색
  var hb=(state.goalData.habits||[]).find(function(x){return x.id===id});
  if(hb)return{goal:{id:hb.id,cat:hb.cat,name:hb.name},scope:"habits"};
  // readingGoals 검색
  var rg=(state.goalData.readingGoals||[]).find(function(x){return x.id===id});
  if(rg)return{goal:{id:rg.id,cat:rg.cat,name:rg.name},scope:"readingGoals"};
  for(var s=0;s<SCOPE_ORDER.length;s++){
    var scope=SCOPE_ORDER[s];
    if(scope==="daily"){
      var keys=Object.keys(state.goalData.daily||{});
      for(var k=0;k<keys.length;k++){
        var list=state.goalData.daily[keys[k]]||[];
        var dg=list.find(function(x){return x.id===id});
        if(dg)return{goal:dg,scope:"daily",dateKey:keys[k]};
      }
    }else{
      var arr=state.goalData[scope]||[];
      var pg=arr.find(function(x){return x.id===id});
      if(pg)return{goal:pg,scope:scope};
    }
  }
  return null;
}

// Get parentIds object from a goal (handles both old parentId and new parentIds)
function getParentIds(goal){
  if(goal.parentIds)return goal.parentIds;
  if(goal.parentId){
    var found=findGoalById(goal.parentId);
    if(found){var obj={};obj[found.scope]=goal.parentId;return obj;}
  }
  return {};
}

// Build ancestry display: "장기: X > 습관: Y > 월간: Z"
function renderAncestry(goal){
  var pids=getParentIds(goal);
  var parts=[];
  // habits 포함 전체 스코프 순서로 표시
  var allScopes=["longterm","habits","readingGoals","monthly","weekly","daily"];
  allScopes.forEach(function(s){
    if(pids[s]){
      var found=findGoalById(pids[s]);
      var label=s==="habits"?"습관":s==="readingGoals"?"독서목표":(SCOPE_LABELS[s]||s);
      if(found)parts.push(label+": "+found.goal.name);
    }
  });
  if(parts.length===0)return null;
  return h("div",{style:"font-size:9px;color:#64748b;padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},"📎 "+parts.join(" > "));
}

// Get candidate parent goals for a specific upper scope, filtered by category
function getCandidatesForScope(upperScope,cat){
  if(upperScope==="habits"){
    // 습관은 카테고리 무관하게 전체 표시 (습관은 어떤 일간/주간 목표의 상위도 될 수 있음)
    var habs=state.goalData.habits||[];
    return habs.map(function(h){return{id:h.id,cat:h.cat,name:h.cat+" "+h.name}});
  }
  if(upperScope==="readingGoals"){
    // 독서목표도 카테고리 무관하게 전체 표시
    var rgs=state.goalData.readingGoals||[];
    return rgs.filter(function(r){return calcReadingGoalProgress(r)<100}).map(function(r){return{id:r.id,cat:r.cat,name:r.cat+" "+r.name}});
  }
  var arr=state.goalData[upperScope]||[];
  if(!cat)return arr.filter(function(g){return(g.progress||0)<100});
  return arr.filter(function(g){return g.cat===cat&&(g.progress||0)<100});
}

// Get children of a goal
function getChildGoals(goalId){
  var children=[];
  // longterm/monthly/weekly + habits/readingGoals (레거시) 스캔
  ["longterm","monthly","weekly","habits","readingGoals"].forEach(function(scope){
    (state.goalData[scope]||[]).forEach(function(g){
      var pids=getParentIds(g);
      if(Object.values(pids).indexOf(goalId)>=0)children.push({scope:scope,goal:g});
    });
  });
  // daily은 dk 키별 객체라 별도 순회
  Object.keys(state.goalData.daily||{}).forEach(function(k){
    (state.goalData.daily[k]||[]).forEach(function(g){
      var pids=getParentIds(g);
      if(Object.values(pids).indexOf(goalId)>=0)children.push({scope:"daily",goal:g,dateKey:k});
    });
  });
  return children;
}

// Get all active (non-100%) goals matching a category, for slot goal linking
// Filters by current date's applicable period (통합 유틸 사용)
function getActiveGoalsForCat(cat){
  var results=[];
  var curY=state.year, curM=state.month, curD=state.day;
  // Longterm: 기간에 현재 연도 포함
  (state.goalData.longterm||[]).forEach(function(g){
    if(g.cat!==cat||(g.progress||0)>=100)return;
    if(goalIncludesDate(g,"longterm",curY,curM,curD))results.push({scope:"longterm",goal:g});
  });
  // Monthly: 날짜 범위에 오늘 포함
  (state.goalData.monthly||[]).forEach(function(g){
    if(g.cat!==cat||(g.progress||0)>=100)return;
    if(goalIncludesDate(g,"monthly",curY,curM,curD))results.push({scope:"monthly",goal:g});
  });
  // Weekly: 날짜 범위에 오늘 포함 (weekIdx 엄격 비교 제거 — 다주 주간 목표도 포함)
  (state.goalData.weekly||[]).forEach(function(g){
    if(g.cat!==cat||(g.progress||0)>=100||g.done)return;
    if(goalIncludesDate(g,"weekly",curY,curM,curD))results.push({scope:"weekly",goal:g});
  });
  // Weekly 이연: endDate가 오늘 이전 & 미완료
  (state.goalData.weekly||[]).forEach(function(g){
    if(g.cat!==cat||(g.progress||0)>=100||g.done)return;
    if(!goalExpiredBefore(g,"weekly",curY,curM,curD))return;
    results.push({scope:"weekly",goal:g,fromDate:(g.month||"?")+"월 W"+(g.weekIdx||"?")});
  });
  // Habits: 카테고리 일치하는 습관 (피커에서는 날짜 무관하게 표시)
  (state.goalData.habits||[]).forEach(function(hb){
    if(hb.cat!==cat)return;
    results.push({scope:"habits",goal:{id:hb.id,cat:hb.cat,name:hb.name,progress:null}});
  });
  // ReadingGoals: 카테고리 일치 + 기간 내 + 미완료
  (state.goalData.readingGoals||[]).forEach(function(rg){
    if(rg.cat!==cat)return;
    if(calcReadingGoalProgress(rg)>=100)return;
    if(rg.type==="specific"){
      if(rg.startDate||rg.endDate){
        var today2=new Date(state.year,state.month-1,state.day);
        var sd2=rg.startDate?new Date(rg.startDate):null;
        var ed2=rg.endDate?new Date(rg.endDate):null;
        if(sd2&&today2<sd2)return;
        if(ed2&&today2>ed2)return;
      }else if(rg.startYear||rg.endYear){
        var sy2=rg.startYear||state.year;
        var ey2=rg.endYear||2040;
        if(state.year<sy2||state.year>ey2)return;
      }
    }else{
      var sy=rg.startYear||state.year;
      var ey=rg.endYear||2040;
      if(state.year<sy||state.year>ey)return;
    }
    results.push({scope:"readingGoals",goal:{id:rg.id,cat:rg.cat,name:rg.name,progress:null}});
  });
  // Daily: 당일 목표 전체 (카테고리 무관, 미완료만)
  var dk=curM+"-"+curD;
  (state.goalData.daily[dk]||[]).forEach(function(g){
    if(!g.done) results.push({scope:"daily",goal:g});
  });
  // Daily 이연: 오늘 이전 30일 내 미완료 목표도 포함
  (function(){
    var viewDate=new Date(state.year,curM-1,curD);
    var viewKey=curM+"-"+curD;
    for(var i=1;i<=30;i++){
      var past=new Date(viewDate);
      past.setDate(viewDate.getDate()-i);
      if(past.getFullYear()!==state.year)break;
      var pk=(past.getMonth()+1)+"-"+past.getDate();
      if(pk===viewKey)continue; // 당일과 중복 방지
      (state.goalData.daily[pk]||[]).forEach(function(g){
        if(!g.done) results.push({scope:"daily",goal:g,fromDate:pk});
      });
    }
  })();
  return results;
}

// ── 목표별 투입시간 집계 ─────────────────────────────────────
// Calculate hours directly linked to a specific goal ID
function calcGoalDirectHours(goalId){
  var total=0;
  var entries=state.data.entries||{};
  var keys=Object.keys(entries);
  for(var i=0;i<keys.length;i++){
    var dk=keys[i];
    var daySlots=entries[dk];
    var slotKeys=Object.keys(daySlots);
    for(var j=0;j<slotKeys.length;j++){
      if(slotKeys[j]==="_diary")continue;
      var sd=daySlots[slotKeys[j]];
      if(sd.actualGoalId===goalId)total+=0.5;
    }
  }
  return total;
}

// Calculate total hours for a goal INCLUDING all descendant goals' hours
function calcGoalTotalHours(goalId,_visited){
  if(!_visited)_visited={};
  if(_visited[goalId])return 0; // prevent circular reference
  _visited[goalId]=true;
  var direct=calcGoalDirectHours(goalId);
  var children=getChildGoals(goalId);
  var childHours=0;
  for(var i=0;i<children.length;i++){
    childHours+=calcGoalTotalHours(children[i].goal.id,_visited);
  }
  return direct+childHours;
}

// Format hours display
function fmtHours(hrs){
  if(hrs===0)return "";
  if(hrs===Math.floor(hrs))return hrs+"h";
  return hrs.toFixed(1)+"h";
}

// 목표 시작 기간 문자열
function fmtGoalStart(scope,g){
  if(scope==="weekly") return (g.year||"")+"년 "+(g.month||"")+"월 W"+(g.weekIdx||"");
  if(scope==="monthly"){
    const sm=g.startMonth||g.month;const em=g.endMonth||g.month;
    return (g.year||"")+"년 "+(sm===em?sm+"월":sm+"~"+em+"월");
  }
  if(scope==="longterm"){
    const sy=g.startYear||g.targetYear||"";const ey=g.endYear||g.targetYear||"";
    return sy===(ey||sy)?sy+"년":sy+"~"+ey+"년";
  }
  return "";
}
// 목표 완료일 문자열 (completedAt 우선, 없으면 종료 기간)
function fmtGoalDone(scope,g){
  if(g.completedAt) return g.completedAt;
  if(scope==="weekly") return (g.year||"")+"년 "+(g.month||"")+"월 W"+(g.weekIdx||"");
  if(scope==="monthly"){
    const em=g.endMonth||g.month;
    return (g.year||"")+"년 "+em+"월";
  }
  if(scope==="longterm"){
    const ey=g.endYear||g.targetYear||"";
    return ey+"년";
  }
  return "";
}

// Build parentIds from state.goalNewParentIds for new goal creation
function buildNewParentIds(scope){
  var result={};
  upperScopes(scope).forEach(function(s){
    if(state.goalNewParentIds[s])result[s]=state.goalNewParentIds[s];
  });
  return result;
}

// Render parent selectors for new goal form (one dropdown per upper scope)
function renderParentSelectors(scope,cat){
  var uppers=upperScopes(scope);
  if(uppers.length===0)return null;
  var wrap=h("div",{style:"display:flex;flex-direction:column;gap:4px;padding-top:2px"});
  var hasAny=false;
  uppers.forEach(function(us){
    var candidates=getCandidatesForScope(us,cat);
    if(candidates.length===0)return;
    hasAny=true;
    var label=us==="habits"?"습관":us==="readingGoals"?"독서목표":(SCOPE_LABELS[us]||us);
    var row=h("div",{style:"display:flex;gap:6px;align-items:center"});
    row.appendChild(h("span",{style:"font-size:10px;color:#64748b;width:32px;flex-shrink:0;text-align:right"},label+":"));
    var sel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px;flex:1"});
    var noneOpt=h("option",{value:""},"없음");
    if(!state.goalNewParentIds[us])noneOpt.selected=true;
    sel.appendChild(noneOpt);
    candidates.forEach(function(g){
      var opt=h("option",{value:String(g.id)},g.name);
      if(state.goalNewParentIds[us]===g.id)opt.selected=true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change",(function(upperScope){return function(e){
      if(e.target.value)state.goalNewParentIds[upperScope]=parseInt(e.target.value);
      else delete state.goalNewParentIds[upperScope];
    }})(us));
    row.appendChild(sel);
    wrap.appendChild(row);
  });
  if(!hasAny)return null;
  return wrap;
}

// Render parent edit selectors for existing goal (in expanded section)
function renderParentEditSelectors(scope,goal){
  var uppers=upperScopes(scope);
  if(uppers.length===0)return null;
  var pids=getParentIds(goal);
  var wrap=h("div",{style:"margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e293b"});
  wrap.appendChild(h("div",{style:"font-size:10px;color:#64748b;margin-bottom:4px"},"📎 상위 목표 연결"));
  var hasAny=false;
  uppers.forEach(function(us){
    var candidates=getCandidatesForScope(us,goal.cat);
    if(pids[us]){
      var currentParent=candidates.find(function(g){return g.id===pids[us]});
      if(!currentParent){
        var found=findGoalById(pids[us]);
        if(found)candidates=[found.goal].concat(candidates);
      }
    }
    if(candidates.length===0)return;
    hasAny=true;
    var label=us==="habits"?"습관":us==="readingGoals"?"독서목표":(SCOPE_LABELS[us]||us);
    var row=h("div",{style:"display:flex;gap:6px;align-items:center;padding:2px 0"});
    row.appendChild(h("span",{style:"font-size:10px;color:#64748b;width:32px;flex-shrink:0;text-align:right"},label+":"));
    var sel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px;flex:1"});
    var noneOpt=h("option",{value:""},"없음");
    if(!pids[us])noneOpt.selected=true;
    sel.appendChild(noneOpt);
    candidates.forEach(function(g){
      var opt=h("option",{value:String(g.id)},g.name);
      if(pids[us]===g.id)opt.selected=true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change",(function(upperScope){return function(e){
      if(!goal.parentIds)goal.parentIds={};
      if(e.target.value)goal.parentIds[upperScope]=parseInt(e.target.value);
      else delete goal.parentIds[upperScope];
      if(goal.parentId)delete goal.parentId;
      saveGoalData();render(true);
    }})(us));
    row.appendChild(sel);
    wrap.appendChild(row);
  });
  if(!hasAny)return null;
  return wrap;
}

// ── 목표 탭 네비게이션 헬퍼 ─────────────────────────────────
function navigateToGoal(scope,goal){
  state.tab="goals";
  state._addForm=null;
  state.goalSearch="";
  state.goalScope=scope;
  // 해당 목표를 DREAM 트리에서 확장
  var dk=null;
  if(scope==="daily"){
    for(var k in state.goalData.daily){
      if((state.goalData.daily[k]||[]).find(function(x){return x.id===goal.id})){dk=k;break;}
    }
  }
  state._expandedGoal={id:goal.id,scope:scope,dk:dk};
  // 카테고리 필터를 해당 DREAM 그룹으로
  if(goal.cat){
    var cObj=catByCode(goal.cat);
    if(cObj)state.goalTreeCat=cObj.group||"all";
  }
  // 캘린더를 목표의 시작일로 이동 (금일 목표 섹션에 바로 노출시키기 위함)
  try{
    var ny=null,nm=null,nd=null;
    if(scope==="daily"&&dk){
      var parts=dk.split("-");
      if(parts.length===2){nm=parseInt(parts[0]);nd=parseInt(parts[1]);ny=state.year;}
    }else if(scope==="weekly"){
      ny=goal.year||state.year;
      nm=goal.startMonth||goal.month||null;
      nd=goal.startDay||1;
    }else if(scope==="monthly"){
      ny=goal.year||state.year;
      nm=goal.startMonth||goal.month||null;
      nd=1;
    }
    if(ny&&nm&&nd){
      state.goalCalYear=ny;state.goalCalMonth=nm;state.goalCalDay=nd;
    }
  }catch(e){}
  render(true);
}
