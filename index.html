      row.appendChild(chk);
      row.appendChild(h("span",{style:"font-size:9px;color:"+iconColor+";flex-shrink:0"},icon));
      row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:#fff;background:"+(cat?cat.color:"#475569")+";border-radius:3px;padding:1px 5px;flex-shrink:0;font-family:'JetBrains Mono',monospace"},catCode));
      row.appendChild(h("span",{style:"flex:1;font-size:12px;color:"+(done?"#475569":"#e2e8f0")+(done?";text-decoration:line-through":"")+";overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},label));
      return row;
    }

    // 이연 섹션
    if(coTotal>0){
      box.appendChild(h("div",{style:"font-size:9px;color:#ef4444;font-weight:700;padding:4px 0;margin-bottom:2px;border-bottom:1px solid #7f1d1d;letter-spacing:.5px"},"🔴 이연 ("+coTotal+")"));
      readingCarryover.forEach(function(g){
        const cat=catByCode(g.cat);
        const pct=calcReadingGoalProgress(g);
        const row=h("div",{style:"display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #0f172a;border-left:2px solid #ef4444;background:#1a0505;margin-bottom:2px;border-radius:3px;cursor:pointer",
          onClick:function(){navigateToGoal("readingGoals",g);}
        });
        row.appendChild(h("span",{style:"font-size:9px;color:#10b981;flex-shrink:0"},"📚"));
        row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:#fff;background:"+(cat?cat.color:"#475569")+";border-radius:3px;padding:1px 5px;flex-shrink:0;font-family:'JetBrains Mono',monospace"},g.cat));
        row.appendChild(h("span",{style:"flex:1;font-size:12px;color:#fca5a5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},g.name));
        row.appendChild(h("span",{style:"font-size:9px;color:#ef4444;font-family:monospace;flex-shrink:0"},(g.endDate||"").slice(5)+" "+pct+"%"));
        box.appendChild(row);
      });
      weeklyCarryover.forEach(function(g){
        const cat=catByCode(g.cat);
        const row=h("div",{style:"display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #0f172a;border-left:2px solid #ef4444;background:#1a0505;margin-bottom:2px;border-radius:3px"});
        row.appendChild(h("span",{style:"font-size:9px;color:#3b82f6;flex-shrink:0"},"🗓"));
        row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:#fff;background:"+(cat?cat.color:"#475569")+";border-radius:3px;padding:1px 5px;flex-shrink:0;font-family:'JetBrains Mono',monospace"},g.cat));
        row.appendChild(h("span",{style:"flex:1;font-size:12px;color:#fca5a5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},g.name));
        row.appendChild(h("span",{style:"font-size:9px;color:#ef4444;font-family:monospace;flex-shrink:0"},g.month+"월"+g.weekIdx+"주 "+(g.progress||0)+"%"));
        box.appendChild(row);
      });
      dailyCarryover.forEach(function(co){
        const g=co.goal;const cat=catByCode(g.cat);
        const row=h("div",{style:"display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #0f172a;border-left:2px solid #ef4444;background:#1a0505;margin-bottom:2px;border-radius:3px"});
        const chk=h("input",{type:"checkbox",style:"width:14px;height:14px;accent-color:#ef4444;flex-shrink:0;cursor:pointer"});
        chk.addEventListener("change",function(){
          const lst=state.goalData.daily[co.origKey]||[];
          const og=lst.find(function(x){return x.id===g.id;});
          if(og){markGoalDone(og,true);saveGoalData();_isAutoRender=true;render();}
        });
        row.appendChild(chk);
        row.appendChild(h("span",{style:"font-size:9px;color:#6366f1;flex-shrink:0"},"📌"));
        row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:#fff;background:"+(cat?cat.color:"#475569")+";border-radius:3px;padding:1px 5px;flex-shrink:0;font-family:'JetBrains Mono',monospace"},g.cat));
        row.appendChild(h("span",{style:"flex:1;font-size:12px;color:#fca5a5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},g.name));
        row.appendChild(h("span",{style:"font-size:9px;color:#ef4444;font-family:monospace;flex-shrink:0"},co.origKey));
        // 선택일로 이동 버튼
        row.appendChild(h("button",{style:"font-size:10px;padding:2px 5px;background:transparent;border:1px solid #7f1d1d;color:#fca5a5;border-radius:4px;cursor:pointer;flex-shrink:0",title:tdk+"로 이동",onClick:function(e){
          e.stopPropagation();
          if(co.origKey===tdk)return;
          if(!state.goalData.daily[tdk])state.goalData.daily[tdk]=[];
          state.goalData.daily[tdk].push(g);
          state.goalData.daily[co.origKey]=(state.goalData.daily[co.origKey]||[]).filter(function(x){return x.id!==g.id;});
          if(state.goalData.daily[co.origKey].length===0)delete state.goalData.daily[co.origKey];
          saveGoalData();_isAutoRender=true;render();
        }},"→"+tgtM+"/"+tgtD));
        // 삭제 버튼
        row.appendChild(h("button",{style:"font-size:11px;padding:2px 5px;background:transparent;border:none;color:#64748b;cursor:pointer;flex-shrink:0",title:"삭제",onClick:function(e){
          e.stopPropagation();
          state.goalData.daily[co.origKey]=(state.goalData.daily[co.origKey]||[]).filter(function(x){return x.id!==g.id;});
          if(state.goalData.daily[co.origKey].length===0)delete state.goalData.daily[co.origKey];
          saveGoalData();_isAutoRender=true;render();
        }},"✕"));
        box.appendChild(row);
      });
    }

    tWeekly.forEach(function(g){
      const row=makeRow("🗓","#3b82f6","#3b82f6",g.name,g.cat,!!g.done,function(){
        markGoalDone(g,!g.done);saveGoalData();_isAutoRender=true;render();
      });
      box.appendChild(row);
    });
    tDaily.forEach(function(g){
      const row=makeRow("📌","#6366f1","#6366f1",g.name,g.cat,!!g.done,function(){
        markGoalDone(g,!g.done);saveGoalData();_isAutoRender=true;render();
      });
      box.appendChild(row);
    });
    wrap.appendChild(box);
  })();

  // ── 최근 완료 (7일 이내) ─────────────────────────────────
  (function(){
    const todayDt=new Date();todayDt.setHours(0,0,0,0);
    const sevenAgo=new Date(todayDt);sevenAgo.setDate(sevenAgo.getDate()-6);
    const sevenKey=sevenAgo.toISOString().slice(0,10);
    const todayKey=todayDt.toISOString().slice(0,10);
    const recentDone=[];
    // 일간
    Object.keys(state.goalData.daily||{}).forEach(function(dk){
      const parts=dk.split("-");
      if(parts.length!==2)return;
      const m=parseInt(parts[0]),d=parseInt(parts[1]);
      if(isNaN(m)||isNaN(d))return;
      const dt=new Date(state.year,m-1,d);dt.setHours(0,0,0,0);
      if(dt<sevenAgo||dt>todayDt)return;
      const dtStr=dt.toISOString().slice(0,10);
      (state.goalData.daily[dk]||[]).forEach(function(g){
        if(g.done){
          recentDone.push({scope:"daily",g:g,at:g.completedAt||dtStr,dk:dk});
        }
      });
    });
    // 주간/월간/장기/독서 — completedAt 필수
    [["weekly","weekly"],["monthly","monthly"],["longterm","longterm"],["readingGoals","readingGoals"]].forEach(function(p){
      (state.goalData[p[0]]||[]).forEach(function(g){
        const at=g.completedAt;if(!at)return;
        if(at<sevenKey||at>todayKey)return;
        const isDone=p[0]==="readingGoals"?calcReadingGoalProgress(g)>=100:(p[0]==="weekly"?!!g.done:(g.progress||0)>=100||!!g.done);
        if(!isDone)return;
        recentDone.push({scope:p[1],g:g,at:at});
      });
    });
    if(recentDone.length===0)return;
    recentDone.sort(function(a,b){return a.at<b.at?1:-1;});

    const box=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:8px 10px;margin-bottom:10px;border:1px solid #065f46"});
    const hdr=h("div",{style:"display:flex;align-items:center;gap:8px;cursor:pointer",
      onClick:function(){state.goalRecentDoneOpen=!state.goalRecentDoneOpen;render();}
    });
    hdr.appendChild(h("span",{style:"font-size:11px;color:#10b981;font-weight:700;letter-spacing:.3px"},"↩ 최근 완료 ("+recentDone.length+")"));
    hdr.appendChild(h("div",{style:"flex:1"},""));
    hdr.appendChild(h("span",{style:"font-size:10px;color:#475569"},"7일"));
    hdr.appendChild(h("span",{style:"font-size:10px;color:#64748b;margin-left:4px"},state.goalRecentDoneOpen?"▲":"▼"));
    box.appendChild(hdr);

    if(state.goalRecentDoneOpen){
      const list=h("div",{style:"margin-top:8px;border-top:1px solid #1e293b;padding-top:6px"});
      const ICONS={daily:"📌",weekly:"🗓",monthly:"📅",longterm:"🎯",readingGoals:"📚"};
      recentDone.forEach(function(it){
        const row=h("div",{style:"display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #0f172a"});
        const catObj=catByCode(it.g.cat);
        const undo=h("button",{style:"font-size:10px;padding:2px 5px;background:transparent;border:1px solid #065f46;color:#34d399;border-radius:4px;cursor:pointer;flex-shrink:0",title:"완료 취소",onClick:function(e){
          e.stopPropagation();
          if(it.scope==="daily"){
            const lst=state.goalData.daily[it.dk]||[];
            const og=lst.find(function(x){return x.id===it.g.id;});
            if(og)markGoalDone(og,false);
          }else if(it.scope==="readingGoals"){
            alert("독서 목표는 권수 기반이라 완료 취소는 독서 기록에서 수정하세요.");return;
          }else{
            markGoalDone(it.g,false);
            if((it.g.progress||0)>=100)it.g.progress=99;
          }
          saveGoalData();_isAutoRender=true;render();
        }},"↩");
        row.appendChild(undo);
        row.appendChild(h("span",{style:"font-size:10px;color:#10b981;flex-shrink:0"},ICONS[it.scope]||"•"));
        row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:#fff;background:"+(catObj?catObj.color:"#475569")+";border-radius:3px;padding:1px 5px;flex-shrink:0;font-family:'JetBrains Mono',monospace"},it.g.cat));
        row.appendChild(h("span",{style:"flex:1;font-size:11px;color:#64748b;text-decoration:line-through;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},it.g.name));
        row.appendChild(h("span",{style:"font-size:9px;color:#065f46;font-family:monospace;flex-shrink:0"},it.at.slice(5)));
        list.appendChild(row);
      });
      box.appendChild(list);
    }
    wrap.appendChild(box);
  })();

  // 빠른 추가 바
  const quickBar=h("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:8px 10px;background:#111827;border-radius:10px;border:1px solid #1e293b"});
  quickBar.appendChild(h("span",{style:"font-size:10px;color:#475569;flex-shrink:0"},"추가:"));
  const qCatSel=h("select",{style:"flex:1;padding:5px 6px;border-radius:6px;border:1px solid #334155;background:#0c0f1a;color:#e2e8f0;font-size:11px;font-family:'JetBrains Mono',monospace"});
  CATEGORIES.forEach(function(c){qCatSel.appendChild(h("option",{value:c.code},c.code+" "+c.label))});
  if(state._addForm)for(let i=0;i<qCatSel.options.length;i++){if(qCatSel.options[i].value===state._addForm.cat)qCatSel.selectedIndex=i;}
  quickBar.appendChild(qCatSel);
  const qScopeSel=h("select",{style:"padding:5px 6px;border-radius:6px;border:1px solid #334155;background:#0c0f1a;color:#e2e8f0;font-size:11px"});
  [{v:"daily",l:"📌 일간"},{v:"weekly",l:"🗓 주간"},{v:"monthly",l:"📅 월간"},{v:"longterm",l:"🎯 장기"}].forEach(function(s){
    const o=h("option",{value:s.v},s.l);
    if(state._addForm&&state._addForm.scope===s.v)o.selected=true;
    qScopeSel.appendChild(o);
  });
  quickBar.appendChild(qScopeSel);
  quickBar.appendChild(h("button",{
    style:"padding:5px 12px;border-radius:6px;border:none;background:#6366f1;color:#fff;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0",
    onClick:function(){
      var cat=qCatSel.value;var scope=qScopeSel.value;
      // 같은 cat+scope이면 토글(닫기), 다른 경우는 무조건 교체
      if(state._addForm&&state._addForm.cat===cat&&state._addForm.scope===scope&&!state._addForm._parentGoalId){
        state._addForm=null;
      }else{
        state._addForm={cat:cat,scope:scope,name:"",memo:"",
          month:calM,startDay:today2.getDate(),endDay:Math.min(today2.getDate()+6,daysInMonth(calY,calM)),
          day:today2.getDate(),startMonth:calM,endMonth:calM,startYear:calY,endYear:calY+1,
          rgType:"cumulative",bookType:"en",targetCount:100,parentIds:{}};
      }
      state.goalTreeCat="all";
      render();
    }
  },state._addForm&&!state._addForm._parentGoalId?"✕ 닫기":"+ 목표 추가"));
  // 🧹 이름으로 강제 삭제
  quickBar.appendChild(h("button",{
    style:"padding:5px 10px;border-radius:6px;border:1px solid #7f1d1d;background:transparent;color:#fca5a5;font-size:11px;cursor:pointer;flex-shrink:0",
    title:"이름 부분일치로 모든 scope에서 일괄 삭제",
    onClick:function(){
      var q=prompt("삭제할 목표 이름 (부분 일치, 대소문자 무시):");
      if(!q||!q.trim())return;
      var n=forceDeleteGoalsByName(q.trim());
      alert(n>0?n+"개 목표를 삭제했습니다.":"매치되는 목표가 없습니다.");
    }
  },"🧹"));
  wrap.appendChild(quickBar);

  // 카테고리 필터
  if(!state.goalTreeCat)state.goalTreeCat="all";
  const catFilterBar=h("div",{style:"display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;margin-bottom:8px"});
  const catFilterOpts=[{id:"all",label:"전체"},...GROUPS.map(g=>({id:g,label:g}))];
  catFilterOpts.forEach(function(cf){
    const isAct=state.goalTreeCat===cf.id;
    catFilterBar.appendChild(h("button",{
      style:"flex-shrink:0;padding:5px 12px;border-radius:8px;border:1px solid "+(isAct?(cf.id==="all"?"#6366f1":GC[cf.id]||"#6366f1"):"#1e293b")+";background:"+(isAct?(cf.id==="all"?"#6366f1":GC[cf.id]||"#6366f1"):"#111827")+";color:"+(isAct?"#fff":"#64748b")+";font-size:11px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace",
      onClick:function(){state.goalTreeCat=cf.id;render();}
    },cf.label));
  });
  wrap.appendChild(catFilterBar);

  // DREAM 카테고리 순으로 목표 트리 구성
  const dreamCats=state.goalTreeCat==="all"?CATEGORIES:CATEGORIES.filter(c=>c.group===state.goalTreeCat);

  // 기준일: 캘린더에서 선택한 날 우선, 없으면 오늘. 이 날을 "포함"하는 목표만 표시.
  const _refD=(state.goalCalDay&&state.goalCalYear===calY&&state.goalCalMonth===calM)?state.goalCalDay:(new Date().getMonth()+1===calM&&new Date().getFullYear()===calY?new Date().getDate():1);
  const _refWIdx=weekIdxOfDay(calY,calM,_refD);
  const _refDateStr=new Date(calY,calM-1,_refD).toISOString().slice(0,10);

  dreamCats.forEach(function(catDef){
    const catCode=catDef.code;
    // 이 카테고리의 목표 수집 — 현재 기간 포함하는 것만
    const ltGoals=(state.goalData.longterm||[]).filter(function(g){
      if(g.cat!==catCode)return false;
      const sy=g.startYear||calY,ey=g.endYear||calY;
      return sy<=calY&&ey>=calY;
    });
    const mGoals2=(state.goalData.monthly||[]).filter(function(g){
      if(g.cat!==catCode||g.year!==calY)return false;
      const sm=g.startMonth||g.month||1,em=g.endMonth||g.month||12;
      return sm<=calM&&em>=calM;
    });
    const wGoals2=(state.goalData.weekly||[]).filter(function(g){
      return g.cat===catCode&&g.year===calY&&g.month===calM&&g.weekIdx===_refWIdx;
    });
    // 기존 독서목표 (레거시): 카테고리 일치 + 현재 연도 포함
    const rgGoals2=(state.goalData.readingGoals||[]).filter(function(g){
      if(g.cat!==catCode)return false;
      if(g.type==="specific"){
        if(!g.startDate||!g.endDate)return true;
        return g.startDate<=_refDateStr&&g.endDate>=_refDateStr;
      }
      const sy=g.startYear||calY,ey=g.endYear||calY;
      return sy<=calY&&ey>=calY;
    });
    // 이번 달 일간목표
    const dGoals2=[];
    for(let d2=1;d2<=daysInMonth(calY,calM);d2++){
      const dk2=calM+"-"+d2;
      (state.goalData.daily[dk2]||[]).filter(g=>g.cat===catCode).forEach(g=>dGoals2.push({g,d:d2,dk:dk2}));
    }

    if(ltGoals.length===0&&mGoals2.length===0&&wGoals2.length===0&&rgGoals2.length===0&&dGoals2.length===0){
      // 폼이 이 카테고리에 열려있으면 섹션 표시
      if(!(state._addForm&&state._addForm.cat===catCode))return;
    }

    const catSec=h("div",{style:"background:#111827;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #1e293b;border-left:3px solid "+catDef.color});

    // 카테고리 헤더 + 추가 버튼
    const catHdr=h("div",{style:"display:flex;align-items:center;gap:8px;margin-bottom:10px"});
    catHdr.appendChild(h("span",{style:"font-size:12px;font-weight:900;color:"+catDef.color+";font-family:'JetBrains Mono',monospace"},catCode));
    catHdr.appendChild(h("span",{style:"font-size:11px;color:#475569"},catDef.label));
    catHdr.appendChild(h("div",{style:"flex:1"},""));
    // 카테고리 헤더: 최상위 목표만 (장기)
    // 하위 목표(월간/주간/일간)는 상위 목표 pill 옆 버튼으로 생성
    const addBtns=h("div",{style:"display:flex;gap:3px;flex-wrap:wrap"});
    var rootScopes=(ltGoals.length===0)
      // 장기목표 없는 카테고리: 모든 scope 허용
      ? [{scope:"daily",label:"일간"},{scope:"weekly",label:"주간"},{scope:"monthly",label:"월간"},{scope:"longterm",label:"장기"}]
      // 장기목표 있는 카테고리: 최상위만
      : [{scope:"longterm",label:"장기"}];
    rootScopes.forEach(function(sv){
      const isActive=state._addForm&&state._addForm.cat===catCode&&state._addForm.scope===sv.scope&&!state._addForm._parentGoalId;
      addBtns.appendChild(h("button",{
        style:"font-size:9px;color:"+(isActive?"#fff":catDef.color)+";background:"+(isActive?catDef.color:catDef.color+"18")+";border:1px solid "+catDef.color+(isActive?"":"40")+";border-radius:4px;padding:2px 5px;cursor:pointer;font-weight:"+(isActive?"700":"400"),
        onClick:function(){
          if(isActive){state._addForm=null;}
          else{
            // 기존 폼 닫고 새 폼 열기
            state._addForm={cat:catCode,scope:sv.scope,name:"",memo:"",
              month:calM,startDay:today2.getDate(),endDay:Math.min(today2.getDate()+6,daysInMonth(calY,calM)),
              day:today2.getDate(),startMonth:calM,endMonth:calM,
              startYear:calY,endYear:calY+1,
              rgType:"cumulative",bookType:"en",targetCount:100,parentIds:{}};
          }
          render();
        }
      },(isActive?"✕ ":"+")+(isActive?"취소":sv.label)));
    });
    catHdr.appendChild(addBtns);
    catSec.appendChild(catHdr);

    // ── 인라인 추가 폼 (최상위 목표 — _parentGoalId 없는 경우) ──
    if(state._addForm&&state._addForm.cat===catCode&&!state._addForm._parentGoalId){
      catSec.appendChild(renderInlineAddForm(state._addForm,catDef,0));
    }
    // ── 계층 트리 렌더링 ──────────────────────────────────────
    // 스코프별 시각 설정
    const SCOPE_VIS={
      longterm: {color:"#f59e0b",bg:"#f59e0b12",border:"#f59e0b30",label:"🎯 장기",fs:"13px",fw:"700",lh:"3px"},
      readingGoals:{color:"#10b981",bg:"#10b98112",border:"#10b98130",label:"📚 독서",fs:"13px",fw:"700",lh:"3px"},
      habits:   {color:"#7c3aed",bg:"#7c3aed12",border:"#7c3aed30",label:"🔁 습관",fs:"13px",fw:"700",lh:"3px"},
      monthly:  {color:"#0d9488",bg:"#0d948808",border:"#0d948828",label:"📅 월간",fs:"12px",fw:"600",lh:"2px"},
      weekly:   {color:"#3b82f6",bg:"transparent",border:"#1e293b",label:"🗓 주간",fs:"12px",fw:"500",lh:"2px"},
      daily:    {color:"#6366f1",bg:"transparent",border:"#1e293b",label:"📌 일간",fs:"11px",fw:"400",lh:"2px"},
    };

    function renderGoalPill(g,scope,depth,pillDk,indentPx){
      const vis=SCOPE_VIS[scope]||{color:"#94a3b8",bg:"transparent",border:"#1e293b",label:scope,fs:"12px",fw:"400",lh:"2px"};
      const hrs=calcGoalTotalHours(g.id);
      const pct=scope==="readingGoals"?calcReadingGoalProgress(g):(g.progress||0);
      const done=(scope==="readingGoals"?(pct>=100):(scope==="daily"||scope==="weekly")?g.done:(pct>=100));
      const isExpanded=state._expandedGoal&&state._expandedGoal.id===g.id&&state._expandedGoal.scope===scope;

      // 들여쓰기: 명시적 indentPx 우선, 없으면 depth 기반
      const INDENT=indentPx!==undefined?indentPx:depth*14;

      const wrap=h("div",{style:"margin-left:"+INDENT+"px;margin-bottom:"+(scope==="longterm"||scope==="readingGoals"||scope==="habits"?"6px":"3px")});

      // ── 좌측 스코프 라인 (장기/독서/습관은 굵게) ──
      const isRoot=scope==="longterm"||scope==="readingGoals"||scope==="habits";
      const pillWrap=h("div",{
        style:"position:relative;border-radius:"+(isExpanded?"8px 8px 0 0":"8px")+";"+
          "background:"+(isExpanded?vis.color+"20":isRoot?vis.bg:"transparent")+";"+
          "border:1px solid "+(isExpanded?vis.color:done?"#064e3b":(isRoot?vis.border:"#1a2234"))+";"+
          "border-left:"+(isRoot?"3px solid "+vis.color:"1px solid "+(done?"#064e3b":"#1a2234"))+";"+
          "transition:all .15s;cursor:pointer",
        onClick:function(){
          if(isExpanded)state._expandedGoal=null;
          else state._expandedGoal={id:g.id,scope:scope,dk:pillDk||null};
          _isAutoRender=true;render();
        }
      });

      const pill=h("div",{style:"display:flex;align-items:center;gap:6px;padding:"+(isRoot?"7px 10px":"5px 10px")});

      // 연결선 (들여쓰기 있는 하위목표)
      if(INDENT>0){
        pill.appendChild(h("span",{style:"font-size:9px;color:#334155;flex-shrink:0;font-family:monospace"},"└"));
      }

      // 스코프 레이블 뱃지
      const badgeStyle="font-size:9px;font-weight:700;color:#fff;background:"+vis.color+";"+
        "border-radius:4px;padding:1px 5px;flex-shrink:0;white-space:nowrap;font-family:'JetBrains Mono',monospace";
      pill.appendChild(h("span",{style:badgeStyle},vis.label));

      // E2 독서 언어 태그
      if(g.language==="en"||g.language==="kr"){
        const langColor=g.language==="en"?"#3b82f6":"#10b981";
        pill.appendChild(h("span",{style:"font-size:9px;color:"+langColor+";flex-shrink:0"},g.language==="en"?"🇺🇸":"🇰🇷"));
      }

      // 목표명
      pill.appendChild(h("span",{
        style:"flex:1;font-size:"+vis.fs+";font-weight:"+vis.fw+";"+
          "color:"+(done?"#475569":"#e2e8f0")+
          (done?";text-decoration:line-through":"")+
          ";overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
      },g.name));

      // 기간 표시 (스코프 우측에 작게)
      var periodTxt="";
      if(scope==="weekly"){
        periodTxt=g.startDay&&g.endDay?(g.month+"/"+g.startDay+"~"+g.endDay):(g.month+"월"+g.weekIdx+"주");
      }else if(scope==="monthly"){
        const sm=g.startMonth||g.month||"";const em=g.endMonth||g.month||"";
        periodTxt=sm===em?sm+"월":sm+"~"+em+"월";
      }else if(scope==="longterm"){
        periodTxt=(g.startYear||"")+"~"+(g.endYear||"");
      }else if(scope==="daily"&&pillDk){
        const dp=pillDk.split("-");periodTxt=dp[0]+"/"+dp[1];
      }
      if(periodTxt){
        pill.appendChild(h("span",{style:"font-size:9px;color:#475569;font-family:'JetBrains Mono',monospace;flex-shrink:0"},periodTxt));
      }

      // 투입시간
      if(hrs>0){
        pill.appendChild(h("span",{style:"font-size:9px;color:#f59e0b;font-family:monospace;flex-shrink:0"},fmtHours(hrs)));
      }

      // 진도/완료
      if(scope==="daily"||scope==="weekly"){
        const chk=h("div",{style:"width:18px;height:18px;border-radius:3px;border:1.5px solid "+(done?"#10b981":vis.color)+";background:"+(done?"#10b981":"transparent")+";display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer",
          title:done?"완료 취소":"완료 체크",
          onClick:function(e){
            e.stopPropagation();
            markGoalDone(g,!g.done);
            saveGoalData();_isAutoRender=true;render();
          }});
        if(done)chk.appendChild(h("span",{style:"font-size:11px;color:#fff;line-height:1"},"✓"));
        pill.appendChild(chk);
      }else if(scope==="readingGoals"&&g.type==="cumulative"){
        const cnt=calcReadingGoalCount(g);
        pill.appendChild(h("span",{style:"font-size:9px;color:#3b82f6;font-family:monospace;flex-shrink:0"},cnt+"/"+g.targetCount+"권"));
      }else if(scope!=="habits"){
        const track=h("div",{style:"width:36px;height:"+vis.lh+";background:#1e293b;border-radius:2px;overflow:hidden;flex-shrink:0"});
        track.appendChild(h("div",{style:"height:100%;width:"+pct+"%;background:"+(done?"#10b981":vis.color)+";transition:width .3s"}));
        pill.appendChild(track);
        pill.appendChild(h("span",{style:"font-size:9px;color:"+(done?"#10b981":vis.color)+";font-family:monospace;width:24px;text-align:right;flex-shrink:0"},pct+"%"));
      }

      // 직접 삭제 버튼 (모든 scope 스캔해서 제거)
      pill.appendChild(h("button",{
        style:"font-size:11px;color:#475569;background:transparent;border:none;padding:0 4px;cursor:pointer;flex-shrink:0",
        title:"삭제",
        onClick:function(e){
          e.stopPropagation();
          if(!confirm("\""+g.name+"\" 목표를 삭제할까요?"))return;
          forceDeleteGoalById(g.id);
          state._expandedGoal=null;
          saveGoalData();cloudSaveGoals();_isAutoRender=true;render();
        }
      },"✕"));
      // 확장 토글
      pill.appendChild(h("span",{style:"font-size:9px;color:"+(isExpanded?vis.color:"#334155")+";flex-shrink:0"},isExpanded?"▲":"▼"));
      pillWrap.appendChild(pill);

      // ── 하위 목표 추가 버튼 (pill 아래 우측 정렬) ──
      var childScopes=[];
      if(scope==="longterm"||scope==="readingGoals"){
        childScopes=[{s:"monthly",l:"월간"},{s:"weekly",l:"주간"},{s:"daily",l:"일간"}];
      }else if(scope==="monthly"){
        childScopes=[{s:"weekly",l:"주간"},{s:"daily",l:"일간"}];
      }else if(scope==="weekly"){
        childScopes=[{s:"daily",l:"일간"}];
      }
      if(childScopes.length>0){
        const childBtnRow=h("div",{style:"display:flex;justify-content:flex-end;gap:3px;padding:2px 6px 4px"});
        childScopes.forEach(function(cs){
          const isAct=state._addForm&&state._addForm._parentGoalId===g.id&&state._addForm.scope===cs.s;
          childBtnRow.appendChild(h("button",{
            style:"font-size:8px;color:"+(isAct?"#fff":vis.color)+";background:"+(isAct?vis.color:vis.color+"18")+";border:1px solid "+vis.color+(isAct?"":"40")+";border-radius:3px;padding:1px 5px;cursor:pointer",
            onClick:function(e){
              e.stopPropagation();
              if(isAct){state._addForm=null;}
              else{
                var pids={};
                if(scope==="longterm")pids.longterm=g.id;
                else if(scope==="readingGoals")pids.readingGoals=g.id;
                else if(scope==="monthly")pids.monthly=g.id;
                else if(scope==="weekly")pids.weekly=g.id;
                state._addForm={cat:catDef.code,scope:cs.s,name:"",memo:"",
                  month:calM,startDay:today2.getDate(),endDay:Math.min(today2.getDate()+6,daysInMonth(calY,calM)),
                  day:today2.getDate(),startMonth:calM,endMonth:calM,
                  startYear:calY,endYear:calY+1,
                  parentIds:pids,_parentGoalId:g.id};
              }
              render();
            }
          },"+"+(isAct?"취소":cs.l)));
        });
        pillWrap.appendChild(childBtnRow);
      }

      wrap.appendChild(pillWrap);

      // 확장 패널 (수정)
      if(isExpanded){
        wrap.appendChild(renderGoalDetailPanel(g,scope,catDef,pillDk||null));
      }

      // 하위 목표 추가 폼 (이 pill 아래)
      if(state._addForm&&state._addForm._parentGoalId===g.id){
        const af=state._addForm;
        wrap.appendChild(renderInlineAddForm(af,catDef,INDENT+16));
      }

      return wrap;
    }

    // ── 트리 구성: 장기 → 월간 → 주간 → 일간, 독서 ──
    // 완료된 목표는 숨김 (단, 미완료 자식이 있으면 조상은 유지)
    function isGoalActive(g,scope){
      if(scope==="readingGoals")return calcReadingGoalProgress(g)<100;
      if(scope==="daily"||scope==="weekly")return !g.done;
      return (g.progress||0)<100 && !g.done;
    }
    const activeDescCache={};
    function hasActiveDescendant(goalId){
      if(activeDescCache[goalId]!==undefined)return activeDescCache[goalId];
      activeDescCache[goalId]=false;
      for(var i=0;i<mGoals2.length;i++){var mg=mGoals2[i];
        if(Object.values(getParentIds(mg)).indexOf(goalId)<0)continue;
        if(isGoalActive(mg,"monthly")||hasActiveDescendant(mg.id)){activeDescCache[goalId]=true;return true;}
      }
      for(var i=0;i<wGoals2.length;i++){var wg=wGoals2[i];
        if(Object.values(getParentIds(wg)).indexOf(goalId)<0)continue;
        if(isGoalActive(wg,"weekly")||hasActiveDescendant(wg.id)){activeDescCache[goalId]=true;return true;}
      }
      for(var i=0;i<dGoals2.length;i++){var dItem=dGoals2[i];
        if(Object.values(getParentIds(dItem.g)).indexOf(goalId)<0)continue;
        if(isGoalActive(dItem.g,"daily")){activeDescCache[goalId]=true;return true;}
      }
      return false;
    }
    function shouldShow(g,scope){return isGoalActive(g,scope)||hasActiveDescendant(g.id);}

    var renderedM=new Set();
    var renderedW=new Set();
    var renderedD=new Set();
    var pillCount=0;
    function pillAdd(g,scope,depth,pillDk,indentPx){
      if(!shouldShow(g,scope))return false;
      catSec.appendChild(renderGoalPill(g,scope,depth,pillDk,indentPx));
      pillCount++;
      return true;
    }
    // 특정 goalId를 parent로 갖는 일간목표(이번 달) 수집 (날짜 오름차순)
    function dailyChildrenOf(goalId){
      return dGoals2.filter(function(item){
        var pids=getParentIds(item.g);
        return Object.values(pids).indexOf(goalId)>=0;
      }).sort(function(a,b){return a.d-b.d;});
    }

    ltGoals.concat(rgGoals2).forEach(function(lt,idx){
      const ltScope=idx<ltGoals.length?"longterm":"readingGoals";
      pillAdd(lt,ltScope,0,undefined,0);

      // 하위 월간
      const childM=mGoals2.filter(g=>{
        const pids=getParentIds(g);
        return Object.values(pids).indexOf(lt.id)>=0;
      });
      childM.forEach(function(mg){
        if(mg.year!==calY)return;
        renderedM.add(mg.id);
        pillAdd(mg,"monthly",1,undefined,14);
        // 하위 주간
        const childW=wGoals2.filter(g=>{
          const pids=getParentIds(g);
          return Object.values(pids).indexOf(mg.id)>=0;
        });
        childW.forEach(function(wg){
          renderedW.add(wg.id);
          pillAdd(wg,"weekly",2,undefined,28);
          // 주간의 하위 일간
          dailyChildrenOf(wg.id).forEach(function(item){
            if(renderedD.has(item.g.id))return;
            renderedD.add(item.g.id);
            pillAdd(item.g,"daily",3,item.dk,42);
          });
        });
        // 월간의 직속 하위 일간 (주간 거치지 않음)
        dailyChildrenOf(mg.id).forEach(function(item){
          if(renderedD.has(item.g.id))return;
          renderedD.add(item.g.id);
          pillAdd(item.g,"daily",2,item.dk,28);
        });
      });
      // 장기/독서의 직속 하위 일간
      dailyChildrenOf(lt.id).forEach(function(item){
        if(renderedD.has(item.g.id))return;
        renderedD.add(item.g.id);
        pillAdd(item.g,"daily",1,item.dk,14);
      });
    });

    // 부모 없는 월간 (orphan) — 장기와 같은 위치
    mGoals2.forEach(function(mg){
      if(mg.year!==calY||renderedM.has(mg.id))return;
      const pids=getParentIds(mg);
      if(Object.keys(pids).length>0)return;
      pillAdd(mg,"monthly",0,undefined,0);
      // 하위 주간
      const childW=wGoals2.filter(g=>{
        const pids2=getParentIds(g);
        return Object.values(pids2).indexOf(mg.id)>=0;
      });
      childW.forEach(function(wg){
        renderedW.add(wg.id);
        pillAdd(wg,"weekly",1,undefined,14);
        dailyChildrenOf(wg.id).forEach(function(item){
          if(renderedD.has(item.g.id))return;
          renderedD.add(item.g.id);
          pillAdd(item.g,"daily",2,item.dk,28);
        });
      });
      dailyChildrenOf(mg.id).forEach(function(item){
        if(renderedD.has(item.g.id))return;
        renderedD.add(item.g.id);
        pillAdd(item.g,"daily",1,item.dk,14);
      });
    });

    // 부모 없는 주간 (orphan) — 장기와 같은 위치
    wGoals2.forEach(function(wg){
      if(renderedW.has(wg.id))return;
      const pids=getParentIds(wg);
      if(Object.keys(pids).length>0)return;
      pillAdd(wg,"weekly",0,undefined,0);
      dailyChildrenOf(wg.id).forEach(function(item){
        if(renderedD.has(item.g.id))return;
        renderedD.add(item.g.id);
        pillAdd(item.g,"daily",1,item.dk,14);
      });
    });

    // 부모 없는 일간 (orphan) — 날짜 오름차순
    const orphanDaily=dGoals2.filter(function(item){return!renderedD.has(item.g.id);}).sort(function(a,b){return a.d-b.d;});
    orphanDaily.forEach(function(item){
      pillAdd(item.g,"daily",0,item.dk,0);
    });

    // 필터링 결과 모두 완료되면 카테고리 섹션 자체 생략 (폼 열린 경우 제외)
    const formOpenHere=!!(state._addForm&&state._addForm.cat===catCode);
    if(pillCount>0||formOpenHere)wrap.appendChild(catSec);
  });

  // 목표가 하나도 없는 경우
  const hasAnyGoal=(state.goalData.longterm||[]).length+(state.goalData.monthly||[]).length+(state.goalData.weekly||[]).length>0||Object.keys(state.goalData.daily||{}).length>0;
  if(!hasAnyGoal){
    wrap.appendChild(h("div",{style:"text-align:center;padding:40px 20px;color:#334155"},
      h("div",{style:"font-size:32px;margin-bottom:10px"},"🎯"),
      h("div",{style:"font-size:14px;color:#475569"},"목표를 추가해 시작하세요"),
      h("div",{style:"font-size:11px;color:#334155;margin-top:6px"},"카테고리별 +장기 / +월간 / +주간 / +일간 버튼 클릭")
    ));
  }

  return wrap;
}



function renderBooks(){
  const wrap=h("div",{});
  const stats=getBookStats();

  // ── 독서 목표 섹션 ──
  const readingGoals=state.goalData.readingGoals||[];
  const rgBox=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:12px;margin-bottom:14px;border:1px solid #1e293b"});
  const rgTitle=h("div",{style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"});
  rgTitle.appendChild(h("span",{style:"font-size:10px;color:#64748b;font-weight:700;letter-spacing:.5px"},"📚 독서 목표"));
  // 추가 버튼
  rgTitle.appendChild(h("button",{style:"font-size:11px;color:#3b82f6;background:transparent;border:1px solid #3b82f6;border-radius:6px;padding:2px 8px;cursor:pointer",onClick:function(){state.showReadingGoalForm=!state.showReadingGoalForm;render()}},"+ 목표추가"));
  rgBox.appendChild(rgTitle);

  // 추가 폼
  if(state.showReadingGoalForm){

    if(state.goalNewCat)state.rgNewCat=state.goalNewCat;
    if(!state.rgNewCat)state.rgNewCat="E2";
    if(!state.rgNewType)state.rgNewType="cumulative";
    if(!state.rgNewBookType)state.rgNewBookType="en";
    if(!state.rgNewTarget)state.rgNewTarget=100;
    if(!state.rgNewStartYear)state.rgNewStartYear=2025;
    if(!state.rgNewEndYear)state.rgNewEndYear=2040;
    const form=h("div",{style:"background:#111827;border-radius:8px;padding:10px;margin-bottom:10px;border:1px solid #334155"});
    // 타입 선택
    const typeRow=h("div",{style:"display:flex;gap:6px;margin-bottom:8px"});
    ["cumulative","specific"].forEach(function(t){
      const label=t==="cumulative"?"📊 누적권수":"📖 특정책";
      typeRow.appendChild(h("button",{style:"flex:1;padding:4px;border-radius:6px;border:1px solid "+(state.rgNewType===t?"#3b82f6":"#334155")+";background:"+(state.rgNewType===t?"#3b82f620":"transparent")+";color:"+(state.rgNewType===t?"#60a5fa":"#64748b")+";font-size:11px;cursor:pointer",onClick:function(){state.rgNewType=t;render()}},label));
    });
    form.appendChild(typeRow);
    // 카테고리 + 이름
    const row1=h("div",{style:"display:flex;gap:6px;margin-bottom:6px"});
    const catSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px;width:100px"});
    CATEGORIES.forEach(function(c){
      const opt=h("option",{value:c.code},c.code);
      if(c.code===state.rgNewCat)opt.selected=true;
      catSel.appendChild(opt);
    });
    catSel.addEventListener("change",function(e){state.rgNewCat=e.target.value});
    row1.appendChild(catSel);
    const nameInp=h("input",{className:"goal-input",placeholder:"목표명 (예: 영어책 100권)",value:state.rgNewName||""});
    nameInp.addEventListener("input",function(e){state.rgNewName=e.target.value});
    nameInp.addEventListener("keydown",function(e){if(e.key==="Enter")addReadingGoal()});
    row1.appendChild(nameInp);
    form.appendChild(row1);
    // cumulative 전용: bookType + targetCount
    if(state.rgNewType==="cumulative"){
      const row2=h("div",{style:"display:flex;gap:6px;margin-bottom:6px;align-items:center"});
      const btSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px;width:90px"});
      [{v:"en",l:"영어책"},{v:"kr",l:"한글책"},{v:"all",l:"전체"}].forEach(function(o){
        const opt=h("option",{value:o.v},o.l);
        if(o.v===state.rgNewBookType)opt.selected=true;
        btSel.appendChild(opt);
      });
      btSel.addEventListener("change",function(e){state.rgNewBookType=e.target.value});
      row2.appendChild(btSel);
      row2.appendChild(h("span",{style:"font-size:11px;color:#64748b"},"목표:"));
      const tgtInp=h("input",{style:"width:60px;padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#0c0f1a;color:#e2e8f0;font-size:11px;text-align:right",type:"number",min:"1",value:String(state.rgNewTarget||100)});
      tgtInp.addEventListener("input",function(e){state.rgNewTarget=parseInt(e.target.value)||100});

    const cat=catByCode(rg.cat);

    const hrs=calcGoalTotalHours(rg.id);
    const card=h("div",{style:"padding:8px 0;border-bottom:1px solid #1e293b"});
    const titleRow=h("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:4px"});
    // 카테고리 편집
    titleRow.appendChild(renderEditableCat(rg.cat,function(newCat){
      rg.cat=newCat;saveGoalData();cloudSaveGoals();_isAutoRender=true;render();
    }));
    // 이름 편집
    titleRow.appendChild(renderEditableName(rg.name,function(newName){
      rg.name=newName;saveGoalData();cloudSaveGoals();_isAutoRender=true;render();
    },"font-size:12px;color:#e2e8f0;font-weight:700;flex:1;"));
    if(hrs>0)titleRow.appendChild(h("span",{style:"font-size:10px;color:#f59e0b;font-family:monospace;font-weight:700;flex-shrink:0"},"("+fmtHours(hrs)+")"));

    titleRow.appendChild(h("button",{className:"goal-del",style:"font-size:11px;color:#ef4444",onClick:function(){

    // 기간 편집 행

      periodEditRow.appendChild(h("span",{style:"font-size:9px;color:#475569"},"~"));

    }else{

      const sySel=h("select",{style:"font-size:9px;background:#111827;border:1px solid #334155;border-radius:4px;color:#64748b;padding:1px 4px"});

    if(rg.type==="specific"){
      const slider=h("input",{type:"range",min:"0",max:"100",value:String(pct),style:"width:60px",onClick:e=>e.stopPropagation()});
      slider.addEventListener("input",function(e){
        rg.progress=parseInt(e.target.value);
        track.firstChild.style.width=rg.progress+"%";

    }

    // 누적형: 책 리스트 토글

      const isOpen=!!state[listKey];
      const toggleBtn=h("button",{style:"font-size:10px;color:#3b82f6;background:transparent;border:none;cursor:pointer;padding:4px 0;text-align:left",onClick:function(){

          var bkey2="books-data-"+y2;
          var raw2=null;
          try{raw2=localStorage.getItem(bkey2)}catch(e){}
          if(!raw2)continue;
          try{
            var bd2=JSON.parse(raw2);
            for(var m2=1;m2<=12;m2++){
              (bd2[String(m2)]||[]).forEach(function(b){
                if(rg.bookType==="all"||b.type===rg.bookType){
                  matchedBooks.push({y:y2,m:m2,b:b});

            brow.appendChild(h("span",{style:"font-size:9px;color:#475569;flex-shrink:0"},item.y+"/"+item.m));
            brow.appendChild(h("span",{style:"font-size:9px;padding:1px 4px;border-radius:3px;flex-shrink:0;background:"+(item.b.type==="en"?"#3b82f620":"#10b98120")+";color:"+(item.b.type==="en"?"#60a5fa":"#34d399")},item.b.type==="en"?"EN":"KR"));
            brow.appendChild(h("span",{style:"flex:1;color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},item.b.title));
            listBox.appendChild(brow);
          });
        }
        card.appendChild(listBox);
      }
    }
    rgBox.appendChild(card);
  });
  wrap.appendChild(rgBox);

  // Year summary cards
  let yearEn=0,yearKr=0,yearTotal=0;
  for(let m=1;m<=12;m++){yearEn+=stats[m].en;yearKr+=stats[m].kr;yearTotal+=stats[m].total}
  const cards=h("div",{className:"book-summary-grid"});
  const c1=h("div",{className:"book-summary-card"});
  c1.appendChild(h("div",{className:"book-summary-value",style:"color:#f59e0b"},String(yearTotal)));
  c1.appendChild(h("div",{className:"book-summary-label"},"전체"));
  cards.appendChild(c1);
  const c2=h("div",{className:"book-summary-card"});
  c2.appendChild(h("div",{className:"book-summary-value",style:"color:#3b82f6"},String(yearEn)));
  c2.appendChild(h("div",{className:"book-summary-label"},"영어책"));
  cards.appendChild(c2);
  const c3=h("div",{className:"book-summary-card"});
  c3.appendChild(h("div",{className:"book-summary-value",style:"color:#10b981"},String(yearKr)));
  c3.appendChild(h("div",{className:"book-summary-label"},"한글책"));
  cards.appendChild(c3);
  wrap.appendChild(cards);

  // Month selector
  const mbar=h("div",{className:"book-month-selector"});
  for(let m=1;m<=12;m++){
    const cnt=(state.bookData[String(m)]||[]).length;
    const label=m+"월"+(cnt>0?" ("+cnt+")":"");
    mbar.appendChild(h("button",{className:"book-month-btn"+(m===state.bookMonth?" active":""),onClick:()=>{state.bookMonth=m;render()}},label));
  }
  wrap.appendChild(mbar);

  // Input section
  const inputSec=h("div",{className:"book-section"});
  inputSec.appendChild(h("h3",{className:"book-section-title"},"📖 "+state.bookMonth+"월 독서 기록"));

  const typeRow=h("div",{style:"display:flex;gap:8px;margin-bottom:10px"});
  const enBtn=h("button",{className:"book-type-btn"+(state.bookNewType==="en"?" active-en":""),onClick:()=>{state.bookNewType="en";render()}},"🇺🇸 영어책");
  const krBtn=h("button",{className:"book-type-btn"+(state.bookNewType==="kr"?" active-kr":""),onClick:()=>{state.bookNewType="kr";render()}},"🇰🇷 한글책");
  typeRow.appendChild(enBtn);
  typeRow.appendChild(krBtn);
  inputSec.appendChild(typeRow);

  const inputRow=h("div",{className:"book-input-row"});
  const titleInput=h("input",{className:"book-input",placeholder:"책 제목을 입력하세요",value:state.bookNewTitle});
  titleInput.addEventListener("input",e=>{state.bookNewTitle=e.target.value});
  titleInput.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&state.bookNewTitle.trim()){
      addBook(state.bookMonth,state.bookNewType,state.bookNewTitle.trim());
      state.bookNewTitle="";
    }
  });
  inputRow.appendChild(titleInput);
  const addBtn=h("button",{className:"book-add-btn",onClick:()=>{
    if(!state.bookNewTitle.trim())return;
    addBook(state.bookMonth,state.bookNewType,state.bookNewTitle.trim());
    state.bookNewTitle="";
  }},"추가");
  inputRow.appendChild(addBtn);
  inputSec.appendChild(inputRow);

  // Book list for selected month
  const monthBooks=state.bookData[String(state.bookMonth)]||[];
  if(monthBooks.length>0){
    const list=h("div",{className:"book-list"});
    monthBooks.forEach(book=>{
      const item=h("div",{className:"book-item",style:"flex-wrap:wrap"});
      // Type toggle button
      const typeBtn=h("button",{className:"book-type-tag "+(book.type==="en"?"en":"kr"),style:"cursor:pointer",onClick:()=>{
        updateBookField(state.bookMonth,book.id,"type",book.type==="en"?"kr":"en");
        render();
      }},book.type==="en"?"EN":"KR");
      item.appendChild(typeBtn);
      // Editable title
      const titleSpan=h("span",{className:"book-item-title",style:"cursor:pointer",onClick:e=>{
        e.stopPropagation();
        const inp=document.createElement("input");
        inp.className="book-input";
        inp.style="flex:1;font-size:13px;padding:4px 8px;";
        inp.value=book.title;
        inp.addEventListener("blur",()=>{
          if(inp.value.trim()&&inp.value.trim()!==book.title){
            updateBookField(state.bookMonth,book.id,"title",inp.value.trim());
          }
          render();
        });
        inp.addEventListener("keydown",ev=>{if(ev.key==="Enter")inp.blur();if(ev.key==="Escape")render()});
        titleSpan.replaceWith(inp);
        inp.focus();inp.select();
      }},book.title);
      item.appendChild(titleSpan);
      // Date display
      if(book.date){
        item.appendChild(h("span",{style:"font-size:10px;color:#64748b;font-family:'JetBrains Mono',monospace;flex-shrink:0"},book.date));
      }
      item.appendChild(h("button",{className:"book-del-btn",onClick:()=>removeBook(state.bookMonth,book.id)},"✕"));
      // Memo/감상
      const memoInput=h("input",{style:"width:100%;margin-top:6px;padding:6px 10px;border-radius:8px;border:1px solid #1e293b;background:#111827;color:#94a3b8;font-size:11px;font-family:'Noto Sans KR',sans-serif;outline:none",placeholder:"한줄 감상 입력...",value:book.memo||""});
      let memoTimer=null;
      memoInput.addEventListener("input",e=>{
        clearTimeout(memoTimer);
        memoTimer=setTimeout(()=>{updateBookMemo(state.bookMonth,book.id,e.target.value)},800);
      });
      memoInput.addEventListener("focus",e=>{e.target.style.borderColor="#f59e0b"});
      memoInput.addEventListener("blur",e=>{e.target.style.borderColor="#1e293b"});
      item.appendChild(memoInput);
      list.appendChild(item);
    });
    inputSec.appendChild(list);
  }else{
    inputSec.appendChild(h("div",{className:"book-empty"},"이번 달 읽은 책이 없습니다"));
  }
  wrap.appendChild(inputSec);

  // Chart
  const chartSec=h("div",{className:"chart-container"});
  chartSec.appendChild(h("h3",{className:"chart-title"},"📈 월별 독서 추이 (권)"));
  const chartWrap=h("div",{className:"chart-wrap"});
  const canvas=h("canvas",{id:"bookChart"});
  chartWrap.appendChild(canvas);
  chartSec.appendChild(chartWrap);
  wrap.appendChild(chartSec);

  // Yearly table
  const tableSec=h("div",{className:"book-section"});
  tableSec.appendChild(h("h3",{className:"book-section-title"},"📊 연간 독서 현황"));
  const table=h("div",{className:"book-yearly-table"});
  const hdr=h("div",{className:"book-yr-row header"});
  hdr.appendChild(h("span",{className:"book-yr-cell"},""));
  for(let m=1;m<=12;m++)hdr.appendChild(h("span",{className:"book-yr-cell"},m+"월"));
  hdr.appendChild(h("span",{className:"book-yr-cell",style:"font-weight:700"},"합계"));
  table.appendChild(hdr);

  // EN row
  const enRow=h("div",{className:"book-yr-row"});
  enRow.appendChild(h("span",{className:"book-yr-cell",style:"color:#3b82f6;font-weight:700"},"EN"));
  let enSum=0;
  for(let m=1;m<=12;m++){
    const v=stats[m].en;
    enSum+=v;
    enRow.appendChild(h("span",{className:"book-yr-cell",style:v>0?"color:#60a5fa;background:#3b82f620":""},v>0?String(v):"–"));
  }
  enRow.appendChild(h("span",{className:"book-yr-cell",style:"font-weight:700;color:#3b82f6"},String(enSum)));
  table.appendChild(enRow);

  // KR row
  const krRow=h("div",{className:"book-yr-row"});
  krRow.appendChild(h("span",{className:"book-yr-cell",style:"color:#10b981;font-weight:700"},"KR"));
  let krSum=0;
  for(let m=1;m<=12;m++){
    const v=stats[m].kr;
    krSum+=v;
    krRow.appendChild(h("span",{className:"book-yr-cell",style:v>0?"color:#34d399;background:#10b98120":""},v>0?String(v):"–"));
  }
  krRow.appendChild(h("span",{className:"book-yr-cell",style:"font-weight:700;color:#10b981"},String(krSum)));
  table.appendChild(krRow);

  // Total row
  const totRow=h("div",{className:"book-yr-row"});
  totRow.appendChild(h("span",{className:"book-yr-cell",style:"color:#f59e0b;font-weight:700"},"합계"));
  let totSum=0;
  for(let m=1;m<=12;m++){
    const v=stats[m].total;
    totSum+=v;
    totRow.appendChild(h("span",{className:"book-yr-cell",style:v>0?"color:#fbbf24;font-weight:600;background:#f59e0b20":""},v>0?String(v):"–"));
  }
  totRow.appendChild(h("span",{className:"book-yr-cell",style:"font-weight:900;color:#f59e0b;font-size:13px"},String(totSum)));
  table.appendChild(totRow);

  tableSec.appendChild(table);
  wrap.appendChild(tableSec);

  setTimeout(()=>renderBookChart(stats),0);
  return wrap;
}

function renderCatPicker(){
  const ov=h("div",{className:"overlay",onClick:()=>{state.showCatPicker=false;render()}});
  const sheet=h("div",{className:"picker-sheet",onClick:e=>e.stopPropagation()});
  sheet.appendChild(h("div",{className:"picker-handle"}));
  const phdr=h("div",{className:"picker-header"});
  phdr.appendChild(h("span",{className:"picker-title"},"📋 카테고리 선택"));
  phdr.appendChild(h("span",{className:"picker-time"},state.activeSlot+" · "+(state.mode==="plan"?"Plan":"Actual")));
  sheet.appendChild(phdr);

  // Time range selector for batch input
  const rangeRow=h("div",{style:"display:flex;gap:8px;align-items:center;margin-bottom:12px;padding:8px 10px;background:#111827;border-radius:10px"});
  rangeRow.appendChild(h("span",{style:"font-size:11px;color:#94a3b8;flex-shrink:0"},state.activeSlot+" ~"));
  const endSel=h("select",{className:"goal-cat-select",style:"padding:6px 8px;font-size:12px;flex:1"});
  // Build end time options: from activeSlot+30min to 24:00
  const startIdx=SLOTS.indexOf(state.activeSlot);
  const singleOpt=h("option",{value:""},"이 슬롯만");
  endSel.appendChild(singleOpt);
  for(let si=startIdx+1;si<SLOTS.length;si++){
    const hrs=((si-startIdx+1)*0.5);
    const opt=h("option",{value:SLOTS[si]},SLOTS[si]+" ("+hrs+"h)");
    endSel.appendChild(opt);
  }
  endSel.addEventListener("change",function(){state._batchEndSlot=endSel.value});
  rangeRow.appendChild(endSel);
  sheet.appendChild(rangeRow);

  const grid=h("div",{className:"cat-grid"});
  GROUPS.forEach(g=>{
    const pg=h("div",{});
    pg.appendChild(h("div",{className:"picker-group-label",style:"color:"+GC[g]},g+" · "+GN[g]));
    const btns=h("div",{className:"picker-btns"});
    groupCats(g).forEach(c=>{
      const btn=h("button",{className:"picker-btn",style:"background:"+c.color+"18;border-color:"+c.color+"40",onClick:()=>{
        const field=state.mode==="plan"?"plan":"actual";
        const endSlot=state._batchEndSlot||"";
        if(endSlot){
          // Batch apply: from activeSlot to endSlot (inclusive)
          const si=SLOTS.indexOf(state.activeSlot);
          const ei=SLOTS.indexOf(endSlot);
          for(let idx=si;idx<=ei;idx++){
            setSlotSilent(SLOTS[idx],field,c.code);
          }
          save();
        }else{
          setSlotSilent(state.activeSlot,field,c.code);
          save();
        }
        state._batchEndSlot="";
        state.showCatPicker=false;render();
      }});
      btn.appendChild(h("span",{className:"picker-code",style:"color:"+c.color},c.code));
      btn.appendChild(h("span",{className:"picker-label"},c.label));
      btns.appendChild(btn);
    });
    pg.appendChild(btns);
    grid.appendChild(pg);
  });
  sheet.appendChild(grid);
  ov.appendChild(sheet);
  return ov;
}

// Track if user is actively typing in an input/textarea
// Only blocks automatic background renders (cloud sync), not user-initiated renders
var _isEditing=false;
var _isAutoRender=false;
document.addEventListener("focusin",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")_isEditing=true;
});
document.addEventListener("focusout",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"){
    setTimeout(()=>{
      var ae=document.activeElement;
      if(!ae||ae.tagName==="BODY"||ae.tagName==="BUTTON"||ae.tagName==="DIV")_isEditing=false;
      // SELECT로 이동한 경우도 편집 중으로 유지
    },100);
  }
});
function render(force){
  // Only block render if it's an automatic background render AND user is editing
  if(_isEditing&&_isAutoRender&&!force)return;
  _isAutoRender=false;
  // 차트 인스턴스 사전 파괴 — DOM 교체 전에 해야 메모리 누수 없음
  try{if(lineChartInst){lineChartInst.destroy();lineChartInst=null}}catch(e){}
  try{if(barChartInst){barChartInst.destroy();barChartInst=null}}catch(e){}
  try{if(dashDailyChartInst){dashDailyChartInst.destroy();dashDailyChartInst=null}}catch(e){}
  try{if(dailyMonthChartInst){dailyMonthChartInst.destroy();dailyMonthChartInst=null}}catch(e){}
  try{if(bookChartInst){bookChartInst.destroy();bookChartInst=null}}catch(e){}
  try{if(window._reviewDailyChartInst){window._reviewDailyChartInst.destroy();window._reviewDailyChartInst=null}}catch(e){}
  const app=document.getElementById("app");
  app.innerHTML="";
  app.appendChild(renderHeader());
  app.appendChild(renderTabs());
  // ── 전역 검색창 ──────────────────────────────────────────────
  const searchBar=h("div",{style:"display:flex;align-items:center;gap:8px;padding:7px 12px;background:#0c0f1a;border-bottom:1px solid #1e293b;position:sticky;top:98px;z-index:39"});
  const searchInp=h("input",{
    placeholder:"🔍  목표 / 습관 / 독서목표 검색...",
    value:state.goalSearch||"",
    style:"flex:1;background:#111827;border:1px solid #1e293b;border-radius:8px;padding:6px 10px;font-size:12px;color:#e2e8f0;outline:none"
  });
  searchInp.className="goal-search-inp";
  let _srComposing=false;
  function _srUpdate(val){
    state.goalSearch=val;
    _refreshGlobalSearch();
  }
  searchInp.addEventListener("compositionstart",function(){_srComposing=true;});
  searchInp.addEventListener("compositionend",function(e){_srComposing=false;_srUpdate(e.target.value);});
  searchInp.addEventListener("input",function(e){if(!_srComposing)_srUpdate(e.target.value);});
  searchInp.addEventListener("keydown",function(e){if(e.key==="Escape"){state.goalSearch="";searchInp.value="";_refreshGlobalSearch();}});
  const clrBtn=h("button",{
    id:"__gsClr",
    style:"background:transparent;border:none;color:#64748b;font-size:16px;cursor:pointer;padding:0 4px;display:"+(state.goalSearch?"":"none"),
    onClick:function(){state.goalSearch="";searchInp.value="";_refreshGlobalSearch();searchInp.focus();}
  },"✕");
  searchBar.appendChild(searchInp);
  searchBar.appendChild(clrBtn);
  app.appendChild(searchBar);
  // ── 메인 콘텐츠 ─────────────────────────────────────────────
  const main=h("div",{className:"main",id:"__globalSearchContent"});
  const _gsq=(state.goalSearch||"").trim().toLowerCase();
  if(_gsq){
    main.appendChild(buildGoalSearchResults(_gsq));
  }else{
    if(state.tab==="input"){
      main.appendChild(renderDateBar());
      if(state.showDatePicker)main.appendChild(renderDatePicker());
    }
    if(state.tab==="input")main.appendChild(renderInput());
    if(state.tab==="goals")main.appendChild(renderGoals());
    if(state.tab==="review")main.appendChild(renderReview());
  }
  app.appendChild(main);
  if(state.showDatePicker&&state.tab==="goals")app.appendChild(renderDatePicker());
  if(state.showCatPicker)app.appendChild(renderCatPicker());
}
