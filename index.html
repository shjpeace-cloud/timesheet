  var hasAny=false;
  uppers.forEach(function(us){
    var candidates=getCandidatesForScope(us,goal.cat);
    if(pids[us]){
      var currentParent=candidates.find(function(g){return g.id===pids[us]});
      if(!currentParent){
        var found=findGoalById(pids[us]);
        if(found)candidates=[found.goal].concat(candidates);
      }
    }
    if(candidates.length===0)return;
    hasAny=true;
    var label=us==="habits"?"습관":us==="readingGoals"?"독서목표":(SCOPE_LABELS[us]||us);
    var row=h("div",{style:"display:flex;gap:6px;align-items:center;padding:2px 0"});

    var sel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px;flex:1"});
    var noneOpt=h("option",{value:""},"없음");
    if(!pids[us])noneOpt.selected=true;
    sel.appendChild(noneOpt);
    candidates.forEach(function(g){
      var opt=h("option",{value:String(g.id)},g.name);
      if(pids[us]===g.id)opt.selected=true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change",(function(upperScope){return function(e){
      if(!goal.parentIds)goal.parentIds={};

      saveGoalData();render(true);
    }})(us));
    row.appendChild(sel);
    wrap.appendChild(row);
  });
  if(!hasAny)return null;
  return wrap;
}

  });
  const readingActive=(state.goalData.readingGoals||[]).filter(g=>{
    if(calcReadingGoalProgress(g)>=100)return false;
    if(g.type==="specific"){
      const today=new Date(state.year,state.month-1,state.day);
      // 날짜 기반 (신규)
      if(g.startDate||g.endDate){
        const sd=g.startDate?new Date(g.startDate):null;
        const ed=g.endDate?new Date(g.endDate):null;
        if(sd&&today<sd)return false;
        if(ed&&today>ed)return false;
        return true;
      }
      // 연도 기반 폴백 (구버전 데이터)
      if(g.startYear||g.endYear){
        const sy=g.startYear||state.year;
        const ey=g.endYear||2040;
        return sy<=state.year&&state.year<=ey;
      }
      // 아무것도 없으면 표시
      return true;
    }else{
      const sy=g.startYear||2025;
      const ey=g.endYear||2040;
      return sy<=state.year&&state.year<=ey;
    }
  });
  if(weeklyActive.length+monthlyActive.length+longtermActive.length+readingActive.length>0){
    const ctx=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:10px;margin-bottom:10px;border:1px solid #1e293b"});
    ctx.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:6px;letter-spacing:.5px"},"이 시기의 목표"));
    const ctxGroups=[
      {label:"🎯 장기",list:longtermActive,scope:"longterm"},
      {label:"📚 독서",list:readingActive,scope:"readingGoals"},
      {label:"🗓 월간",list:monthlyActive,scope:"monthly"},
      {label:"📆 주간",list:weeklyActive,scope:"weekly"}
    ];
    let renderedGroupCount=0;
    ctxGroups.forEach(grp=>{
      if(grp.list.length===0)return;
      if(renderedGroupCount>0){
        ctx.appendChild(h("div",{style:"border-top:1px solid #1e293b;margin:6px 0"}));
      }
      grp.list.forEach(g=>{
        const cat=catByCode(g.cat);
        const row=h("div",{style:"display:flex;align-items:center;gap:6px;padding:4px 0;font-size:11px"});
        row.appendChild(h("span",{style:"font-size:9px;color:#64748b;width:30px"},grp.label.split(" ")[0]));
        row.appendChild(h("span",{className:"goal-cat-tag",style:"background:"+(cat?cat.color:"#475569")+";font-size:9px;padding:1px 5px"},g.cat));
        row.appendChild(h("span",{style:"flex:1;color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},g.name));
        // Hours
        const ctxHrs=calcGoalTotalHours(g.id);
        if(ctxHrs>0)row.appendChild(h("span",{style:"font-size:9px;color:#f59e0b;font-family:monospace;font-weight:700;flex-shrink:0"},fmtHours(ctxHrs)));
        // 진도
        const pct=grp.scope==="readingGoals"?calcReadingGoalProgress(g):(g.progress||0);
        const pctColor=grp.scope==="readingGoals"?"#3b82f6":"#0d9488";
        const track=h("div",{style:"width:50px;height:4px;background:#1e293b;border-radius:2px;overflow:hidden"});
        track.appendChild(h("div",{style:"height:100%;width:"+pct+"%;background:"+pctColor}));
        row.appendChild(track);
        // 독서 누적형: 권수 표시
        if(grp.scope==="readingGoals"&&g.type==="cumulative"){
          const cnt=calcReadingGoalCount(g);
          row.appendChild(h("span",{style:"font-size:9px;color:#3b82f6;font-family:monospace;font-weight:700;width:46px;text-align:right"},cnt+"/"+g.targetCount));
        }else{
          row.appendChild(h("span",{style:"font-size:10px;color:"+pctColor+";font-family:monospace;font-weight:700;width:30px;text-align:right"},pct+"%"));
        }
        ctx.appendChild(row);
      });
      renderedGroupCount++;
    });
    wrap.appendChild(ctx);
  }

  // ── 오늘의 습관 섹션 ──
  const activeHabits=(state.goalData.habits||[]).filter(function(hb){
    // 기간 내 여부 확인
    var sp=hb.startDate.split("-");var ep=hb.endDate.split("-");
    var sd=new Date(parseInt(sp[0]),parseInt(sp[1])-1,parseInt(sp[2]));
    var ed=new Date(parseInt(ep[0]),parseInt(ep[1])-1,parseInt(ep[2]));
    var cur=new Date(state.year,state.month-1,state.day);
    return cur>=sd&&cur<=ed;
  });
  if(activeHabits.length>0){
    const hbox=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:10px;margin-bottom:10px;border:1px solid #1e293b"});
    hbox.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:6px;letter-spacing:.5px"},"오늘의 습관"));
    // 이번 주 월요일 계산 (주간 진도용)
    const curDt=new Date(state.year,state.month-1,state.day);
    const curDow=curDt.getDay();
    const mon=new Date(curDt);mon.setDate(curDt.getDate()+(curDow===0?-6:1-curDow));
    activeHabits.forEach(function(hb){
      const cat=catByCode(hb.cat);
      const autoChecked=isHabitAutoChecked(hb,state.year,state.month,state.day);
      const manualChecked=!!(hb.completions&&hb.completions[habitKey(state.year,state.month,state.day)]);
      const done=autoChecked||manualChecked;
      const row=h("div",{style:"display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1e293b"+(activeHabits[activeHabits.length-1]===hb?";border-bottom:none":"")});
      // 체크박스: 자동체크면 비활성(읽기전용), 수동은 토글 가능
      const chk=h("input",{type:"checkbox",style:"width:16px;height:16px;accent-color:"+(autoChecked?"#f59e0b":"#0d9488")+";flex-shrink:0;cursor:"+(autoChecked?"default":"pointer")});
      chk.checked=done;
      if(!autoChecked){
        chk.addEventListener("change",function(){toggleHabit(hb.id,state.year,state.month,state.day)});
      }
      row.appendChild(chk);
      row.appendChild(h("span",{className:"goal-cat-tag",style:"background:"+(cat?cat.color:"#475569")+";font-size:9px;padding:1px 5px;flex-shrink:0"},hb.cat));
      // 이름 + 누적시간 + 자동체크 뱃지
      const nameWrap=h("div",{style:"flex:1;display:flex;align-items:center;gap:4px;overflow:hidden;min-width:0"});
      nameWrap.appendChild(h("span",{style:"font-size:12px;color:"+(done?"#0d9488":"#cbd5e1")+(done?";text-decoration:line-through":"")+";overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},hb.name));
      if(autoChecked)nameWrap.appendChild(h("span",{style:"font-size:9px;color:#f59e0b;flex-shrink:0"},"⚡"));
      const hrsId=hb.longtermId||hb.id;
      const hrs=calcGoalTotalHours(hrsId);
      if(hrs>0)nameWrap.appendChild(h("span",{style:"font-size:9px;color:#f59e0b;font-family:monospace;font-weight:700;flex-shrink:0"},"("+fmtHours(hrs)+")"));
      row.appendChild(nameWrap);
      // 주간 진도
      const wPct=calcHabitWeeklyPct(hb,mon);
      const progWrap=h("div",{style:"display:flex;align-items:center;gap:4px;flex-shrink:0"});
      const wTrack=h("div",{style:"width:36px;height:4px;background:#1e293b;border-radius:2px;overflow:hidden"});
      wTrack.appendChild(h("div",{style:"height:100%;width:"+wPct+"%;background:#0d9488;transition:width .3s"}));
      progWrap.appendChild(wTrack);
      progWrap.appendChild(h("span",{style:"font-size:9px;color:#0d9488;font-family:monospace;font-weight:700;width:28px;text-align:right"},wPct+"%"));
      row.appendChild(progWrap);
      hbox.appendChild(row);
    });
    // 장기 전체 진도 요약
    const ltRow=h("div",{style:"display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:6px;border-top:1px solid #1e293b"});
    ltRow.appendChild(h("span",{style:"font-size:9px;color:#475569;flex-shrink:0"},"전체"));
    const totalDone=activeHabits.reduce(function(s,hb){return s+Object.keys(hb.completions||{}).length},0);
    const avgPct=activeHabits.length>0?Math.round(totalDone/activeHabits.length/HABIT_TOTAL_DAYS*100):0;
    const ltTrack=h("div",{style:"flex:1;height:4px;background:#1e293b;border-radius:2px;overflow:hidden"});
    ltTrack.appendChild(h("div",{style:"height:100%;width:"+avgPct+"%;background:#7c3aed"}));
    ltRow.appendChild(ltTrack);
    ltRow.appendChild(h("span",{style:"font-size:9px;color:#7c3aed;font-family:monospace;font-weight:700"},avgPct+"%"));
    hbox.appendChild(ltRow);
    wrap.appendChild(hbox);
  }
  const form=h("div",{className:"goal-form"});
  const row=h("div",{className:"goal-form-row"});
  const sel=h("select",{className:"goal-cat-select"});
  CATEGORIES.forEach(c=>{
    const opt=h("option",{value:c.code},c.code+" "+c.label);
    if(c.code===state.goalNewCat)opt.selected=true;
    sel.appendChild(opt);
  });
  sel.addEventListener("change",e=>{state.goalNewCat=e.target.value;state.goalNewParentIds={};render()});
  row.appendChild(sel);
  const inp=h("input",{className:"goal-input",placeholder:"오늘의 목표",value:state.goalNewName});
  inp.addEventListener("input",e=>{state.goalNewName=e.target.value});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")addDailyGoal()});
  row.appendChild(inp);
  row.appendChild(h("button",{className:"goal-add-btn",onClick:addDailyGoal},"+"));
  form.appendChild(row);
  // Parent goal selectors (one per upper scope)
  const parentSels=renderParentSelectors("daily",state.goalNewCat);
  if(parentSels){
    const prow=h("div",{className:"goal-form-row",style:"padding-top:0;flex-direction:column"});
    prow.appendChild(h("span",{style:"font-size:10px;color:#64748b;margin-bottom:2px"},"📎 상위 목표:"));
    prow.appendChild(parentSels);
    form.appendChild(prow);
  }
  wrap.appendChild(form);

  // Carryover: find incomplete daily goals from days that have ALREADY PASSED (based on today)
  // "Already passed" means yesterday or earlier — today is still in progress
  const carryoverGoals=[];
  (function(){
    const viewDate=new Date(state.year,state.month-1,state.day);
    // Look back from viewDate going backward (always show past incomplete goals)
    for(let i=1;i<=30;i++){
      const checkDate=new Date(viewDate);
      checkDate.setDate(checkDate.getDate()-i);
      if(checkDate.getFullYear()!==state.year)break;
      const pk=(checkDate.getMonth()+1)+"-"+checkDate.getDate();
      const plist=state.goalData.daily[pk]||[];
      plist.forEach(g=>{
        if(!g.done)carryoverGoals.push({goal:g,fromDate:pk,origKey:pk});
      });
    }
  })();

  // List
  const k=state.month+"-"+state.day;
  const list=state.goalData.daily[k]||[];
  const hasAny=list.length>0||carryoverGoals.length>0;
  if(!hasAny){
    wrap.appendChild(h("div",{className:"goal-empty"},"오늘 목표가 없습니다"));
  }else{
    const ul=h("div",{className:"goal-list"});
    const doneCount=list.filter(g=>g.done).length;
    const stat=h("div",{style:"font-size:11px;color:#64748b;margin-bottom:6px;text-align:right"},doneCount+"/"+list.length+" 완료");
    ul.appendChild(stat);

    // Show carryover goals first (in red)
    if(carryoverGoals.length>0){
      ul.appendChild(h("div",{style:"font-size:10px;color:#ef4444;font-weight:700;padding:4px 0;margin-bottom:4px;border-bottom:1px solid #7f1d1d"},"🔴 이연된 목표 ("+carryoverGoals.length+")"));
      carryoverGoals.forEach(co=>{
        const g=co.goal;
        const cat=catByCode(g.cat);
        const item=h("div",{className:"goal-item",style:"border:1px solid #7f1d1d;background:#1a0505"});
        const expKey="daily-"+g.id;
        const isExpanded=!!state.goalExpanded[expKey];
        const r=h("div",{className:"goal-item-row"});
        // Expand toggle
        r.appendChild(h("button",{className:"goal-del",style:"font-size:11px;padding:2px 4px;color:#fca5a5",onClick:()=>{state.goalExpanded[expKey]=!state.goalExpanded[expKey];render()}},isExpanded?"▼":"▶"));
        const chk=h("button",{className:"goal-check",style:"border-color:#ef4444",onClick:()=>{
          const origList=state.goalData.daily[co.origKey]||[];
          const og=origList.find(x=>x.id===g.id);
          if(og){markGoalDone(og,true);saveGoalData();render(true);}
        }},"");
        r.appendChild(chk);
        r.appendChild(renderEditableCat(g.cat,newCat=>{
          updateDailyGoalField(co.origKey,g.id,"cat",newCat);render();
        }));
        r.appendChild(renderEditableName(g.name,newName=>{
          updateDailyGoalField(co.origKey,g.id,"name",newName);
        },"color:#fca5a5;"));
        r.appendChild(h("span",{style:"font-size:9px;color:#ef4444;font-family:monospace;flex-shrink:0"},co.fromDate));
        // Hours
        const coHrs=calcGoalTotalHours(g.id);
        if(coHrs>0)r.appendChild(h("span",{style:"font-size:10px;color:#f59e0b;font-family:'JetBrains Mono',monospace;font-weight:700;flex-shrink:0"},fmtHours(coHrs)));
        // Date move button
        r.appendChild(h("button",{className:"goal-del",style:"font-size:11px;padding:2px 4px;color:#fca5a5",onClick:e=>{
          e.stopPropagation();
          const ov=document.createElement("div");
          ov.style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center";
          ov.addEventListener("click",()=>ov.remove());
          const box=document.createElement("div");
          box.style="background:#1e293b;border-radius:16px;padding:16px;max-width:320px;width:90%;border:1px solid #334155";
          box.addEventListener("click",ev=>ev.stopPropagation());
          box.appendChild(h("div",{style:"font-size:13px;font-weight:700;margin-bottom:12px;color:#e2e8f0"},"📅 날짜 이동 (원래: "+co.fromDate+")"));
          const dateRow=h("div",{style:"display:flex;gap:8px;align-items:center;margin-bottom:12px"});
          const mSel=h("select",{className:"goal-cat-select",style:"padding:6px 8px"});
          for(let m=1;m<=12;m++){const o=h("option",{value:String(m)},m+"월");if(m===state.month)o.selected=true;mSel.appendChild(o)}
          dateRow.appendChild(mSel);
          const dSel=h("select",{className:"goal-cat-select",style:"padding:6px 8px"});
          for(let d=1;d<=31;d++){const o=h("option",{value:String(d)},d+"일");if(d===state.day)o.selected=true;dSel.appendChild(o)}
          dateRow.appendChild(dSel);
          box.appendChild(dateRow);
          const moveBtn=h("button",{className:"goal-add-btn",style:"width:100%;padding:10px",onClick:()=>{
            const newM=parseInt(mSel.value);const newD=parseInt(dSel.value);
            const maxD=daysInMonth(state.year,newM);const finalD=Math.min(newD,maxD);
            const newKey=newM+"-"+finalD;
            if(newKey===co.origKey){ov.remove();return;}
            if(!state.goalData.daily[newKey])state.goalData.daily[newKey]=[];
            state.goalData.daily[newKey].push(g);
            state.goalData.daily[co.origKey]=state.goalData.daily[co.origKey].filter(x=>x.id!==g.id);
            if(state.goalData.daily[co.origKey].length===0)delete state.goalData.daily[co.origKey];
            saveGoalData();ov.remove();render(true);
          }},"이동");
          box.appendChild(moveBtn);
          ov.appendChild(box);
          document.body.appendChild(ov);
        }},"📅"));
        r.appendChild(h("button",{className:"goal-del",onClick:()=>{
          state.goalData.daily[co.origKey]=state.goalData.daily[co.origKey].filter(x=>x.id!==g.id);
          if(state.goalData.daily[co.origKey].length===0)delete state.goalData.daily[co.origKey];
          saveGoalData();render(true);
        }},"✕"));
        item.appendChild(r);
        // Ancestry
        const coAnc=renderAncestry(g);
        if(coAnc)item.appendChild(coAnc);
        // Expanded: parent edit
        if(isExpanded){
          const subWrap=h("div",{style:"margin-top:6px;padding:8px;background:#111827;border-radius:8px;border:1px dashed #7f1d1d"});
          const parentEditEl=renderParentEditSelectors("daily",g);
          if(parentEditEl)subWrap.appendChild(parentEditEl);
          if(subWrap.children.length>0)item.appendChild(subWrap);
        }
        ul.appendChild(item);
      });
      if(list.length>0){
        ul.appendChild(h("div",{style:"border-top:1px solid #1e293b;margin:8px 0"}));
      }
    }

    list.forEach(g=>{
      const cat=catByCode(g.cat);
      const item=h("div",{className:"goal-item"+(g.done?" done":"")});
      const expKey="daily-"+g.id;
      const isExpanded=!!state.goalExpanded[expKey];
      const r=h("div",{className:"goal-item-row"});
      // Expand toggle
      const toggleBtn=h("button",{className:"goal-del",style:"font-size:11px;padding:2px 4px;color:#94a3b8",onClick:()=>{state.goalExpanded[expKey]=!state.goalExpanded[expKey];render()}},isExpanded?"▼":"▶");
      r.appendChild(toggleBtn);
      const chk=h("button",{className:"goal-check"+(g.done?" checked":""),onClick:()=>toggleDailyGoal(g.id)},g.done?"✓":"");
      r.appendChild(chk);
      r.appendChild(renderEditableCat(g.cat,newCat=>{
        updateDailyGoalField(k,g.id,"cat",newCat);render();
      }));
      r.appendChild(renderEditableName(g.name,newName=>{
        updateDailyGoalField(k,g.id,"name",newName);
      },g.done?"text-decoration:line-through;color:#64748b;":""));
      // Date move button
      r.appendChild(h("button",{className:"goal-del",style:"font-size:11px;padding:2px 4px;color:#94a3b8",onClick:e=>{
        e.stopPropagation();
        const ov=document.createElement("div");
        ov.style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center";
        ov.addEventListener("click",()=>ov.remove());
        const box=document.createElement("div");
        box.style="background:#1e293b;border-radius:16px;padding:16px;max-width:320px;width:90%;border:1px solid #334155";
        box.addEventListener("click",ev=>ev.stopPropagation());
        box.appendChild(h("div",{style:"font-size:13px;font-weight:700;margin-bottom:12px;color:#e2e8f0"},"📅 날짜 이동"));
        const dateRow=h("div",{style:"display:flex;gap:8px;align-items:center;margin-bottom:12px"});
        const mSel=h("select",{className:"goal-cat-select",style:"padding:6px 8px"});
        for(let m=1;m<=12;m++){const o=h("option",{value:String(m)},m+"월");if(m===state.month)o.selected=true;mSel.appendChild(o)}
        dateRow.appendChild(mSel);
        const dSel=h("select",{className:"goal-cat-select",style:"padding:6px 8px"});
        for(let d=1;d<=31;d++){const o=h("option",{value:String(d)},d+"일");if(d===state.day)o.selected=true;dSel.appendChild(o)}
        dateRow.appendChild(dSel);
        box.appendChild(dateRow);
        const moveBtn=h("button",{className:"goal-add-btn",style:"width:100%;padding:10px",onClick:()=>{
          const newM=parseInt(mSel.value);
          const newD=parseInt(dSel.value);
          const maxD=daysInMonth(state.year,newM);
          const finalD=Math.min(newD,maxD);
          const newKey=newM+"-"+finalD;
          if(newKey===k){ov.remove();return;}
          if(!state.goalData.daily[newKey])state.goalData.daily[newKey]=[];
          state.goalData.daily[newKey].push(g);
          state.goalData.daily[k]=state.goalData.daily[k].filter(x=>x.id!==g.id);
          if(state.goalData.daily[k].length===0)delete state.goalData.daily[k];
          saveGoalData();ov.remove();render(true);
        }},"이동");
        box.appendChild(moveBtn);
        ov.appendChild(box);
        document.body.appendChild(ov);
      }},"📅"));
      // Hours display
      const dailyHrs=calcGoalTotalHours(g.id);
      if(dailyHrs>0)r.appendChild(h("span",{style:"font-size:10px;color:#f59e0b;font-family:'JetBrains Mono',monospace;font-weight:700;flex-shrink:0"},fmtHours(dailyHrs)));
      r.appendChild(h("button",{className:"goal-del",onClick:()=>removeDailyGoal(g.id)},"✕"));
      item.appendChild(r);
      // Ancestry breadcrumb
      const anc=renderAncestry(g);
      if(anc)item.appendChild(anc);
      // Expanded: parent edit
      if(isExpanded){
        const subWrap=h("div",{style:"margin-top:6px;padding:8px;background:#111827;border-radius:8px;border:1px dashed #1e293b"});
        const parentEditEl=renderParentEditSelectors("daily",g);
        if(parentEditEl)subWrap.appendChild(parentEditEl);
        if(subWrap.children.length>0)item.appendChild(subWrap);
      }
      ul.appendChild(item);
    });
    wrap.appendChild(ul);
  }
  return wrap;
}

// ── 목표 탭 네비게이션 헬퍼 ─────────────────────────────────
function navigateToGoal(scope,goal){
  state.tab="goals";
  state._addForm=null;
  state.goalSearch="";
  state.goalScope=scope;
  // 해당 목표를 DREAM 트리에서 확장
  var dk=null;
  if(scope==="daily"){
    for(var k in state.goalData.daily){
      if((state.goalData.daily[k]||[]).find(function(x){return x.id===goal.id})){dk=k;break;}
    }
  }
  state._expandedGoal={id:goal.id,scope:scope,dk:dk};
  // 카테고리 필터를 해당 DREAM 그룹으로
  if(goal.cat){
    var cObj=catByCode(goal.cat);
    if(cObj)state.goalTreeCat=cObj.group||"all";
  }
  render(true);
}

function renderPeriodGoals(scope){
  const wrap=h("div",{});

  // Period selector (above form)
  if(scope==="monthly"){
    const mbar=h("div",{className:"book-month-selector"});
    for(let m=1;m<=12;m++){
      const cnt=(state.goalData.monthly||[]).filter(g=>{
        if(g.year!==state.year)return false;
        const sm=g.startMonth||g.month;
        const em=g.endMonth||g.month;
        return sm<=m&&m<=em;
      }).length;
      const lbl=m+"월"+(cnt>0?" ("+cnt+")":"");

          const isToday=valid&&today.getFullYear()===state.year&&today.getMonth()+1===state.goalWeekMonth&&today.getDate()===actualDay;

          if(chHrs>0)chRow.appendChild(h("span",{style:"font-size:9px;color:#f59e0b;font-family:monospace;flex-shrink:0"},fmtHours(chHrs)));
          chRow.appendChild(h("span",{style:"font-size:9px;color:#0d9488;flex-shrink:0"},"↗"));
          childWrap.appendChild(chRow);
        });
        item.appendChild(childWrap);
      }
      // Progress: auto bar (with subtasks) or manual slider (without)
      const pr=h("div",{className:"goal-progress-row"});
      if(hasSub){
        // Read-only progress bar
        const pct=g.progress||0;
        const track=h("div",{style:"flex:1;height:6px;background:#1e293b;border-radius:3px;overflow:hidden"});
        track.appendChild(h("div",{style:"height:100%;width:"+pct+"%;background:#0d9488;transition:width .3s"}));
        pr.appendChild(track);
        pr.appendChild(h("span",{className:"goal-progress-val"},pct+"%"));
      }else{
        // Manual slider
        const slider=h("input",{type:"range",min:"0",max:"100",step:"5",value:String(g.progress||0),className:"goal-progress-slider"});
        const valSpan=h("span",{className:"goal-progress-val"},(g.progress||0)+"%");
        slider.addEventListener("input",e=>{
          const v=parseInt(e.target.value);
          valSpan.textContent=v+"%";
          updateGoalProgress(scope,g.id,v);
        });
        pr.appendChild(slider);
        pr.appendChild(valSpan);
      }
      item.appendChild(pr);
      // Meta: editable period display
      if(scope==="weekly"){
        const meta=h("div",{className:"goal-meta",style:"cursor:pointer",onClick:()=>toggleGoalExpand(scope,g.id)});
        var wkRange;
        if(g.startDay&&g.endDay){
          wkRange=g.month+"월 "+g.startDay+"일~"+g.endDay+"일";
        }else{
          wkRange=g.month+"월 "+g.weekIdx+"주 ("+weekDateRange(state.year,g.month,g.weekIdx)+")";
        }
        meta.appendChild(h("span",{className:"goal-meta-item"},"📆 "+wkRange));
        // planDays 요약 (있을 때)
        if(g.planDays&&g.planDays.length>0){
          var sdSorted=g.planDays.slice().sort(function(a,b){
            var ap=a.split("-"),bp=b.split("-");
            return (parseInt(ap[0])*100+parseInt(ap[1]))-(parseInt(bp[0])*100+parseInt(bp[1]));
          });
          var sdStr=sdSorted.map(function(dk){return dk.split("-")[1]+"일"}).join(", ");
          var metaCat=catByCode(g.cat);
          meta.appendChild(h("span",{style:"font-size:9px;color:"+(metaCat?metaCat.color:"#94a3b8")+";font-family:monospace;margin-left:6px"},"→ "+sdStr));
        }
        item.appendChild(meta);
      }
      if(scope==="monthly"&&(g.startMonth||g.endMonth)){
        const sm=g.startMonth||g.month;
        const em=g.endMonth||g.month;
        const rangeTxt=sm===em?(sm+"월"):(sm+"~"+em+"월");
        const meta=h("div",{className:"goal-meta"});
        meta.appendChild(h("span",{className:"goal-meta-item"},"🗓 "+rangeTxt));
        item.appendChild(meta);
      }
      if(scope==="longterm"&&(g.startYear||g.endYear||g.targetYear)){
        const meta=h("div",{className:"goal-meta"});
        const sy=g.startYear||g.targetYear;
        const ey=g.endYear||g.targetYear;
        const rangeTxt=sy===ey?(sy+"년"):(sy+"~"+ey);
        meta.appendChild(h("span",{className:"goal-meta-item"},"🎯 "+rangeTxt));
        item.appendChild(meta);
      }
      // Editable memo (inline)
      if(g.memo){
        const memoDiv=h("div",{className:"goal-memo",style:"cursor:pointer",onClick:e=>{
          e.stopPropagation();
          const inp=document.createElement("input");
          inp.className="goal-input";
          inp.style="width:100%;font-size:11px;padding:6px 8px;margin-top:4px;";
          inp.value=g.memo;
          inp.addEventListener("blur",()=>{
            updatePeriodGoalField(scope,g.id,"memo",inp.value.trim());
            render();
          });
          inp.addEventListener("keydown",ev=>{if(ev.key==="Enter")inp.blur();if(ev.key==="Escape")render()});
          memoDiv.replaceWith(inp);
          inp.focus();
        }},g.memo);
        item.appendChild(memoDiv);
      }
      // Subtasks (when expanded)
      if(isExpanded){
        const subWrap=h("div",{style:"margin-top:6px;padding:8px;background:#111827;border-radius:8px;border:1px dashed #1e293b"});

        // Period edit controls
        if(scope==="weekly"){
          const periodRow=h("div",{style:"display:flex;gap:6px;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e293b;font-size:11px"});
          periodRow.appendChild(h("span",{style:"color:#64748b;font-size:10px;flex-shrink:0"},"📆 기간:"));
          const mSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          for(let m=1;m<=12;m++){const o=h("option",{value:String(m)},m+"월");if(m===g.month)o.selected=true;mSel.appendChild(o)}
          mSel.addEventListener("change",e=>{
            const nm=parseInt(e.target.value);
            updatePeriodGoalField(scope,g.id,"month",nm);
            const wm=weeksInMonth(state.year,nm);
            if(g.weekIdx>wm)updatePeriodGoalField(scope,g.id,"weekIdx",wm);
            render();
          });
          periodRow.appendChild(mSel);
          const wSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          const wm=weeksInMonth(state.year,g.month);
          for(let w=1;w<=wm;w++){const o=h("option",{value:String(w)},w+"주");if(w===g.weekIdx)o.selected=true;wSel.appendChild(o)}
          wSel.addEventListener("change",e=>{updatePeriodGoalField(scope,g.id,"weekIdx",parseInt(e.target.value));render()});
          periodRow.appendChild(wSel);
          subWrap.appendChild(periodRow);

          // ── 날짜 지정 (이 주 중 작업할 날) ──────────────────
          (function(gRef){
            var gCat=catByCode(gRef.cat);
            var gColor=gCat?gCat.color:"#94a3b8";
            if(!gRef.planDays)gRef.planDays=[];
            // 이 목표의 주 날짜 배열 계산
            var wkFirst=new Date(state.year,gRef.month-1,1);
            var wkFirstDow=wkFirst.getDay();
            var wkStartDay,wkEndDay;
            var wkTotalDays=daysInMonth(state.year,gRef.month);
            var wkWm=weeksInMonth(state.year,gRef.month);
            if(gRef.weekIdx===1){wkStartDay=1;wkEndDay=Math.min(7-wkFirstDow,wkTotalDays);}
            else{wkStartDay=7-wkFirstDow+1+(gRef.weekIdx-2)*7;wkEndDay=Math.min(wkStartDay+6,wkTotalDays);}
            var DOW_SH=["월","화","수","목","금","토","일"];
            const pdRow=h("div",{style:"margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e293b"});
            pdRow.appendChild(h("div",{style:"font-size:9px;color:#64748b;margin-bottom:5px;font-weight:700"},"📅 작업 날짜:"));
            const btnWrap=h("div",{style:"display:flex;flex-wrap:wrap;gap:4px"});
            // 이 주의 각 날짜에 대해 버튼 생성
            var cellDate=new Date(state.year,gRef.month-1,wkStartDay);
            var startDow=cellDate.getDay(); // 0=Sun
            var startOffset=startDow===0?6:startDow-1; // Mon=0
            for(var pdI=0;pdI<7;pdI++){
              var actualDay=wkStartDay+pdI-startOffset;
              if(actualDay<1||actualDay>wkTotalDays)continue;
              var dayKey=gRef.month+"-"+actualDay;
              var dowIdx=(startDow-1+pdI)%7; if(dowIdx<0)dowIdx+=7;
              // recalc dowIdx properly
              var thisDate=new Date(state.year,gRef.month-1,actualDay);
              var thisDow=thisDate.getDay(); // 0=Sun
              var thisDowIdx=thisDow===0?6:thisDow-1;
              var isSelected=gRef.planDays.indexOf(dayKey)>=0;
              var isHol=!!isHoliday(state.year,gRef.month,actualDay);
              var isWknd=thisDowIdx>=5;
              var today2=new Date();
              var isToday2=today2.getFullYear()===state.year&&today2.getMonth()+1===gRef.month&&today2.getDate()===actualDay;
              var labelColor=isToday2?"#6366f1":(isHol||isWknd)?"#ef4444":"#94a3b8";
              var btn=h("button",{style:[
                "display:flex;flex-direction:column;align-items:center;padding:4px 6px;border-radius:6px;",
                "border:1.5px solid;cursor:pointer;min-width:30px;transition:all .15s;",
                isSelected?"background:"+gColor+";border-color:"+gColor+";"
                          :"background:#0c0f1a;border-color:#1e293b;",
                isToday2?"outline:1.5px solid #6366f1;outline-offset:1px;":""
              ].join("")});
              btn.appendChild(h("span",{style:"font-size:8px;color:"+(isSelected?"#fff80":labelColor)+";font-weight:700"},DOW_SH[thisDowIdx]));
              btn.appendChild(h("span",{style:"font-size:10px;font-family:'JetBrains Mono',monospace;color:"+(isSelected?"#fff":labelColor)+";font-weight:"+(isToday2?"700":"400")},String(actualDay)));
              (function(dk,gObj){
                btn.addEventListener("click",function(){
                  if(!gObj.planDays)gObj.planDays=[];
                  var idx=gObj.planDays.indexOf(dk);
                  if(idx>=0)gObj.planDays.splice(idx,1);
                  else gObj.planDays.push(dk);
                  saveGoalData();cloudSaveGoals();_isAutoRender=true;render();
                });
              })(dayKey,gRef);
              btnWrap.appendChild(btn);
            }
            pdRow.appendChild(btnWrap);
            // 선택 날짜 요약
            if(gRef.planDays&&gRef.planDays.length>0){
              var sd2=gRef.planDays.slice().sort(function(a,b){
                var ap=a.split("-"),bp=b.split("-");
                return (parseInt(ap[0])*100+parseInt(ap[1]))-(parseInt(bp[0])*100+parseInt(bp[1]));
              });
              var ds2=sd2.map(function(dk2){return dk2.split("-")[1]+"일"});
              pdRow.appendChild(h("div",{style:"margin-top:5px;font-size:9px;color:"+gColor+";font-family:monospace"},"→ "+ds2.join(", ")));
            }
            subWrap.appendChild(pdRow);
          })(g);
        }  // end if(scope==="weekly")
        if(scope==="monthly"){
          const periodRow=h("div",{style:"display:flex;gap:6px;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e293b;font-size:11px"});
          periodRow.appendChild(h("span",{style:"color:#64748b;font-size:10px;flex-shrink:0"},"🗓 기간:"));
          const smSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          for(let m=1;m<=12;m++){const o=h("option",{value:String(m)},m+"월");if(m===(g.startMonth||g.month))o.selected=true;smSel.appendChild(o)}
          smSel.addEventListener("change",e=>{
            const v=parseInt(e.target.value);
            updatePeriodGoalField(scope,g.id,"startMonth",v);
            updatePeriodGoalField(scope,g.id,"month",v);
            if((g.endMonth||g.month)<v)updatePeriodGoalField(scope,g.id,"endMonth",v);
            render();
          });
          periodRow.appendChild(smSel);
          periodRow.appendChild(h("span",{style:"color:#64748b"},"~"));
          const emSel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          for(let m=1;m<=12;m++){const o=h("option",{value:String(m)},m+"월");if(m===(g.endMonth||g.month))o.selected=true;emSel.appendChild(o)}
          emSel.addEventListener("change",e=>{
            const v=parseInt(e.target.value);
            updatePeriodGoalField(scope,g.id,"endMonth",v);
            if((g.startMonth||g.month)>v){updatePeriodGoalField(scope,g.id,"startMonth",v);updatePeriodGoalField(scope,g.id,"month",v)}
            render();
          });
          periodRow.appendChild(emSel);
          subWrap.appendChild(periodRow);
        }
        if(scope==="longterm"){
          const periodRow=h("div",{style:"display:flex;gap:6px;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e293b;font-size:11px"});
          periodRow.appendChild(h("span",{style:"color:#64748b;font-size:10px;flex-shrink:0"},"🎯 기간:"));
          const sySel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          for(let y=2026;y<=2040;y++){const o=h("option",{value:String(y)},y+"");if(y===(g.startYear||g.targetYear))o.selected=true;sySel.appendChild(o)}
          sySel.addEventListener("change",e=>{
            const v=parseInt(e.target.value);
            updatePeriodGoalField(scope,g.id,"startYear",v);
            if((g.endYear||g.targetYear)<v)updatePeriodGoalField(scope,g.id,"endYear",v);
            render();
          });
          periodRow.appendChild(sySel);
          periodRow.appendChild(h("span",{style:"color:#64748b"},"~"));
          const eySel=h("select",{className:"goal-cat-select",style:"padding:4px 6px;font-size:11px"});
          for(let y=2026;y<=2040;y++){const o=h("option",{value:String(y)},y+"");if(y===(g.endYear||g.targetYear))o.selected=true;eySel.appendChild(o)}
          eySel.addEventListener("change",e=>{
            const v=parseInt(e.target.value);
            updatePeriodGoalField(scope,g.id,"endYear",v);
            if((g.startYear||g.targetYear)>v)updatePeriodGoalField(scope,g.id,"startYear",v);
            render();
          });
          periodRow.appendChild(eySel);
          subWrap.appendChild(periodRow);
        }
        // Editable memo field (always shown in expanded)

        // Parent goal edit (multi-scope, not for longterm)
        if(scope!=="longterm"){
          const parentEditEl=renderParentEditSelectors(scope,g);
          if(parentEditEl)subWrap.appendChild(parentEditEl);
        }

        if(!g.memo){
          const memoRow=h("div",{style:"margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e293b"});
          const memoInp=h("input",{className:"goal-input",placeholder:"메모 추가...",value:"",style:"width:100%;font-size:11px;padding:6px 8px"});
          memoInp.addEventListener("blur",()=>{
            if(memoInp.value.trim()){updatePeriodGoalField(scope,g.id,"memo",memoInp.value.trim());render()}
          });
          memoInp.addEventListener("keydown",ev=>{if(ev.key==="Enter")memoInp.blur()});
          memoRow.appendChild(memoInp);
          subWrap.appendChild(memoRow);
        }

        if(hasSub){
          g.subtasks.forEach(s=>{
            const sr=h("div",{style:"display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px"});
            const chk=h("button",{className:"goal-check"+(s.done?" checked":""),style:"width:16px;height:16px;font-size:10px;border-width:1.5px",onClick:()=>toggleSubtask(scope,g.id,s.id)},s.done?"✓":"");
            sr.appendChild(chk);
            sr.appendChild(h("span",{style:"flex:1;color:"+(s.done?"#64748b":"#cbd5e1")+";text-decoration:"+(s.done?"line-through":"none")},s.name));
            sr.appendChild(h("span",{style:"font-size:10px;color:#0d9488;font-family:monospace;font-weight:700"},(s.weight||0)+"%"));
            sr.appendChild(h("button",{className:"goal-del",style:"font-size:12px",onClick:()=>removeSubtask(scope,g.id,s.id)},"✕"));
            subWrap.appendChild(sr);
          });
          // Show weight total warning
          const totalWeight=g.subtasks.reduce((s,x)=>s+(x.weight||0),0);
          if(totalWeight!==100){
            subWrap.appendChild(h("div",{style:"font-size:9px;color:"+(totalWeight>100?"#ef4444":"#f59e0b")+";text-align:right;margin-top:2px"},"가중치 합: "+totalWeight+"% "+(totalWeight===100?"":(totalWeight<100?"(아직 "+(100-totalWeight)+"% 남음)":"(100% 초과!)"))));
          }
        }
        // Add subtask form
        const subFormKey=scope+"-"+g.id;
        const addRow=h("div",{style:"display:flex;gap:4px;margin-top:6px;padding-top:6px;border-top:1px solid #1e293b"});
        const subInp=h("input",{className:"goal-input",placeholder:"세부 단계",value:state.goalSubInputs[subFormKey]||"",style:"flex:1;font-size:11px;padding:6px 8px"});
        subInp.addEventListener("input",e=>{state.goalSubInputs[subFormKey]=e.target.value});
        subInp.addEventListener("keydown",e=>{if(e.key==="Enter")addSubtask(scope,g.id)});
        addRow.appendChild(subInp);
        const wInp=h("input",{className:"goal-input",type:"number",placeholder:"%",value:state.goalSubWeights[subFormKey]||"",style:"width:50px;font-size:11px;padding:6px 4px;text-align:center",min:"1",max:"100"});
        wInp.addEventListener("input",e=>{state.goalSubWeights[subFormKey]=e.target.value});
        addRow.appendChild(wInp);
        addRow.appendChild(h("button",{className:"goal-add-btn",style:"padding:6px 10px;font-size:11px",onClick:()=>addSubtask(scope,g.id)},"+"));
        subWrap.appendChild(addRow);
        item.appendChild(subWrap);
      }
      ul.appendChild(item);
    });
    wrap.appendChild(ul);

    // Completed goals section
    if(completedGoals.length>0){
      const doneSection=h("div",{style:"margin-top:12px"});
      doneSection.appendChild(h("div",{style:"font-size:10px;color:#064e3b;font-weight:700;padding:4px 0;margin-bottom:4px;border-bottom:1px solid #064e3b"},"✅ 완료된 목표 ("+completedGoals.length+")"));
      const doneList=h("div",{className:"goal-list"});
      completedGoals.forEach(g=>{
        const cat=catByCode(g.cat);
        const item=h("div",{className:"goal-item done",style:"opacity:.6"});
        const r=h("div",{className:"goal-item-row"});
        r.appendChild(h("span",{style:"font-size:14px;color:#10b981;flex-shrink:0"},"✓"));
        r.appendChild(h("span",{className:"goal-cat-tag",style:"background:"+(cat?cat.color:"#475569")},g.cat));
        r.appendChild(h("span",{className:"goal-name done"},g.name));
        const doneHrs=calcGoalTotalHours(g.id);
        if(doneHrs>0)r.appendChild(h("span",{style:"font-size:10px;color:#f59e0b;font-family:'JetBrains Mono',monospace;font-weight:700;flex-shrink:0"},fmtHours(doneHrs)));
        // Restore button - bring back to active
        r.appendChild(h("button",{className:"goal-del",style:"color:#10b981;font-size:14px",title:"되돌리기",onClick:()=>{
          updateGoalProgress(scope,g.id,90);
          render(true);
        }},"↩"));
        r.appendChild(h("button",{className:"goal-del",onClick:()=>{
          if(confirm("완료된 목표를 삭제할까요?"))removePeriodGoal(scope,g.id);
        }},"✕"));
        item.appendChild(r);
        // ── 시작일 · 완료일 표시 (weekly 이상) ──────────────────
        const startStr=fmtGoalStart(scope,g);
        const doneStr=fmtGoalDone(scope,g);
        if(startStr||doneStr){
          const dateRow=h("div",{style:"display:flex;align-items:center;gap:10px;padding:2px 4px 4px 22px;font-size:10px;color:#475569;font-family:monospace"});
          if(startStr)dateRow.appendChild(h("span",{},"▶ "+startStr));
          if(doneStr) dateRow.appendChild(h("span",{style:"color:#10b981"},"✓ "+doneStr));
          item.appendChild(dateRow);
        }
        const pr=h("div",{className:"goal-progress-row"});
        const track=h("div",{style:"flex:1;height:6px;background:#1e293b;border-radius:3px;overflow:hidden"});
        track.appendChild(h("div",{style:"height:100%;width:100%;background:#10b981"}));
        pr.appendChild(track);
        pr.appendChild(h("span",{className:"goal-progress-val",style:"color:#10b981"},"100%"));
        item.appendChild(pr);
        doneList.appendChild(item);
      });
      doneSection.appendChild(doneList);
      wrap.appendChild(doneSection);
    }
  }
  return wrap;
}

function addHabit(){
  var name=(state.habitNewName||"").trim();
  if(!name)return;
  var cat=state.habitNewCat||"D1";
  var id=Date.now();
  if(!state.goalData.habits)state.goalData.habits=[];
  state.goalData.habits.push({
    id:id,cat:cat,name:name,
    startDate:HABIT_START_DATE,endDate:HABIT_END_DATE,
    completions:{},longtermId:null
  });
  state.habitNewName="";
  saveGoalData();cloudSaveGoals();_isAutoRender=true;render();
}
function removeHabit(id){
  if(!confirm("습관을 삭제하면 모든 체크 기록도 삭제됩니다. 삭제할까요?"))return;
  state.goalData.habits=(state.goalData.habits||[]).filter(function(h){return h.id!==id});
  saveGoalData();cloudSaveGoals();_isAutoRender=true;render();
}
function renderHabitsTab(){
  const wrap=h("div",{});

  // ── 추가 폼 ──
  const form=h("div",{className:"goal-form"});
  const frow=h("div",{className:"goal-form-row"});
  const sel=h("select",{className:"goal-cat-select"});
  CATEGORIES.forEach(function(c){
    const opt=h("option",{value:c.code},c.code+" "+c.label);
    if(c.code===(state.habitNewCat||state.goalNewCat||"D1"))opt.selected=true;
    sel.appendChild(opt);
  });
  sel.addEventListener("change",function(e){state.habitNewCat=e.target.value});
  frow.appendChild(sel);
  const inp=h("input",{className:"goal-input",placeholder:"습관 이름",value:state.habitNewName||""});
  inp.addEventListener("input",function(e){state.habitNewName=e.target.value});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")addHabit()});
  frow.appendChild(inp);
  frow.appendChild(h("button",{className:"goal-add-btn",onClick:addHabit},"+"));
  form.appendChild(frow);
  wrap.appendChild(form);

  const habits=state.goalData.habits||[];
  if(habits.length===0){
    wrap.appendChild(h("div",{className:"goal-empty"},"습관 목표가 없습니다"));
    return wrap;
  }

  // ── 주 기준 계산 (오늘 기준 + offset, 습관 기간으로 제한) ──
  const today=new Date();
  const todayDow=today.getDay();
  const diffToMon=todayDow===0?-6:1-todayDow;

  // 전체 habits 공통 기간의 최소 startDate, 최대 endDate 계산
  var globalStart=null,globalEnd=null;
  habits.forEach(function(hb){
    var sp=hb.startDate.split("-"),ep=hb.endDate.split("-");

function buildGoalSearchResults(q){
  const sec=h("div",{className:"goal-section"});
  sec.appendChild(h("h3",{className:"goal-section-title"},"🔍 검색 결과"));
  const SCOPE_META=[
    {sc:"longterm",icon:"🎯",label:"장기"},
    {sc:"monthly",icon:"🗓",label:"월간"},
    {sc:"weekly",icon:"📆",label:"주간"},
    {sc:"daily",icon:"📌",label:"일간"},
    {sc:"habits",icon:"🔁",label:"습관"},
    {sc:"readingGoals",icon:"📚",label:"독서목표"},
  ];
  let totalFound=0;
  SCOPE_META.forEach(function(sm){
    let list=[];
    if(sm.sc==="daily"){
      Object.entries(state.goalData.daily||{}).forEach(function([dk,arr]){
        (arr||[]).forEach(function(g){if(g.name&&g.name.toLowerCase().indexOf(q)>=0)list.push({g:g,extra:dk});});
      });
    }else if(sm.sc==="habits"){
      list=(state.goalData.habits||[]).filter(function(g){return g.name&&g.name.toLowerCase().indexOf(q)>=0;}).map(function(g){return{g:g};});
    }else if(sm.sc==="readingGoals"){
      list=(state.goalData.readingGoals||[]).filter(function(g){return g.name&&g.name.toLowerCase().indexOf(q)>=0;}).map(function(g){return{g:g};});
    }else{
      list=(state.goalData[sm.sc]||[]).filter(function(g){return g.name&&g.name.toLowerCase().indexOf(q)>=0;}).map(function(g){return{g:g};});
    }
    if(list.length===0)return;
    totalFound+=list.length;
    sec.appendChild(h("div",{style:"font-size:10px;color:#64748b;font-weight:700;letter-spacing:.5px;padding:8px 4px 4px"},sm.icon+" "+sm.label));
    list.forEach(function(item){
      const g=item.g;
      const catObj=catByCode(g.cat);
      const hrs=calcGoalTotalHours(g.id);
      const row=h("div",{style:"display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;margin-bottom:3px;background:#111827;border:1px solid #1e293b;cursor:pointer",
        onClick:function(){
          if(sm.sc==="daily"){state.goalScope="daily";}
          else if(sm.sc==="habits"){state.goalScope="habits";}
          else if(sm.sc==="readingGoals"){state.tab="goals";state.goalScope="longterm";}
          else{
            state.goalScope=sm.sc;
            if(sm.sc==="monthly"&&g.startMonth)state.goalMonth=g.startMonth;
            if(sm.sc==="weekly"&&g.month){state.goalWeekMonth=g.month;state.goalWeekIdx=g.weekIdx||1;}
          }
          state.goalSearch="";render();
        }
      });
      row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:"+(catObj?catObj.color:"#94a3b8")+";font-family:monospace;flex-shrink:0;min-width:28px"},g.cat||""));
      const nameParts=g.name.split(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"));
      const nameSpan=h("span",{style:"flex:1;font-size:12px;color:#e2e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"});
      nameParts.forEach(function(part){
        if(part.toLowerCase()===q){
          nameSpan.appendChild(h("mark",{style:"background:#f59e0b40;color:#fcd34d;border-radius:2px;padding:0 1px"},part));
        }else{
          nameSpan.appendChild(document.createTextNode(part));
        }
      });
      row.appendChild(nameSpan);
      if(typeof g.progress==="number"){
        const pct=g.progress||0;
        const pColor=pct>=100?"#10b981":pct>=50?"#f59e0b":"#64748b";
        row.appendChild(h("span",{style:"font-size:10px;color:"+pColor+";font-family:monospace;flex-shrink:0"},pct+"%"));
      }
      if(hrs>0)row.appendChild(h("span",{style:"font-size:10px;color:#f59e0b;font-family:monospace;flex-shrink:0"},fmtHours(hrs)));
      if(item.extra)row.appendChild(h("span",{style:"font-size:9px;color:#475569;flex-shrink:0"},item.extra));
      sec.appendChild(row);
    });
  });
  if(totalFound===0){
    sec.appendChild(h("div",{style:"text-align:center;padding:30px;color:#475569;font-size:12px"},'"'+q+'" 검색 결과가 없습니다'));
  }
  return sec;
}

// ── 목표 상세 패널 (클릭 시 확장) ────────────────────────────
function renderGoalDetailPanel(g,scope,catDef,dk){
  const panel=h("div",{style:"background:#0a0f1a;border-radius:0 0 10px 10px;padding:10px 12px 12px;border:1px solid "+catDef.color+"40;border-top:none;margin-bottom:4px"});

  // ── 카테고리 + 이름 + 삭제 ──
  const editRow=h("div",{style:"display:flex;align-items:center;gap:6px;margin-bottom:8px"});
  editRow.appendChild(renderEditableCat(g.cat,function(newCat){
    if(scope==="daily"&&dk)updateDailyGoalField(dk,g.id,"cat",newCat);
    else updatePeriodGoalField(scope,g.id,"cat",newCat);
    saveGoalData();render(true);
  }));
  const nameInp=h("input",{style:"flex:1;padding:6px 10px;border-radius:7px;border:1px solid #334155;background:#111827;color:#e2e8f0;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none",value:g.name||""});
  nameInp.addEventListener("focus",function(){nameInp.style.borderColor=catDef.color;_isEditing=true;});
  nameInp.addEventListener("blur",function(){nameInp.style.borderColor="#334155";_isEditing=false;});
  nameInp.addEventListener("input",function(e){g.name=e.target.value;});
  nameInp.addEventListener("change",function(){saveGoalData();cloudSaveGoals();});
  editRow.appendChild(nameInp);
  editRow.appendChild(h("button",{
    style:"padding:5px 8px;border-radius:6px;border:1px solid #ef444440;background:transparent;color:#ef4444;font-size:11px;cursor:pointer;flex-shrink:0",
    onClick:function(){
      if(!confirm("\""+g.name+"\" 목표를 삭제하시겠습니까?"))return;
      forceDeleteGoalById(g.id);
      state._expandedGoal=null;saveGoalData();cloudSaveGoals();render(true);
    }
  },"🗑"));
  panel.appendChild(editRow);

  // ── 메모 ──
  const memoInp=h("input",{style:"width:100%;padding:5px 10px;border-radius:7px;border:1px solid #1e293b;background:#111827;color:#94a3b8;font-size:11px;font-family:'Noto Sans KR',sans-serif;outline:none;margin-bottom:8px",placeholder:"메모 (선택)",value:g.memo||""});
  memoInp.addEventListener("focus",function(){memoInp.style.borderColor="#334155";_isEditing=true;});
  memoInp.addEventListener("blur",function(){memoInp.style.borderColor="#1e293b";_isEditing=false;});
  memoInp.addEventListener("input",function(e){g.memo=e.target.value;});
  memoInp.addEventListener("change",function(){saveGoalData();});
  panel.appendChild(memoInp);

  // ── Scope 변경 (일간/주간/월간/장기 상호 변환) ──
  if(scope==="daily"||scope==="weekly"||scope==="monthly"||scope==="longterm"){
    const scRow=h("div",{style:"display:flex;gap:4px;align-items:center;margin-bottom:8px;padding:4px 8px;background:#0c0f1a;border-radius:6px;border:1px dashed #33415580"});
    scRow.appendChild(h("span",{style:"font-size:10px;color:#64748b;flex-shrink:0"},"🔄 변경:"));
    [["daily","📌 일간","#6366f1"],["weekly","🗓 주간","#3b82f6"],["monthly","📅 월간","#0d9488"],["longterm","🎯 장기","#f59e0b"]].forEach(function(sv){
      const isCur=sv[0]===scope;
      scRow.appendChild(h("button",{
        style:"padding:3px 7px;border-radius:4px;border:1px solid "+(isCur?sv[2]:"#334155")+";background:"+(isCur?sv[2]+"22":"transparent")+";color:"+(isCur?sv[2]:"#64748b")+";font-size:10px;cursor:"+(isCur?"default":"pointer"),
        disabled:isCur,
        onClick:isCur?null:function(){
          if(!confirm("\""+g.name+"\" 목표를 "+sv[1]+"(으)로 변경하시겠습니까?"))return;
          const today=new Date();
          const ty=today.getFullYear(),tm=today.getMonth()+1,td=today.getDate();
          // 1) 원본에서 제거
          if(scope==="daily"&&dk){
            state.goalData.daily[dk]=(state.goalData.daily[dk]||[]).filter(x=>x.id!==g.id);
            if(state.goalData.daily[dk].length===0)delete state.goalData.daily[dk];
          }else if(state.goalData[scope]){
            state.goalData[scope]=state.goalData[scope].filter(x=>x.id!==g.id);
          }
          // 2) 대상 scope로 복사 (id, cat, name, memo, parentIds, bookTarget 보존)
          const base={id:g.id,cat:g.cat,name:g.name,memo:g.memo||""};
          if(g.parentIds)base.parentIds=g.parentIds;
          if(g.bookTarget&&sv[0]==="longterm")base.bookTarget=g.bookTarget;
          if(sv[0]==="daily"){
            base.done=false;
            const nk=tm+"-"+td;
            if(!state.goalData.daily[nk])state.goalData.daily[nk]=[];
            state.goalData.daily[nk].push(base);
            state._expandedGoal={id:g.id,scope:"daily",dk:nk};
          }else if(sv[0]==="weekly"){
            base.progress=0;base.subtasks=[];
            base.year=ty;base.month=tm;

// ── 인라인 폼용 상위목표 선택 ────────────────────────────────
// af.parentIds를 직접 수정 (state.goalNewParentIds 미사용)
function renderInlineParentSelectors(af){
  var scope=af.scope;
  var cat=af.cat;
  var uppers=upperScopes(scope);
  if(uppers.length===0)return null;
  if(!af.parentIds)af.parentIds={};
  var hasAny=false;
  var wrap=h("div",{style:"display:flex;flex-direction:column;gap:4px;margin-top:6px;padding:6px 8px;background:#0c0f1a;border-radius:6px;border:1px solid #1e293b"});
  wrap.appendChild(h("span",{style:"font-size:10px;color:#64748b;font-weight:700;margin-bottom:2px"},"📎 상위 목표 연결"));
  uppers.forEach(function(us){
    var candidates=getCandidatesForScope(us,cat);
    if(candidates.length===0)return;
    hasAny=true;
    var label=us==="habits"?"습관":us==="readingGoals"?"독서목표":(SCOPE_LABELS[us]||us);
    var row=h("div",{style:"display:flex;gap:6px;align-items:center"});
    row.appendChild(h("span",{style:"font-size:10px;color:#64748b;width:40px;flex-shrink:0;text-align:right"},label+":"));
    var sel=h("select",{style:"flex:1;padding:4px 6px;border-radius:6px;border:1px solid #334155;background:#111827;color:#cbd5e1;font-size:11px;font-family:'Noto Sans KR',sans-serif"});
    var noneOpt=h("option",{value:""},"없음");
    if(!af.parentIds[us])noneOpt.selected=true;
    sel.appendChild(noneOpt);
    candidates.forEach(function(g){
      var opt=h("option",{value:String(g.id)},g.cat+" "+g.name);
      if(af.parentIds[us]===g.id)opt.selected=true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change",(function(upperScope){return function(e){
      if(e.target.value)af.parentIds[upperScope]=parseInt(e.target.value);
      else delete af.parentIds[upperScope];
    }})(us));
    row.appendChild(sel);
    wrap.appendChild(row);
  });
  return hasAny?wrap:null;
}


function doAddInlineGoal(af){
  var name=(af.name||"").trim();
  if(!name)return;
  var memo=(af.memo||"").trim();
  var id=Date.now();
  var cat=af.cat;
  var pids=(af.parentIds&&Object.keys(af.parentIds).length>0)?af.parentIds:undefined;

  // E2 목표는 언어 태그 부착
  var lang=(cat==="E2"&&af.language)?af.language:null;

  if(af.scope==="daily"){
    var m=af.month||new Date().getMonth()+1;
    var d=af.day||new Date().getDate();
    var dk=m+"-"+d;
    if(!state.goalData.daily[dk])state.goalData.daily[dk]=[];
    var dg={id:id,cat:cat,name:name,done:false,memo:memo};
    if(pids)dg.parentIds=pids;
    if(lang)dg.language=lang;
    state.goalData.daily[dk].push(dg);
    state.goalCalMonth=m;state.goalCalDay=d;

  }else if(af.scope==="weekly"){
    var wm2=af.month||new Date().getMonth()+1;
    var sd=af.startDay||1;
    var ed=af.endDay||Math.min(7,daysInMonth(state.year,wm2));
    var wi=weekIdxOfDay(state.year,wm2,sd);
    var wg={id:id,cat:cat,name:name,memo:memo,progress:0,subtasks:[],
      year:state.year,month:wm2,weekIdx:wi,startDay:sd,endDay:ed,

    if(pids)wg.parentIds=pids;

    state.goalData.weekly.push(wg);
    state.goalData.weekly=sortByDream(state.goalData.weekly);

  }else if(af.scope==="monthly"){
    var sm=af.startMonth||new Date().getMonth()+1;
    var em=af.endMonth||sm;
    var mg={id:id,cat:cat,name:name,memo:memo,progress:0,subtasks:[],
      year:state.year,month:sm,startMonth:sm,endMonth:em};
    if(pids)mg.parentIds=pids;
    if(lang)mg.language=lang;
    state.goalData.monthly.push(mg);
    state.goalData.monthly=sortByDream(state.goalData.monthly);

  }else if(af.scope==="longterm"){
    var lg={id:id,cat:cat,name:name,memo:memo,progress:0,subtasks:[],
      startYear:af.startYear||state.year,endYear:af.endYear||state.year+1};
    if(pids)lg.parentIds=pids;
    if(lang)lg.language=lang;
    state.goalData.longterm.push(lg);
    state.goalData.longterm=sortByDream(state.goalData.longterm);

  }else if(af.scope==="habits"){
    if(!state.goalData.habits)state.goalData.habits=[];
    state.goalData.habits.push({
      id:id,cat:cat,name:name,
      startDate:HABIT_START_DATE,endDate:HABIT_END_DATE,
      completions:{},longtermId:pids&&pids.longterm?pids.longterm:null
    });

  }

  state._addForm=null;
  saveGoalData();cloudSaveGoals();
  render(true);
}

function renderGoals(){
  const wrap=h("div",{});

  // ── 전역 검색 결과 ──
  const _gsq=(state.goalSearch||"").trim().toLowerCase();
  if(_gsq){
    wrap.appendChild(buildGoalSearchResults(_gsq));
    return wrap;
  }

  // ── 월간 캘린더 ──────────────────────────────────────────
  if(!state.goalCalMonth)state.goalCalMonth=new Date().getMonth()+1;
  if(!state.goalCalYear)state.goalCalYear=state.year;
  const calY=state.goalCalYear,calM=state.goalCalMonth;
  const today2=new Date();

  const calBox=h("div",{style:"background:#0c0f1a;border-radius:12px;padding:12px;margin-bottom:16px;border:1px solid #1e293b"});

  // 캘린더 헤더
  const calNav=h("div",{style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"});
  calNav.appendChild(h("button",{className:"goal-date-arrow",onClick:function(){
    state.goalCalMonth--;if(state.goalCalMonth<1){state.goalCalMonth=12;state.goalCalYear--;}render();
  }},"◀"));
  const calTitle=h("div",{style:"display:flex;flex-direction:column;align-items:center;gap:2px"});
  calTitle.appendChild(h("span",{style:"font-size:15px;font-weight:900;color:#e2e8f0;font-family:'JetBrains Mono',monospace"},calY+"년 "+calM+"월"));
  // 이번달로 버튼
  const isCurMonth=calY===today2.getFullYear()&&calM===today2.getMonth()+1;
  if(!isCurMonth){
    calTitle.appendChild(h("button",{style:"font-size:9px;color:#6366f1;background:#6366f120;border:1px solid #6366f140;border-radius:4px;padding:1px 8px;cursor:pointer",
      onClick:function(){state.goalCalMonth=today2.getMonth()+1;state.goalCalYear=today2.getFullYear();render();}
    },"↩ 이번 달"));
  }
  calNav.appendChild(calTitle);
  calNav.appendChild(h("button",{className:"goal-date-arrow",onClick:function(){
    state.goalCalMonth++;if(state.goalCalMonth>12){state.goalCalMonth=1;state.goalCalYear++;}render();
  }},"▶"));
  calBox.appendChild(calNav);

  // 요일 헤더 (일요일 시작)
  const dowHdr=h("div",{style:"display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px"});
  ["일","월","화","수","목","금","토"].forEach(function(d,i){
    var hc=i===0?"#ef4444":(i===6?"#3b82f6":"#475569");
    dowHdr.appendChild(h("div",{style:"text-align:center;font-size:9px;font-weight:700;color:"+hc+";padding:2px 0"},d));
  });
  calBox.appendChild(dowHdr);

  // 날짜 그리드 (일요일 시작)
  const firstDay=new Date(calY,calM-1,1);
  const firstDow=firstDay.getDay(); // 0=Sun
  const startOffset=firstDow; // Sun=0
  const totalDays=daysInMonth(calY,calM);
  // 일간목표 있는 날짜 수집
  const daysWithGoals=new Set();
  Object.keys(state.goalData.daily||{}).forEach(function(dk){
    const parts=dk.split("-");
    if(parseInt(parts[0])===calM&&(state.goalData.daily[dk]||[]).length>0){
      daysWithGoals.add(parseInt(parts[1]));
    }
  });

  const grid=h("div",{style:"display:grid;grid-template-columns:repeat(7,1fr);gap:2px"});
  // 앞 빈칸
  for(let i=0;i<startOffset;i++){
    grid.appendChild(h("div",{},""));
  }
  for(let d=1;d<=totalDays;d++){
    const isToday3=calY===today2.getFullYear()&&calM===today2.getMonth()+1&&d===today2.getDate();
    const isSelected=state.goalCalDay===d&&calY===state.goalCalYear&&calM===state.goalCalMonth;
    const hasDGoals=daysWithGoals.has(d);
    const dow2=(startOffset+d-1)%7; // 0=Sun, 6=Sat
    const isSun=dow2===0;
    const isSat=dow2===6;
    const isHol2=!!isHoliday(calY,calM,d);
    const dayColor=isToday3?"#fff":isSat?"#3b82f6":(isHol2||isSun)?"#ef4444":"#cbd5e1";
    const dayBg=isToday3?"#6366f1":(isSelected?"#1e3a8a":"transparent");

    const dayBtn=h("button",{
      style:[
        "position:relative;padding:5px 2px;border-radius:6px;border:none;",
        "background:"+dayBg+";color:"+dayColor+";font-size:11px;",
        "font-family:'JetBrains Mono',monospace;cursor:pointer;",
        "font-weight:"+(isToday3||isSelected?"700":"400")+";",
        "transition:background .15s;"
      ].join(""),
      onClick:function(){
        state.goalCalDay=(state.goalCalDay===d&&calY===state.goalCalYear&&calM===state.goalCalMonth)?null:d;
        render();
      }
    },String(d));
    // 일간목표 있으면 점 표시
    if(hasDGoals){
      const dot=h("div",{style:"position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:"+(isToday3?"#fff":"#6366f1")});
      dayBtn.style.position="relative";
      dayBtn.appendChild(dot);
    }
    grid.appendChild(dayBtn);
  }
  calBox.appendChild(grid);

  // 선택된 날의 일간목표 표시
  if(state.goalCalDay){
    const selDk=calM+"-"+state.goalCalDay;
    const selGoals=state.goalData.daily[selDk]||[];
    const selDow=["일","월","화","수","목","금","토"][new Date(calY,calM-1,state.goalCalDay).getDay()];
    const selBox=h("div",{style:"margin-top:10px;padding-top:10px;border-top:1px solid #1e293b"});
    selBox.appendChild(h("div",{style:"font-size:10px;color:#6366f1;font-weight:700;margin-bottom:6px"},calM+"/"+state.goalCalDay+" ("+selDow+") 일간목표"));
    if(selGoals.length===0){
      selBox.appendChild(h("div",{style:"font-size:11px;color:#334155;text-align:center;padding:6px 0"},"일간 목표 없음"));
    }else{
      selGoals.forEach(function(g){
        const cat=catByCode(g.cat);
        const row=h("div",{style:"display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;cursor:pointer",
          onClick:function(){navigateToGoal("daily",g);}
        });
        row.appendChild(h("span",{style:"font-size:9px;font-weight:700;color:"+(cat?cat.color:"#94a3b8")+";font-family:monospace;flex-shrink:0"},g.cat));
        row.appendChild(h("span",{style:"flex:1;color:"+(g.done?"#475569":"#cbd5e1")+(g.done?";text-decoration:line-through":"")},g.name));
        if(g.done)row.appendChild(h("span",{style:"color:#10b981"},"✓"));
        row.appendChild(h("span",{style:"font-size:9px;color:#0d9488"},"↗"));
        selBox.appendChild(row);
      });
    }
    // + 일간목표 추가 버튼
    const addDayBtn=h("button",{
      style:"margin-top:6px;width:100%;padding:6px;border-radius:8px;border:1px dashed #334155;background:transparent;color:#0d9488;font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif",
      onClick:function(){
        // 해당 날짜로 이동하여 일간목표 추가
        state.month=calM;state.day=state.goalCalDay;
        state.goalScope="daily";state.tab="goals";
        render(true);
      }
    },"+ 일간목표 추가");
    selBox.appendChild(addDayBtn);
    calBox.appendChild(selBox);
  }
  wrap.appendChild(calBox);

  // ── 금일 목표 ─────────────────────────────────────────────
  (function(){
    // 캘린더에서 날짜 선택 시 그 날 기준, 아니면 오늘
    const tgtY=state.goalCalDay?state.goalCalYear:state.year;
    const tgtM=state.goalCalDay?state.goalCalMonth:state.month;
    const tgtD=state.goalCalDay?state.goalCalDay:state.day;
    const isToday=tgtY===state.year&&tgtM===state.month&&tgtD===state.day;
    const tdk=tgtM+"-"+tgtD;
    const tWIdx=weekIdxOfDay(tgtY,tgtM,tgtD);
    const tDaily=(state.goalData.daily[tdk]||[]);
    const tWeekly=(state.goalData.weekly||[]).filter(function(g){
      return g.year===tgtY&&g.month===tgtM&&g.weekIdx===tWIdx;
    });

    // 이연: 선택일 이전 30일 내 미완료 일간목표
    const dailyCarryover=[];
    (function(){
      const viewDate=new Date(tgtY,tgtM-1,tgtD);
      for(let i=1;i<=30;i++){
        const cd=new Date(viewDate);cd.setDate(cd.getDate()-i);
        if(cd.getFullYear()!==tgtY)break;
        const pk=(cd.getMonth()+1)+"-"+cd.getDate();
        (state.goalData.daily[pk]||[]).forEach(function(g){
          if(!g.done)dailyCarryover.push({goal:g,origKey:pk});
        });
      }
    })();
    // 이연: 선택일 주차 이전의 미완료 주간목표
    const weeklyCarryover=(state.goalData.weekly||[]).filter(function(g){
      if(g.year!==tgtY||(g.progress||0)>=100||g.done)return false;
      if(g.month<tgtM)return true;
      if(g.month>tgtM)return false;
      return g.weekIdx<tWIdx;
    });
    // 이연: endDate 지난 specific 독서목표
    const tgtDateStr=new Date(tgtY,tgtM-1,tgtD).toISOString().slice(0,10);
    const readingCarryover=(state.goalData.readingGoals||[]).filter(function(g){
      if(g.type!=="specific"||!g.endDate)return false;
      if(g.endDate>=tgtDateStr)return false;
      return calcReadingGoalProgress(g)<100;
    });

    if(tWeekly.length===0&&tDaily.length===0&&dailyCarryover.length===0&&weeklyCarryover.length===0&&readingCarryover.length===0)return;

    const box=h("div",{style:"background:#0c0f1a;border-radius:10px;padding:10px;margin-bottom:12px;border:1px solid #1e293b"});

    hdr.appendChild(h("span",{style:"font-size:10px;color:#64748b;font-weight:700;letter-spacing:.5px"},
      "📅 "+tgtM+"/"+tgtD+(isToday?" 금일":"")+" 목표"));
    const summary=[];
    const coTotal=dailyCarryover.length+weeklyCarryover.length+readingCarryover.length;
    if(coTotal)summary.push("🔴"+coTotal+" 이연");
    if(tWeekly.length)summary.push(tWeekly.filter(g=>g.done).length+"/"+tWeekly.length+" 주간");
    if(tDaily.length)summary.push(tDaily.filter(g=>g.done).length+"/"+tDaily.length+" 일간");
    hdr.appendChild(h("span",{style:"font-size:9px;color:#475569;font-family:'JetBrains Mono',monospace"},summary.join(" · ")));
    box.appendChild(hdr);

    function makeRow(icon,iconColor,accentColor,label,catCode,done,onToggle){
      const cat=catByCode(catCode);
      const row=h("div",{style:"display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #0f172a"});

      chk.checked=done;
